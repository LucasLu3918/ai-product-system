version: 1
decision:
  id: issue-79-provider-credential-policy-v1
  baseline_repository_revision: 54d4b5a4f388d0f77c6e43bb4ec02c176504cf9e
  decision: ADOPT
  decided_by: repository maintainer LucasLu3918
  decided_at: "2026-09-20T17:14:00+08:00"
  reason: External Agent/provider API keys are not planned for near-term AIPS operation. Credential-dependent capabilities should remain available only as explicit opt-in enhancements and must not block normal runtime, validation, merge, or release flows when credentials are absent.
  scope:
    - Gemini live provider-session verification
    - future external Agent/provider credential-dependent optional capabilities
policy:
  external_agent_credentials_required: false
  credential_dependent_features_default_enabled: false
  credential_dependent_features_activation: explicit_credential_configuration_only
  missing_credential_semantics: SKIPPED_NOT_CONFIGURED
  missing_credential_is_error: false
  missing_credential_blocks_release: false
  provider_neutral_or_deterministic_fallback_preferred: true
  alternate_login_or_authentication_introduced: false
  deferred_alternate_authentication:
    - OAuth login
    - Vertex AI credentials
    - GitHub OIDC / Workload Identity Federation
    - other external login flows
  preserve_existing_verified_runtime_capabilities: true
authority:
  policy_change_authorized: true
  bounded_code_change_authorized: true
  branch_or_pr_authorized: true
  merge_authorized: true
  release_authorized: false
  runtime_enforcement_authorized: false
  automatic_remediation_authorized: false
  protected_human_authority_preserved: true
