name: python-compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported-runtime-smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            constraints/tested.txt
            requirements.txt
      - name: Install tested runtime dependencies
        run: python -m pip install -c constraints/tested.txt -r requirements.txt
      - name: Validate canonical Python support facts
        run: python tests/evidence/system_facts_lifecycle.py
      - name: Validate managed install and doctor compatibility
        run: python tests/evidence/install_preflight_lifecycle.py
