name: gemini-runtime-verification

on:
  pull_request:
    paths:
      - ".github/workflows/gemini-runtime-verification.yml"
      - "harness/adapters/gemini-cli/**"
      - "config/gemini-observable-event-capture.yaml"
      - "scripts/gemini_cli_runtime_verification.py"
      - "scripts/gemini_observable_event_capture.py"
      - "tests/validation/gemini_runtime_verification_contracts.py"
      - "references/evolution/ISSUE_79_GEMINI_RUNTIME_VERIFICATION_*.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-gemini-cli-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install AIPS Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-validation.txt
      - name: Install pinned Gemini CLI
        run: |
          npm install --global @google/gemini-cli@0.60.0
          test "$(gemini --version)" = "0.60.0"
      - name: Execute real Gemini CLI + real tools + real extension hooks
        run: |
          python scripts/gemini_cli_runtime_verification.py \
            --gemini "$(command -v gemini)" \
            --extension harness/adapters/gemini-cli \
            --output gemini-runtime-verification.json
      - name: Assert exact candidate identity
        shell: bash
        env:
          AIPS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AIPS_EXPECTED_HEAD_SHA"
      - name: Publish verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gemini-runtime-verification
          path: gemini-runtime-verification.json
          if-no-files-found: error
