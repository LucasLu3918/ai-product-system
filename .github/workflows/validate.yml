name: validate

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  janitor:
    runs-on: ubuntu-24.04
    env:
      AIPS_DOCS_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.ref_name != github.event.repository.default_branch && format('origin/{0}', github.event.repository.default_branch) || '' }}
      AIPS_GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || format('{0}^', github.sha) }}
      AIPS_GATE_BASE_TIP: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
      AIPS_GATE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fast documentation impact precheck
        run: |
          python -m pip install PyYAML
          python scripts/publish_preflight.py docs-impact \
            --base "$AIPS_GATE_BASE" \
            --head "$AIPS_GATE_HEAD" \
            --require-complete \
            --format json
      - name: Refresh pull request base tip
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          AIPS_GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: >-
          git fetch --no-tags origin
          "+refs/heads/$AIPS_GATE_BASE_REF:refs/remotes/origin/$AIPS_GATE_BASE_REF"
      - name: Mandatory candidate secret scan (fail fast)
        run: >-
          python scripts/check_secret_leakage.py --root .
          --policy config/secret-scan.yaml --publication-candidate
          --base "$AIPS_GATE_BASE" --head "$AIPS_GATE_HEAD" --json
      - name: Repository preflight (fail fast)
        run: >-
          python scripts/repository_preflight.py
          --base "$AIPS_GATE_BASE" --head "$AIPS_GATE_HEAD"
      - run: python -m pip install -r requirements.txt -r requirements-visual.txt -r requirements-validation.txt
      - name: Install deterministic Playwright Chromium
        run: python -m playwright install chromium
      - name: Resolve change class
        id: change_class
        shell: bash
        env:
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: |
          value=standard
          case ",$PR_LABELS," in
            *,aips:core-change,*) value=core ;;
            *,aips:large-change,*) value=large ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: deterministic integration gate
        id: gate
        shell: bash
        env:
          AIPS_GATE_REPORT: ${{ runner.temp }}/integration-gate-report.yaml
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: |
          base_tip_args=()
          if [[ -n "$AIPS_GATE_BASE_TIP" ]]; then
            base_tip_args=(--base-tip "$AIPS_GATE_BASE_TIP")
          fi
          python scripts/publish_preflight.py run \
            --base "$AIPS_GATE_BASE" \
            --head "$AIPS_GATE_HEAD" \
            --profile config/integration-gate.yaml \
            --matrix .aips/review/CORE_CHANGE_TEST_MATRIX.yaml \
            --change-class "${{ steps.change_class.outputs.value }}" \
            --labels "$PR_LABELS" \
            --offline \
            "${base_tip_args[@]}" \
            --output "$AIPS_GATE_REPORT"
      - name: Integration Gate evidence summary
        if: ${{ always() }}
        shell: bash
        env:
          AIPS_GATE_OUTCOME: ${{ steps.gate.outcome }}
          AIPS_GATE_REPORT: ${{ runner.temp }}/integration-gate-report.yaml
        run: |
          if [[ "$AIPS_GATE_OUTCOME" == "skipped" ]]; then
            echo "Integration Gate: NOT_RUN (earlier step prevented execution)." >> "$GITHUB_STEP_SUMMARY"
          elif [[ ! -s "$AIPS_GATE_REPORT" ]]; then
            echo "Integration Gate: REPORT_UNAVAILABLE (step outcome: ${AIPS_GATE_OUTCOME:-unknown})." >> "$GITHUB_STEP_SUMMARY"
          else
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import yaml
          from pathlib import Path

          report = yaml.safe_load(Path(os.environ["AIPS_GATE_REPORT"]).read_text(encoding="utf-8")) or {}
          candidate = report.get("candidate") or {}
          print(f"Integration Gate: {report.get('status', 'REPORT_UNAVAILABLE')}")
          print(f"Candidate: {candidate.get('head_sha', 'unknown')}")
          print(f"Fingerprint: {report.get('candidate_fingerprint', 'unknown')}")
          for check in report.get("checks") or []:
              print(f"- {check.get('id', 'unknown')}: {check.get('status', 'unknown')} "
                    f"(exit={check.get('exit_code', 'n/a')}, reason={check.get('reason', 'n/a')})")
          PY
          fi
      - name: Upload Integration Gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-gate-report.yaml
          if-no-files-found: ignore
          retention-days: 14
      - name: Repository Health evidence
        if: ${{ always() }}
        shell: bash
        env:
          AIPS_HEALTH_REPORT: ${{ runner.temp }}/repository-health-report.json
        run: |
          python scripts/repository_health.py audit \
            --config config/repository-health.yaml \
            --format json > "$AIPS_HEALTH_REPORT"
      - name: Upload Repository Health evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-health-report.json
          if-no-files-found: ignore
          retention-days: 14

  repository:
    needs: janitor
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: required repository aggregate
        run: test "${{ needs.janitor.result }}" = "success"
