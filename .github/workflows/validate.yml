name: validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  janitor:
    runs-on: ubuntu-latest
    env:
      AIPS_DOCS_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.ref_name != github.event.repository.default_branch && format('origin/{0}', github.event.repository.default_branch) || '' }}
      AIPS_GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || format('{0}^', github.sha) }}
      AIPS_GATE_BASE_TIP: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
      AIPS_GATE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-visual.txt -r requirements-validation.txt
      - name: Refresh pull request base tip
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          AIPS_GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: >-
          git fetch --no-tags origin
          "+refs/heads/$AIPS_GATE_BASE_REF:refs/remotes/origin/$AIPS_GATE_BASE_REF"
      - name: deterministic integration gate
        shell: bash
        run: |
          base_tip_args=()
          if [[ -n "$AIPS_GATE_BASE_TIP" ]]; then
            base_tip_args=(--base-tip "$AIPS_GATE_BASE_TIP")
          fi
          python scripts/integration_gate.py \
            --profile config/integration-gate.yaml \
            --base "$AIPS_GATE_BASE" \
            --head "$AIPS_GATE_HEAD" \
            "${base_tip_args[@]}" \
            --output integration-gate-report.yaml

  repository:
    needs: janitor
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: required repository aggregate
        run: test "${{ needs.janitor.result }}" = "success"
