name: validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  janitor:
    runs-on: ubuntu-latest
    env:
      AIPS_DOCS_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.ref_name != github.event.repository.default_branch && format('origin/{0}', github.event.repository.default_branch) || '' }}
      AIPS_GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || format('{0}^', github.sha) }}
      AIPS_GATE_BASE_TIP: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
      AIPS_GATE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-visual.txt -r requirements-validation.txt
      - name: Refresh pull request base tip
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          AIPS_GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: >-
          git fetch --no-tags origin
          "+refs/heads/$AIPS_GATE_BASE_REF:refs/remotes/origin/$AIPS_GATE_BASE_REF"
      - name: Resolve change class
        id: change_class
        shell: bash
        env:
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: |
          value=standard
          case ",$PR_LABELS," in
            *,aips:core-change,*) value=core ;;
            *,aips:large-change,*) value=large ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: deterministic integration gate
        shell: bash
        run: |
          base_tip_args=()
          matrix_args=()
          if [[ -n "$AIPS_GATE_BASE_TIP" ]]; then
            base_tip_args=(--base-tip "$AIPS_GATE_BASE_TIP")
          fi
          if [[ -f .aips/review/CORE_CHANGE_TEST_MATRIX.yaml ]]; then
            matrix_args=(--matrix .aips/review/CORE_CHANGE_TEST_MATRIX.yaml)
          fi
          python scripts/integration_gate.py \
            --profile config/integration-gate.yaml \
            --base "$AIPS_GATE_BASE" \
            --head "$AIPS_GATE_HEAD" \
            --change-class "${{ steps.change_class.outputs.value }}" \
            "${base_tip_args[@]}" \
            "${matrix_args[@]}" \
            --output integration-gate-report.yaml

  gemini-runtime-verification:
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'aips:core-change') || contains(github.event.pull_request.labels.*.name, 'aips:large-change') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-validation.txt
      - name: Install pinned Gemini CLI stable
        run: npm install --global @google/gemini-cli@0.60.0
      - name: Verify real Gemini CLI tool and AfterTool capture path
        run: >-
          python tests/evidence/gemini_cli_runtime_verification.py
          --gemini gemini
          --expected-version 0.60.0
          --output gemini-runtime-verification-report.json

  repository:
    needs: [janitor, gemini-runtime-verification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: required repository aggregate
        shell: bash
        run: |
          test "${{ needs.janitor.result }}" = "success"
          case "${{ needs.gemini-runtime-verification.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
