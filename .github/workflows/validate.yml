name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-visual.txt
      - run: python tests/validate_repository.py
      - name: Render visual lifecycle evidence
        env:
          AIPS_VISUAL_ARTIFACT_DIR: .artifacts/visual-render
        run: python tests/evidence/visual_render_lifecycle.py
      - name: Preserve visual evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-render-evidence
          path: .artifacts/visual-render
          if-no-files-found: warn
          retention-days: 7
