name: validate
run-name: >-
  validate pr=${{ github.event.pull_request.number || 0 }} head=${{ github.event.pull_request.head.sha || github.sha }} base=${{ github.event.pull_request.base.sha || github.event.before || '' }} class=${{ contains(github.event.pull_request.labels.*.name, 'aips:core-change') && 'core' || contains(github.event.pull_request.labels.*.name, 'aips:large-change') && 'large' || 'standard' }}

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
         ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'aips:core-change' ||
          github.event.label.name == 'aips:large-change')) }}

permissions:
  contents: read

jobs:
  advisory-fast-feedback:
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.action != 'labeled' &&
          github.event.action != 'unlabeled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AIPS_GATE_BASE: ${{ github.event.pull_request.base.sha }}
      AIPS_GATE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install fast preflight dependency
        run: python -m pip install -c constraints/tested.txt PyYAML
      - name: Run advisory exact-candidate repository preflight
        id: fast_preflight
        continue-on-error: true
        run: >-
          python scripts/repository_preflight.py
          --base "$AIPS_GATE_BASE" --head "$AIPS_GATE_HEAD"
      - name: Report advisory preflight outcome
        if: always()
        env:
          AIPS_FAST_PREFLIGHT_OUTCOME: ${{ steps.fast_preflight.outcome }}
        run: |
          if [[ "$AIPS_FAST_PREFLIGHT_OUTCOME" == "success" ]]; then
            echo "Advisory fast feedback: PASS for $AIPS_GATE_HEAD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Advisory fast feedback: FINDINGS for $AIPS_GATE_HEAD (full required repository validation still runs independently)." >> "$GITHUB_STEP_SUMMARY"
          fi

  janitor:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'aips:core-change' ||
          github.event.label.name == 'aips:large-change' }}
    runs-on: ubuntu-24.04
    env:
      AIPS_DOCS_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.ref_name != github.event.repository.default_branch && format('origin/{0}', github.event.repository.default_branch) || '' }}
      AIPS_GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || format('{0}^', github.sha) }}
      AIPS_GATE_BASE_TIP: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
      AIPS_GATE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-visual.txt
            requirements-validation.txt
            requirements-openapi.txt
            constraints/tested.txt
      - name: Build exact-candidate optional toolchain plan
        id: validation_plan
        shell: bash
        run: |
          python -m pip install -c constraints/tested.txt PyYAML
          plan_path="$RUNNER_TEMP/ci-validation-plan.json"
          python scripts/ci_validation_plan.py --base "$AIPS_GATE_BASE" --head "$AIPS_GATE_HEAD" --output "$plan_path"
          echo "AIPS_CI_VALIDATION_PLAN=$plan_path" >> "$GITHUB_ENV"
          echo "needs_node=$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["needs_node"]).lower())' "$plan_path")" >> "$GITHUB_OUTPUT"
          echo "needs_browser=$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["needs_browser"]).lower())' "$plan_path")" >> "$GITHUB_OUTPUT"
          echo "needs_openapi=$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["needs_openapi"]).lower())' "$plan_path")" >> "$GITHUB_OUTPUT"
          cat "$plan_path" >> "$GITHUB_STEP_SUMMARY"
      - name: Fast documentation impact precheck
        run: |
          python -m pip install -c constraints/tested.txt PyYAML
          python scripts/publish_preflight.py docs-impact \
            --base "$AIPS_GATE_BASE" \
            --head "$AIPS_GATE_HEAD" \
            --require-complete \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --format json
      - name: Refresh pull request base tip
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          AIPS_GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: >-
          git fetch --no-tags origin
          "+refs/heads/$AIPS_GATE_BASE_REF:refs/remotes/origin/$AIPS_GATE_BASE_REF"
      - name: Mandatory candidate secret scan (fail fast)
        run: >-
          python scripts/check_secret_leakage.py --root .
          --policy config/secret-scan.yaml --publication-candidate
          --base "$AIPS_GATE_BASE" --head "$AIPS_GATE_HEAD" --json
      - name: Repository preflight (fail fast)
        run: >-
          python scripts/repository_preflight.py
          --base "$AIPS_GATE_BASE" --head "$AIPS_GATE_HEAD"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.validation_plan.outputs.needs_node == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install documentation build dependencies
        if: steps.validation_plan.outputs.needs_node == 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts
      - run: python -m pip install -c constraints/tested.txt -r requirements.txt -r requirements-validation.txt
      - name: Enforce progressive quality ratchet
        run: python scripts/quality_ratchet.py check --base "$AIPS_GATE_BASE"
      - name: Install browser validation dependencies
        if: steps.validation_plan.outputs.needs_browser == 'true'
        run: python -m pip install -c constraints/tested.txt -r requirements-visual.txt
      - name: Install OpenAPI validation dependencies
        if: steps.validation_plan.outputs.needs_openapi == 'true'
        run: python -m pip install -c constraints/tested.txt -r requirements-openapi.txt
      - name: Install deterministic Playwright Chromium
        if: steps.validation_plan.outputs.needs_browser == 'true'
        run: python -m playwright install chromium
      - name: Resolve change class
        id: change_class
        shell: bash
        env:
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: |
          value=standard
          case ",$PR_LABELS," in
            *,aips:core-change,*) value=core ;;
            *,aips:large-change,*) value=large ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Publish validator selection shadow plan
        env:
          AIPS_SHADOW_REPORT: ${{ runner.temp }}/validation-shadow-plan.json
        run: |
          python scripts/validation_shadow_plan.py \
            --base "$AIPS_GATE_BASE" \
            --head "$AIPS_GATE_HEAD" \
            --change-class "${{ steps.change_class.outputs.value }}" \
            --output "$AIPS_SHADOW_REPORT" >> "$GITHUB_STEP_SUMMARY"
      - name: deterministic integration gate
        id: gate
        shell: bash
        env:
          AIPS_GATE_REPORT: ${{ runner.temp }}/integration-gate-report.yaml
          AIPS_VALIDATION_TIMING_REPORT: ${{ runner.temp }}/repository-validation-timing.json
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: |
          base_tip_args=()
          if [[ -n "$AIPS_GATE_BASE_TIP" ]]; then
            base_tip_args=(--base-tip "$AIPS_GATE_BASE_TIP")
          fi
          python scripts/publish_preflight.py run \
            --base "$AIPS_GATE_BASE" \
            --head "$AIPS_GATE_HEAD" \
            --profile config/integration-gate.yaml \
            --matrix .aips/review/CORE_CHANGE_TEST_MATRIX.yaml \
            --change-class "${{ steps.change_class.outputs.value }}" \
            --labels "$PR_LABELS" \
            --offline \
            "${base_tip_args[@]}" \
            --output "$AIPS_GATE_REPORT"
      - name: Capture combined validation observation
        if: ${{ always() }}
        shell: bash
        env:
          AIPS_SHADOW_REPORT: ${{ runner.temp }}/validation-shadow-plan.json
          AIPS_TIMING_REPORT: ${{ runner.temp }}/repository-validation-timing.json
          AIPS_GATE_REPORT: ${{ runner.temp }}/integration-gate-report.yaml
          AIPS_OBSERVATION: ${{ runner.temp }}/validation-observation/observation.json
        run: |
          args=(--event "$GITHUB_EVENT_PATH" --output "$AIPS_OBSERVATION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow "$GITHUB_WORKFLOW")
          [[ -s "$AIPS_SHADOW_REPORT" ]] && args+=(--shadow "$AIPS_SHADOW_REPORT")
          [[ -s "$AIPS_TIMING_REPORT" ]] && args+=(--timing "$AIPS_TIMING_REPORT")
          [[ -s "$AIPS_GATE_REPORT" ]] && args+=(--gate "$AIPS_GATE_REPORT")
          python scripts/validation_observation.py capture "${args[@]}"
      - name: Upload combined validation observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-observation/observation.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Integration Gate evidence summary
        if: ${{ always() }}
        shell: bash
        env:
          AIPS_GATE_OUTCOME: ${{ steps.gate.outcome }}
          AIPS_GATE_REPORT: ${{ runner.temp }}/integration-gate-report.yaml
        run: |
          if [[ "$AIPS_GATE_OUTCOME" == "skipped" ]]; then
            echo "Integration Gate: NOT_RUN (earlier step prevented execution)." >> "$GITHUB_STEP_SUMMARY"
          elif [[ ! -s "$AIPS_GATE_REPORT" ]]; then
            echo "Integration Gate: REPORT_UNAVAILABLE (step outcome: ${AIPS_GATE_OUTCOME:-unknown})." >> "$GITHUB_STEP_SUMMARY"
          else
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import yaml
          from pathlib import Path

          report = yaml.safe_load(Path(os.environ["AIPS_GATE_REPORT"]).read_text(encoding="utf-8")) or {}
          candidate = report.get("candidate") or {}
          print(f"Integration Gate: {report.get('status', 'REPORT_UNAVAILABLE')}")
          print(f"Candidate: {candidate.get('head_sha', 'unknown')}")
          print(f"Fingerprint: {report.get('candidate_fingerprint', 'unknown')}")
          for check in report.get("checks") or []:
              print(f"- {check.get('id', 'unknown')}: {check.get('status', 'unknown')} "
                    f"(exit={check.get('exit_code', 'n/a')}, reason={check.get('reason', 'n/a')}, duration_ms={check.get('duration_ms', 'n/a')})")
          PY
          fi
      - name: Upload Integration Gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-gate-report.yaml
          if-no-files-found: ignore
          retention-days: 14
      - name: Repository validation timing summary
        if: ${{ always() }}
        shell: bash
        env:
          AIPS_TIMING_PATH: ${{ runner.temp }}/repository-validation-timing.json
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["AIPS_TIMING_PATH"])
          if not path.is_file():
              print("Repository timing: UNAVAILABLE (validation did not produce timing evidence).")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              print(f"Repository timing: {report.get('status', 'UNKNOWN')}; total_ms={report.get('total_duration_ms', 'unknown')}")
              checks = sorted(report.get("checks", []), key=lambda item: item.get("duration_ms", 0), reverse=True)
              for check in checks[:10]:
                  print(f"- {check.get('name', 'unknown')}: {check.get('duration_ms', 'unknown')} ms ({check.get('status', 'unknown')})")
          PYTHON
      - name: Upload repository validation timing
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-validation-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-validation-timing.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload validator selection shadow plan
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-shadow-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-shadow-plan.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Repository Health evidence
        if: ${{ always() }}
        shell: bash
        env:
          AIPS_HEALTH_REPORT: ${{ runner.temp }}/repository-health-report.json
        run: |
          python scripts/repository_health.py audit \
            --config config/repository-health.yaml \
            --format json > "$AIPS_HEALTH_REPORT"
      - name: Upload Repository Health evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-health-report.json
          if-no-files-found: ignore
          retention-days: 14

  dependency-review-shadow:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/dependency-review.yml
    with:
      shadow: true

  repository:
    needs: janitor
    permissions:
      contents: read
      actions: read
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: required repository aggregate
        env:
          AIPS_LABEL_NOOP: ${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'aips:core-change' && github.event.label.name != 'aips:large-change' }}
          AIPS_JANITOR_RESULT: ${{ needs.janitor.result }}
          GH_TOKEN: ${{ github.token }}
          AIPS_EXPECTED_RUN: validate pr=${{ github.event.pull_request.number || 0 }} head=${{ github.event.pull_request.head.sha || github.sha }} base=${{ github.event.pull_request.base.sha || github.event.before || '' }} class=${{ contains(github.event.pull_request.labels.*.name, 'aips:core-change') && 'core' || contains(github.event.pull_request.labels.*.name, 'aips:large-change') && 'large' || 'standard' }}
          AIPS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$AIPS_JANITOR_RESULT" == "skipped" && "$AIPS_LABEL_NOOP" == "true" ]]; then
            python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import sys

          def api(path):
              result = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError("GitHub validation evidence unavailable")
              return json.loads(result.stdout)

          passed = False
          try:
              repo = os.environ["GITHUB_REPOSITORY"]
              head = os.environ["AIPS_CANDIDATE_HEAD"]
              current = int(os.environ["GITHUB_RUN_ID"])
              runs = api(f"repos/{repo}/actions/workflows/validate.yml/runs?head_sha={head}&per_page=100")["workflow_runs"]
              for run in sorted(runs, key=lambda item: item["id"], reverse=True):
                  if run["id"] >= current or run.get("head_sha") != head:
                      continue
                  jobs = api(f"repos/{repo}/actions/runs/{run['id']}/jobs?filter=latest")["jobs"]
                  janitor = next((job for job in jobs if job["name"] == "janitor"), None)
                  if janitor and janitor.get("conclusion") == "skipped":
                      continue
                  passed = bool(janitor and janitor.get("conclusion") == "success" and run.get("display_title") == os.environ["AIPS_EXPECTED_RUN"])
                  break
          except (RuntimeError, ValueError, KeyError, OSError):
              passed = False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Label-only validation: " + ("PASS (matching complete Gate)" if passed else "BLOCKED (no matching successful complete Gate)") + "\n")
          sys.exit(0 if passed else 1)
          PYTHON
            exit $?
          fi
          test "$AIPS_JANITOR_RESULT" = "success"
