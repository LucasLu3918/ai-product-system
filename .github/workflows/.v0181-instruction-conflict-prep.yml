name: v0181-instruction-conflict-prep

on:
  push:
    branches:
      - release/v0.18.1-instruction-conflict

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.18.1-instruction-conflict
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/.v0181_instruction_conflict_prep.py
      - name: Commit validated v0.18.1 changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md docs/CONFORMANCE.md scripts/project_intelligence.py templates/intelligence/PROJECT_OVERRIDES.yaml templates/intelligence/TURN_CONTEXT_MANIFEST.yaml tests/evidence/intelligence_context_lifecycle.py tests/scenario_coverage.yaml tests/validation/conformance_isolation.py
          git commit -m "feat(context): integrate instruction conflicts with project authority"
          git push origin HEAD:release/v0.18.1-instruction-conflict
