name: e2b-sandbox-verification

on:
  workflow_dispatch:
    inputs:
      provider_test_consent_confirmed:
        description: I have obtained E2B's required prior written consent for this test.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.provider_test_consent_confirmed == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install optional E2B verifier
        run: python -m pip install -r requirements.txt -r requirements-sandbox.txt
      - name: Run synthetic provider smoke test
        if: github.ref == 'refs/heads/main' && inputs.provider_test_consent_confirmed == true
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/e2b_sandbox_verification.py --output e2b-sandbox-verification.json --check-artifact-path results/output.txt
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2b-sandbox-verification-${{ github.sha }}
          path: e2b-sandbox-verification.json
          if-no-files-found: error
