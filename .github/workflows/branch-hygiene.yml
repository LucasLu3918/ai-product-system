name: branch-hygiene

on:
  schedule:
    - cron: "0 2 * * 1"  # Monday 10:00 Asia/Taipei
  workflow_dispatch:
    inputs:
      apply_cleanup:
        description: Apply the exact Human-approved one-time cleanup manifest
        required: false
        default: false
        type: boolean
      proposal_run_id:
        description: Successful main branch-hygiene report run containing the approved proposal
        type: string
        required: false
        default: ''
      proposal_fingerprint:
        description: Exact sha256 proposal fingerprint explicitly approved for this one-time cleanup
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - scripts/branch_hygiene.py
      - config/branch-lifecycle.yaml
      - config/branch-cleanup-manifest.yaml
      - .github/workflows/branch-hygiene.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: python -m pip install -c constraints/tested.txt -r requirements.txt

      - name: Refresh remote branch refs
        shell: bash
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Read pull request metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 1000
          --json number,headRefName,headRefOid,baseRefName,state,mergedAt,closedAt
          > branch-pull-requests.json

      - name: Build deterministic report
        run: >-
          python scripts/branch_hygiene.py
          --config config/branch-lifecycle.yaml
          --target main
          --remote origin
          --pull-requests branch-pull-requests.json
          --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          > branch-hygiene.yaml

      - name: Publish report summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          report = yaml.safe_load(Path("branch-hygiene.yaml").read_text(encoding="utf-8"))
          rows = report.get("branches") or []
          candidates = [row for row in rows if row.get("recommended_action") == "REVIEW_FOR_CLEANUP"]
          persistent = [row["branch"] for row in rows if row.get("lifecycle") == "PERSISTENT"]
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("# Branch Hygiene Report\n\n")
              out.write(f"- target: `{report['target']}`\n")
              out.write(f"- generated against main: `{report['generated_against_main_sha']}`\n")
              out.write(f"- proposal fingerprint: `{report['cleanup_proposal']['proposal_fingerprint']}`\n")
              out.write(f"- ref scope: `{report['ref_scope']}`\n")
              out.write(f"- policy: `{report['policy']}`\n")
              out.write(f"- branches inspected: **{len(rows)}**\n")
              out.write(f"- cleanup proposals: **{len(candidates)}**\n")
              out.write(f"- persistent branches: **{len(persistent)}**\n")
              out.write("- branch_deletion_authorized: **false**\n")
              out.write("- human_authority_preserved: **true**\n\n")
              if rows:
                  out.write("## Branch cleanup proposal\n\n")
                  out.write("| Branch | Current SHA | Merged PR | Age (days) | Main integration | Recommended action |\n")
                  out.write("|---|---|---|---:|---|---|\n")
                  for row in rows:
                      out.write(
                          f"| `{row['branch']}` | `{row['current_sha']}` | "
                          f"{row.get('merged_pr') or '—'} ({row['merged_status']}) | "
                          f"{row['age_days']} | {row['integrated_into_target']} | "
                          f"{row['recommended_action']} |\n"
                      )
          PY

      - name: Upload branch cleanup proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-cleanup-proposal-${{ github.run_id }}
          path: branch-hygiene.yaml
          retention-days: 90

      - name: Verify report-only authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          report = yaml.safe_load(Path("branch-hygiene.yaml").read_text(encoding="utf-8"))
          authority = report.get("authority") or {}
          assert authority.get("branch_deletion_authorized") is False
          assert authority.get("human_authority_preserved") is True
          PY

  dispatch-identity:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply_cleanup == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/aips-python-bootstrap
        with:
          python-version: "3.12"
          requirements-files: |
            requirements.txt
            requirements-validation.txt
          constraints-file: constraints/tested.txt
          cache-dependency-path: |
            requirements.txt
            requirements-validation.txt
            constraints/tested.txt
          verification-modules: |
            yaml
            cryptography
      - name: Verify issuer without deleting refs
        run: python scripts/branch_hygiene.py --verify-dispatch-only --github-repository "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply_cleanup == true
    needs: report
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: python -m pip install -c constraints/tested.txt -r requirements.txt -r requirements-validation.txt

      - name: Refresh exact remote branch refs
        shell: bash
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Apply exact Human-authorized cleanup manifest
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_PROPOSAL_RUN_ID: ${{ inputs.proposal_run_id }}
          APPROVED_PROPOSAL_FINGERPRINT: ${{ inputs.proposal_fingerprint }}
        run: >-
          python scripts/branch_hygiene.py
          --config config/branch-lifecycle.yaml
          --target main
          --remote origin
          --proposal-run-id "$APPROVED_PROPOSAL_RUN_ID"
          --proposal-fingerprint "$APPROVED_PROPOSAL_FINGERPRINT"
          --github-repository "$GITHUB_REPOSITORY"
          > branch-cleanup-result.yaml

      - name: Publish cleanup result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import yaml

          result = yaml.safe_load(Path("branch-cleanup-result.yaml").read_text(encoding="utf-8"))
          summary = result.get("summary") or {}
          authority = result.get("authority") or {}
          assert authority.get("authorization_scope") == "exact_manifest_only"
          assert authority.get("human_authority_preserved") is True
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("# Controlled Branch Cleanup\n\n")
              out.write(f"- cleanup_id: `{result.get('cleanup_id')}`\n")
              out.write(f"- requested: **{summary.get('requested', 0)}**\n")
              out.write(f"- deleted: **{summary.get('deleted', 0)}**\n")
              out.write(f"- already absent: **{summary.get('already_absent', 0)}**\n")
              out.write("- authorization scope: **exact_manifest_only**\n")
              out.write("- human authority preserved: **true**\n")
          PY
      - name: Retain cleanup audit and recovery refs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-cleanup-result-${{ github.run_id }}
          path: branch-cleanup-result.yaml
          retention-days: 90
