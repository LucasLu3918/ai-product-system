name: v0180-capability-check

on:
  push:
    branches:
      - release/v0.18.0-capability

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tests/evidence/instruction_resolution_lifecycle.py
      - run: python tests/evidence/project_overrides_refresh_lifecycle.py
      - run: python tests/evidence/monorepo_lazy_intelligence_lifecycle.py
      - run: python tests/evidence/project_intelligence_promotion_lifecycle.py
      - run: python tests/validate_repository.py
