name: evolution-effectiveness

on:
  schedule:
    # Monthly on day 2 at 10:15 Asia/Taipei, after the monthly Radar rollup.
    - cron: "15 2 2 * *"
  workflow_dispatch:
    inputs:
      period:
        description: Optional cohort month (YYYY-MM). Defaults to previous UTC calendar month.
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      - name: Resolve cohort period
        id: period
        shell: bash
        env:
          REQUESTED_PERIOD: ${{ inputs.period }}
        run: |
          period="$REQUESTED_PERIOD"
          if [[ -z "$period" ]]; then
            period="$(python - <<'PY'
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          year = now.year
          month = now.month - 1
          if month == 0:
              year -= 1
              month = 12
          print(f"{year:04d}-{month:02d}")
          PY
          )"
          fi
          if [[ ! "$period" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "period must be YYYY-MM" >&2
            exit 1
          fi
          echo "value=$period" >> "$GITHUB_OUTPUT"

      - name: Load durable Evolution Radar issue history
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          index = json.loads(subprocess.check_output([
              "gh", "issue", "list",
              "--repo", repo,
              "--state", "all",
              "--limit", "500",
              "--search", "Evolution Radar",
              "--json", "number,title,body,createdAt,state",
          ], text=True))
          rows = []
          for item in index:
              title = str(item.get("title") or "")
              if not title.startswith("Evolution Radar ["):
                  continue
              number = str(item["number"])
              detail = json.loads(subprocess.check_output([
                  "gh", "issue", "view", number,
                  "--repo", repo,
                  "--json", "number,title,body,createdAt,state,comments",
              ], text=True))
              rows.append(detail)
          Path("evolution-effectiveness-input.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Build deterministic effectiveness evidence
        shell: bash
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/evolution_effectiveness.py build \
            --issues-json evolution-effectiveness-input.json \
            --config config/evolution-effectiveness.yaml \
            --period "${{ steps.period.outputs.value }}" \
            --repository-revision "$GITHUB_SHA" \
            --generated-at "$generated_at" \
            --output evolution-effectiveness.yaml
          python scripts/evolution_effectiveness.py validate \
            evolution-effectiveness.yaml \
            --config config/evolution-effectiveness.yaml
          python scripts/evolution_effectiveness.py markdown \
            evolution-effectiveness.yaml \
            --config config/evolution-effectiveness.yaml \
            --output evolution-effectiveness.md

      - name: Publish Job Summary
        run: cat evolution-effectiveness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish or reconcile effectiveness issue
        shell: bash
        env:
          PERIOD: ${{ steps.period.outputs.value }}
        run: |
          title="Evolution Effectiveness [monthly] $PERIOD"
          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 500 \
            --search "Evolution Effectiveness" \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          flags="$(python - <<'PY'
          import yaml
          doc = yaml.safe_load(open("evolution-effectiveness.yaml")) or {}
          print(len(doc.get("review_flags") or []))
          PY
          )"

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file evolution-effectiveness.md
            number="$existing"
          else
            url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file evolution-effectiveness.md)"
            number="${url##*/}"
          fi

          if [[ "$flags" -gt 0 ]]; then
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          else
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed >/dev/null 2>&1 || true
          fi
