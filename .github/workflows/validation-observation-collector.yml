name: Validation Observation Collector

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Observation window (1–90 days)
        required: false
        default: "30"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    # Timing history has only two observed runs (31 seconds); 15 minutes is a
    # conservative provisional bound, not a statistically reliable P95-derived limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/aips-python-bootstrap
        with:
          python-version: "3.12"
          requirements-files: |
            requirements.txt
            requirements-validation.txt
          cache-dependency-path: |
            requirements.txt
            requirements-validation.txt
            constraints/tested.txt
          constraints-file: constraints/tested.txt
          verification-modules: |
            yaml
      - name: Collect bounded full-run evidence and evaluate graduation
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIPS_OBSERVATION_DAYS: ${{ inputs.days || '30' }}
          AIPS_DATASET: ${{ runner.temp }}/validation-graduation-dataset.json
          AIPS_REPORT: ${{ runner.temp }}/validation-graduation-report.json
        run: >-
          python scripts/validation_observation.py collect
          --days "$AIPS_OBSERVATION_DAYS"
          --output "$AIPS_DATASET"
          --report "$AIPS_REPORT"
      - name: Preserve bounded dataset and readiness report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-graduation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/validation-graduation-dataset.json
            ${{ runner.temp }}/validation-graduation-report.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Report readiness result
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          AIPS_REPORT: ${{ runner.temp }}/validation-graduation-report.json
        run: |
          if [[ "$COLLECT_OUTCOME" != "success" ]]; then
            echo "Validation Observation Collector: ERROR (operational collection failed; inspect the bounded report artifact if available)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ! -s "$AIPS_REPORT" ]]; then
            echo "Validation Observation Collector: ERROR (report is missing or empty)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", "UNKNOWN"))' "$AIPS_REPORT")"
          case "$status" in
            READY_FOR_HUMAN_REVIEW)
              echo "Validation graduation: READY_FOR_HUMAN_REVIEW (human review is still required)." >> "$GITHUB_STEP_SUMMARY"
              ;;
            NOT_READY)
              echo "Validation graduation: NOT_READY (evidence collection completed; full validation continues)." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Validation Observation Collector: ERROR (missing or unknown report status)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
