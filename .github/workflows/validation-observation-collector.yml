name: Validation Observation Collector

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Observation window (1–90 days)
        required: false
        default: "30"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-validation.txt
            constraints/tested.txt
      - run: python -m pip install -c constraints/tested.txt -r requirements-validation.txt PyYAML
      - name: Collect bounded full-run evidence and evaluate graduation
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIPS_OBSERVATION_DAYS: ${{ inputs.days || '30' }}
          AIPS_DATASET: ${{ runner.temp }}/validation-graduation-dataset.json
          AIPS_REPORT: ${{ runner.temp }}/validation-graduation-report.json
        run: >-
          python scripts/validation_observation.py collect
          --days "$AIPS_OBSERVATION_DAYS"
          --output "$AIPS_DATASET"
          --report "$AIPS_REPORT"
      - name: Preserve bounded dataset and readiness report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-graduation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/validation-graduation-dataset.json
            ${{ runner.temp }}/validation-graduation-report.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Report readiness result
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          if [[ "$COLLECT_OUTCOME" != "success" ]]; then
            echo "Validation graduation remains NOT_READY; inspect the bounded report artifact for evidence gaps."
            exit 1
          fi
