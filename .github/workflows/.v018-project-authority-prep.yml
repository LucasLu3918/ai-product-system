name: v018-project-authority-prep

on:
  push:
    branches:
      - release/v0.18.0-project-authority

permissions:
  contents: write

concurrency:
  group: v018-project-authority-prep
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.18.0-project-authority
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/.v018_project_authority_prep.py
      - name: Commit prepared v0.18.0 release
        run: |
          if git diff --quiet; then
            echo "No release-prep changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md docs/CONFORMANCE.md orchestration/PROJECT_INTELLIGENCE.md bin/aips scripts/project_intelligence.py tests/evidence/project_override_reconciliation_lifecycle.py tests/scenario_coverage.yaml tests/validation/conformance_isolation.py
          git commit -m "chore(release): prepare v0.18.0 project authority"
          git push origin HEAD:release/v0.18.0-project-authority
