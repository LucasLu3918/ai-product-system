name: focused-pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focused-pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared-deterministic-primitives:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -c constraints/tested.txt -r requirements-pytest.txt
      - name: Run focused deterministic primitive tests
        run: python -m pytest -q tests/test_aips_common_primitives.py
