name: installation-entrypoints

on:
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/aips_cli.sh"
      - "scripts/system_facts.py"
      - "config/system-facts.yaml"
      - "pyproject.toml"
      - "scripts/install.ps1"
      - "scripts/uninstall.ps1"
      - "scripts/bootstrap.sh"
      - "scripts/uninstall.sh"
      - "bin/aips"
      - "docs/human/INSTALLATION.md"
      - "docs/human/MAINTENANCE.md"
      - "docs/human/USER_GUIDE.md"
      - "docs/human/GETTING_STARTED.md"
      - "README.md"
      - "requirements-openapi.txt"
      - "scripts/package_install.py"
      - "tests/evidence/runtime_recovery_lifecycle.py"
      - "tests/evidence/release_channel_lifecycle.py"
      - "tests/evidence/install_download_lifecycle.py"
      - "tests/evidence/openapi_cli_install_lifecycle.py"
      - "tests/evidence/install_preflight_lifecycle.py"
      - "tests/evidence/system_facts_lifecycle.py"
      - "tests/validation/system_facts_contracts.py"
      - "tests/evidence/install_download_contract.ps1"
      - ".github/workflows/installation-entrypoints.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: bash -n scripts/install.sh scripts/bootstrap.sh scripts/uninstall.sh
      - run: bash scripts/install.sh --dry-run
      - run: python3 tests/evidence/install_download_lifecycle.py
      - run: python3 tests/evidence/openapi_cli_install_lifecycle.py

  linux-lifecycle:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-openapi.txt
      - shell: bash
        run: |
          export HOME="$RUNNER_TEMP/aips-home"
          export AIPS_INSTALL_DIR="$RUNNER_TEMP/aips-system"
          mkdir -p "$HOME"
          AIPS_INSTALL_SOURCE="$GITHUB_WORKSPACE" bash scripts/install.sh --channel main
          export PATH="$HOME/.local/bin:$PATH"
          aips doctor
          optional_status="$(aips openapi doctor)"
          printf '%s\n' "$optional_status"
          [[ "$optional_status" == *NOT_INSTALLED* ]]
          mkdir -p "$RUNNER_TEMP/aips openapi product"
          cat > "$RUNNER_TEMP/aips openapi product/openapi.yaml" <<'EOF'
          openapi: 3.0.3
          info: {title: Installed CLI fixture, version: '1.0'}
          paths: {}
          EOF
          if missing_output="$(aips openapi validate "$RUNNER_TEMP/aips openapi product/openapi.yaml" --repo-root "$RUNNER_TEMP/aips openapi product" 2>&1)"; then
            echo "OpenAPI validation must request explicit optional dependency installation before setup." >&2
            exit 1
          fi
          [[ "$missing_output" == *"Run: aips openapi install"* ]]
          printf '%s\n' "$missing_output"
          aips openapi install
          aips openapi doctor
          aips openapi validate "$RUNNER_TEMP/aips openapi product/openapi.yaml" --repo-root "$RUNNER_TEMP/aips openapi product"
          aips mcp inspect
          aips uninstall --remove-venv

  windows-contract:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/uninstall.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          ./scripts/install.ps1 -DryRun
      - shell: pwsh
        run: ./tests/evidence/install_download_contract.ps1
