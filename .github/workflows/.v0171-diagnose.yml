name: v0171-diagnose

on:
  push:
    branches:
      - release/v0.17.1

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.17.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Capture lifecycle output
        run: |
          set +e
          python tests/evidence/legacy_harness_migration_lifecycle.py > .v0171-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> .v0171-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .v0171-diagnostic.txt
          git commit -m "chore(test): record v0.17.1 lifecycle diagnostic"
          git push origin HEAD:release/v0.17.1
