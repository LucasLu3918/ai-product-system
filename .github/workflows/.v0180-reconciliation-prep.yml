name: v0180-reconciliation-prep

on:
  push:
    branches:
      - release/v0.18.0-reconciliation

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.18.0-reconciliation
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/.v0180_reconciliation_prep.py
      - run: python tests/evidence/project_override_reconciliation_lifecycle.py
      - run: python tests/validate_repository.py
      - name: Commit capability implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/project_intelligence.py bin/aips templates/intelligence/PROJECT_OVERRIDES.yaml orchestration/PROJECT_INTELLIGENCE.md tests/evidence/project_override_reconciliation_lifecycle.py
          if git diff --cached --quiet; then
            echo "No capability changes to commit"
            exit 0
          fi
          git commit -m "feat(intelligence): reconcile approved project overrides"
          git push origin HEAD:release/v0.18.0-reconciliation
