name: retrieval-semantic-trial

on:
  push:
    branches:
      - feature/retrieval-embedding-trial
  workflow_dispatch:

concurrency:
  group: retrieval-semantic-trial-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic-embedding-trial:
    runs-on: ubuntu-latest
    env:
      AIPS_RETRIEVAL_EMBEDDING_PROVIDER: ${{ vars.AIPS_RETRIEVAL_EMBEDDING_PROVIDER }}
      AIPS_RETRIEVAL_EMBEDDING_MODEL: ${{ vars.AIPS_RETRIEVAL_EMBEDDING_MODEL }}
      AIPS_RUN_EMBEDDING_TRIAL: "1"
      AIPS_EMBEDDING_TRIAL_OUTPUT: ${{ github.workspace }}/retrieval-embedding-trial.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-visual.txt -r requirements-semantic-trial.txt
      - name: Run synthetic-only embedding retrieval Trial (local/default)
        if: ${{ vars.AIPS_RETRIEVAL_EMBEDDING_PROVIDER != 'remote' }}
        env:
          SENTENCE_TRANSFORMERS_HOME: ${{ runner.temp }}/aips-semantic-model-cache
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python tests/evidence/retrieval_quality_evaluation_lifecycle.py
      - name: Run synthetic-only embedding retrieval Trial (remote optional)
        if: ${{ vars.AIPS_RETRIEVAL_EMBEDDING_PROVIDER == 'remote' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTENCE_TRANSFORMERS_HOME: ${{ runner.temp }}/aips-semantic-model-cache
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python tests/evidence/retrieval_quality_evaluation_lifecycle.py
      - name: Print bounded Trial evidence
        if: always()
        shell: bash
        run: |
          if [[ -f retrieval-embedding-trial.json ]]; then
            cat retrieval-embedding-trial.json
          else
            echo '{"trial":{"status":"TRIAL_BLOCKED","recommendation":"HOLD"},"summary":{"reason":"Trial report was not produced"}}'
          fi
      - name: Publish Trial operator summary
        if: always()
        shell: bash
        run: |
          python scripts/retrieval_embedding_trial_summary.py \
            --report retrieval-embedding-trial.json \
            --output "$GITHUB_STEP_SUMMARY"
