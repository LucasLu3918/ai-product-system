name: v0180-override-reconcile

on:
  push:
    branches:
      - release/v0.18.0-capability

permissions:
  contents: write

jobs:
  capability:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.18.0-capability
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/.v0180_override_reconcile_patch.py
      - run: python -m py_compile scripts/project_intelligence.py tests/evidence/project_overrides_refresh_lifecycle.py
      - run: python tests/evidence/project_overrides_refresh_lifecycle.py
      - run: python tests/evidence/instruction_resolution_lifecycle.py
      - run: python tests/evidence/project_intelligence_lifecycle.py
      - run: python tests/validate_repository.py
      - name: Commit validated capability
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/project_intelligence.py orchestration/PROJECT_INTELLIGENCE.md tests/evidence/project_overrides_refresh_lifecycle.py
          git commit -m "feat(intelligence): preserve overrides during refresh reconciliation"
          git push origin HEAD:release/v0.18.0-capability
