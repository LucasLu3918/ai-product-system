name: gemini-provider-session-verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gemini-provider-session-verification.yml"
      - "scripts/gemini_provider_session_verification.py"
      - "harness/adapters/gemini-cli/**"
      - "config/gemini-observable-event-capture.yaml"
      - "references/evolution/ISSUE_79_GEMINI_PROVIDER_SESSION_*.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check protected provider credential presence
        id: credential
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -n "$GEMINI_API_KEY" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record optional provider verification disabled state
        if: steps.credential.outputs.present != 'true'
        shell: bash
        run: |
          python scripts/gemini_provider_session_verification.py             --extension harness/adapters/gemini-cli             --output gemini-provider-session-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("gemini-provider-session-verification.json").read_text())
          assert doc["status"] == "SKIPPED_NOT_CONFIGURED"
          assert doc["provider_verification_enabled"] is False
          assert doc["required_for_release"] is False
          assert doc["live_provider_session_verified"] is False
          assert doc["provider_model_execution_verified"] is False
          PY
          echo "## Gemini provider-session verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: SKIPPED_NOT_CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
          echo "- provider_verification_enabled: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- required_for_release: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- live_provider_session_verified: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- provider_model_execution_verified: false" >> "$GITHUB_STEP_SUMMARY"

      - name: Install AIPS dependencies
        if: steps.credential.outputs.present == 'true'
        run: python -m pip install -r requirements.txt -r requirements-validation.txt

      - name: Install pinned Gemini CLI
        if: steps.credential.outputs.present == 'true'
        run: |
          npm install --global @google/gemini-cli@0.60.0
          test "$(gemini --version)" = "0.60.0"

      - name: Execute trusted live provider-session verification
        if: steps.credential.outputs.present == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIPS_EXPECTED_SHA: ${{ github.sha }}
        run: |
          python scripts/gemini_provider_session_verification.py             --gemini "$(command -v gemini)"             --extension harness/adapters/gemini-cli             --output gemini-provider-session-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("gemini-provider-session-verification.json").read_text())
          assert doc["status"] == "PASS"
          assert doc["provider_verification_enabled"] is True
          assert doc["required_for_release"] is False
          assert doc["candidate_sha"]
          assert doc["live_provider_session_verified"] is True
          assert doc["provider_model_execution_verified"] is True
          assert doc["credential_value_persisted"] is False
          assert doc["raw_private_secret_leakage"] == 0
          PY

      - name: Assert exact protected-main candidate
        if: steps.credential.outputs.present == 'true'
        shell: bash
        env:
          AIPS_EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AIPS_EXPECTED_SHA"

      - name: Publish provider verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gemini-provider-session-verification
          path: gemini-provider-session-verification.json
          if-no-files-found: error
