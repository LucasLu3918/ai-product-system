name: evolution-radar

on:
  schedule:
    - cron: "0 1 * * 1"   # weekly Monday 09:00 Asia/Taipei
    - cron: "30 1 1 * *"  # monthly day 1 09:30 Asia/Taipei
  workflow_dispatch:
    inputs:
      mode:
        description: Radar mode
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly

permissions:
  contents: read
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "30 1 1 * *" ]]; then
            echo "value=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect weekly evidence
        if: steps.mode.outputs.value == 'weekly'
        run: python scripts/evolution_radar.py collect --mode weekly --output evolution-radar.yaml
      - name: Load prior weekly evidence
        if: steps.mode.outputs.value == 'monthly'
        shell: bash
        run: gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" > evolution-radar-issues.json
      - name: Build monthly rollup
        if: steps.mode.outputs.value == 'monthly'
        run: >-
          python scripts/evolution_radar_rollup.py monthly-rollup
          --issues-json evolution-radar-issues.json
          --config config/evolution-sources.yaml
          --output evolution-radar.yaml
      - name: Stamp immutable run context
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          from pathlib import Path
          import yaml

          path = Path("evolution-radar.yaml")
          doc = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          run = doc.setdefault("run", {})
          run["generated_at"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          run["repository_revision"] = os.environ["GITHUB_SHA"]
          path.write_text(yaml.safe_dump(doc, sort_keys=False, allow_unicode=True), encoding="utf-8")
          PY
      - name: Validate evidence
        run: python scripts/evolution_radar.py validate evolution-radar.yaml
      - name: Build Human review issue
        run: python scripts/evolution_radar_rollup.py issue-body evolution-radar.yaml --output evolution-radar-issue.md
      - name: Publish research report only
        shell: bash
        run: |
          title="Evolution Radar [${{ steps.mode.outputs.value }}] $(date -u +%Y-%m-%d)"
          gh issue create --title "$title" --body-file evolution-radar-issue.md
