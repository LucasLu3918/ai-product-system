name: evolution-radar

on:
  schedule:
    - cron: "0 1 * * 1"   # weekly Monday 09:00 Asia/Taipei
    - cron: "30 1 1 * *"  # monthly day 1 09:30 Asia/Taipei
    - cron: "0 2 1 1,4,7,10 *"  # quarterly day 1 10:00 Asia/Taipei
  workflow_dispatch:
    inputs:
      mode:
        description: Radar mode
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly
          - quarterly
      semantic_provider:
        description: Optional scheduled semantic provider; handoff requires no model API credential
        required: true
        default: auto
        type: choice
        options:
          - auto
          - openai-codex-action
          - handoff

permissions:
  contents: read
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 2 1 1,4,7,10 *" ]]; then
            echo "value=quarterly" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "30 1 1 * *" ]]; then
            echo "value=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect weekly evidence
        if: steps.mode.outputs.value == 'weekly'
        run: python scripts/evolution_radar.py collect --mode weekly --output evolution-radar.yaml

      - name: Load prior weekly evidence
        if: steps.mode.outputs.value == 'monthly' || steps.mode.outputs.value == 'quarterly'
        shell: bash
        run: >-
          gh api --paginate --slurp
          "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100"
          > evolution-radar-issues-pages.json

      - name: Resolve review period
        if: steps.mode.outputs.value == 'monthly' || steps.mode.outputs.value == 'quarterly'
        id: period
        shell: bash
        env:
          RADAR_MODE: ${{ steps.mode.outputs.value }}
        run: |
          period="$(python - <<'PY'
          from datetime import datetime, timezone
          import os

          now = datetime.now(timezone.utc)
          mode = os.environ["RADAR_MODE"]
          if mode == "monthly":
              year = now.year
              month = now.month - 1
              if month == 0:
                  year -= 1
                  month = 12
              print(f"{year:04d}-{month:02d}")
          else:
              current_quarter = (now.month - 1) // 3 + 1
              quarter = current_quarter - 1
              year = now.year
              if quarter == 0:
                  year -= 1
                  quarter = 4
              print(f"{year:04d}-Q{quarter}")
          PY
          )"
          echo "value=$period" >> "$GITHUB_OUTPUT"

      - name: Build monthly rollup
        if: steps.mode.outputs.value == 'monthly'
        run: >-
          python scripts/evolution_radar_rollup.py monthly-rollup
          --issues-json evolution-radar-issues-pages.json
          --config config/evolution-sources.yaml
          --period "${{ steps.period.outputs.value }}"
          --output evolution-radar.yaml

      - name: Build quarterly rollup
        if: steps.mode.outputs.value == 'quarterly'
        run: >-
          python scripts/evolution_radar_rollup.py quarterly-rollup
          --issues-json evolution-radar-issues-pages.json
          --config config/evolution-sources.yaml
          --period "${{ steps.period.outputs.value }}"
          --output evolution-radar.yaml

      - name: Stamp immutable run context
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          from pathlib import Path
          import yaml

          path = Path("evolution-radar.yaml")
          doc = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          run = doc.setdefault("run", {})
          run["generated_at"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          run["repository_revision"] = os.environ["GITHUB_SHA"]
          path.write_text(yaml.safe_dump(doc, sort_keys=False, allow_unicode=True), encoding="utf-8")
          PY

      - name: Validate raw evidence
        run: python scripts/evolution_radar.py validate evolution-radar.yaml

      - name: Build deterministic local pre-analysis
        shell: bash
        run: |
          python scripts/evolution_analysis.py preanalyze \
            --evidence evolution-radar.yaml \
            --config config/evolution-analyzer.yaml \
            --capabilities references/evolution/CAPABILITY_MAP.yaml \
            --output evolution-local-preanalysis.yaml
          python scripts/evolution_analysis.py preanalysis-validate \
            --evidence evolution-radar.yaml \
            --config config/evolution-analyzer.yaml \
            --capabilities references/evolution/CAPABILITY_MAP.yaml \
            --preanalysis evolution-local-preanalysis.yaml
          python scripts/evolution_analysis.py preanalysis-markdown \
            --preanalysis evolution-local-preanalysis.yaml \
            --output evolution-local-preanalysis.md

      - name: Build semantic analysis package
        run: >-
          python scripts/evolution_analysis.py package
          --evidence evolution-radar.yaml
          --preanalysis evolution-local-preanalysis.yaml
          --capabilities references/evolution/CAPABILITY_MAP.yaml
          --output evolution-analysis-package.yaml

      - name: Build provider-neutral semantic handoff
        run: >-
          python scripts/evolution_analysis.py handoff
          --package evolution-analysis-package.yaml
          --prompt templates/evolution/EVOLUTION_ANALYZER_PROMPT.md
          --schema templates/evolution/EVOLUTION_ANALYZER_RESULT.schema.json
          --capabilities references/evolution/CAPABILITY_MAP.yaml
          --output evolution-analysis-handoff.md

      - name: Detect semantic analyzer credential
        id: analyzer_secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve semantic provider
        id: semantic_provider
        shell: bash
        env:
          REQUESTED_PROVIDER: ${{ inputs.semantic_provider || 'auto' }}
          SECRET_AVAILABLE: ${{ steps.analyzer_secret.outputs.available }}
        run: |
          selected="$REQUESTED_PROVIDER"
          if [[ "$selected" == "auto" ]]; then
            if [[ "$SECRET_AVAILABLE" == "true" ]]; then
              selected="openai-codex-action"
            else
              selected="handoff"
            fi
          fi
          if [[ "$selected" == "openai-codex-action" && "$SECRET_AVAILABLE" != "true" ]]; then
            selected="handoff"
          fi
          echo "value=$selected" >> "$GITHUB_OUTPUT"

      - name: Run bounded semantic analyzer
        id: semantic
        if: steps.semantic_provider.outputs.value == 'openai-codex-action' && steps.analyzer_secret.outputs.available == 'true'
        continue-on-error: true
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: templates/evolution/EVOLUTION_ANALYZER_PROMPT.md
          output-file: evolution-analysis-result.json
          output-schema-file: templates/evolution/EVOLUTION_ANALYZER_RESULT.schema.json
          permission-profile: ":read-only"
          codex-version: "0.155.0"
          model: ${{ vars.AIPS_EVOLUTION_MODEL }}
          effort: high
          safety-strategy: drop-sudo
          allow-bot-users: github-actions[bot]

      - name: Bind and apply validated semantic analysis
        id: analysis_apply
        if: steps.semantic.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          AIPS_EVOLUTION_MODEL: ${{ vars.AIPS_EVOLUTION_MODEL }}
        run: |
          analyzed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          model="${AIPS_EVOLUTION_MODEL:-provider-default}"
          python scripts/evolution_analysis.py finalize             --evidence evolution-radar.yaml             --package evolution-analysis-package.yaml             --result evolution-analysis-result.json             --provider openai-codex-action             --model "$model"             --analyzed-at "$analyzed_at"             --output evolution-analysis.yaml
          python scripts/evolution_analysis.py apply             --evidence evolution-radar.yaml             --analysis evolution-analysis.yaml             --output evolution-radar-analyzed.yaml
          mv evolution-radar-analyzed.yaml evolution-radar.yaml

      - name: Record truthful analyzer fallback
        if: always()
        shell: bash
        env:
          SECRET_AVAILABLE: ${{ steps.analyzer_secret.outputs.available }}
          SEMANTIC_OUTCOME: ${{ steps.semantic.outcome }}
          APPLY_OUTCOME: ${{ steps.analysis_apply.outcome }}
          SELECTED_PROVIDER: ${{ steps.semantic_provider.outputs.value }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path("evolution-radar.yaml")
          doc = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          analyzer = (doc.get("run") or {}).get("analyzer") or {}
          if analyzer.get("status") != "available":
              if os.environ.get("SELECTED_PROVIDER") == "handoff":
                  reason = "No scheduled semantic provider was selected or available; provider-neutral handoff is READY. Recommendations remain ANALYSIS_PENDING until a validated result is bound and applied."
              elif os.environ.get("SECRET_AVAILABLE") != "true":
                  reason = "Selected provider credential is unavailable; provider-neutral handoff is READY and recommendations remain ANALYSIS_PENDING."
              elif os.environ.get("SEMANTIC_OUTCOME") != "success":
                  reason = "Semantic analyzer execution failed; recommendations remain ANALYSIS_PENDING and no suitability conclusion was inferred."
              else:
                  reason = "Semantic analyzer output failed deterministic validation; recommendations remain ANALYSIS_PENDING and no suitability conclusion was inferred."
              analyzer["status"] = "unavailable"
              analyzer["provider"] = None
              analyzer["model"] = None
              analyzer["reason"] = reason
              doc["run"]["analyzer"] = analyzer
              path.write_text(yaml.safe_dump(doc, sort_keys=False, allow_unicode=True), encoding="utf-8")
          PY

      - name: Validate final evidence
        run: python scripts/evolution_radar.py validate evolution-radar.yaml

      - name: Publish local pre-analysis and semantic handoff summary
        if: always()
        shell: bash
        run: |
          if [[ -f evolution-local-preanalysis.md ]]; then
            cat evolution-local-preanalysis.md >> "$GITHUB_STEP_SUMMARY"
          fi
          cat evolution-analysis-handoff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build Human review issue
        run: >-
          python scripts/evolution_radar_rollup.py issue-body evolution-radar.yaml
          --preanalysis evolution-local-preanalysis.md
          --handoff evolution-analysis-handoff.md
          --output evolution-radar-issue.md

      - name: Publish research report only
        shell: bash
        run: |
          title="Evolution Radar [${{ steps.mode.outputs.value }}] $(date -u +%Y-%m-%d)"
          gh issue create --title "$title" --body-file evolution-radar-issue.md
