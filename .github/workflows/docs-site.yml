name: docs-site

on:
  pull_request:
    paths:
      - "docs/human/**"
      - "package.json"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "docs/human/**"
      - "package.json"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      pages_configured: ${{ steps.pages-state.outputs.configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run docs:build

      - id: pages-state
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$RUNNER_TEMP/pages-site.json"
          status="$(curl -sS -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"
          case "$status" in
            200)
              echo "configured=true" >> "$GITHUB_OUTPUT"
              echo "Official Docs Site deployment: CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "Official Docs Site deployment: SKIPPED_NOT_CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
              echo "Enable Settings → Pages → Build and deployment → Source = GitHub Actions once; the docs build itself passed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unable to determine GitHub Pages state (HTTP $status)."
              cat "$response" || true
              exit 1
              ;;
          esac

      - if: github.event_name != 'pull_request' && steps.pages-state.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/human/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages_configured == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
