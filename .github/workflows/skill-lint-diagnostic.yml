name: Temporary Skill Lint Diagnostic
on:
  pull_request:
    paths:
      - scripts/skill_catalog.py
      - tests/test_skill_catalog.py
      - .github/workflows/skill-lint-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.8
      - run: python -m ruff check scripts/skill_catalog.py tests/test_skill_catalog.py --output-format concise || true
