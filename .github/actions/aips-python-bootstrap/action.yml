name: AIPS Python bootstrap
description: Set up the pinned AIPS Python runtime and install declared requirement files.
inputs:
  python-version:
    description: Python version used by the calling workflow
    required: true
  requirements-files:
    description: Newline-separated requirements files installed together
    required: true
  cache-dependency-path:
    description: Newline-separated files used for the pip cache key
    required: true
  constraints-file:
    description: Optional pip constraints file
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python and pip cache
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Install declared Python dependencies
      shell: bash
      env:
        AIPS_REQUIREMENTS_FILES: ${{ inputs.requirements-files }}
        AIPS_CONSTRAINTS_FILE: ${{ inputs.constraints-file }}
      run: |
        set -euo pipefail
        requirement_args=()
        while IFS= read -r file; do
          [[ -z "$file" ]] && continue
          requirement_args+=(-r "$file")
        done <<< "$AIPS_REQUIREMENTS_FILES"
        ((${#requirement_args[@]} > 0)) || { echo "requirements-files must not be empty" >&2; exit 2; }
        constraint_args=()
        if [[ -n "$AIPS_CONSTRAINTS_FILE" ]]; then
          constraint_args=(-c "$AIPS_CONSTRAINTS_FILE")
        fi
        python -m pip install "${constraint_args[@]}" "${requirement_args[@]}"
        python -c 'import yaml; print("AIPS Python bootstrap ready")'
