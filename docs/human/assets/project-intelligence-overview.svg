<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<rect width="1500" height="900" fill="#f7f7f5"/>
<style>.title{font:700 32px system-ui,sans-serif;fill:#171717}.sub{font:400 15px system-ui,sans-serif;fill:#666}.h{font:700 17px system-ui,sans-serif;fill:#171717}.t{font:400 13px system-ui,sans-serif;fill:#444}.box{fill:#fff;stroke:#d8d8d3;stroke-width:2}.dark{fill:#171717}.white{fill:#fff}.line{stroke:#aaa;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aaa"/></marker></defs>
<text x="60" y="58" class="title">Project Intelligence — Existing Project lifecycle</text><text x="60" y="88" class="sub">Canonical workspace identity · authoritative pointers · targeted refresh · change impact</text>
<rect x="80" y="135" width="310" height="130" rx="16" class="box"/><text x="110" y="175" class="h">① Read-only Bootstrap</text><text x="110" y="205" class="t">Instructions / Docs / Repo topology</text><text x="110" y="233" class="t">No installs / migrations / unknown binaries</text>
<rect x="455" y="135" width="310" height="130" rx="16" class="box"/><text x="485" y="175" class="h">② Semantic Enrichment</text><text x="485" y="205" class="t">Architecture · Data Flow · Modules</text><text x="485" y="233" class="t">Conventions · Tests · Security · Ops</text>
<rect x="830" y="135" width="310" height="130" rx="16" class="box"/><text x="860" y="175" class="h">③ Machine-readable Core</text><text x="860" y="205" class="t">Source Registry · Impact Graph</text><text x="860" y="233" class="t">Overrides · Intelligence Index</text>
<rect x="1205" y="135" width="215" height="130" rx="16" class="dark"/><text x="1235" y="175" class="h white">④ READY</text><text x="1235" y="205" class="t white">Coverage validated</text><text x="1235" y="233" class="t white">Review HTML generated</text>
<path d="M390 200 L450 200" class="line"/><path d="M765 200 L825 200" class="line"/><path d="M1140 200 L1200 200" class="line"/>
<rect x="170" y="390" width="470" height="175" rx="18" class="box"/><text x="200" y="430" class="h">⑤ Turn Context / Freshness / Budget</text><text x="200" y="460" class="t">Only mapped selected topics can prove irrelevance</text><text x="200" y="488" class="t">Core 1,600 + Recall 6,000 = 7,600 estimated tokens</text><text x="200" y="516" class="t">Safe summaries · index failure → source pointers</text>
<rect x="860" y="390" width="470" height="175" rx="18" class="box"/><text x="890" y="430" class="h">⑥ Mutation Change Impact</text><text x="890" y="460" class="t">Approve scope before implementation</text><text x="890" y="488" class="t">Check exact base/head + binary diff digest + paths</text><text x="890" y="516" class="t">Dirty / mismatched / unknown → not READY</text>
<path d="M1312 265 L1312 325 L405 325 L405 385" class="line"/><path d="M640 478 L855 478" class="line"/>
<rect x="300" y="680" width="900" height="125" rx="18" class="box"/><text x="335" y="720" class="h">⑦ Targeted Refresh + Human Review</text><text x="335" y="750" class="t">Refresh only affected Intelligence / Impact Graph · regenerate HTML when material</text><text x="335" y="778" class="t">User additions / exceptions / exclusions persist in PROJECT_OVERRIDES and are never silently overwritten</text>
<path d="M1095 565 L1095 625 L750 625 L750 675" class="line"/>
</svg>
