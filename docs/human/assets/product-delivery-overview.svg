<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<rect width="1500" height="1040" fill="#f7f7f5"/>
<style>.title{font:700 34px system-ui,-apple-system,sans-serif;fill:#171717}.sub{font:400 16px system-ui,-apple-system,sans-serif;fill:#666}.h{font:700 18px system-ui,-apple-system,sans-serif;fill:#171717}.t{font:400 14px system-ui,-apple-system,sans-serif;fill:#444}.box{fill:#fff;stroke:#d8d8d3;stroke-width:2}.dark{fill:#171717}.white{fill:#fff}.line{stroke:#aaa;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aaa"/></marker></defs>
<text x="70" y="65" class="title">End-to-End Product Delivery — 品質感知完整產品交付</text><text x="70" y="95" class="sub">Quality Profile → Planning → Implementation → LOCAL_COMPLETE → optional Production Enablement → PRODUCTION_VERIFIED</text>
<rect x="90" y="135" width="1320" height="85" rx="18" class="box"/><text x="120" y="170" class="h">① User Intent + Q1/Q2/Q3 Quality Planning</text><text x="120" y="198" class="t">Performance · Security · Usability · Reliability · Maintainability · Resource/Cost · Delivery</text><path d="M750 220 L750 255" class="line"/>
<rect x="90" y="260" width="1320" height="90" rx="18" class="box"/><text x="120" y="296" class="h">② Planning Package + Architecture</text><text x="120" y="326" class="t">UX / Brand / API / Data / Security / Delivery + provider-neutral Logs / Health / Metrics / Trace / Audit requirements</text><path d="M750 350 L750 385" class="line"/>
<rect x="90" y="390" width="400" height="160" rx="18" class="box"/><text x="120" y="428" class="h">③ Implementation</text><text x="120" y="458" class="t">Frontend / Backend / Data</text><text x="120" y="486" class="t">Tests + instrumentation hooks</text><text x="120" y="514" class="t">Shared contracts / migrations</text>
<rect x="550" y="390" width="400" height="160" rx="18" class="box"/><text x="580" y="428" class="h">④ Local Verification</text><text x="580" y="458" class="t">Unit · Integration · Contract · E2E</text><text x="580" y="486" class="t">Security · Performance · UX / Visual</text><text x="580" y="514" class="t">Maintainability / Reliability evidence</text>
<rect x="1010" y="390" width="400" height="160" rx="18" class="dark"/><text x="1040" y="428" class="h white">⑤ LOCAL_COMPLETE</text><text x="1040" y="458" class="t white">Locally runnable complete product</text><text x="1040" y="486" class="t white">Hosting/Production may remain undecided</text>
<path d="M490 470 L545 470" class="line"/><path d="M950 470 L1005 470" class="line"/><path d="M1210 550 L1210 590" class="line"/>
<rect x="90" y="595" width="400" height="165" rx="18" class="box"/><text x="120" y="635" class="h">⑥ Production Enablement</text><text x="120" y="665" class="t">Only when requested / user continues</text><text x="120" y="693" class="t">Infra · Secrets · Domain / TLS</text><text x="120" y="721" class="t">DB / Backup / Recovery · CI/CD</text>
<rect x="550" y="595" width="400" height="165" rx="18" class="box"/><text x="580" y="635" class="h">⑦ Observability + Staging</text><text x="580" y="665" class="t">ELK/Loki/Managed Logs as justified</text><text x="580" y="693" class="t">Prometheus/Grafana/OTel/Alerts</text><text x="580" y="721" class="t">Staging Smoke / E2E / Security</text>
<rect x="1010" y="595" width="400" height="165" rx="18" class="box"/><text x="1040" y="635" class="h">⑧ Release Readiness</text><text x="1040" y="665" class="t">Exact candidate + Build / Test / Security</text><text x="1040" y="693" class="t">Data / Recovery / Observability</text><text x="1040" y="721" class="t">READY / NOT_READY / BLOCKED</text>
<path d="M490 678 L545 678" class="line"/><path d="M950 678 L1005 678" class="line"/><path d="M1210 760 L1210 805" class="line"/>
<rect x="270" y="810" width="420" height="140" rx="18" class="box"/><text x="305" y="852" class="h">⑨ Production Promotion</text><text x="305" y="884" class="t">Risk-proportional approval</text><text x="305" y="912" class="t">Same verified candidate/artifact strategy</text>
<rect x="810" y="810" width="420" height="140" rx="18" class="dark"/><text x="845" y="852" class="h white">⑩ PRODUCTION_VERIFIED</text><text x="845" y="884" class="t white">Health · Smoke · Critical path</text><text x="845" y="912" class="t white">Logs · Metrics · Alerts · Recovery evidence</text>
<path d="M690 880 L805 880" class="line"/>
</svg>