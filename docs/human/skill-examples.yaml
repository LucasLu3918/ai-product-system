# Human-only localized examples; functional semantics come from canonical SKILL.md.
version: 1
skills:
  architecture-decision-record:
    name_zh: "架構決策紀錄"
    example: "針對資料庫選型比較 PostgreSQL 與 SQL Server，整理權衡、風險及 ADR。"
  authorization-security:
    name_zh: "授權安全"
    example: "審查 REST API 是否可能跨租戶讀取其他人的訂單。"
  brand-foundation:
    name_zh: "品牌基礎"
    example: "替 Lucas Lab 定義品牌個性、語氣、配色與可重用設計原則。"
  business-logic-abuse:
    name_zh: "商業邏輯濫用"
    example: "分析優惠券重複套用、重播與價格竄改的防範措施。"
  capacity-cost:
    name_zh: "容量與成本"
    example: "估算每秒 200 個 API 請求的資源配置、尖峰負載與月費區間。"
  characterization-testing:
    name_zh: "既有行為測試"
    example: "重構舊版付款程式前，先補上目前行為的特徵測試。"
  clean-architecture:
    name_zh: "Clean Architecture"
    example: "檢查訂單服務的相依方向，提出最小介面分離方案。"
  code-review:
    name_zh: "程式碼審查"
    example: "依 Spec 與 Coding Standards 兩個面向審查這個 PR，列出證據。"
  creative-calibration:
    name_zh: "創意校準"
    example: "先比較三種日式奇幻角色風格，協助我選擇統一方向。"
  creative-reference-research:
    name_zh: "視覺參考研究"
    example: "蒐集近年遊戲 UI 參考，分類設計語言與可用元素。"
  creative-writing-workflow:
    name_zh: "創作寫作流程"
    example: "把白雪公主的零散劇情想法整理成節拍，再精修第一章。"
  data-modeling:
    name_zh: "資料建模"
    example: "替會員、訂單與退款建立資料關係及不可違反的約束。"
  database-migration:
    name_zh: "資料庫遷移"
    example: "規劃新增 NOT NULL 欄位的漸進式資料遷移與回滾。"
  delivery-planning:
    name_zh: "交付規劃"
    example: "將購物車功能拆成可驗收的垂直切片與依賴任務。"
  dependency-upgrade:
    name_zh: "套件升級審核"
    example: "評估升級 Vue 套件的相容性、資安風險和測試範圍。"
  domain-driven-design:
    name_zh: "領域驅動設計"
    example: "為訂單與支付定義限界上下文、聚合及領域語言。"
  e2e-browser-testing:
    name_zh: "瀏覽器端對端測試"
    example: "用瀏覽器測試會員註冊、登入與購物結帳流程。"
  financial-integrity:
    name_zh: "金融資料完整性"
    example: "檢查退款流程的金額守恆、重試與對帳條件。"
  frontend-implementation:
    name_zh: "前端功能實作"
    example: "實作可響應式的搜尋列表，涵蓋載入、空狀態和錯誤狀態。"
  game-balance-economy:
    name_zh: "遊戲平衡與經濟"
    example: "分析解謎遊戲的線索提示成本與難度曲線。"
  game-design-document:
    name_zh: "遊戲設計文件"
    example: "把密室逃脫想法整理為核心循環、規則與可玩切片。"
  game-feel:
    name_zh: "遊戲手感"
    example: "改善玩家點擊物件後的動畫回饋與反應延遲。"
  game-loop-architecture:
    name_zh: "遊戲循環架構"
    example: "設計密室遊戲的狀態轉移、暫停與存檔流程。"
  human-guided-wizard:
    name_zh: "人工設定精靈"
    example: "為 Cloudflare 手動設定密鑰建立安全的步驟精靈，不收集密碼。"
  incident-response:
    name_zh: "事故回應"
    example: "正式 API 突然逾時，整理止血、調查和復原步驟。"
  level-design:
    name_zh: "關卡設計"
    example: "設計白雪公主城堡三個解謎房間的教學與難度節奏。"
  llm-feature-integration:
    name_zh: "LLM 功能整合"
    example: "規劃 AI 摘要功能的輸入 schema、品質、資安和成本上限。"
  observability-design:
    name_zh: "可觀測性設計"
    example: "為訂單 API 設計追蹤、指標、日誌與告警。"
  performance-profiling:
    name_zh: "效能分析"
    example: "用實際量測找出頁面載入變慢的瓶頸並驗證改善。"
  product-discovery:
    name_zh: "產品探索"
    example: "釐清 AI 小工具的目標使用者、痛點與核心價值。"
  product-research:
    name_zh: "產品研究"
    example: "比較五款密室逃脫遊戲的遊玩回饋與機制。"
  rapid-prototyping:
    name_zh: "快速原型驗證"
    example: "先做一個可互動的 HTML 版購物車原型，確認狀態切換。"
  requirements-definition:
    name_zh: "需求定義"
    example: "將目前討論整理成可追溯需求與驗收標準，不確定處標註 UNKNOWN。"
  rest-api:
    name_zh: "REST API 設計"
    example: "為會員服務設計 REST 端點、驗證、錯誤回應及測試。"
  secure-design:
    name_zh: "安全設計"
    example: "替檔案上傳功能建立信任邊界與安全控制。"
  security-testing:
    name_zh: "安全測試"
    example: "為跨帳戶存取及繞過身分驗證建立負向測試。"
  sql-performance:
    name_zh: "SQL 效能"
    example: "分析慢查詢執行計畫並比較索引調整前後耗時。"
  systematic-debugging:
    name_zh: "系統化除錯"
    example: "先重現 KSampler 錯誤，再隔離根因並補回歸測試。"
  tdd:
    name_zh: "測試驅動開發"
    example: "使用 Red → Green → Refactor 實作折扣規則，先寫失敗測試。"
  technical-research:
    name_zh: "技術研究"
    example: "查官方文件比較 MPS 對浮點格式的支援，附版本與證據。"
  technical-teaching:
    name_zh: "技術教學"
    example: "用短課程與實作練習教我 ASP.NET Core 的依賴注入。"
  threat-modeling:
    name_zh: "威脅建模"
    example: "對公開登入 API 畫出信任邊界、威脅與緩解措施。"
  ux-web-design:
    name_zh: "網站 UX 設計"
    example: "規劃手機優先的作品集導覽與可及性要求。"
  visual-direction:
    name_zh: "視覺方向"
    example: "替暗黑童話遊戲建立一致的視覺風格與配色方向。"
  visual-quality-review:
    name_zh: "視覺品質審核"
    example: "檢查角色圖片構圖、比例、材質及整體一致性。"
