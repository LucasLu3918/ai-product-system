version: 1
change:
  id: plan15-operational-closure
  summary: Close the approved Plan15 operational gaps by extending the existing release, installer, dependency, quality, validation-observation,
    branch proposal, Project Intelligence/Retrieval, Evolution, configuration taxonomy and GitHub ruleset mechanisms while
    preserving human authority and full validation.
  boundary:
  - Stable release candidate provenance and installer bootstrap/update behavior
  - Runtime dependency closure and supported Python/platform compatibility
  - Ruff debt reporting and no-growth enforcement; selected-module mypy and coverage ratchets
  - Validation shadow-observation collection, provenance, retention and graduation evaluation
  - Exact-SHA branch cleanup proposal freshness and human-only execution safeguards
  - Project Intelligence and Retrieval responsibility boundaries with facade/CLI/data compatibility
  - Evolution offline relevance evaluation, labeled evidence and provider-neutral pending decisions
  - Configuration taxonomy drift detection and consumer-safe consolidation
  - GitHub Ruleset read-only comparison and evidence-gated transition planning
  - Cross-cutting documentation, scenarios, schemas, architecture and publication evidence
