- boundary: Canonical documentation and Scenario evidence closure
  reason: The approved evolution-radar doc mapping and additional publication placement
    closure must describe the same observable archive and incomplete-yield contract.
  checks:
    static_lint:
      applicable: true
      evidence: repository documentation placement and Scenario Conformance validators
    unit:
      applicable: false
      na_reason: Documentation changes are checked through canonical placement and
        repository validation.
    integration:
      applicable: true
      evidence: aips publish preview plus complete exact-candidate Integration Gate
    contract:
      applicable: true
      evidence: Scenario 155 and canonical documentation sync/placement mapping
    e2e:
      applicable: false
      na_reason: Documentation wording creates no runtime path.
    security:
      applicable: true
      evidence: Human/Agent docs retain bounded untrusted archive, authority and fail-closed
        statements
    migration_recovery:
      applicable: false
      na_reason: No documentation or stored-data migration.
    concurrency_idempotency_replay:
      applicable: false
      na_reason: No concurrent behavior is introduced by documentation.
    cli_harness:
      applicable: false
      na_reason: No CLI or Harness behavior is changed.
    docs_schema:
      applicable: true
      evidence: aips publish preview documentation_placement PASS and repository documentation
        contracts
- boundary: Python runtime minimum and managed installation recovery
  reason: AIPS must reject unsupported interpreters clearly and repair an existing
    managed venv without leaving a partial install.
  checks:
    static_lint:
      applicable: true
      evidence: bash syntax, Ruff, and repository validation
    unit:
      applicable: true
      evidence: Python-version predicate boundaries for 3.11, 3.12, and newer
    integration:
      applicable: true
      evidence: installer recreates an unsupported managed venv with a compatible interpreter
    contract:
      applicable: true
      evidence: doctor and install errors state the Python >=3.12 requirement
    e2e:
      applicable: true
      evidence: tests/evidence/install_preflight_lifecycle.py and installation-entrypoints workflow
    security:
      applicable: true
      evidence: unsupported EOL runtime is not accepted; update remains fail-closed when
        no compatible creator is available
    migration_recovery:
      applicable: true
      evidence: existing managed venv below 3.12 is recreated; unmanaged project data
        is untouched
    concurrency_idempotency_replay:
      applicable: false
      na_reason: No concurrent or replayable persistent writes are introduced.
    cli_harness:
      applicable: true
      evidence: aips doctor and aips install lifecycle diagnostics
    docs_schema:
      applicable: true
      evidence: installation, Getting Started, Technology Guide, and generated system reference
- boundary: Canonical Python facts and scheduled compatibility coverage
  reason: Declared support, tested versions, installer predicates, generated references,
    and scheduled smoke coverage must agree.
  checks:
    static_lint:
      applicable: true
      evidence: Python facts and workflow schema validation
    unit:
      applicable: true
      evidence: tests/validation/system_facts_contracts.py validates range and tested matrix
    integration:
      applicable: true
      evidence: system facts generator lifecycle and scheduled Python compatibility workflow
    contract:
      applicable: true
      evidence: pyproject.toml and config/system-facts.yaml are cross-checked
    e2e:
      applicable: true
      evidence: scheduled Python 3.12, 3.13, and 3.14 installer smoke matrix
    security:
      applicable: false
      na_reason: No dependency, workflow permission, or credential scope is expanded.
    migration_recovery:
      applicable: false
      na_reason: Runtime upgrade recovery is covered in the installer boundary.
    concurrency_idempotency_replay:
      applicable: false
      na_reason: No new mutable runtime state is introduced.
    cli_harness:
      applicable: true
      evidence: scheduled smoke runs aips install/doctor lifecycle contracts
    docs_schema:
      applicable: true
      evidence: generated system facts and canonical runtime support docs
- boundary: GitHub supply-chain checks and repository security authority
  reason: New pull-request and scheduled security checks must be immutable-pinned, least-privilege, and unable to publish or merge.
  checks:
    static_lint: {applicable: true, evidence: workflow schema and action SHA contracts}
    unit: {applicable: false, na_reason: No security decision algorithm is added.}
    integration: {applicable: true, evidence: Dependency Review pull_request contract and scheduled/manual Scorecard workflow contract}
    contract: {applicable: true, evidence: tests/validation/security_workflow_contracts.py}
    e2e: {applicable: true, evidence: GitHub CodeQL default setup configured for actions and python; initial analysis run 37306625912 completed successfully.}
    security: {applicable: true, evidence: minimum read permissions, pinned full SHAs, no PR or release authority}
    migration_recovery: {applicable: false, na_reason: No stored state changes.}
    concurrency_idempotency_replay: {applicable: false, na_reason: No source writes or shared state.}
    cli_harness: {applicable: false, na_reason: No CLI or Harness behavior changes.}
    docs_schema: {applicable: true, evidence: Security Assurance and Scenarios 211/213 contracts}
- boundary: Validation selection shadow and graduation safeguards
  reason: Selective execution must remain disabled until complete exact-candidate evidence supports a separate Human decision.
  checks:
    static_lint: {applicable: true, evidence: scripts/validation_shadow_plan.py and scripts/validation_graduation.py syntax}
    unit: {applicable: true, evidence: exact changed-path classes and candidate SHA audit sampling}
    integration: {applicable: true, evidence: tests/evidence/validation_shadow_plan_lifecycle.py and tests/evidence/validation_graduation_lifecycle.py}
    contract: {applicable: true, evidence: tests/validation/validation_graduation_contracts.py and config/validation-graduation.yaml}
    e2e: {applicable: true, evidence: full-run artifact history, false-negative cohort, and readiness-only output lifecycle}
    security: {applicable: true, evidence: unknown/core/large/validator paths force full run; no skipped execution or automatic activation}
    migration_recovery: {applicable: true, evidence: missing/truncated/stale artifacts block graduation without altering current validator set}
    concurrency_idempotency_replay: {applicable: true, evidence: deterministic SHA-keyed audit sample and repeatable shadow plan}
    cli_harness: {applicable: false, na_reason: No public CLI command is added.}
    docs_schema: {applicable: true, evidence: Scenario 212, maintenance docs, config schema contracts}
- boundary: Verified stable installation and update channels
  reason: Install/update must follow the selected channel and refuse mismatched tags, rollback, dirty state, or unsupported major changes.
  checks:
    static_lint: {applicable: true, evidence: bash -n plus release resolver Ruff checks}
    unit: {applicable: true, evidence: SemVer numeric ordering, annotated tags, tag/VERSION/commit mismatch rejection}
    integration: {applicable: true, evidence: install_preflight_lifecycle.py, install_download_lifecycle.py, and release_channel_lifecycle.py}
    contract: {applicable: true, evidence: --channel stable/main parsing and absolute Git metadata persistence}
    e2e: {applicable: true, evidence: new install without releases, stable tag install, installed update, fallback and rollback refusal fixtures}
    security: {applicable: true, evidence: exact full tag SHA and VERSION verification; no credentials or release tag creation}
    migration_recovery: {applicable: true, evidence: legacy AIPS_INSTALL_BRANCH maps to branch mode; metadata persists across updates}
    concurrency_idempotency_replay: {applicable: false, na_reason: Updates remain single-writer fast-forward operations.}
    cli_harness: {applicable: true, evidence: source and installed symlink entrypoint compatibility}
    docs_schema: {applicable: true, evidence: Installation, Getting Started, Versioning, and Scenario 213 docs}
- boundary: Gradual test quality and debt ratchets
  reason: Add reproducible coverage and property evidence without imposing unsupported percentages or growing existing Ruff/mypy debt.
  checks:
    static_lint: {applicable: true, evidence: full Ruff baseline remains at 872 findings and scoped Ruff checks pass}
    unit: {applicable: true, evidence: deterministic Hypothesis SemVer properties and release lifecycle assertions}
    integration: {applicable: true, evidence: Integration Gate quality ratchet plus selected mypy execution}
    contract: {applicable: true, evidence: tests/validation/quality_ratchet_contracts.py and requirements/constraints pin equality}
    e2e: {applicable: true, evidence: Coverage.py branch report for release selector; no percentage threshold}
    security: {applicable: false, na_reason: No runtime security boundary changes.}
    migration_recovery: {applicable: false, na_reason: No production persisted data changes.}
    concurrency_idempotency_replay: {applicable: true, evidence: Hypothesis uses derandomize=true and database=None}
    cli_harness: {applicable: false, na_reason: No public product CLI behavior changes.}
    docs_schema: {applicable: true, evidence: Quality Guide, Maintenance guidance, Scenario 213}
- boundary: Advisory governance, reliability, and branch cleanup
  reason: Complexity and reliability metrics must remain observational, and cleanup must never delete a remote ref without an exact separately approved manifest.
  checks:
    static_lint: {applicable: true, evidence: repository health and branch policy config contracts}
    unit: {applicable: true, evidence: Repository Health advisory count computation and reliability readiness contracts}
    integration: {applicable: true, evidence: repository_health_lifecycle.py, maintenance_reliability_lifecycle.py, branch_hygiene_lifecycle.py}
    contract: {applicable: true, evidence: report-only flags, three-complete-month SLO deferral, proposal authorization false}
    e2e: {applicable: true, evidence: complete and incomplete monthly report lifecycle plus exact-branch proposal generation}
    security: {applicable: true, evidence: no writes, merge authority, release authority, or automatic deletion}
    migration_recovery: {applicable: false, na_reason: No persisted state schema is rewritten.}
    concurrency_idempotency_replay: {applicable: true, evidence: fingerprint-bound proposal and deterministic report output}
    cli_harness: {applicable: false, na_reason: No public command signature changes.}
    docs_schema: {applicable: true, evidence: Maintenance docs and Scenario registry entries}
