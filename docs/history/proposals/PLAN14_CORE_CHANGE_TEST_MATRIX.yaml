version: 1
change:
  id: plan14-03-10
  summary: P14-03 through P14-10 add supply-chain checks, evidence-gated full-run
    validation graduation, verified stable update channels, gradual coverage/lint/type
    quality ratchets, report-only governance and reliability measures, and proposal-only
    branch hygiene. P14-01 and P14-02 remain regression boundaries for the full Gate.
  boundary:
  - GitHub supply-chain workflows and minimum permissions, pinned actions, dependency review, and advisory Scorecard
  - Validation selection shadow evidence, conservative full-run fallbacks, 30-day cohort graduation and Human-only decision
  - Stable release tag resolution and verification, channel persistence, installer/update compatibility, and no automatic release tagging
  - Coverage and deterministic Hypothesis measurement, no-growth Ruff baseline, and selected-module mypy debt limit
  - Advisory governance complexity counts and deferred monthly reliability SLO review thresholds
  - Exact-SHA branch-cleanup proposals without remote deletion authority
  - Canonical docs, Scenario registration, Integration Gate and repository validation wiring
  - P14-01 and P14-02 regressions: durable Issue evidence, evolution rollup, Python >=3.12 runtime floor and compatibility smoke
matrix:
- boundary: Durable Issue archive and rollup consumer compatibility
  reason: Original evidence must remain byte-preserved below GitHub limits; invalid,
    oversized or corrupt archives cannot become complete evidence.
  checks:
    static_lint:
      applicable: true
      evidence: scripts/evolution_radar_rollup.py; tests/evidence/evolution_radar_lifecycle.py;
        repository validation
    unit:
      applicable: true
      evidence: archive digest, bounds, corruption, and missing-preanalysis assertions
    integration:
      applicable: true
      evidence: archived weekly Issue restored by Radar and Effectiveness consumers
    contract:
      applicable: true
      evidence: Issue evidence extraction and monthly source coverage/report contracts
    e2e:
      applicable: true
      evidence: tests/evidence/evolution_radar_lifecycle.py end-to-end Issue round-trip
    security:
      applicable: true
      evidence: 8 MiB decompression cap, SHA-256 check, malformed-envelope rejection;
        workflow permissions unchanged
    migration_recovery:
      applicable: false
      na_reason: Existing Issue bodies remain readable; no stored data is rewritten.
    concurrency_idempotency_replay:
      applicable: true
      evidence: immutable digest and repeatable archive decode lifecycle
    cli_harness:
      applicable: false
      na_reason: No CLI command or Harness authority changes.
    docs_schema:
      applicable: true
      evidence: Human and Agent Radar documentation plus Scenario 155 and coverage
        registry
- boundary: Monthly source-effectiveness evidence completeness
  reason: Missing weekly pre-analysis must remain unknown and cannot be counted as
    zero shortlist yield.
  checks:
    static_lint:
      applicable: true
      evidence: scripts/evolution_radar_rollup.py; tests/evidence/evolution_radar_lifecycle.py;
        repository validation
    unit:
      applicable: true
      evidence: archive digest, bounds, corruption, and missing-preanalysis assertions
    integration:
      applicable: true
      evidence: archived weekly Issue restored by Radar and Effectiveness consumers
    contract:
      applicable: true
      evidence: Issue evidence extraction and monthly source coverage/report contracts
    e2e:
      applicable: true
      evidence: tests/evidence/evolution_radar_lifecycle.py end-to-end Issue round-trip
    security:
      applicable: false
      na_reason: No new secret-bearing input or authority; archive decoder security
        is covered by the first boundary.
    migration_recovery:
      applicable: true
      evidence: Historical weekly Issues without pre-analysis remain accepted while
        shortlist yield is marked unavailable.
    concurrency_idempotency_replay:
      applicable: false
      na_reason: No new mutable persistence or concurrency behavior.
    cli_harness:
      applicable: false
      na_reason: No CLI command or Harness authority changes.
    docs_schema:
      applicable: true
      evidence: Human and Agent Radar documentation plus Scenario 155 and coverage
        registry
- boundary: Protected authority and workflow publication
  reason: Keep issue-only GitHub permissions, credential-free collection and Human-only
    source-policy decisions.
  checks:
    static_lint:
      applicable: true
      evidence: scripts/evolution_radar_rollup.py; tests/evidence/evolution_radar_lifecycle.py;
