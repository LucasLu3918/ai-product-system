version: 1
change:
  id: plan16-p16-04-advisory-fast-lane
  summary: Add a bounded pull-request repository preflight in parallel while preserving the existing full required repository validation.
  boundary:
    - Exact pull-request base/head checkout, read-only permissions and the advisory fast-preflight job lifecycle.
    - Advisory outcome reporting and independence from the required Janitor and repository aggregate.
    - Label-only event filtering, validation contracts, Scenario 220 and Human documentation.
