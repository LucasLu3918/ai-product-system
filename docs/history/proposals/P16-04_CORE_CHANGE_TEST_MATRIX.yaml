matrix:
  - boundary: exact-candidate-parallel-preflight
    reason: The quick lane must inspect the exact pull-request candidate concurrently with the existing full validation path.
    checks:
      static_lint:
        applicable: true
        evidence: Workflow YAML parsing and repository diff checks validate the new job and its exact base/head arguments.
      unit:
        applicable: true
        evidence: Validation observation contracts assert exact candidate binding, independent scheduling, bounded outcome reporting and label-event filtering.
      integration:
        applicable: true
        evidence: The repository-preflight implementation runs against the exact candidate; GitHub Actions executes it in a separate Ubuntu job.
      contract:
        applicable: true
        evidence: Scenario 220 and workflow contracts require the fast lane to remain advisory and independent of the required repository aggregate.
      e2e:
        applicable: true
        evidence: Full repository validation and the exact-candidate Integration Gate run on the complete candidate; remote PR checks verify workflow behavior.
      security:
        applicable: true
        evidence: The job has contents-read only permissions, disables persisted checkout credentials and invokes no write-capable command.
      migration_recovery:
        applicable: false
        na_reason: No persistent data, schema, migration or recovery behavior changes.
      cli_harness:
        applicable: false
        na_reason: No CLI or runtime harness behavior changes.
      docs_schema:
        applicable: true
        evidence: Scenario coverage, Human maintenance/conformance docs, documentation sync and placement checks cover the new workflow behavior.
  - boundary: required-full-validation-authority
    reason: Advisory failures must remain visible without changing the complete required Integration Gate or repository validator.
    checks:
      static_lint:
        applicable: true
        evidence: Workflow contract asserts repository still depends on Janitor and the fast lane is not a prerequisite.
      unit:
        applicable: true
        evidence: Validation observation contract parses the workflow and checks job dependency and continue-on-error semantics.
      integration:
        applicable: true
        evidence: Exact-candidate Core Gate executes the existing full repository validation and mandatory candidate secret scan.
      contract:
        applicable: true
        evidence: Existing validation graduation configuration remains full_run_shadow with selective execution and automatic activation disabled.
      e2e:
        applicable: true
        evidence: Full local validation plus remote PR and merged-main required checks confirm the existing complete path remains green.
      security:
        applicable: true
        evidence: Existing candidate secret scanning and required repository gate remain unchanged; the advisory job grants no publication authority.
      migration_recovery:
        applicable: false
        na_reason: No persistent data, schema, migration or recovery behavior changes.
      cli_harness:
        applicable: false
        na_reason: No CLI or runtime harness behavior changes.
      docs_schema:
        applicable: true
        evidence: Validation, maintenance and conformance documentation explicitly retain the required full repository gate.
