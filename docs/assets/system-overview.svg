<rect x="1020" y="380" width="400" height="175" rx="18" class="box"/><text x="1050" y="418" class="h">⑤ Planning / Governance</text><text x="1050" y="450" class="t">Core Change · Planning Gate 1 / 2</text><text x="1050" y="478" class="t">Security · Visual · Multi-Review</text><text x="1050" y="506" class="t">Human Authority / Scope Integrity</text>
<path d="M480 467 L545 467" class="line"/><path d="M950 467 L1015 467" class="line"/><path d="M750 555 L750 600" class="line"/>
<rect x="80" y="605" width="850" height="170" rx="18" class="box"/><text x="110" y="644" class="h">⑥ Execution + Verification</text><text x="110" y="676" class="t">Implementation / Generation → Tests / Security / Performance / UX / Visual Evidence</text><text x="110" y="706" class="t">Independent / Multi-Perspective Review → Author Fix → Targeted Re-review</text><text x="110" y="736" class="t">Complete product: LOCAL_COMPLETE → optional Production Enablement → PRODUCTION_VERIFIED</text>
<rect x="990" y="605" width="430" height="170" rx="18" class="box"/><text x="1020" y="644" class="h">⑦ Persistent Workspace（ATTACHED only）</text><text x="1020" y="676" class="t">.ai State · Manifest · Project Knowledge</text><text x="1020" y="706" class="t">Quality / Visual pointers · Runs / Decisions</text><text x="1020" y="736" class="t">EPHEMERAL 不自動建立 .ai/</text>
