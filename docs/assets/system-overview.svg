<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<rect width="1500" height="1040" fill="#f7f7f5"/>
<style>.title{font:700 34px system-ui,-apple-system,sans-serif;fill:#171717}.sub{font:400 16px system-ui,-apple-system,sans-serif;fill:#666}.h{font:700 18px system-ui,-apple-system,sans-serif;fill:#171717}.t{font:400 14px system-ui,-apple-system,sans-serif;fill:#444}.box{fill:#fff;stroke:#d8d8d3;stroke-width:2}.dark{fill:#171717}.white{fill:#fff}.line{stroke:#aaa;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aaa"/></marker></defs>
<text x="65" y="60" class="title">AI Product System — Global Harness 架構總覽</text><text x="65" y="92" class="sub">Cross-Agent Harness · Non-invasive adapters · Progressive Context · Persistent Project Knowledge</text>
