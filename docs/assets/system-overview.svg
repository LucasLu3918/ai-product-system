<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <rect width="1400" height="980" fill="#f7f7f5"/>
  <style>
    .title{font:700 34px system-ui,-apple-system,sans-serif;fill:#171717}
    .sub{font:400 16px system-ui,-apple-system,sans-serif;fill:#666}
    .h{font:700 19px system-ui,-apple-system,sans-serif;fill:#171717}
    .t{font:400 14px system-ui,-apple-system,sans-serif;fill:#444}
    .box{fill:#fff;stroke:#d8d8d3;stroke-width:2;rx:18}
    .dark{fill:#171717}
    .white{fill:#fff}
    .line{stroke:#a7a7a0;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a7a7a0"/></marker></defs>

  <text x="70" y="65" class="title">AI Product System — 系統架構總覽</text>
  <text x="70" y="95" class="sub">Human-first governance · Minimum Context · Reusable Role/Skill · Persistent Workspace</text>

  <rect x="80" y="135" width="1240" height="85" class="box"/>
  <text x="110" y="170" class="h">① 使用者意圖與決策（Human Intent & Approval）</text>
  <text x="110" y="198" class="t">需求、素材、Reference、Brand、Scope、重大決策與最終發布確認</text>

  <path d="M700 220 L700 260" class="line"/>

  <rect x="80" y="265" width="1240" height="90" class="box"/>
  <text x="110" y="302" class="h">② 預檢與治理（Preflight & Governance）</text>
  <text x="110" y="330" class="t">System Update · Self-Improvement · Core Change · Risk / SAL · Planning Detection · Scope Integrity</text>

  <path d="M700 355 L700 395" class="line"/>

  <rect x="80" y="400" width="380" height="170" class="box"/>
  <text x="110" y="438" class="h">③ 路由（Routing）</text>
  <text x="110" y="470" class="t">Work Mode · Role · Skill</text>
  <text x="110" y="497" class="t">Context · Model · Tool</text>
  <text x="110" y="524" class="t">Minimum Sufficient Context</text>

  <rect x="510" y="400" width="380" height="170" class="box"/>
  <text x="540" y="438" class="h">④ 專用流程（Protocols）</text>
  <text x="540" y="470" class="t">Planning · Creative Direction</text>
  <text x="540" y="497" class="t">Brand · Security · Capability Incubation</text>
  <text x="540" y="524" class="t">只在需要時載入</text>

  <rect x="940" y="400" width="380" height="170" class="box"/>
  <text x="970" y="438" class="h">⑤ 確定性自動化（Automation）</text>
  <text x="970" y="470" class="t">Shell / Python / Existing Tool</text>
  <text x="970" y="497" class="t">Raw Data → JSON / YAML Summary</text>
  <text x="970" y="524" class="t">AI 只讀必要結果</text>

  <path d="M460 485 L505 485" class="line"/>
  <path d="M890 485 L935 485" class="line"/>
  <path d="M1130 570 L1130 620" class="line"/>

  <rect x="80" y="625" width="810" height="160" class="box"/>
  <text x="110" y="663" class="h">⑥ 執行與審核（Execution & Review）</text>
  <text x="110" y="695" class="t">Change Boundary · Implementation / Generation · Independent Review</text>
  <text x="110" y="722" class="t">Security / Visual / Quality Gate</text>
  <text x="110" y="749" class="t">結果與 Evidence 再寫回 Workspace</text>

  <rect x="940" y="625" width="380" height="160" class="box"/>
  <text x="970" y="663" class="h">⑦ 可接手工作區（Workspace）</text>
  <text x="970" y="695" class="t">.ai/ State · Planning · Decisions</text>
  <text x="970" y="722" class="t">Brand · Creative Direction · Evidence</text>
  <text x="970" y="749" class="t">Version / Commit / Provenance</text>

  <path d="M700 785 L700 830" class="line"/>

  <rect x="300" y="835" width="800" height="105" class="dark" rx="18"/>
  <text x="340" y="875" class="h white">⑧ Git 發布確認（Publish Gate）</text>
  <text x="340" y="907" class="t white">Changed Files + Validation + Atomic Commits → Human Approval → Push / PR / Release</text>
</svg>