<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<rect width="1500" height="1050" fill="#f7f7f5"/>
<style>.title{font:700 34px system-ui,sans-serif;fill:#171717}.sub{font:400 16px system-ui,sans-serif;fill:#666}.h{font:700 18px system-ui,sans-serif;fill:#171717}.t{font:400 14px system-ui,sans-serif;fill:#444}.box{fill:#fff;stroke:#d8d8d3;stroke-width:2}.dark{fill:#171717}.white{fill:#fff}.line{stroke:#aaa;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aaa"/></marker></defs>
<text x="65" y="58" class="title">AI Product System v0.12 — Enforceable + Resumable Harness</text><text x="65" y="88" class="sub">Runtime-native composition · Relevant context only · Existing-project impact safety</text>
<rect x="80" y="125" width="1340" height="82" rx="18" class="box"/><text x="110" y="160" class="h">① User Prompt + Runtime Adapter</text><text x="110" y="188" class="t">Codex CONTEXT_ALWAYS · Claude/Gemini TURN_NATIVE when verified · existing user context preserved</text><path d="M750 207 L750 238" class="line"/>
<rect x="80" y="243" width="1340" height="82" rx="18" class="box"/><text x="110" y="278" class="h">② Compact Turn Context</text><text x="110" y="306" class="t">Project identity · capability · freshness · Source Registry · relevant Intelligence pointers · no full rescan</text><path d="M750 325 L750 355" class="line"/>
<rect x="80" y="360" width="400" height="180" rx="18" class="box"/><text x="110" y="398" class="h">③ Native / Authoritative Sources</text><text x="110" y="430" class="t">AGENTS · CLAUDE · GEMINI</text><text x="110" y="458" class="t">ADR · Contracts · Official Docs</text><text x="110" y="486" class="t">SOURCE_REGISTRY avoids duplicate storage</text>
<rect x="550" y="360" width="400" height="180" rx="18" class="box"/><text x="580" y="398" class="h">④ Project Intelligence</text><text x="580" y="430" class="t">Architecture · Data Flow · Modules</text><text x="580" y="458" class="t">Conventions · Testing · Security · Ops</text><text x="580" y="486" class="t">IMPACT_GRAPH + PROJECT_OVERRIDES</text>
<rect x="1020" y="360" width="400" height="180" rx="18" class="box"/><text x="1050" y="398" class="h">⑤ AIPS Routing / Governance</text><text x="1050" y="430" class="t">Requirements · Quality · Security</text><text x="1050" y="458" class="t">Roles / Skills / Tools / Planning</text><text x="1050" y="486" class="t">Human Authority / Scope Integrity · Approval Binding</text>
<path d="M480 450 L545 450" class="line"/><path d="M950 450 L1015 450" class="line"/><path d="M750 540 L750 580" class="line"/>
<rect x="80" y="585" width="630" height="170" rx="18" class="box"/><text x="110" y="625" class="h">⑥ Existing Project Mutation</text><text x="110" y="657" class="t">Change Boundary → Impact Graph → CHANGE_IMPACT</text><text x="110" y="685" class="t">Preserve valid native conventions → Implementation</text><text x="110" y="713" class="t">Actual Diff vs Declared Impact → Targeted Refresh</text>
<rect x="790" y="585" width="630" height="170" rx="18" class="box"/><text x="820" y="625" class="h">⑦ Intelligence Persistence</text><text x="820" y="657" class="t">EPHEMERAL → ~/.config/aips/projects/&lt;id&gt;/</text><text x="820" y="685" class="t">ATTACHED → .ai/intelligence/</text><text x="820" y="713" class="t">Validated attach/detach migration · one writer · atomic replace</text>
<path d="M750 755 L750 795" class="line"/>
<rect x="230" y="800" width="1040" height="150" rx="18" class="dark"/><text x="270" y="844" class="h white">⑧ Verification + Human Review</text><text x="270" y="878" class="t white">Tests / Review · Approval binding · CHECKPOINT + EVENTS · deterministic evidence</text><text x="270" y="908" class="t white">User corrections → PROJECT_OVERRIDES · Large/Core Change → checkpoint/resume + Architecture Diagram Impact Check</text>
</svg>