<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
<rect width="1500" height="650" fill="#f7f7f5"/>
<style>.title{font:700 32px system-ui,-apple-system,sans-serif;fill:#171717}.sub{font:400 15px system-ui,-apple-system,sans-serif;fill:#666}.h{font:700 17px system-ui,-apple-system,sans-serif;fill:#171717}.t{font:400 13px system-ui,-apple-system,sans-serif;fill:#444}.box{fill:#fff;stroke:#d8d8d3;stroke-width:2}.line{stroke:#aaa;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aaa"/></marker></defs>
<text x="60" y="60" class="title">Installation &amp; Project Lifecycle — 安裝、Harness 與專案生命週期</text><text x="60" y="90" class="sub">Global Harness 與 Project persistence 分離；Uninstall 只移除 AIPS-owned integration</text>
<rect x="55" y="145" width="180" height="105" rx="16" class="box"/><text x="83" y="184" class="h">① Clone</text><text x="83" y="213" class="t">AIPS Repository</text>
<rect x="280" y="145" width="210" height="105" rx="16" class="box"/><text x="308" y="184" class="h">② Install</text><text x="308" y="213" class="t">CLI + Harness Ownership</text>
<rect x="535" y="145" width="220" height="105" rx="16" class="box"/><text x="563" y="184" class="h">③ Runtime Adapters</text><text x="563" y="213" class="t">AUTO when safe · else MANUAL</text>
<rect x="800" y="145" width="220" height="105" rx="16" class="box"/><text x="828" y="184" class="h">④ Agent Use</text><text x="828" y="213" class="t">Minimal Bootstrap / Resolve</text>
<rect x="1065" y="145" width="180" height="105" rx="16" class="box"/><text x="1093" y="184" class="h">⑤ Uninstall</text><text x="1093" y="213" class="t">Remove AIPS-owned only</text>
<rect x="1290" y="145" width="160" height="105" rx="16" class="box"/><text x="1318" y="184" class="h">⑥ Optional</text><text x="1318" y="213" class="t">User deletes repo</text>
<path d="M235 198 L275 198" class="line"/><path d="M490 198 L530 198" class="line"/><path d="M755 198 L795 198" class="line"/><path d="M1020 198 L1060 198" class="line"/><path d="M1245 198 L1285 198" class="line"/>
<rect x="180" y="350" width="470" height="150" rx="18" class="box"/><text x="210" y="390" class="h">EPHEMERAL Project</text><text x="210" y="420" class="t">No .ai/ → AIPS can guide current work</text><text x="210" y="448" class="t">Preflight does not auto-attach</text><text x="210" y="476" class="t">No persistent Project Knowledge / State</text>
<rect x="850" y="350" width="470" height="150" rx="18" class="box"/><text x="880" y="390" class="h">ATTACHED Project</text><text x="880" y="420" class="t">Explicit aips attach → .ai/ persistent workspace</text><text x="880" y="448" class="t">aips detach → .ai.detached-* reversible archive</text><text x="880" y="476" class="t">Uninstall preserves both attached/detached workspace</text>
<path d="M800 250 L800 300 L415 300 L415 345" class="line"/><path d="M415 500 L415 550 L1085 550 L1085 505" class="line"/>
</svg>