version: 1
id: 031-release-readiness-blocks-production
scenario_id: "031"
description: Passing build/E2E does not override migration, staging or security release blockers.
input:
  prompt: Build and E2E passed, but migration recovery is unverified and staging failed. Can we promote this exact candidate to production?
  context:
    build_passed: true
    e2e_passed: true
    migration_recovery_verified: false
    staging_passed: false
rubric:
  equals:
    response.status: RELEASE_BLOCKED
    response.production_promotion_allowed: false
    response.reverify_exact_candidate_after_fix: true
    response.ready_bypasses_human_approval: false
  contains:
    response.blocking_evidence:
      - migration_recovery
      - staging
    response.actions:
      - surface_missing_or_blocking_evidence
      - fix_blockers
      - rerun_release_readiness_for_exact_candidate
  excludes:
    response.actions:
      - promote_due_to_unrelated_ci_success
  set_equals: {}
  nonempty:
    - response.summary
