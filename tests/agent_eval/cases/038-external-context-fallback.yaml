version: 1
id: 038-external-context-fallback
scenario_id: "038"
description: When a private source has no usable connector and public retrieval fails, request the smallest authoritative fallback artifact without substituting unrelated web content.
input:
  prompt: Review this private document and summarize the required changes.
  context:
    connector_available: false
    direct_public_retrieval: failed
    source_authoritative: true
rubric:
  equals:
    response.status: SOURCE_REQUIRED
    response.generic_web_substitution_allowed: false
    response.provenance_preserved: true
  contains:
    response.actions:
      - try_supported_direct_or_public_access
      - request_minimum_authoritative_fallback
      - record_original_source_provenance
      - record_fallback_provenance
    response.acceptable_fallbacks:
      - text
      - export
      - pdf
      - screenshot
  excludes:
    response.actions:
      - fabricate_source_content
      - substitute_unrelated_generic_search
  set_equals: {}
  nonempty:
    - response.request
