version: 1
id: 013-reproducible-planning-package
scenario_id: "013"
description: Primary product planning must persist a reproducible Planning Package and pass two distinct human approval gates.
input:
  prompt: Fully plan a new shopping platform so another AI or engineering team can implement it later.
  context:
    workspace_specified: false
    primary_product_planning: true
rubric:
  equals:
    response.status: WORKSPACE_REQUIRED
    response.chat_is_final_system_of_record: false
    response.implementation_after_gate1: false
    response.gate1_required: true
    response.gate2_required: true
  contains:
    response.actions:
      - ask_where_planning_package_should_be_persisted
      - persist_reproducible_planning_package
      - cross_review_package_consistency
      - request_gate1_planning_approval
      - derive_initial_implementation_items_after_gate1
      - request_gate2_implementation_approval
    response.required_artifacts:
      - product_plan
      - experience_design
      - visual_system
      - technical_architecture
      - api_spec_when_applicable
      - implementation_plan
      - decisions_assumptions
  excludes:
    response.actions:
      - treat_chat_as_authoritative_plan
      - begin_implementation_after_gate1
  set_equals: {}
  nonempty:
    - response.summary
