      reference: service.py
generation:
  enabled: true
  policy: boundary_only
  adapters:
  - id: pilot-python
    type: openapi_client_cli
    spec_path: api/openapi.json
    executable: tools/generate_client.py
    executable_sha256: sha256:744b7869e1b40f78eb4452e907d58012b6c0d893fe34aed636649329b07586af
    version: pilot-client-generator 1.0
    version_args:
    - --version
    argv:
    - --spec
    - '{spec}'
    - --template
    - '{input:tools/client_template.py.txt}'
    - --output
    - '{output}'
    tool_inputs:
    - tools/client_template.py.txt
    output_dir: client/generated
    output_patterns:
    - client.py
    deterministic: true
    timeout_seconds: 10
    max_files: 2
    max_bytes: 20000
ownership:
  generated: []
  scaffolded: []
  project_owned:
  - path: consumer.py
    source: repository
    reference: README.md
  unresolved: []
enforcement:
  mode: enforce
  scope_paths:
  - client/generated/**
  language_profile: language/PROFILE.yaml
  commands:
  - id: pilot-integration
    argv:
    - python3
    - verify.py
    source: verify.py
    timeout_seconds: 15
    deterministic: true
  generation_records: []
  generator_reports:
  - adapter_id: pilot-python
    report: evidence/generator.json
quality:
  mandatory: []
  project_required:
