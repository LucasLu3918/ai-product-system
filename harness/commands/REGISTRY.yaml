version: 1
canonical_namespace: aips
renderer_families:
  - markdown-command
  - markdown-skill
  - generic
commands:
  - id: aips.constitution
    version: 1
    purpose: apply-and-check-protected-constitution
    canonical_sources:
      - core/CONSTITUTION.md
    inputs: [objective, workspace]
    outputs: [constraint-report]
    gates: [constitutional-amendment-gate]
    authority:
      human_approval: false
      git_publish: false
      merge: false
      release: false
      production: false
    side_effects: []
    invocation:
      slash: [/aips.constitution, /aips-constitution]
      skill: [$aips-constitution]
  - id: aips.plan
    version: 1
    purpose: reproducible-product-planning
    canonical_sources:
      - SYSTEM.md
      - orchestration/PLANNING_PACKAGE.md
      - orchestration/QUALITY_PLANNING.md
    inputs: [objective, workspace]
    outputs: [planning-package]
    gates: [planning-gate-1, planning-gate-2]
    authority:
      human_approval: false
      git_publish: false
      merge: false
      release: false
      production: false
    side_effects: [workspace_write]
    invocation:
      slash: [/aips.plan, /aips-plan]
      skill: [$aips-plan]
  - id: aips.impact
    version: 1
    purpose: existing-project-change-impact
    canonical_sources:
      - orchestration/CHANGE_IMPACT.md
      - SYSTEM.md
    inputs: [objective, workspace, changed_paths]
    outputs: [change-impact]
    gates: [change-impact-gate]
    authority:
      human_approval: false
      git_publish: false
      merge: false
      release: false
      production: false
    side_effects: [workspace_read]
    invocation:
      slash: [/aips.impact, /aips-impact]
      skill: [$aips-impact]
  - id: aips.grill-me
    version: 1
    purpose: explicit-requirement-clarification
    canonical_sources:
      - orchestration/REQUIREMENT_CLARIFICATION.md
      - skills/product/requirements-definition/SKILL.md
    inputs: [objective, workspace, known_constraints]
    outputs: [decisions, assumptions, open_questions, requirement_brief]
    gates: [requirement-readiness]
    authority:
      human_approval: false
      git_publish: false
      merge: false
      release: false
      production: false
    side_effects: [workspace_read]
    guidance:
      - Invoke this interview only when the user explicitly calls /grill-me or directly asks to be grilled about a plan or design.
      - Inspect available conversation and workspace evidence before asking the user; do not ask for facts the agent can verify.
      - Ask one concise, decision-focused question at a time, with a recommended answer and alternatives when useful.
      - Prioritize decisions that change the goal, scope, architecture, risk, compatibility, cost or acceptance criteria.
      - Stop when the material decisions are resolved; summarize confirmed decisions, assumptions and remaining questions.
      - Do not edit files or treat unanswered blocking decisions as approved requirements.
    invocation:
      slash: [/grill-me, /aips-grill-me]
      skill: [$grill-me]
hosts:
  opencode:
    renderer: markdown-command
    mode: global-native-or-mcp
    capability: CONTEXT_ALWAYS
    placement: ~/.config/opencode/commands
  codex:
    renderer: markdown-skill
    mode: global-native-skill
    capability: CONTEXT_ALWAYS
    placement: ~/.agents/skills
  claude:
    renderer: markdown-skill
    mode: global-native-skill
    capability: CONTEXT_ALWAYS
    placement: ~/.claude/skills
  gemini:
    renderer: markdown-skill
    mode: global-native-skill
    capability: CONTEXT_ALWAYS
    placement: ~/.agents/skills
  cursor:
    renderer: markdown-command
    mode: project-projection-or-mcp
    capability: MCP_STANDARD
    placement: ~/.config/aips/commands/projections/cursor
  windsurf:
    renderer: markdown-command
    mode: project-projection-or-mcp
    capability: MCP_STANDARD
    placement: ~/.config/aips/commands/projections/windsurf
  copilot:
    renderer: generic
    mode: mcp-or-generic
    capability: MCP_STANDARD
    placement: ~/.config/aips/commands/projections/copilot
  amp:
    renderer: generic
    mode: mcp-or-generic
    capability: MCP_STANDARD
    placement: ~/.config/aips/commands/projections/amp
  generic:
    renderer: generic
    mode: mcp-or-manual
    capability: MCP_STANDARD
    placement: ~/.config/aips/commands/projections/generic
