version: 2

adapters:
  opencode:
    runtime: OpenCode
    detect_command: opencode
    strategy: managed_global_instruction_block_and_native_projections
    capability: CONTEXT_ALWAYS
    governance_enforcement: ADVISORY
    source: harness/adapters/opencode/AGENTS.md
    native_verification: UNVERIFIED
    pre_tool_guard: UNSUPPORTED

  codex:
    runtime: Codex CLI
    detect_command: codex
    strategy: managed_global_instruction_block
    capability: CONTEXT_ALWAYS
    governance_enforcement: ADVISORY
    hook_probe: EXPERIMENTAL
    hook_probe_scope: single_synthetic_Bash_command
    source: harness/adapters/codex/AGENTS.md

  claude-code:
    runtime: Claude Code
    detect_command: claude
    strategy: managed_memory_block_plus_user_prompt_hook
    capability:
      preferred: TURN_NATIVE
      fallback: CONTEXT_ALWAYS
    governance_enforcement:
      preferred: TOOL_GUARDED
      fallback: ADVISORY
    source: harness/adapters/claude-code/CLAUDE.md

  gemini-cli:
    runtime: Gemini CLI
    detect_command: gemini
    strategy: official_extension_before_agent
    capability: TURN_NATIVE
    governance_enforcement: TOOL_GUARDED
    source: harness/adapters/gemini-cli

  generic-manual:
    runtime: Other / Unsupported Runtime
    detect_command: null
    strategy: manual_bootstrap
    capability: MANUAL
    governance_enforcement: UNSUPPORTED
    source: harness/adapters/generic/BOOTSTRAP.md
