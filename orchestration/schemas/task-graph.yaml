version: 1
plan_id: string
base_revision: git-sha-or-project-revision
max_parallel: 1
tasks:
  - id: string
    order: 100
    objective: string
    dependencies: []
    read_only: false
    change_boundary: []
    read_set: []
    write_set: []
    review:
      mode: SELF_CHECK # SELF_CHECK | INDEPENDENT_REVIEW
      review_of_task: null
      required: false
      context_inheritance: none
      allowed_context_classes: []
    role: null
    skills: []
    isolation:
      mode: worktree
      required: true
      runtime:
        ports:
          - id: dev
            protocol: tcp
            preferred: 3000
            expose_as: [PORT]
    validation_profile: default
