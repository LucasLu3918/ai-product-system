# Reference shape; omit fields that are not relevant.
business_impact: low | medium | high | critical
technical_complexity: low | medium | high | critical
risk: normal | elevated | high | critical
security_assurance: 0 | 1 | 2 | 3 | 4
reliability_impact: 0 | 1 | 2 | 3 | 4
reasoning: low | medium | high | very_high
coding: none | normal | strong
reliability: normal | high | critical
context: small | medium | large
data: public | internal | confidential | restricted
minimum_tier: 1 | 2 | 3 | 4
preferred_tier: 1 | 2 | 3 | 4
budget:
  context: small | medium | large
  reasoning: low | medium | high
  max_parallel_subagents: 1
  prefer_cost_efficient: true
  cost:
    amount: null
    currency: null
    period: per_run
    enforcement: advisory
    price_source: null
observed_usage:
  input_tokens: null
  output_tokens: null
  source: runtime_observed | unavailable
  confidence: observed | estimated | unknown
  cost_status: unknown
isolation:
  mode: shared | worktree | sandbox
  required: false
  status: AVAILABLE | UNSUPPORTED | BLOCKED
  id: null
  boundary_id: null
  provider: null
  runtime_class: null
  minimum_isolation: container | vm | microvm
  verification_status: VERIFIED | STALE | FAILED | UNKNOWN
  data_class: public | internal | confidential | restricted
  resource: null
authorization:
  profile: null
  status: NOT_EVALUATED | ALLOW | DENY | BLOCKED
  enforcement: PRE_EXECUTION_EVIDENCE | RUNTIME_GUARDED
subagents: []

# Optional policy intent; does not alter host model settings.
primary_execution_policy:
  strategy: runtime_preferred
  allow_downshift: false
auxiliary_routing:
  strategy: minimum_sufficient
