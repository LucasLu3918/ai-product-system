    contract:
      applicable: true
      evidence: Scenario 222 and static contracts lock the 50,000-byte threshold and non-blocking/no-move authority boundary.
    e2e:
      applicable: true
      evidence: Full repository validation and exact-candidate Integration Gate exercise Scenario 222 and documentation conformance.
    security:
      applicable: true
