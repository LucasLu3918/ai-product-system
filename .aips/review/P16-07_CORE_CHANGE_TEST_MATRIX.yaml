version: 1
change:
  id: plan16-p16-07-large-document-measurement
  summary: Measure tracked documentation and evidence sizes and report warnings above 50,000 bytes without Gate blocking or file movement.
  boundary:
  - Versioned report-only policy measures tracked text/documentation/evidence paths using byte counts.
  - Over-threshold files are informational WARN rows with successful exit status; the baseline records the current snapshot.
  - No files are moved or archived; future layering decisions remain Human-owned and wait for measurement review.
