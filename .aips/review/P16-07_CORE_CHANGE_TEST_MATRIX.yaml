    migration_recovery:
      applicable: false
      na_reason: Measurement creates a small review snapshot and does not alter source files.
    cli_harness:
      applicable: true
      evidence: The report CLI returns zero when its overall status is WARN and leaves input files unchanged.
    docs_schema:
      applicable: true
