  base_sha: 5eda403d85250bc2215163858091d1384f3ed562
  changed_files_hash: pending
matrix:
- boundary: tracked-file-size-measurement
  reason: Measurements must be reproducible, scoped to tracked repository text/evidence files, and expose exact bytes and the configured threshold.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff, YAML policy contracts and repository preflight validate the report-only audit.
    unit:
      applicable: true
      evidence: Lifecycle verifies above-threshold WARN, exact-threshold OK, tracked-path scope and input immutability.
    integration:
      applicable: true
