version: 1

change:
  id: plan35-publication-root-cause-recovery
  summary: Preserve root-cause publication diagnostics and non-authorizing recovery guidance.
  boundary:
    - Exact candidate and GitHub merge-command validation retain the sole publication authority.
    - Required Checks classification must distinguish independently observed policy from pending jobs.
    - Claude Host denial observation never grants native permission or a signed external publication grant.
    - CLI, Human and Harness documentation retain existing governance and canonical placement.

matrix:
  - boundary: Publication command, required-check policy and reason fidelity
    reason: Protect merge SHA binding and remove misleading generic error classifications without weakening the publication gate.
    checks:
      static_lint:
        applicable: true
        evidence: Ruff and repository preflight on changed Python modules.
      unit:
        applicable: true
        evidence: tests/test_publication_error_recovery.py, tests/test_publication_planning.py, tests/test_publication_diagnostics.py.
      integration:
        applicable: true
        evidence: Exact-candidate GitHub Integration Gate and publication preflight contract suite.
      contract:
        applicable: true
        evidence: CLI output remains additive; read-only diagnostics and exact merge-command binding in Scenario 260.
      e2e:
        applicable: false
        na_reason: No deployed application or automatic merge action; the genuine Claude Host classifier needs separate interactive acceptance.
      security:
        applicable: true
        evidence: Secret scanner, redacted failure categories, fail-closed absent Required Checks, prohibition of admin merge/branch deletion.
      migration_recovery:
        applicable: true
        evidence: Existing personal/high-assurance publication modes and exact candidate fingerprints are retained.
      cli_harness:
        applicable: true
        evidence: Prepare/diagnose output and Claude Code PreToolUse guidance; Host runtime capability not inferred from synthetic tests.
      docs_schema:
        applicable: true
        evidence: Canonical Documentation Impact closure, Scenario 260 and Traditional Chinese Human guide.
  - boundary: Non-authorizing recovery and Host denial provenance
    reason: Classify retryable read-only checks separately from Human confirmation and Host permission denial.
    checks:
      static_lint:
        applicable: true
        evidence: Ruff and Python syntax contract checks.
      unit:
        applicable: true
        evidence: New recovery state tests and existing publication planning lifecycle.
      integration:
        applicable: true
        evidence: No merge/grant-consuming action from prepare, diagnose, doctor or recovery guidance.
      contract:
        applicable: true
        evidence: Stable source/reason_code/phase/next_step and read-only recovery output remain compatible.
      e2e:
        applicable: false
        na_reason: Actual Host Auto Mode permission classification cannot be proven in an isolated CI fixture.
      security:
        applicable: true
        evidence: Host denial cannot be retried with disguised commands; no credentials, broad permissions or policy downgrades.
      migration_recovery:
        applicable: true
        evidence: ALREADY_MERGED, HOST_PERMISSION_REQUIRED and CHECKS_PENDING guidance requires re-observation.
      cli_harness:
        applicable: true
        evidence: Claude Code adapter uses existing native PreToolUse approval flow; no new Host permission grants.
      docs_schema:
        applicable: true
        evidence: Canonical Handbook, Architecture/Harness, security, orchestration and Scenario 260 updates.

