change:
  id: plan20-phase2-system-core
  summary: Compact fixed system context, route canonical protocols per task, and correct
    bounded Python relation extraction for Change Impact.
  boundary:
  - fixed-system-core
  - task-specific-protocol-routing
  - context-manifest-and-runtime-hook
  - retrieval-relations-and-impact-traversal
  - documentation-and-conformance
  - external-vitepress-resolution
matrix:
- boundary: fixed-system-core
  reason: Reduce fixed system context while preserving authority, compatibility routing,
    and all existing gates.
  checks: &id001
    static_lint:
      applicable: true
      evidence: Ruff E4/E7/E9/F on routing, hook, and lifecycle files; full changed-file
        lint findings reviewed against baseline.
    unit:
      applicable: true
      evidence: tests/evidence/retrieval_relations_extraction_lifecycle.py and route
        classifier assertions in tests/evidence/intelligence_context_lifecycle.py.
    integration:
      applicable: true
      evidence: tests/evidence/intelligence_context_lifecycle.py and tests/evidence/change_impact_traversal_lifecycle.py;
        exact-candidate Integration Gate required.
    contract:
      applicable: true
      evidence: tests/validation/static_contracts.py and tests/validation/change_impact_traversal_contracts.py;
        compact manifest and hook contract assertions.
    security:
      applicable: true
      evidence: Missing required protocol sources fail closed for mutation; route
        output excludes prompt text and core retains Human/publication gates.
    migration_recovery:
      applicable: true
      evidence: Retrieval index schema v5 is rebuildable; retrieval lifecycle and
        stale-index behavior remain covered.
    cli_harness:
      applicable: true
      evidence: Turn Context CLI and runtime hook lifecycle verify the selected route
        manifest and diagnostics.
    docs_schema:
      applicable: true
      evidence: Canonical protocol, Human documentation closure, two architecture
        diagrams, Scenario 230 and generated conformance view.
    e2e:
      applicable: false
      na_reason: No product UI, deployed service, or end-user runtime behavior changes.
- boundary: task-specific-protocol-routing
  reason: Resolve and combine canonical protocol pointers for every supported task
    category with conservative fallback.
  checks: *id001
- boundary: context-manifest-and-runtime-hook
  reason: Keep full/compact manifests and hook output additive, privacy-safe, and
    fail closed when required sources are missing.
  checks: *id001
- boundary: retrieval-relations-and-impact-traversal
  reason: Use syntactic Python calls and bounded caller/consumer traversal without
    claiming compiler-grade or repository-wide completeness.
  checks: *id001
- boundary: documentation-and-conformance
  reason: Keep canonical Human/Agent guidance, diagrams, route scenario, generated
    views, and exact-candidate evidence aligned.
  checks: *id001
- boundary: external-vitepress-resolution
  reason: Allow a clean candidate to use an explicit external VitePress installation
    only when its installed version matches the candidate lockfile exactly.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff critical lint and quality ratchet run in the exact-candidate Integration Gate.
    unit:
      applicable: true
      evidence: tests/evidence/publish_preflight_lifecycle.py covers external resolution,
        local default resolution, absent packages, and lockfile-version mismatch.
    integration:
      applicable: true
      evidence: Exact-candidate Integration Gate builds changed documentation through
        the external VitePress path while the candidate checkout stays clean.
    contract:
      applicable: true
      evidence: tests/validation/publish_preflight_contracts.py asserts explicit path,
        exact lockfile version, and no-install/no-registry behavior.
    security:
      applicable: true
      evidence: External package paths are explicit and read-only; mismatched package
        metadata fails before invoking Node; no package install or registry request occurs.
    migration_recovery:
      applicable: true
      evidence: Existing checkout-local node_modules remains the default; external
        resolution is opt-in and needs no persisted state or migration.
    cli_harness:
      applicable: true
      evidence: Publication preview and Gate inherit the explicit
        AIPS_VITEPRESS_NODE_MODULES environment setting.
    docs_schema:
      applicable: true
      evidence: Scenario 165, Integration Gate, Maintenance, and Technology Guide
        describe version matching and the clean-checkout workflow.
    e2e:
      applicable: false
      na_reason: No deployed UI or user-facing product flow changes.
