change:
  id: eval-as-ci-trajectory-quality-gate
  summary: Deliver the synchronized temporal intelligence and Eval-as-CI trajectory quality gate candidate on top of the main baseline, with deterministic evidence, privacy boundaries, documentation and exact-candidate validation.
  boundary:
    - temporal-canonical-schema
    - git-revision-resolver
    - retrieval-sqlite-projection
    - change-impact-and-context
    - documentation-architecture
    - validation-and-migration
    - trajectory-trace-and-deterministic-evaluation
    - scenario-and-publish-evidence

matrix:
  - boundary: temporal-canonical-schema
    reason: New canonical assertion ledger and IMPACT_GRAPH v2 validity/provenance fields.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation and YAML parsing"}
      unit: {applicable: true, evidence: "Temporal schema, interval and supersession tests"}
      integration: {applicable: true, evidence: "CLI temporal query smoke tests"}
      contract: {applicable: true, evidence: "Canonical template and backward-compatible v1 graph contract"}
      e2e: {applicable: false, na_reason: "No external service or browser flow is changed"}
      security: {applicable: true, evidence: "No secret persistence; malformed input fails closed"}
      migration_recovery: {applicable: true, evidence: "Unknown history remains UNKNOWN and canonical YAML can rebuild projections"}
      cli_harness: {applicable: true, evidence: "aips intelligence temporal CURRENT/AS_OF/BETWEEN/WHY commands"}
      docs_schema: {applicable: true, evidence: "Temporal protocol and template documentation"}
  - boundary: git-revision-resolver
    reason: Historical state depends on deterministic Git ancestry rather than timestamps.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation"}
      unit: {applicable: true, evidence: "Replacement and branch ancestry tests"}
      integration: {applicable: true, evidence: "Temporary Git repository lifecycle"}
      contract: {applicable: true, evidence: "CURRENT/AS_OF/BETWEEN/WHY result contract"}
      e2e: {applicable: false, na_reason: "Repository-local deterministic resolver"}
      security: {applicable: false, na_reason: "No authorization or credential boundary"}
      migration_recovery: {applicable: true, evidence: "Unknown revision and unknown-history negative paths"}
      cli_harness: {applicable: true, evidence: "Temporal CLI argument validation"}
      docs_schema: {applicable: true, evidence: "Revision semantics documented"}
  - boundary: retrieval-sqlite-projection
    reason: Temporal assertions and supersession links are projected into rebuildable SQLite.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation"}
      unit: {applicable: true, evidence: "Projection count and digest assertions"}
      integration: {applicable: true, evidence: "Retrieval lifecycle with temporary config/cache"}
      contract: {applicable: true, evidence: "SQLite remains non-canonical and metadata reports temporal provider"}
      e2e: {applicable: false, na_reason: "No external deployment path"}
      security: {applicable: true, evidence: "Existing retrieval secret-path exclusion remains enabled"}
      migration_recovery: {applicable: true, evidence: "Force index rebuild recreates temporal tables"}
      cli_harness: {applicable: true, evidence: "aips intelligence index"}
      docs_schema: {applicable: true, evidence: "Architecture and Retrieval documentation"}
  - boundary: change-impact-and-context
    reason: Historical Change Impact must use the active temporal graph and current snapshot remains fast default.
    checks:
      static_lint: {applicable: true, evidence: "Documentation and Python validation"}
      unit: {applicable: true, evidence: "Historical Change Impact acceptance scenario"}
      integration: {applicable: true, evidence: "Existing Project Intelligence and Retrieval lifecycle tests"}
      contract: {applicable: true, evidence: "CHANGE_IMPACT and PROJECT_INTELLIGENCE protocols"}
      e2e: {applicable: false, na_reason: "No user-facing web product"}
      security: {applicable: true, evidence: "No authority or secret semantics changed"}
      migration_recovery: {applicable: false, na_reason: "Impact artifact is derived and rebuildable"}
      cli_harness: {applicable: true, evidence: "Existing impact-init and temporal CLI contracts"}
      docs_schema: {applicable: true, evidence: "Architecture diagrams and human overview updated"}
  - boundary: documentation-architecture
    reason: New canonical temporal flow changes system and human architecture documentation.
    checks:
      static_lint: {applicable: true, evidence: "Repository documentation validators"}
      unit: {applicable: false, na_reason: "Documentation behavior is covered by placement/sync contracts"}
      integration: {applicable: true, evidence: "Documentation placement and sync validation"}
      contract: {applicable: true, evidence: "Canonical orchestration and human documentation sections"}
      e2e: {applicable: true, evidence: "Docs site build where available"}
      security: {applicable: false, na_reason: "No new credential or protected operation"}
      migration_recovery: {applicable: false, na_reason: "Documentation-only compatibility is additive"}
      cli_harness: {applicable: false, na_reason: "No runtime command implementation in this boundary"}
      docs_schema: {applicable: true, evidence: "Architecture diagrams, scenario registry and protocol docs"}
  - boundary: validation-and-migration
    reason: New lifecycle tests verify fail-closed validation and safe historical migration semantics.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation"}
      unit: {applicable: true, evidence: "tests/test_temporal_intelligence.py"}
      integration: {applicable: true, evidence: "tests/evidence/temporal_intelligence_lifecycle.py"}
      contract: {applicable: true, evidence: "Scenario 166 registry binding"}
      e2e: {applicable: false, na_reason: "No external runtime"}
      security: {applicable: true, evidence: "No secret values are persisted"}
      migration_recovery: {applicable: true, evidence: "Unknown history, malformed interval and rebuild cases"}
      cli_harness: {applicable: true, evidence: "Project Intelligence CLI smoke tests"}
      docs_schema: {applicable: true, evidence: "Scenario and acceptance documentation"}
  - boundary: trajectory-trace-and-deterministic-evaluation
    reason: Observable Agent trajectory analysis introduces a provider-neutral trace contract, deterministic duplicate/retry/budget rules and privacy-safe evidence.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation, Ruff and mypy for trajectory evaluator"}
      unit: {applicable: true, evidence: "Deterministic duplicate-read, budget and gate assertions"}
      integration: {applicable: true, evidence: "Trajectory lifecycle evidence and aips trajectory CLI"}
      contract: {applicable: true, evidence: "Trajectory protocol and reusable trace/evidence templates"}
      e2e: {applicable: false, na_reason: "No external service or browser flow is changed"}
      security: {applicable: true, evidence: "Private reasoning and secret-like values fail closed"}
      migration_recovery: {applicable: false, na_reason: "Trace evidence is additive and provider-neutral"}
      cli_harness: {applicable: true, evidence: "aips trajectory evaluate/report"}
      docs_schema: {applicable: true, evidence: "Trajectory protocol, human overview and scenario documentation"}
  - boundary: scenario-and-publish-evidence
    reason: Scenario Conformance and Integration Gate must account for trajectory evidence without granting machine publication authority.
    checks:
      static_lint: {applicable: true, evidence: "Repository validation and exact candidate Gate"}
      unit: {applicable: true, evidence: "Scenario 167 lifecycle evidence"}
      integration: {applicable: true, evidence: "Integration Gate trajectory check"}
      contract: {applicable: true, evidence: "Scenario registry, Architecture Surface and Capability Map bindings"}
      e2e: {applicable: false, na_reason: "No external product UI is changed"}
      security: {applicable: true, evidence: "Human authority and publish_authorized=false assertions"}
      migration_recovery: {applicable: false, na_reason: "Evidence is rebuildable"}
      cli_harness: {applicable: true, evidence: "aips trajectory CLI lifecycle"}
      docs_schema: {applicable: true, evidence: "Conformance and architecture documentation"}

