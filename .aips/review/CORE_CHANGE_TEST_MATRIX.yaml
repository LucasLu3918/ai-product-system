version: 1
change:
  id: zero-coupling-optional-governance
  summary: Repository-independent external state, optional governance, native Git
    compatibility and safe migration.
  boundary:
  - external state and repository/worktree identity
  - installation, modes and runtime adapter ownership
  - native Git and publication authority
  - state migration, recovery and durable knowledge
  - CLI, documentation, CI and compatibility
