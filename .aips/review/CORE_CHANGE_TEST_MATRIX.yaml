change:
  id: creative-bundle-mflux-20261008
  summary: Safe versioned creative Bundle/Profile preparation and fixed MFLUX model/operation CLI mapping.
  boundary:
    - Non-Git EPHEMERAL prepare action, version allocation, create-only files, scope/path/symlink protections, and unconfigured engine state
    - Fixed FLUX.1, FLUX.2 Klein and Qwen Edit MFLUX executable/argument mapping; FLUX.1 edit is single-reference, while FLUX.2/Qwen multi-reference edit is bounded; ComfyUI edit is single-reference
    - AIPS CLI and OpenCode creative tool schema, intent/session binding, preflight and explicit execute boundaries
    - Scenario 236, evidence, docs, diagrams, documentation placement/sync, release version/changelog

