version: 1
change:
  id: plan12-reliability
  summary: Add bounded monthly GitHub validation/merge evidence and deterministic reliability metrics for Human review.
  boundary:
    - bounded-github-metadata-collection
    - reliability-metric-and-unknown-semantics
    - report-workflow-authority-and-publication
    - scenario-validation-and-documentation-closure
matrix:
  - boundary: bounded-github-metadata-collection
    reason: GitHub Actions runs/jobs and merged PR metadata are fetched with fixed pagination, row, failure-detail and changed-file caps; truncation remains explicit.
    checks: &shared
      static_lint:
        applicable: true
        evidence: Ruff critical scan and Python syntax through repository validation.
      unit:
        applicable: true
        evidence: Lifecycle API fixtures cover run/search objects, array-shaped PR files, truncation and unavailable failure details.
      integration:
        applicable: true
        evidence: Full repository validator and exact-candidate Integration Gate.
      contract:
        applicable: true
        evidence: Maintenance reliability config/workflow contract checks permissions, finite bounds and required evidence fields.
      e2e:
        applicable: true
        evidence: Workflow YAML is validated by repository contracts and required GitHub PR checks exercise the candidate workflow definition.
      security:
        applicable: true
        evidence: Exact-candidate mandatory secret scan; fixture/report stores normalized metadata only and no logs, prompts or credentials.
      migration_recovery:
        applicable: false
        na_reason: This adds a bounded report artifact and review Issue, not a repository-owned user data store or migration.
      cli_harness:
        applicable: false
        na_reason: A new standalone evidence helper does not change public AIPS CLI routing or runtime adapters.
      docs_schema:
        applicable: true
        evidence: Scenario 201 registry/conformance, recursive documentation sync and placement preview, plus docs-site build.
  - boundary: reliability-metric-and-unknown-semantics
    reason: Monthly pass rate, nearest-rank runtime and files-per-change distributions, hotfix labels, repeated paths, failure hints and exact-SHA regressions must be deterministic and conservative with incomplete data.
    checks:
      <<: *shared
      unit:
        applicable: true
        evidence: Lifecycle verifies pass-rate basis points, median/P95, normalized Hotfix labels, repeated paths, heuristic category priority, exact merge-SHA correlation, truncated history, missing timestamps and missing changed-file counts.
  - boundary: report-workflow-authority-and-publication
    reason: Monthly Actions may collect read-only Actions/contents/PR metadata and publish a short-lived artifact, Job Summary and deduplicated Human-review Issue without any remediation authority.
    checks:
      <<: *shared
      security:
        applicable: true
        evidence: Static contract pins actions:read, contents:read, pull-requests:read and issues:write; forbidden contents/PR write, merge, release and code-mutation authority is rejected.
  - boundary: scenario-validation-and-documentation-closure
    reason: Scenario 201 has one lifecycle owner in repository validation and the Human/Agent docs plus documentation rules remain synchronized in canonical topic sections.
    checks:
      <<: *shared
      integration:
        applicable: true
        evidence: Full repository validator, scenario conformance inventory (201 total, 199 automated, 2 manual), documentation closure and placement preview.
status: READY
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
