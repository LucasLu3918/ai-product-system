change:
  id: opencode-native-context-guard-20261008
  summary: "Complete all eight approved OpenCode AIPS recommendations: task routing, exact session roots, native V2 context and permission hooks, semantic Shell limits, EPHEMERAL creative profiles, version-aware lifecycle, bounded performance and privacy trace."
  boundary:
    - prompt domain, intent, effect classification and Chinese creative-asset routing
    - Project Intelligence Context Manifest additive readiness and classification contract
    - OpenCode V2 native plugin lifecycle, ownership, version handling, recovery and capability truth
    - Session-scoped creative workspace discovery and safe non-overwrite output suggestions
    - Bounded context performance evidence and privacy-limited local execution trace
    - path/symlink/evidence/cache boundary and explicit Shell/MCP unsupported behavior
    - Scenario, documentation, architecture projections and exact-candidate publication evidence
matrix:
  - boundary: Prompt domain, intent, effect and creative asset routing
    reason: Read-only inspection, discussion, new asset creation and modification must select appropriate context and must not be conflated by keywords.
    checks:
      static_lint: {applicable: true, evidence: Pending exact candidate Gate}
      unit: {applicable: true, evidence: English/Traditional Chinese golden vectors including SVG read/chat/create/edit and negation}
      integration: {applicable: true, evidence: Turn Context lifecycle preserves legacy tuple/manifest keys and selects new dimensions}
      contract: {applicable: true, evidence: Additive context schema and legacy consumer compatibility}
      security: {applicable: true, evidence: Prompt is not persisted; quoted/untrusted text does not elevate action effect}
      migration_recovery: {applicable: false, na_reason: Additive derived fields; no persisted project schema}
      cli_harness: {applicable: true, evidence: intelligence context JSON/compact CLI output lifecycle}
      docs_schema: {applicable: true, evidence: Protocol routing, Scenario and schema validation}
      e2e: {applicable: true, evidence: Deterministic task-to-context route lifecycle; no model call required}
  - boundary: OpenCode V2 plugin context injection and native operation interception
    reason: Native plugin hooks change runtime context and supported tool action admission and need direct V2 acceptance evidence.
    checks:
      static_lint: {applicable: true, evidence: Pending exact candidate Gate and TypeScript/JS syntax validation}
      unit: {applicable: true, evidence: Hook selection, readiness decisions and native tool target extraction}
      integration: {applicable: true, evidence: Isolated V2 plugin install/load and hook lifecycle}
      contract: {applicable: true, evidence: Official V2 Plugin.define and hook payload compatibility}
      security: {applicable: true, evidence: Native direct-write allow/deny, root escape, symlink, stale readiness and plugin error cases; Shell/MCP limit assertions}
      migration_recovery: {applicable: true, evidence: Plugin install/update/uninstall conflict and interrupted ownership checkpoint}
      cli_harness: {applicable: true, evidence: Install/status/doctor/uninstall and detected V1/V2/unknown version}
      docs_schema: {applicable: true, evidence: Adapter compatibility, capability registry and documentation sync}
      e2e: {applicable: true, evidence: Locally installed OpenCode V2.0.24 isolated native CLI with loopback mock provider verifies AIPS Context delivery, creative SVG write ALLOW, existing SVG edit DENY, hook execution, MCP connection and no external provider use}
  - boundary: Readiness, path integrity, fingerprints and existing policy boundary
    reason: AIPS must reject affected writes when project context is missing/stale or target confinement is uncertain without inventing a local-write policy engine.
    checks:
      static_lint: {applicable: true, evidence: Pending exact candidate Gate}
      unit: {applicable: true, evidence: Path normalization, symlink escape, fingerprint invalidation, L0-L3 readiness mapping}
      integration: {applicable: true, evidence: Git and non-Git projects; missing/partial/stale manifest; cache replay/invalidation}
      contract: {applicable: true, evidence: Runtime policy external-action contract unchanged; Context Manifest additions backward compatible}
      security: {applicable: true, evidence: No path escape, prompt persistence or false protection claims; stale/error fail closed for supported operations}
      migration_recovery: {applicable: true, evidence: Cache corruption/failure recovers by recomputation and never upgrades readiness}
      cli_harness: {applicable: true, evidence: Harness diagnostics report plugin/readiness status and unsupported boundaries}
      docs_schema: {applicable: true, evidence: Security and recovery guidance matches implemented enforcement}
      e2e: {applicable: true, evidence: Non-Git isolated root, supported new creative asset ALLOW, existing asset DENY, symlink/root escape rejection and session-root hash bound to isolated workspace}
  - boundary: Lifecycle, adapter truth, conformance and documentation closure
    reason: Core runtime behavior must be installable, diagnosable, removable and accurately described across consumers.
    checks:
      static_lint: {applicable: true, evidence: Pending exact candidate Gate}
      unit: {applicable: false, na_reason: Covered by the focused classifier and plugin units above}
      integration: {applicable: true, evidence: Existing OpenCode ownership lifecycle plus expanded plugin lifecycle and conformance}
      contract: {applicable: true, evidence: Adapter registry, capability registry, generated projections and docs-placement contracts}
      security: {applicable: true, evidence: Exact-candidate strict secret scan over final tree and base..head history}
      migration_recovery: {applicable: true, evidence: Idempotent install, preserved user files, interruption, safe retry and uninstall}
      cli_harness: {applicable: true, evidence: Full harness lifecycle and exact-candidate local Integration Gate}
      docs_schema: {applicable: true, evidence: Scenario conformance, placement/sync, link checks and VitePress build}
      e2e: {applicable: true, evidence: Credential-free local loopback mock exercises native model/context/action flow; hosted providers and MCP write claims remain out of scope}
