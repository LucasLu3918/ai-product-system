version: 1

change:
  id: evidence-backed-impact-unknown-dispositions
  summary: Add evidence-backed Change Impact unknown dispositions while preserving fail-closed approval and exact READY reconciliation.
  boundary:
    - Change Impact schema and legacy compatibility
    - evidence and Human review validation
    - scoped traversal disposition validation
    - CLI/lifecycle and documentation contracts

matrix:
  - boundary: change-impact-disposition-schema
    reason: Structured disposition fields extend the canonical Change Impact contract.
    checks:
      static_lint: {applicable: true, evidence: py_compile of changed Python modules passed.}
      unit: {applicable: true, evidence: change_impact_resolution_contracts.py passed for all dispositions and rejection cases.}
      integration: {applicable: true, evidence: change_impact_resolution_lifecycle.py passed three CLI lifecycle cases.}
      contract: {applicable: true, evidence: static contract validates the canonical Change Impact template fields.}
      e2e: {applicable: false, na_reason: Offline artifact contract has no external runtime.}
      security: {applicable: true, evidence: tests reject stale hashes, out-of-root paths, invalid review, duplicate IDs and unsupported dispositions.}
      migration_recovery: {applicable: true, evidence: legacy string unknowns remain blocking; no persisted data migration occurs.}
      cli_harness: {applicable: true, evidence: impact-validate CLI accepts reviewed evidence and rejects legacy strings.}
      docs_schema: {applicable: true, evidence: static template and documentation sync/placement contracts passed.}

  - boundary: evidence-verification-and-legacy-fail-closed
    reason: Closed dispositions must cite current in-root evidence; legacy strings and malformed or stale evidence must remain blocking.
    checks:
      static_lint: {applicable: true, evidence: py_compile of changed Python modules passed.}
      unit: {applicable: true, evidence: contract tests cover legacy, open, malformed, stale, out-of-root and symlink evidence.}
      integration: {applicable: true, evidence: CLI lifecycle tests verify approved and rejected records.}
      contract: {applicable: true, evidence: validator requires in-root current SHA-256 and Human approval metadata.}
      e2e: {applicable: false, na_reason: Deterministic local artifact validation covers this boundary.}
      security: {applicable: true, evidence: symlink escape, parent traversal, stale file hash, stale traversal digest and scope mismatch are rejected.}
      migration_recovery: {applicable: true, evidence: old string entries are not migrated or treated as resolved.}
      cli_harness: {applicable: true, evidence: impact-validate CLI is exercised through the repository entry point.}
      docs_schema: {applicable: true, evidence: template, guidance, architecture, sync and placement contracts passed.}

  - boundary: traversal-scope-and-final-reconciliation
    reason: Scoped graph evidence must match recorded seeds without upgrading global coverage; READY must retain exact diff and node reconciliation.
    checks:
      static_lint: {applicable: true, evidence: py_compile of changed Python modules passed.}
      unit: {applicable: true, evidence: change_impact_traversal_lifecycle.py passed all 15 tests.}
      integration: {applicable: true, evidence: traversal report and exact READY reconciliation lifecycle regressions passed.}
      contract: {applicable: true, evidence: traversal contract and scoped coverage contract passed.}
      e2e: {applicable: false, na_reason: Traversal behavior is validated with deterministic repository fixtures.}
      security: {applicable: true, evidence: incomplete graph, scope mismatch, truncation and unresolved traversal evidence remain blocking.}
      migration_recovery: {applicable: true, evidence: READY retains base/head digest and exact changed-file reconciliation.}
      cli_harness: {applicable: true, evidence: impact-traverse CLI produced complete risk-adaptive evidence at two-hop depth.}
      docs_schema: {applicable: true, evidence: Scenario 175 traversal documentation and existing contract passed.}

  - boundary: documentation-scenario-and-repository-integration
    reason: Agent/Human instructions, architecture flow, scenario registry, and validation entry points must stay synchronized.
    checks:
      static_lint: {applicable: true, evidence: changed Python modules compile and documentation placement passes.}
      unit: {applicable: false, na_reason: No independent logic in documentation registry changes.}
      integration: {applicable: true, evidence: Scenario Conformance reports 179 of 179 scenarios passing.}
      contract: {applicable: true, evidence: static contracts plus documentation sync and placement contracts passed.}
      e2e: {applicable: false, na_reason: Documentation and registry contracts are deterministic.}
      security: {applicable: false, na_reason: No new execution or credential path.}
      migration_recovery: {applicable: false, na_reason: No persistent data migration.}
      cli_harness: {applicable: true, evidence: change impact CLI lifecycle suite passed.}
      docs_schema: {applicable: true, evidence: Scenario 179 registration and current Conformance inventory validate.}

