version: 1
change:
  id: plan12-core-modularization
  summary: Incrementally modularize the AIPS CLI, publication preflight, and repository
    validation while preserving all public and evidence contracts.
  boundary:
  - cli-entrypoint
  - publication-policy
  - validator-registry
matrix:
- boundary: cli-entrypoint
  reason: The public launcher resolves the owning checkout and forwards argv unchanged
    to the legacy command implementation.
  checks: &id001
    static_lint:
      applicable: true
      evidence: Ruff critical scan plus full repository validation.
    unit:
      applicable: true
      evidence: Deterministic publication policy tests and validator registry lifecycle
        contract.
    integration:
      applicable: true
      evidence: Publication preflight lifecycle, CLI launcher lifecycle, repository
        validator, and exact-candidate Integration Gate.
    contract:
      applicable: true
      evidence: Stable CLI argv/exit behavior, policy outputs, registry order and
        error aggregation, documentation and architecture bindings.
    e2e:
      applicable: true
      evidence: Source checkout and installed symlink lifecycle plus all remote required
        PR checks.
    security:
      applicable: true
      evidence: Mandatory candidate secret scan; preserve publication authorization
        boundary and required security validator registration.
    migration_recovery:
      applicable: false
      na_reason: No persistent data, schema, or user-owned state format changes.
    cli_harness:
      applicable: true
      evidence: Run public bin/aips from checkout and installed-path lifecycle, including
        symlink resolution and argument forwarding.
    docs_schema:
      applicable: true
      evidence: Documentation placement/sync, Architecture Surface and Repository
        Health validation, plus updated CLI and Gate documentation.
- boundary: publication-policy
  reason: Pure change-class, PR label, matrix applicability and documentation closure
    calculations move behind a dedicated policy module.
  checks: *id001
- boundary: validator-registry
  reason: The registry preserves 39 module imports, timing labels, explicit lifecycle
    ownership and seven-module error aggregation order.
  checks: *id001
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
candidate:
  base_sha: cd04056396af78904a0416409a5d4b5e180b2dca
  changed_files_hash: 4d973186665fb1e3a98f4158b4175e116ca65da377df80ddabf725148e7e2e4b
review_evidence:
  required: false
  path: .aips/review/INDEPENDENT_REVIEW_EVIDENCE.yaml
status: READY
