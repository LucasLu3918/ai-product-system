version: 1
change:
  id: pii-email-git-remote-20261020
  summary: Replace pii.email.v1 with pii.email.v2 so the exact `git` service user of scp-like and ssh:// Git remotes is
    not reported as an email, while every other address, personal remote user and confusable remains blocked, detection
    and redaction share one predicate, and PII exceptions stay impossible.
  boundary:
    - Email detection rule semantics (pii.email.v2)
    - Redaction parity for REDACT sinks
    - Commit Hook, diagnose and publication preview/plan consumers
    - Secret and exception invariants
    - Documentation and scenario closure
matrix:
  - boundary: Email detection rule semantics (pii.email.v2)
    reason: The rule blocks durable sinks; narrowing it must not let any non-remote address through.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff check on changed Python files; git diff --check clean."}
      unit: {applicable: true, evidence: "PASS: tests/test_content_safety.py 16 tests (new cases folded into existing methods); 17 hex Git remote samples ALLOW, 21 hex true-address samples BLOCK with rule_id pii.email.v2."}
      integration: {applicable: true, evidence: "PASS: tests/test_safety_diagnostics.py 17 tests and tests/test_publication_planning.py 30 tests."}
      contract: {applicable: true, evidence: "PASS: v1/v2 corpus comparison test; v1 flags all 38 samples, v2 flags only the 21 true-address samples."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: case variants, dotless-i confusable, personal scp user, ssh:// personal user, https userinfo, address adjacent to or inside a remote path, and combolist form stay blocked."}
      migration_recovery: {applicable: false, na_reason: No persistent data or configuration migration; rollback is a PR revert.}
      cli_harness: {applicable: true, evidence: "PASS: aips publish preview (core) content_safety PASS and documentation placement complete for the candidate."}
      docs_schema: {applicable: true, evidence: "PASS: Content Safety Boundary, Security Assurance and Scenario 266 describe the rule."}
  - boundary: Redaction parity for REDACT sinks
    reason: Detection and redaction previously used separate regex application; they must agree.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff check on changed Python files; git diff --check clean."}
      unit: {applicable: true, evidence: "PASS: runtime_log redacts the address and keeps the adjacent Git remote; a remote alone is ALLOW."}
      integration: {applicable: true, evidence: "PASS: safe_emit REDACT path shared by governance_audit, observable_event and project_intelligence callers."}
      contract: {applicable: true, evidence: "PASS: finding shape unchanged; values never emitted."}
