change:
  id: design5-creative-readiness
  summary: Align OpenCode creative configuration, improve local engine/readiness diagnostics, and add conservative Apple Silicon dtype guidance.
  boundary:
    - OpenCode configure schema parity with the shared executor
    - MFLUX command/version and model readiness diagnostics
    - Fixed-loopback ComfyUI read-only discovery
    - Apple Silicon FP8 static warning and inference status
    - Scenario 236, Human docs, changelog/version and exact-candidate publication
    - CI full Python interpreter handoff for isolated CLI validation fixtures
    - Regression contract for validate workflow interpreter selection and ordering
    - Required Security Assurance and Core/CI protocol documentation closure
matrix:
  - boundary: OpenCode creative configuration contract
    reason: Agents must be able to pass every supported Z-Image Turbo setting while unknown fields remain rejected.
    checks:
      static_lint: {applicable: true, evidence: TypeScript syntax and repository validator}
      unit: {applicable: true, evidence: Schema allowlist parity for model_profile/unet_name/clip_name/vae_name}
      integration: {applicable: true, evidence: Native creative tool callback fixture accepts the four fields}
      contract: {applicable: true, evidence: additionalProperties false and unknown-field negative case}
      e2e: {applicable: true, evidence: End-to-end tool-to-configure fixture; no model inference}
      security: {applicable: true, evidence: Existing allowlist, path confinement and no-download invariants}
      migration_recovery: {applicable: false, na_reason: Optional additive tool schema fields; Bundle v1 remains unchanged}
      cli_harness: {applicable: true, evidence: OpenCode plugin lifecycle and creative CLI adapter}
      docs_schema: {applicable: true, evidence: Canonical schema/documentation impact checks}
  - boundary: Local engine and staged readiness diagnostics
    reason: Command discovery, version probes, configured model inventory, static preflight and real inference are distinct evidence levels.
    checks:
      static_lint: {applicable: true, evidence: Creative execution contracts and repository lint}
      unit: {applicable: true, evidence: Missing command, version timeout/nonzero/empty, ComfyUI unreachable/malformed, model missing and stage status cases}
      integration: {applicable: true, evidence: Fake MFLUX and local loopback ComfyUI fixture; no workflow submission during discover}
      contract: {applicable: true, evidence: Additive provider diagnostics and stable existing reason codes}
      e2e: {applicable: true, evidence: Synthetic discover/configure/preflight/execute fixture; actual inference remains separately UNVERIFIED}
      security: {applicable: true, evidence: Only fixed 127.0.0.1:8188 GET probes, bounded responses/timeouts, no redirects/proxies/downloads}
      migration_recovery: {applicable: false, na_reason: No persisted engine state or Bundle migration}
      cli_harness: {applicable: true, evidence: aips creative discover/preflight results consumed by OpenCode}
      docs_schema: {applicable: true, evidence: Engine recovery guidance and readiness states}
  - boundary: Apple Silicon dtype compatibility guidance
    reason: FP8 dtype failures are backend/runtime specific; static evidence must be conservative and never claim inference readiness.
    checks:
      static_lint: {applicable: true, evidence: Creative contracts and repository validation}
      unit: {applicable: true, evidence: Apple Silicon FP8, FP16/BF16, explicit compatible, and unknown metadata cases}
      integration: {applicable: true, evidence: Dtype evidence flows from configured workflow into preflight warning}
      contract: {applicable: true, evidence: Stable status/warning schema and INFERENCE_VERIFIED remains absent without execution evidence}
      e2e: {applicable: true, evidence: Deterministic fixture only; hardware/model inference is not run by CI}
      security: {applicable: true, evidence: No model file content or absolute local path emitted}
      migration_recovery: {applicable: false, na_reason: No stored compatibility decisions}
      cli_harness: {applicable: true, evidence: Preflight CLI status surfaced without implying successful generation}
      docs_schema: {applicable: true, evidence: Apple Silicon troubleshooting wording and dated source check}
  - boundary: Existing multi-item recovery and publication
    reason: New diagnostics must preserve create-only output and hash-verified generate-set resume while the exact Core candidate passes repository gates.
    checks:
      static_lint: {applicable: true, evidence: Changed Python/TypeScript lint and repository validator}
      unit: {applicable: true, evidence: Existing two-item partial failure and resume regression}
      integration: {applicable: true, evidence: creative_execution_lifecycle and creative_generate_set_lifecycle}
      contract: {applicable: true, evidence: Existing Bundle v1, manifest/trace and generate-set CLI contracts}
      e2e: {applicable: true, evidence: Synthetic multi-item execution; real model output remains UNVERIFIED}
      security: {applicable: true, evidence: No overwrite, prompt/secret/path leakage, downloads or non-loopback egress}
      migration_recovery: {applicable: true, evidence: Resume skips only verified prior outputs}
      cli_harness: {applicable: true, evidence: CLI and OpenCode lifecycle}
      docs_schema: {applicable: true, evidence: Scenario 236, architecture, User Guide and Conformance}
  - boundary: Documentation, version metadata and exact-candidate publication
    reason: Core changes require canonical doc closure, a candidate-bound matrix, strict secret scanning, full local Gate, required PR checks and main reconciliation.
    checks:
      static_lint: {applicable: true, evidence: Documentation validators and complete repository validator}
      unit: {applicable: true, evidence: Scenario/conformance and generated capability projection checks}
      integration: {applicable: true, evidence: Python 3.12 exact-candidate Core Integration Gate}
      contract: {applicable: true, evidence: Change Impact, matrix base/hash and exact file list reconcile}
      e2e: {applicable: true, evidence: Required repository aggregate on PR and successful main checks after merge}
      security: {applicable: true, evidence: Credential-free strict scan of final tree and base..head history}
      migration_recovery: {applicable: false, na_reason: No durable data or schema migration}
      cli_harness: {applicable: true, evidence: Publication environment, preflight and Integration Gate}
      docs_schema: {applicable: true, evidence: Documentation closure/build and architecture impact check}
