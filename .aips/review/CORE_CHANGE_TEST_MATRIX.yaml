- boundary: public-cli-help-errors
  reason: Public command groups need predictable success help and useful nonzero errors
    without converting internal libraries into CLI parsers.
  checks:
    static_lint:
      applicable: true
      evidence: The existing quality ratchet covers the changed shell and Python surfaces.
    unit:
      applicable: true
      evidence: Static contracts assert status and diagnostic snapshots for help and
        unknown-command routes.
    integration:
      applicable: true
      evidence: Full repository validation runs the CLI snapshots through the actual
        bin/aips launcher.
    contract:
      applicable: true
      evidence: Scenario 233 records group usage and error-exit semantics.
    security:
      applicable: true
      evidence: Unknown commands fail closed; help routes grant no additional operation
        authority.
    migration_recovery:
      applicable: false
      na_reason: No persisted state changes.
    cli_harness:
      applicable: true
      evidence: Actual shell, harness, MCP, project, system and evolution group commands
        are exercised.
    docs_schema:
      applicable: true
      evidence: Human and Agent Conformance define the stable help/error behavior.
    e2e:
      applicable: false
      na_reason: These contracts are CLI entrypoint-level and do not call external
        services.
- boundary: batched-documentation-diff
  reason: Placement audit batches Git operations while preserving exact per-file added-line
    decisions.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff passes for the placement implementation and its contract module.
    unit:
      applicable: true
      evidence: The temporary Git fixture compares old and batched results for tracked,
        untracked and space-containing paths.
    integration:
      applicable: true
      evidence: Full documentation placement audit passes against the working tree.
    contract:
      applicable: true
      evidence: Existing single-file helper remains available; untracked files retain
        whole-file line coverage.
    security:
      applicable: true
      evidence: Source paths remain explicit Git pathspec arguments and authoritative
        hashes are untouched.
    migration_recovery:
      applicable: false
      na_reason: The placement check reads repository files only.
    cli_harness:
      applicable: false
      na_reason: No public CLI surface changes.
    docs_schema:
      applicable: true
      evidence: No placement policy or documentation output contract changed.
    e2e:
      applicable: false
      na_reason: The bounded synthetic benchmark measures the same placement path
        at three repository sizes.
- boundary: advisory-security-inventory
  reason: Scheduled supply-chain inventory and Gitleaks shadow outcomes add supplementary
    evidence without changing release authority.
  checks:
    static_lint:
      applicable: true
      evidence: YAML parsing and security_workflow_contracts.py pass for the pinned
        workflow and permission controls.
    unit:
      applicable: true
      evidence: Scenario Conformance checks the workflow triggers, advisory behavior
        and evidence registry.
    integration:
      applicable: true
      evidence: Full repository validation and exact-candidate Integration Gate remain
        required before publication.
    contract:
      applicable: true
      evidence: Workflow contract pins the OSV reusable workflow and Gitleaks action,
        with scheduled/manual triggers only.
    security:
      applicable: true
      evidence: Scanner outcomes are nonblocking; comments and Gitleaks artifacts
        are disabled; permissions are narrowly scoped.
    migration_recovery:
      applicable: false
      na_reason: No repository or external state is changed by the scheduled observations.
    cli_harness:
      applicable: false
      na_reason: No CLI or runtime hook changes.
    docs_schema:
      applicable: true
      evidence: Maintenance, Security Assurance, Technology Guide and Scenario 231
        document the advisory boundary.
    e2e:
      applicable: false
      na_reason: The workflow is supplementary observation; required secret scan and
        repository Gate are retained.
- boundary: generated-cli-system-facts-and-scoped-impact-proposal
  reason: Canonical command facts and their generated reference table must cover the
    new project/system routes, while source-backed Impact Graph candidates remain a
    review-only proposal and repository-wide coverage stays partial.
  checks:
    static_lint:
      applicable: true
      evidence: system_facts.py --check and system_facts_contracts pass; YAML facts
        bind each route to its lifecycle validator and canonical documentation.
    unit:
      applicable: true
      evidence: install_preflight_lifecycle.py covers read-only project status,
        invalid paths and canonical preflight compatibility.
    integration:
      applicable: true
      evidence: The final exact-candidate Integration Gate runs repository validation
        and the core boundary matrix.
    contract:
      applicable: true
      evidence: Generated SYSTEM_REFERENCE lists project check, system preflight,
        and the legacy preflight alias from config/system-facts.yaml.
    security:
      applicable: true
      evidence: project check remains read-only; the graph proposal does not modify
        canonical graph data or upgrade global coverage.
    migration_recovery:
      applicable: false
      na_reason: The command inventory and proposal do not migrate persistent data.
    cli_harness:
      applicable: true
      evidence: Existing CLI routing and lifecycle evidence cover both namespaced
        commands and the compatibility alias.
    docs_schema:
      applicable: true
      evidence: INSTALLATION and GETTING_STARTED bind the routes; SYSTEM_REFERENCE
        generated facts are kept in sync; the scoped graph proposal records exact
        source-line evidence and pending Human review.
    e2e:
      applicable: false
      na_reason: The routes are validated by isolated lifecycle fixtures and local
        repository checks without external project mutation.
