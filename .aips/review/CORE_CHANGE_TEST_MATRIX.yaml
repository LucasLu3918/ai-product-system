    reason: A supported OpenCode host must demonstrate its version-bound native path while mock-model acceptance remains distinct from real generation and other hosts remain unverified.
    checks:
      static_lint: {applicable: true, evidence: Repository validation.}
      unit: {applicable: true, evidence: Native acceptance contract and host version allowlist.}
