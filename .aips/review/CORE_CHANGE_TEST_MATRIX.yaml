version: 1
change:
  id: validation-timing-optimization
  summary: Measure repository validation bottlenecks and avoid redundant local full
    validation without reducing required CI coverage.
  boundary:
  - repository-validator-contracts
  - local-and-ci-timing-artifacts
  - publication-and-documentation-closure
matrix:
- boundary: repository-validator-contracts
  reason: Contract imports and lifecycle subprocesses must keep their order, failure
    propagation and scenario coverage while recording durations.
  checks:
    static_lint:
      applicable: true
      evidence: Python compile and Ruff critical lint for the validator.
    unit:
      applicable: true
      evidence: Existing contract modules run through the unchanged repository entrypoint.
    integration:
      applicable: true
      evidence: Exact-candidate Gate runs repository-validation on the full candidate.
    contract:
      applicable: true
      evidence: PASS or FAIL and 197 scenario inventory remain unchanged; timing JSON
        contains check names
      statuses and durations.: null
    e2e:
      applicable: false
      na_reason: No deployed application behavior changes.
    security:
      applicable: true
      evidence: Timing report excludes captured test output and secrets; mandatory
        candidate secret scans remain required.
    migration_recovery:
      applicable: false
      na_reason: Optional ephemeral timing artifact has no stored schema migration.
    cli_harness:
      applicable: true
      evidence: Standalone validator and Publication Preflight retain their existing
        exit semantics.
    docs_schema:
      applicable: true
      evidence: Human and Agent documentation describe Gate inclusion and timing output.
- boundary: local-and-ci-timing-artifacts
  reason: The local wrapper and GitHub Actions must publish the same diagnostic report
    while preserving full PR and main Gate runs.
  checks:
    static_lint:
      applicable: true
      evidence: Python compile and workflow YAML parse.
    unit:
      applicable: true
      evidence: Wrapper output path and CI artifact configuration are checked against
        the validator report contract.
    integration:
      applicable: true
      evidence: Local exact-candidate Gate and PR CI produce parseable timing reports.
    contract:
      applicable: true
      evidence: Gate PASS remains required for the repository aggregate; missing optional
        artifact cannot masquerade as PASS.
    e2e:
      applicable: true
      evidence: PR and post-merge main CI each run the complete Gate.
    security:
      applicable: true
      evidence: Reports contain no test output or secrets and use short artifact retention.
    migration_recovery:
      applicable: false
      na_reason: Runner temporary artifacts expire; no persistent migration.
    cli_harness:
      applicable: true
      evidence: prepare-local-validation selects the prepared venv and writes beside
        its Gate report.
    docs_schema:
      applicable: true
      evidence: Maintenance and Integration Gate docs explain the single local full-run
        path.
- boundary: publication-and-documentation-closure
  reason: Core CI changes must retain publication identity, matrix binding, documentation
    placement and remote merge checks.
  checks:
    static_lint:
      applicable: true
      evidence: Git diff check and critical Ruff lint.
    unit:
      applicable: true
      evidence: Publication preflight and documentation contracts run in repository
        validation.
    integration:
      applicable: true
      evidence: Exact-candidate preflight checks matrix binding
      documentation impact and Gate status.: null
    contract:
      applicable: true
      evidence: Workflow still requires janitor success through the repository aggregate.
    e2e:
      applicable: true
      evidence: PR and main checks verify separate commit identities after merge.
    security:
      applicable: true
      evidence: Candidate secret scans run before dependencies and within the Gate.
    migration_recovery:
      applicable: false
      na_reason: No persisted product state changes.
    cli_harness:
      applicable: true
      evidence: Publication preview
      plan and post-merge reconciliation use existing commands.: null
    docs_schema:
      applicable: true
      evidence: Recursive documentation placement
      changed Markdown links and VitePress build pass.: null
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
candidate:
  base_sha: 2201223e82a7f90b3929ad72374fb6c287286f8e
  changed_files_hash: 31090df99db151799b4bd55b78dc963597214dd6708685b4a627e4f5b05e0765
review_evidence:
  required: false
  path: .aips/review/INDEPENDENT_REVIEW_EVIDENCE.yaml
status: READY
