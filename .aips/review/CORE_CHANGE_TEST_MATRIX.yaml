version: 1
change:
  id: documentation-sync-dot-prefix-20261020
  summary: Documentation Sync removes only a single leading "./" from changed paths instead of lstrip("./"), so every
    .github/** trigger in config/documentation-sync.yaml is enforced; pure dependency updates stay exempt through
    evaluate_candidate.
  boundary:
    - Documentation Sync path normalization
    - Repository preflight documentation consistency
    - Repository delivery and documentation closure
matrix:
  - boundary: Documentation Sync path normalization
    reason: evaluate_changes normalized with lstrip("./"), stripping the leading dot of .github/** and disabling the
      Technology Guide and rule-specific workflow triggers.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff reports only the 4 pre-existing findings (EXE001, I001, PLW1510 x2) on unchanged lines; git diff --check clean."}
      unit: {applicable: true, evidence: "PASS: contracts assert .github/workflows/evolution-radar.yml requires the Technology Guide and evolution-radar docs, ./-prefixed complete update passes, and .github/workflows/docs-site.yml triggers documentation-platform."}
      integration: {applicable: true, evidence: "PASS: documentation_sync.py --files .github/workflows/docs-site.yml returns valid false with Technology Guide and documentation-platform errors; the base (172128e8..3832eab9) evaluator returns valid true for the same input."}
      contract: {applicable: true, evidence: "PASS: validation.documentation_sync_contracts reports no documentation sync errors."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: fail-closed direction only; the pure dependency exemption and its equality guard are unchanged."}
      migration_recovery: {applicable: false, na_reason: "No persistent state; rollback is reverting one line."}
      cli_harness: {applicable: true, evidence: "PASS: documentation_sync.py CLI --files and --base-ref modes."}
      docs_schema: {applicable: true, evidence: "PASS: DOCUMENTATION_SYNC (Human and Agent), TECHNOLOGY_GUIDE, DOCUMENTATION_MAP and Scenario 221 describe the normalization."}
  - boundary: Repository preflight documentation consistency
    reason: repository_preflight inherits the stricter evaluator; Dependabot workflow PRs must remain exempt.
    checks:
      static_lint: {applicable: false, na_reason: repository_preflight.py is unchanged.}
      unit: {applicable: false, na_reason: Covered by the normalization contracts.}
      integration: {applicable: true, evidence: "PASS: repository_preflight.py --base origin/main (3832eab9) on real heads #340 af8ad73a, #339 c3366418, #337 6fd260b7, #259 4784e68c: REPOSITORY PREFLIGHT PASSED; documentation_sync.py --base-ref on those plus #263 #262 #261 #260 #168 reports PURE_DEPENDENCY_UPDATE with 0 errors."}
      contract: {applicable: true, evidence: "PASS: --base/--head contract unchanged."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: Human workflow-only edits now require the mapped documents instead of passing silently."}
      migration_recovery: {applicable: false, na_reason: Revert-only.}
      cli_harness: {applicable: true, evidence: "PASS: repository_preflight.py CLI on four real PR heads."}
      docs_schema: {applicable: false, na_reason: Covered by the normalization boundary.}
  - boundary: Repository delivery and documentation closure
    reason: The change touches the Documentation Sync gate and must pass the full local Gate.
    checks:
      static_lint: {applicable: true, evidence: "PASS: full local Integration Gate static stage."}
      unit: {applicable: true, evidence: "PASS: focused suites inside the full Gate run."}
      integration: {applicable: true, evidence: "PASS: publish_preflight.py run on the exact committed candidate."}
      contract: {applicable: true, evidence: "PASS: candidate documentation sync clean for its own changed files (0 errors with the fixed evaluator)."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: candidate secret scan and content safety inside the Gate."}
      migration_recovery: {applicable: false, na_reason: Rollback is a PR revert.}
      cli_harness: {applicable: true, evidence: "PASS: publish_preflight.py run CLI."}
      docs_schema: {applicable: true, evidence: "PASS: Documentation Placement audit clean."}
