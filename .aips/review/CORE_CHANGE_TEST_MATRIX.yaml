change:
  id: creative-workflow-continuity
  summary: Fix Chinese illustration intent, bounded OpenCode clarification continuity, local engine diagnostics and recovery guidance by extending existing creative execution capabilities.
  boundary:
    - Creative intent and output-budget contract
    - OpenCode session-bound creative prompt admission, clarification continuation and revocation
    - Local image-engine discovery, compatibility status and reason-specific recovery
    - Existing multi-item Creative generate-set workflow and partial recovery
    - Creative workflow documentation, diagrams and exact-candidate publication
matrix:
  - boundary: Creative intent and output-budget contract
    reason: Chinese intent routing and output-count calculation determine which local creative actions and item counts can be admitted.
    checks:
      static_lint: {applicable: true, evidence: scripts/turn_intent.py and scripts/creative_request_policy.py validation}
      unit: {applicable: true, evidence: Original three prompts, 立繪 synonyms, one/two-role counts, ambiguous and over-budget cases}
      integration: {applicable: true, evidence: tests/evidence/creative_request_policy_lifecycle.py}
      contract: {applicable: true, evidence: Preserve existing intent fields, action decisions and maximum output limit}
      e2e: {applicable: true, evidence: AIPS policy invocation from the original Chinese conversation}
      security: {applicable: true, evidence: User-only source, cancellation and scope-expansion negative cases}
      migration_recovery: {applicable: false, na_reason: No durable authorization or user data schema}
      cli_harness: {applicable: true, evidence: creative request policy CLI input/output and OpenCode caller}
      docs_schema: {applicable: true, evidence: Creative direction and relevant scenario/documentation contracts}
  - boundary: OpenCode session-bound authorization lifecycle
    reason: A constrained continuation can affect filesystem mutation and must bind the current user response to one active Session and bounded task.
    checks:
      static_lint: {applicable: true, evidence: TypeScript plugin contracts and repository validator}
      unit: {applicable: true, evidence: Fresh grants, bounded selections, cancellation, unrelated requests, session/root drift, concurrency and expiry}
      integration: {applicable: true, evidence: Native tool harness and tests/evidence/opencode_integration_lifecycle.py}
      contract: {applicable: true, evidence: Preserve tool schema, reason codes, current Session root binding and direct allow/deny behavior}
      e2e: {applicable: true, evidence: Native OpenCode v2.0.24 acceptance verified grant admission/revocation; no image generation was executed}
      security: {applicable: true, evidence: No transcript-only grants, no prompt persistence, no unauthorized execute, no cross-session reuse}
      migration_recovery: {applicable: false, na_reason: Session state remains ephemeral and is discarded on restart}
      cli_harness: {applicable: true, evidence: OpenCode plugin lifecycle and host discovery/version result}
      docs_schema: {applicable: true, evidence: OpenCode adapter guidance and current conversation scenario}
  - boundary: Local creative engine diagnostics and recovery
    reason: Health and static compatibility diagnostics must not imply inference readiness, download weights, or silently change output medium/provider.
    checks:
      static_lint: {applicable: true, evidence: Creative execution validation and repository validator}
      unit: {applicable: true, evidence: Missing command, probe timeout/failure, version parse, local capability, dtype compatibility and UNVERIFIED outcomes}
      integration: {applicable: true, evidence: Fake MFLUX and loopback ComfyUI discovery/preflight lifecycle}
      contract: {applicable: true, evidence: Additive diagnostics; preserve Bundle/provider schemas and existing reason codes}
      e2e: {applicable: true, evidence: No real local weights assumed; inference and image quality remain UNVERIFIED unless explicitly available}
      security: {applicable: true, evidence: No downloads, cloud fallback, prompt/image trace, or non-loopback image egress}
      migration_recovery: {applicable: false, na_reason: No engine configuration migration}
      cli_harness: {applicable: true, evidence: aips creative discover/preflight and OpenCode diagnostic result}
      docs_schema: {applicable: true, evidence: Diagnostics and recovery guidance}
  - boundary: Existing multi-item workflow and recovery
    reason: Multi-role generation must respect the admitted total budget and preserve successful output when another item fails.
    checks:
      static_lint: {applicable: true, evidence: Generate-set validators and repository checks}
      unit: {applicable: true, evidence: Item count cap, stable IDs, per-item failure and hash-verified resume}
      integration: {applicable: true, evidence: tests/evidence/creative_generate_set_lifecycle.py and creative execution lifecycle}
      contract: {applicable: true, evidence: Existing manifest format and generate-set CLI remain compatible}
      e2e: {applicable: true, evidence: Synthetic two-Bundle run with one failure; real inference separately UNVERIFIED}
      security: {applicable: true, evidence: No overwrite, no scope traversal, no budget bypass}
      migration_recovery: {applicable: true, evidence: Interrupted/partial set resume only when saved hashes match}
      cli_harness: {applicable: true, evidence: Creative generate-set and OpenCode multi-item invocation}
      docs_schema: {applicable: true, evidence: Multi-character workflow and recovery documentation}
  - boundary: Documentation, architecture and exact-candidate publication
    reason: Behavior changes affect user guidance and must be reviewed against the exact base/head, complete file set and required checks.
    checks:
      static_lint: {applicable: true, evidence: Documentation validators and full repository validation}
      unit: {applicable: true, evidence: Scenario/conformance coverage and generated capability projections if affected}
      integration: {applicable: true, evidence: Documentation impact plus exact-candidate Integration Gate}
      contract: {applicable: true, evidence: Impact record and matrix changed-file digest reconcile with actual diff}
      e2e: {applicable: true, evidence: PR required aggregate on exact candidate; remote main checks after merge}
      security: {applicable: true, evidence: Mandatory candidate and history secret scanning; no credentials added}
      migration_recovery: {applicable: false, na_reason: No persistent project/user data migration}
      cli_harness: {applicable: true, evidence: Python 3.12 local publication preflight and Integration Gate}
      docs_schema: {applicable: true, evidence: Markdown links, docs build, canonical placement and architecture diagram impact check}
