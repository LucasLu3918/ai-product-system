version: 1

candidate:
  base_sha: e6213aa0334f3ef8f8f20dda7d0157d14c18189c
  changed_files_hash: 7f11c2cc5a91100c5a37741a66e1b1223214a5645ed56a0ee24bf06d4564e678

change:
  id: candidate-browser-preflight-hardening
  summary: Harden exact-candidate publication preflight and classify browser startup failures as environment blockers while preferring managed Chromium for visual evidence.
  boundary:
    - exact-candidate-and-matrix-binding
    - documentation-impact-and-placement
    - browser-discovery-and-smoke-probe
    - visual-and-creative-lifecycle

matrix:
  - boundary: exact-candidate-and-matrix-binding
    reason: Publication preflight must reject dirty worktrees, stale base tips, mismatched HEADs and stale changed-files hashes before lifecycle checks.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation and Ruff critical checks"}
      unit: {applicable: true, evidence: "Publication preflight lifecycle"}
      integration: {applicable: true, evidence: "Exact-candidate Integration Gate"}
      contract: {applicable: true, evidence: "Integration Gate candidate and matrix binding"}
      e2e: {applicable: false, na_reason: "No product browser flow is changed by candidate binding"}
      security: {applicable: true, evidence: "No authority is granted by preflight evidence"}
      migration_recovery: {applicable: false, na_reason: "No persisted data migration"}
      cli_harness: {applicable: true, evidence: "publish preflight plan/run CLI"}
      docs_schema: {applicable: true, evidence: "Candidate and publication protocol documentation"}
  - boundary: documentation-impact-and-placement
    reason: Documentation config and publication behavior must close recursive sync and canonical placement before the expensive Gate.
    checks:
      static_lint: {applicable: true, evidence: "Documentation sync and placement contracts"}
      unit: {applicable: false, na_reason: "Contract validators cover deterministic documentation behavior"}
      integration: {applicable: true, evidence: "Repository preflight documentation closure"}
      contract: {applicable: true, evidence: "Documentation Map, Sync and Agent protocol updates"}
      e2e: {applicable: true, evidence: "Docs site build where available"}
      security: {applicable: false, na_reason: "No credential boundary"}
      migration_recovery: {applicable: false, na_reason: "Additive documentation contract"}
      cli_harness: {applicable: true, evidence: "aips docs impact and publish preflight"}
      docs_schema: {applicable: true, evidence: "Canonical placement configuration"}
  - boundary: browser-discovery-and-smoke-probe
    reason: System Chrome can abort in macOS HIServices/LaunchServices before a page exists; existence checks are insufficient.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation and Ruff critical checks"}
      unit: {applicable: true, evidence: "Missing-browser and launch-failure classification assertions"}
      integration: {applicable: true, evidence: "Version and isolated-profile headless smoke probe"}
      contract: {applicable: true, evidence: "READY and ENVIRONMENT_BLOCKED result contract"}
      e2e: {applicable: true, evidence: "Visual lifecycle when browser prerequisite is READY"}
      security: {applicable: true, evidence: "Temporary browser profile and no persisted credentials"}
      migration_recovery: {applicable: false, na_reason: "No persisted browser state"}
      cli_harness: {applicable: true, evidence: "publish preflight environment report"}
      docs_schema: {applicable: true, evidence: "Browser provider and environment blocker documentation"}
  - boundary: visual-and-creative-lifecycle
    reason: Visual and creative evidence must share browser provider selection and distinguish environment failure from product regression.
    checks:
      static_lint: {applicable: true, evidence: "Lifecycle syntax and critical Ruff checks"}
      unit: {applicable: true, evidence: "Visual and creative contract validators"}
      integration: {applicable: true, evidence: "Rendered lifecycle evidence when browser is available"}
      contract: {applicable: true, evidence: "ENVIRONMENT_BLOCKED lifecycle classification"}
      e2e: {applicable: true, evidence: "Playwright managed Chromium or explicit system browser"}
      security: {applicable: false, na_reason: "No protected operation or credential flow"}
      migration_recovery: {applicable: false, na_reason: "Evidence artifacts are temporary"}
      cli_harness: {applicable: false, na_reason: "No new CLI command"}
      docs_schema: {applicable: true, evidence: "Visual evidence provider documentation"}

scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
status: READY
