      applicable: true
      evidence: 'PENDING: Markdown, Python and repository validators on the exact candidate.'
    unit:
      applicable: true
      evidence: 'PASS: hook test asserts denial, diagnostic identifier/phase, allowlisted context and no command
        input.'
    integration:
      applicable: true
      evidence: 'PENDING: Hook envelope lifecycle and runtime adapter conformance.'
    contract:
      applicable: true
      evidence: 'PASS: Claude Code PreToolUse envelope remains native and denied actions stay denied.'
    e2e:
      applicable: false
      na_reason: No deployed UI acceptance claim; host-level acceptance availability is recorded separately.
    security:
      applicable: true
      evidence: 'PASS: Hook output is allowlisted, excludes raw commands/args/credentials and declares authorized=false/executed=false.'
    migration_recovery:
      applicable: false
      na_reason: No persisted schema, diagnostic history or migration is added.
    cli_harness:
      applicable: true
      evidence: 'PASS: native Hook denial contract and user-facing reason are covered by focused tests.'
    docs_schema:
      applicable: true
      evidence: 'PENDING: close exact docs impact, placement, sync, VitePress, and Scenario 260/261.'
