change:
  id: autonomous-m4a-publication-20261012
  summary: Enable validated Claude task-authorized auto-merge and safe M4A publication.
  boundary:
    - Permit only exact, explicitly task-authorized Claude `gh pr merge --auto` after all existing live PR/base/head/required-check and content checks pass; retain ordinary Claude and Gemini per-call confirmation.
    - Validate `.m4a` ISO BMFF structure before binary treatment; scan disguised text and selected metadata; preserve staged scanning and the 8 MiB hard limit with useful audio diagnostics.
    - Update the existing scenario, tests and canonical publication/security documentation; no new authority service, role, skill, or Constitution change.
