change:
  id: p16-08-validation-observation-dependencies
  summary: Install the pinned PyYAML dependency required by the 30-day Validation Observation Collector and assert its workflow contract. Keep collection read-only, full-run shadow non-selective, and full repository validation required.
  boundary:
  - The manual/scheduled collector installs PyYAML from constraints/tested.txt before importing validation_observation.py.
  - Workflow permission, observation schema, retention, and graduation rules remain unchanged.
  - Missing or failed collection evidence remains NOT_READY; it cannot enable selective test execution or weaken the required full repository Gate.
