version: 1
candidate:
  base_sha: 7cf7d36b47ae196a896c8ac8f93c6eab0383824f
  changed_files_hash: f20945a9668eeaad41cabca4f6b44fe420b96ae171858138b126480daa6b6160
change:
  id: evolution-local-deterministic-preanalysis
  summary: Add a credential-free deterministic first-pass Evolution Radar triage lane for near-duplicate grouping, topic/capability hints, and Human review priority without inferring semantic suitability.
  boundary:
    - evolution-radar
    - deterministic-preanalysis
    - human-review-evidence
    - provider-neutrality
    - scenario-conformance
    - documentation
matrix:
  - boundary: deterministic-preanalysis
    reason: The local lane must be reproducible, credential-free, network-free, bound to exact evidence/config/capability inputs, and incapable of emitting semantic adoption states.
    checks:
      static_lint: {applicable: true, evidence: "evolution_analysis.py and config/evolution-analyzer.yaml are compiled/contract-checked by repository validation"}
      unit: {applicable: true, evidence: "Evolution Radar lifecycle validates rule configuration, deterministic repeated output, tamper rejection, and semantic-state preservation"}
      integration: {applicable: true, evidence: "weekly/monthly Radar evidence flows through local preanalysis before optional semantic analysis"}
      contract: {applicable: true, evidence: "Scenario 146 requires semantic_suitability_inferred=false, recommendation_state_mutated=false, no credential and no extra network"}
      e2e: {applicable: true, evidence: "lifecycle evidence builds preanalysis, round-trips durable markdown, and embeds it into the Human review Issue"}
      security: {applicable: true, evidence: "preanalysis reads only collected evidence, committed rules and Capability Map; it has no provider credential or additional network path"}
      migration_recovery: {applicable: true, evidence: "provider-neutral handoff and optional semantic analyzer remain unchanged as the next analysis layer"}
      cli_harness: {applicable: false, na_reason: "No Runtime/Harness execution path changes"}
      docs_schema: {applicable: true, evidence: "Evolution Radar Human/Agent docs, overview, Technology Guide and Conformance are synchronized"}
  - boundary: human-review-priority
    reason: HIGH/MEDIUM/LOW is only a deterministic reading-order hint and must never be interpreted as COVERED/HOLD/ASSESS/TRIAL/ADOPT or Human approval.
    checks:
      static_lint: {applicable: true, evidence: "preanalysis annotations reject state/decision/recommendation fields"}
      unit: {applicable: true, evidence: "tampered semantic_suitability_inferred=true evidence is rejected"}
      integration: {applicable: true, evidence: "Human review Issue carries both deterministic preanalysis and separate provider-neutral semantic handoff"}
      contract: {applicable: true, evidence: "semantic recommendation remains ANALYSIS_PENDING through the local-preanalysis lifecycle"}
      e2e: {applicable: true, evidence: "same evidence/config/capability inputs produce byte-equivalent data structures before serialization"}
      security: {applicable: true, evidence: "all Human/branch/PR/merge/release/publication authority flags remain false"}
      migration_recovery: {applicable: true, evidence: "removing/altering local rules cannot silently convert preanalysis into semantic decisions because validation binds mode and preserved state"}
      cli_harness: {applicable: false, na_reason: "No CLI/Harness permission surface changes"}
      docs_schema: {applicable: true, evidence: "docs explicitly define priority as Human review ordering rather than adoption scoring"}
  - boundary: near-duplicate-and-capability-hints
    reason: Local heuristics must stay explainable and reference only existing source-controlled capability IDs.
    checks:
      static_lint: {applicable: true, evidence: "configured category capability_ids are validated against CAPABILITY_MAP.yaml"}
      unit: {applicable: true, evidence: "fixture titles prove deterministic token/Jaccard clustering and declared capability matching"}
      integration: {applicable: true, evidence: "preanalysis baseline binds the Capability Map digest and local config digest"}
      contract: {applicable: true, evidence: "unknown capability IDs and invalid thresholds fail validation"}
      e2e: {applicable: false, na_reason: "No external semantic or provider execution is required for deterministic title heuristics"}
      security: {applicable: true, evidence: "no raw provider payload, secret, private reasoning or external content fetch is added"}
      migration_recovery: {applicable: true, evidence: "Capability Map changes invalidate prior preanalysis bindings through digest mismatch"}
      cli_harness: {applicable: false, na_reason: "No runtime adapter behavior changes"}
      docs_schema: {applicable: true, evidence: "Scenario 146 and Evolution Radar docs explain the bounded heuristic semantics"}
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
status: PASS
