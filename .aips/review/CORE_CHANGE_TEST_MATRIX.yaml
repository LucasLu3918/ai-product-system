    contract: {applicable: true, evidence: "tests/validation/creative_execution_contracts.py plus generate-set lifecycle"}
    e2e: {applicable: false, na_reason: No image generation is performed; deterministic preset and preflight contracts are used.}
    security: {applicable: true, evidence: "loopback/port/method/path, redirect, external destination, HTTP 4xx/5xx and redaction fixtures; no generation/download"}
    migration_recovery: {applicable: false, na_reason: Existing Bundle/Manifest additions remain additive with backward-compatible defaults.}
    cli_harness: {applicable: true, evidence: "native creative tool callback fixture plus read-only discovery/preflight CLI paths"}
    docs_schema: {applicable: true, evidence: "CREATIVE_ASSET_PRESETS.yaml, Bundle/Manifest, Scenario 262 and generated Conformance summary validation"}
