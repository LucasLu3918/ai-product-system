version: 1
change:
  id: plan16-03e-aips-cli-package
  summary: Extract the existing AIPS shell CLI implementation into ordered source
    modules while preserving its public launcher, facade, command behavior and installed/source-checkout
    compatibility.
  boundary:
  - bin/aips and scripts/aips_cli.sh resolved-checkout launcher/facade contract; ordered
    sourcing of scripts/aips_cli/*.sh before dispatch
  - command arguments, output, exit status and effects; existing CLI contract, install,
    update, migration and optional OpenAPI lifecycle consumers
  - runtime-context architecture inventory, generated System Reference, documentation
    placement/synchronization and exact-candidate validation
  - accepted partial shell call graph coverage; no changes to credentials, network
    authority, persisted data or Human publication/merge authority
