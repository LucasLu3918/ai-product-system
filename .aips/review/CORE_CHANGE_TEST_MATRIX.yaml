version: 1
change:
  id: publication-diagnostics-recovery-20261014
  summary: Separate publication candidate and target-policy evidence; retain safe GitHub error provenance; align
    recovery retryability; show structured Claude Code Hook diagnostics while preserving authority gates.
  boundary:
  - Candidate and target policy branch evidence
  - GitHub response provenance and redaction
  - Recovery classification and publication phase boundaries
  - Claude Code denial and canonical documentation closure
matrix:
- boundary: Candidate and target policy branch evidence
  reason: Policy decisions must observe the selected/default remote target independently of the local candidate,
    and missing evidence must remain blocking.
  checks:
    static_lint:
      applicable: true
      evidence: 'PENDING: Ruff and repository validation on the exact candidate.'
    unit:
      applicable: true
      evidence: 'PASS: focused doctor tests cover source/default-target branch separation, explicit target, and
        incomplete policy remains UNKNOWN.'
    integration:
      applicable: true
      evidence: 'PENDING: snapshot lifecycle covers confirmed branch existence and contextual 404 behavior.'
    contract:
      applicable: true
      evidence: 'PASS: doctor response contract asserts separate candidate_branch and policy_branch fields.'
    e2e:
      applicable: false
      na_reason: No deployed user interface; the read-only CLI and deterministic remote API fixtures exercise the
        behavior.
    security:
      applicable: true
      evidence: 'PASS: missing or permission-limited evidence remains blocking; no authorization or writes are produced.'
    migration_recovery:
      applicable: false
      na_reason: Read-only evidence only; no persisted state or migration.
    cli_harness:
      applicable: true
      evidence: 'PASS: public doctor invocation and branch-selection behavior are covered by focused publication
        tests.'
    docs_schema:
      applicable: true
      evidence: 'PENDING: close documentation impact and run placement/sync/build validators.'
- boundary: GitHub response provenance and redaction
  reason: HTTP and CLI response categories affect policy observability; raw credentials, headers and unrestricted
    errors must never escape.
  checks:
    static_lint:
      applicable: true
      evidence: 'PENDING: Ruff and repository validation on the exact candidate.'
    unit:
      applicable: true
      evidence: 'PASS: parser tests distinguish 401 authentication, 403 permission, rate limiting and safe token
        redaction.'
    integration:
      applicable: true
      evidence: 'PENDING: governance snapshot lifecycle and contract validations.'
    contract:
      applicable: true
      evidence: 'PASS: stable source endpoint/status/error-class fields remain additive and bounded.'
    e2e:
      applicable: false
      na_reason: No deployed user interface; deterministic API fixtures cover the response surface.
    security:
      applicable: true
      evidence: 'PASS: credential-like tokens are redacted and HTTP headers/raw stderr are not returned.'
    migration_recovery:
      applicable: false
      na_reason: No durable diagnostic store or data migration is introduced.
    cli_harness:
      applicable: true
      evidence: 'PASS: doctor exposes structured safe API source evidence without writes.'
    docs_schema:
      applicable: true
      evidence: 'PENDING: validate synchronized troubleshooting and security guidance.'
- boundary: Recovery classification and publication phase boundaries
  reason: Retry metadata must agree with actual retry guidance; retries can only re-observe transient evidence and
    cannot publish.
  checks:
    static_lint:
      applicable: true
      evidence: 'PENDING: Ruff and repository validation on the exact candidate.'
    unit:
      applicable: true
      evidence: 'PASS: recovery tests distinguish transient network evidence, pending checks, generic unavailable,
        permission and Human/Host denials.'
    integration:
      applicable: true
      evidence: 'PENDING: publication planning and already-merged lifecycle fixtures.'
    contract:
      applicable: true
      evidence: 'PASS: recovery output is non-authorizing and preserves reason/phase contracts.'
    e2e:
      applicable: false
      na_reason: No remote mutation is exercised in local fixtures; no deployed application flow exists.
    security:
      applicable: true
      evidence: 'PASS: no retry path invokes push, PR creation, merge or policy mutation.'
    migration_recovery:
      applicable: true
      evidence: 'PASS: existing exact-head merged recovery remains read-only and idempotent.'
    cli_harness:
      applicable: true
      evidence: 'PASS: standalone/compound command and publication phase tests remain in the focused suites.'
    docs_schema:
      applicable: true
      evidence: 'PENDING: validate Scenario 260/261 and adapter guidance.'
- boundary: Claude Code denial and canonical documentation closure
  reason: Native Hook denials need visible structured safe identifiers while preserving the documented native envelope
    and all publication authorization boundaries.
  checks:
