change:
  id: plan29-real-task-outcome-evaluation-20261011
  summary: Define the Plan29
  boundary:
  - Reuse the existing Agent Eval task_observation contract, Trajectory Eval shadow
    evidence, and allowlisted telemetry; do not add a second evaluator or infer missing
    measurements.
  - Define a Human-reviewed fixed cohort, exact case fingerprints, comparable baseline/candidate
    revisions, separate success/rework/security measures, and failure retention.
  - Keep missing, stale, invalid, failed, or unbound evidence visible as NOT_READY/UNKNOWN;
    the empirical benchmark remains NOT_READY until real observations exist.
  - This candidate changes only Plan29 tracking, the existing canonical Agent Eval
    topic, the required canonical Technology Guide, Conformance, and User Guide references,
    and this Core Change Matrix; runtime behavior, persisted task data, telemetry,
    and global Impact Graph coverage remain unchanged.
