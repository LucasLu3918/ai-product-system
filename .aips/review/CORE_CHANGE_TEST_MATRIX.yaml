change:
  id: repository-health-architecture-surface-inventory
  summary: Add explicit deterministic architecture-surface accounting and exact-candidate Repository Health CI evidence without external provider credentials or remediation authority.
  boundary:
    - repository-health
    - architecture-surface-inventory
    - scenario-conformance
    - validation-workflow
    - documentation
matrix:
  - boundary: architecture-surface-inventory
    reason: Every Capability Map entry must be accounted for exactly once and bound to concrete repository, documentation and validation surfaces.
    checks:
      static_lint: {applicable: true, evidence: "repository validation compiles and contract-checks repository_health.py"}
      unit: {applicable: true, evidence: "Repository Health lifecycle exercises unclassified capability, missing path and unbound validation negative paths"}
      integration: {applicable: true, evidence: "Repository Health reuses Capability Map, Scenario Conformance and tests/validate_repository.py bindings"}
      contract: {applicable: true, evidence: "Scenario 149 locks complete capability accounting and validation binding semantics"}
      e2e: {applicable: true, evidence: "validate workflow executes the exact candidate, emits repository-health-report.json and uploads it as an artifact"}
      security: {applicable: true, evidence: "audit remains credential-free, read-only and provider-network-free; artifact upload grants no authority"}
      migration_recovery: {applicable: false, na_reason: "No persisted user/project data or schema migration is changed"}
      cli_harness: {applicable: false, na_reason: "No CLI or Runtime Adapter behavior changes"}
      docs_schema: {applicable: true, evidence: "Repository Health, Maintenance, Architecture, Conformance and Technology Guide docs are synchronized"}
  - boundary: validation-workflow
    reason: The required validate workflow changes and must preserve the existing Integration Gate and repository aggregate contract.
    checks:
      static_lint: {applicable: true, evidence: "existing workflow/static validation enforces immutable action SHA pinning and syntax contracts"}
      unit: {applicable: false, na_reason: "Workflow wiring is integration-level behavior"}
      integration: {applicable: true, evidence: "Integration Gate exact-candidate run remains the first required janitor gate"}
      contract: {applicable: true, evidence: "repository-health config requires the report command, report filename, upload action and required repository aggregate strings"}
      e2e: {applicable: true, evidence: "PR CI must complete janitor plus required repository aggregate on the exact head"}
      security: {applicable: true, evidence: "workflow permissions remain contents: read and upload-artifact is pinned to the existing repository-approved SHA"}
      migration_recovery: {applicable: false, na_reason: "No deployment or persistence migration"}
      cli_harness: {applicable: false, na_reason: "No CLI/Harness interface changes"}
      docs_schema: {applicable: true, evidence: "Maintenance and Repository Health docs describe artifact semantics and authority boundary"}
