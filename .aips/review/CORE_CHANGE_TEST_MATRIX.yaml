change:
  id: plan29-documentation-capability-maintenance-20261011
  summary: Record Plan29 #12 as satisfied by existing canonical registries, deterministic generated projections, documentation synchronization, and a non-destructive report-only size audit.
  boundary:
    - Preserve config/capability-registry.yaml and config/system-facts.yaml as canonical sources; their consumer indexes and reference facts remain deterministic generated projections with drift checks.
    - Preserve documentation source-to-canonical-doc synchronization and Repository Health bindings for capability IDs, paths, canonical docs, validation evidence, and bounded discovery.
    - Preserve report-only size measurement: oversized documents remain non-blocking WARN, and audit never archives, moves, or deletes required security or historical evidence.
    - This candidate changes only Plan29 tracking and its Core Change Matrix; registries, projections, documentation, audit behavior, and global Impact Graph coverage remain unchanged.
