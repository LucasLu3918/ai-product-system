candidate:
  base_sha: 7052227725342a338b76006e7934a0e9ee60ca86
  changed_files_hash: 985131af17f2493b60eebaad4dc98f9f9992166a1f994f45156a375bb8678618

change:
  id: parallel-run-dashboard
  summary: Add a repository-scoped read-only Run Projection and localhost dashboard while preserving canonical Run State, approval authority and Resume behavior.
  boundary:
    - durable-run-state-and-checkpoint-v3
    - repository-scoped-workspace-projection
    - cli-and-local-dashboard-observation
    - read-only-security-boundary
    - documentation-and-scenario-conformance

matrix:
  - boundary: durable-run-state-and-checkpoint-v3
    reason: Checkpoint v3 adds optional execution and gate observability metadata while retaining v1/v2 readers and Resume semantics.
    checks:
      static_lint: {applicable: true, evidence: "py_compile and Ruff critical checks"}
      unit: {applicable: true, evidence: "tests/test_run_projection.py"}
      integration: {applicable: true, evidence: "tests/validate_repository.py governance resume"}
      contract: {applicable: true, evidence: "RUN_CHECKPOINT.yaml and run_state CLI"}
      e2e: {applicable: false, na_reason: "No product browser flow is required for checkpoint persistence"}
      security: {applicable: true, evidence: "bounded/redacted event contract"}
      migration_recovery: {applicable: true, evidence: "legacy v1/v2 projection and truncated JSONL tests"}
      cli_harness: {applicable: true, evidence: "aips run checkpoint/status/list/inspect"}
      docs_schema: {applicable: true, evidence: "RUN_RESUME.md and RUN_DASHBOARD.md"}
  - boundary: repository-scoped-workspace-projection
    reason: Parallel worktrees and EPHEMERAL/ATTACHED stores must normalize into one deterministic repository view with CURRENT/STALE/MISSING health.
    checks:
      static_lint: {applicable: true, evidence: "Ruff critical checks"}
      unit: {applicable: true, evidence: "tests/test_run_projection.py"}
      integration: {applicable: true, evidence: "tests/evidence/run_dashboard_lifecycle.py"}
      contract: {applicable: true, evidence: "stable projection JSON and snapshot fingerprint"}
      e2e: {applicable: false, na_reason: "Browser presentation is validated by API contract and lifecycle evidence"}
      security: {applicable: true, evidence: "whitelist fields omit raw paths and payloads"}
      migration_recovery: {applicable: true, evidence: "missing workspace and malformed JSONL recovery"}
      cli_harness: {applicable: true, evidence: "aips run list/inspect"}
      docs_schema: {applicable: true, evidence: "Scenario 173 and architecture bindings"}
  - boundary: cli-and-local-dashboard-observation
    reason: CLI and localhost HTTP consumers must share the projection without adding a control plane or dependency chain.
    checks:
      static_lint: {applicable: true, evidence: "bash -n and Ruff critical checks"}
      unit: {applicable: true, evidence: "projection and lifecycle tests"}
      integration: {applicable: true, evidence: "full repository validation"}
      contract: {applicable: true, evidence: "GET /api/v1/runs and /healthz"}
      e2e: {applicable: false, na_reason: "No remote browser product flow; server is localhost observation only"}
      security: {applicable: true, evidence: "loopback-only, no-store, no CORS, no mutation endpoints"}
      migration_recovery: {applicable: false, na_reason: "No persistent API migration"}
      cli_harness: {applicable: true, evidence: "aips run dashboard"}
      docs_schema: {applicable: true, evidence: "human and agent dashboard documentation"}
  - boundary: read-only-security-boundary
    reason: Runtime information crosses into a browser and must exclude prompts, reasoning, secrets, raw output and mutation authority.
    checks:
      static_lint: {applicable: true, evidence: "Ruff critical checks"}
      unit: {applicable: true, evidence: "API whitelist lifecycle assertions"}
      integration: {applicable: true, evidence: "content safety and repository validation"}
      contract: {applicable: true, evidence: "projection whitelist contract"}
      e2e: {applicable: false, na_reason: "No authenticated remote UI is introduced"}
      security: {applicable: true, evidence: "content safety lifecycle and no mutation routes"}
      migration_recovery: {applicable: false, na_reason: "No persisted security schema migration"}
      cli_harness: {applicable: true, evidence: "localhost dashboard CLI"}
      docs_schema: {applicable: true, evidence: "RUN_DASHBOARD.md security contract"}
  - boundary: documentation-and-scenario-conformance
    reason: Architecture, capability map, user guidance and Scenario 173 must remain discoverable and consistent.
    checks:
      static_lint: {applicable: true, evidence: "documentation placement and static contracts"}
      unit: {applicable: true, evidence: "scenario registry validation"}
      integration: {applicable: true, evidence: "tests/validate_repository.py"}
      contract: {applicable: true, evidence: "architecture surface and capability bindings"}
      e2e: {applicable: false, na_reason: "Documentation-only boundaries do not require browser E2E"}
      security: {applicable: true, evidence: "security and read-only boundary documentation"}
      migration_recovery: {applicable: false, na_reason: "Additive documentation and scenario evidence"}
      cli_harness: {applicable: true, evidence: "repository validation entrypoint"}
      docs_schema: {applicable: true, evidence: "canonical docs and scenario registry"}

scope_recomputed_after_expansion: true
actual_diff_reconciled: true
