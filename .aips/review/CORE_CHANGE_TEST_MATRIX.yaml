version: 1
candidate:
  base_sha: da31b06489c154eb3e0755e2235c5f8c76811e46
  changed_files_hash: e486062193a51bd15ee390586ea13f780786e5010d14d76034574e9f9830d91e
change:
  id: verified-sandbox-provider
  summary: Add a provider-neutral, fail-closed sandbox capability resolver and synthetic-only E2B verification lane; project-source adapter awaits explicit data-scope authorization.
  boundary:
    - sandbox-capability-contract-and-registry
    - risk-and-data-aware-isolation-resolution
    - synthetic-e2b-verification-and-credentials
    - verification-evidence-and-verification-receipts
    - security-and-failure-paths
    - scenarios-docs-architecture-and-release
    - seed-scoped-impact-graph-coverage
matrix:
  - boundary: sandbox-capability-contract-and-registry
    reason: Runtime class, controls, and verification state determine truthful capability.
    checks:
      static_lint: {applicable: true, evidence: repository validation and schema contracts}
      unit: {applicable: true, evidence: class matching, missing/stale/invalid evidence and fail-closed cases}
      integration: {applicable: true, evidence: resolve mode with registry and external evidence fixtures}
      contract: {applicable: true, evidence: Execution Profile and provider registry schema}
      e2e: {applicable: false, na_reason: No user interface}
      security: {applicable: true, evidence: no downgrade, no temporary-directory sandbox claim}
      migration_recovery: {applicable: true, evidence: existing profile compatibility; evidence expiry and reset}
      cli_harness: {applicable: true, evidence: aips isolation resolve/create/status/remove}
      docs_schema: {applicable: true, evidence: isolation docs and schema}
  - boundary: risk-and-data-aware-isolation-resolution
    reason: Risk/data policy selects minimum isolation and controls.
    checks:
      static_lint: {applicable: true, evidence: repository validation}
      unit: {applicable: true, evidence: risk classes, data classes and explicit overrides}
      integration: {applicable: true, evidence: no provider, container mismatch and E2B candidate fixtures}
      contract: {applicable: true, evidence: backward-compatible profile fields}
      e2e: {applicable: false, na_reason: No user interface}
      security: {applicable: true, evidence: confidential/restricted defaults and egress/credential boundaries}
      migration_recovery: {applicable: true, evidence: old profile without new fields}
      cli_harness: {applicable: true, evidence: resolver CLI output}
      docs_schema: {applicable: true, evidence: risk/data policy docs}
  - boundary: synthetic-e2b-verification-and-credentials
    reason: The optional verifier uses synthetic canary content; project-file transfer awaits explicit scope authorization.
    checks:
      static_lint: {applicable: true, evidence: compile and static checks}
      unit: {applicable: true, evidence: no-key skip, path syntax and receipt contract}
      integration: {applicable: true, evidence: synthetic canary smoke verifier contract}
      contract: {applicable: true, evidence: optional SDK dependency and main-only workflow}
      e2e: {applicable: false, na_reason: No user interface}
      security: {applicable: true, evidence: no mounts/secrets, default deny egress, safe archive/artifact paths}
      migration_recovery: {applicable: true, evidence: live cleanup runs in finally and records failure}
      cli_harness: {applicable: true, evidence: optional dependency and credential-free CLI behavior}
      docs_schema: {applicable: true, evidence: setup and controlled-trial guidance}
  - boundary: verification-evidence-and-verification-receipts
    reason: Provider availability requires fresh evidence distinct from provider claims.
    checks:
      static_lint: {applicable: true, evidence: repository validation}
      unit: {applicable: true, evidence: receipt redaction, digest binding and expiry}
      integration: {applicable: true, evidence: external verification record matching}
      contract: {applicable: true, evidence: evidence/receipt schema}
      e2e: {applicable: false, na_reason: No user interface}
      security: {applicable: true, evidence: secret values never persisted; workflow protected-main/manual}
      migration_recovery: {applicable: true, evidence: missing/stale evidence remains blocked}
      cli_harness: {applicable: true, evidence: verification state output}
      docs_schema: {applicable: true, evidence: evidence semantics}
  - boundary: security-and-failure-paths
    reason: External execution changes process, network, credential and data boundaries.
    checks:
      static_lint: {applicable: true, evidence: secret guard and repository validation}
      unit: {applicable: true, evidence: no-key, denied egress, invalid source paths and fail-closed failures}
      integration: {applicable: true, evidence: provider outage, TTL, partial lifecycle and destroy failure}
      contract: {applicable: true, evidence: structured statuses and sanitized errors}
      e2e: {applicable: false, na_reason: No user interface}
      security: {applicable: true, evidence: explicit credential registry and PR secret isolation}
      migration_recovery: {applicable: true, evidence: cleanup state and expired verification}
      cli_harness: {applicable: true, evidence: structured isolation output}
      docs_schema: {applicable: true, evidence: security guidance}
  - boundary: scenarios-docs-architecture-and-release
    reason: Workflow, diagrams and release metadata must match the implemented capability.
    checks:
      static_lint: {applicable: true, evidence: documentation/schema validators}
      unit: {applicable: false, na_reason: Documentation-only portions}
      integration: {applicable: true, evidence: scenario coverage and repository validation}
      contract: {applicable: true, evidence: docs synchronization rules}
      e2e: {applicable: false, na_reason: No user interface}
      security: {applicable: true, evidence: no claim of AIPS hypervisor attestation}
      migration_recovery: {applicable: false, na_reason: No persistent document migration}
      cli_harness: {applicable: false, na_reason: Documentation-only portions}
      docs_schema: {applicable: true, evidence: architecture diagrams, human and agent docs, changelog/version}
  - boundary: seed-scoped-impact-graph-coverage
    reason: High-risk impact review needs bounded complete caller evidence while preserving truthful repository-wide partial coverage.
    checks:
      static_lint: {applicable: true, evidence: repository validation and YAML schema contracts}
      unit: {applicable: true, evidence: matching seeds select evidence-backed scopes; unmatched seeds remain unknown}
      integration: {applicable: true, evidence: exact two-hop CLI/workflow caller traversal for sandbox resolver and verifier}
      contract: {applicable: true, evidence: IMPACT_GRAPH coverage_scopes template contract}
      e2e: {applicable: false, na_reason: No user interface}
      security: {applicable: true, evidence: bounded scopes cannot alter repository-wide coverage claims}
      migration_recovery: {applicable: true, evidence: absent coverage_scopes retains existing global coverage behavior}
      cli_harness: {applicable: true, evidence: impact-traverse --graph-seed output}
      docs_schema: {applicable: true, evidence: Change Impact guidance and Scenario 175}
scope_recomputed_after_expansion: true
blockers: []
actual_diff_reconciled: true
