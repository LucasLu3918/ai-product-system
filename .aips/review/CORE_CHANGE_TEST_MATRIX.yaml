version: 1
change:
  id: plan53-hook-publish-recovery
  summary: Bound publication Hook execution, add exact-candidate expiring Secret Scan
    evidence, support safe upstream push flags and scope unknown Required Checks Doctor
    blockers to strict mode.
  boundary:
  - publication authority and push parsing
  - Prepare and private scan evidence lifecycle
  - Claude Code Hook deadline and diagnostics
  - Required Checks Doctor semantics
  - Scenario, documentation and exact candidate delivery
matrix:
- boundary: publication authority and push parsing
  reason: Preserve exact remote/ref/candidate/lease validation while allowing only
    standalone upstream flags.
  checks: &id001
    static_lint:
      applicable: true
      evidence: 'PASS: focused changed modules and test files pass Ruff; git diff
        --check passes. The three existing governance_guard Ruff findings are unchanged
        baseline warnings.'
    unit:
      applicable: true
      evidence: 'PASS: 104 publication tests and 130 subtests passed across scan evidence,
        diagnostics, planning and authority suites.'
    integration:
      applicable: true
      evidence: 'REQUIRED: run the exact-candidate AIPS Integration Gate after commit
        and before remote publication or merge.'
    contract:
      applicable: true
      evidence: 'REQUIRED: final exact-candidate repository validation, publication
        preflight contracts and Scenario 261.'
    e2e:
      applicable: true
      evidence: 'PASS: fixture-backed Claude Code Hook subprocess lifecycle is included
        in the 104 passing publication tests.'
    security:
      applicable: true
      evidence: 'PASS: scan-evidence tampering, expiry, symlink and policy/candidate
        drift cases passed. REQUIRED: full final-tree and base..head scan in the exact-candidate
        Gate.'
    migration_recovery:
      applicable: true
      evidence: 'PASS: absent, corrupt, expired, symlinked and mismatched evidence
        fails closed; evidence stays in the private user cache.'
    cli_harness:
      applicable: true
      evidence: 'PASS: Hook lifecycle and safe upstream flag cases passed. REQUIRED:
        final repository Gate after commit.'
    docs_schema:
      applicable: true
      evidence: 'PASS: final docs-impact and documentation-placement preview reports
        no required additions and placement PASS.'
- boundary: Prepare and private scan evidence lifecycle
  reason: Evidence is non-authorizing, private, short-lived and bound to exact repository,
    worktree, candidate, target, remote, scanner and policy.
  checks: *id001
- boundary: Claude Code Hook deadline and diagnostics
  reason: Bound wall-clock execution, report safe phase/elapsed evidence and never
    classify a timeout as network failure.
  checks: *id001
- boundary: Required Checks Doctor semantics
  reason: Preserve unknown policy truth; non-strict Doctor warns without blocking
    ordinary branch workflows, while strict mode blocks unknown/unconfigured policy.
  checks: *id001
- boundary: Scenario, documentation and exact candidate delivery
  reason: Bind all changed source/tests/docs and full Gate evidence to one exact candidate.
  checks: *id001
