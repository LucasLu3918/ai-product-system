- boundary: installer-transaction-and-lock
  reason: Install/update must serialize concurrent writers, retry transient Git operations,
    remove partial staging state and promote only a verified checkout.
  checks:
    static_lint:
      applicable: true
      evidence: bash -n scripts/install.sh passed; Ruff changed-file baseline comparison
        has zero added findings.
    unit:
      applicable: true
      evidence: tests/evidence/installer_reliability_lifecycle.py passed.
    integration:
      applicable: true
      evidence: Source-checkout install lifecycle promoted verified checkout and invoked
        CLI fixture.
    contract:
      applicable: true
      evidence: tests/evidence/install_download_lifecycle.py passed with bounded curl
        retry options in Unix/WSL snippets.
    security:
      applicable: true
      evidence: Active locks are preserved; stale locks are reported for explicit
        recovery; partial clones are not promoted.
    migration_recovery:
      applicable: true
      evidence: Active lock, stale lock, success promotion and partial clone cleanup
        lifecycle cases passed.
    cli_harness:
      applicable: true
      evidence: Installer preserved install arguments and source-checkout CLI entrypoint.
    docs_schema:
      applicable: true
      evidence: Installer snippet parity and WSL contract passed; docs now describe
        bounded retry and recovery.
    e2e:
      applicable: true
      evidence: Local temporary Git source installed end-to-end to a separate test
        destination.
