version: 1
change:
  id: dependabot-preflight-pin-sync-20261020
  summary: Route every diff-based Documentation Sync consumer, including repository preflight, through one
    evaluate_candidate entry point that shares pure_dependency_update, and validate GitHub Action pins by exact
    identity, full commit SHA, reviewed version floor and paired-workflow consistency instead of copied SHA literals.
  boundary:
    - Documentation Sync shared entry point
    - Repository preflight documentation consistency
    - Action pin validation helper
    - Pin contract sites and evolution adapter config
    - Repository delivery and documentation closure
matrix:
  - boundary: Documentation Sync shared entry point
    reason: documentation_sync.evaluate_candidate is the only diff-based sync evaluator; it may exempt only verified
      pure dependency updates with the same equality guard as Documentation Impact and Placement.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff reports no new findings versus base for changed files; git diff --check clean."}
      unit: {applicable: true, evidence: "PASS: dependency_impact_lifecycle sync_for fixtures: pip bump exempt; bump plus doc edit, range edit and disabled policy keep full rules; zero base returns no files."}
      integration: {applicable: true, evidence: "PASS: documentation_sync.py --base-ref on real heads #262 #263 #260 #168 #340 #259 reports valid with PURE_DEPENDENCY_UPDATE."}
      contract: {applicable: true, evidence: "PASS: documentation_sync_contracts uses evaluate_candidate; static config contracts unchanged."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: predicate, allowlist and size limits unchanged; any predicate failure returns the full rules."}
      migration_recovery: {applicable: false, na_reason: "No persistent state; documentation_exemption.enabled false restores full rules (asserted)."}
      cli_harness: {applicable: true, evidence: "PASS: documentation_sync.py CLI reports dependency_update_exemption when exempt."}
      docs_schema: {applicable: true, evidence: "PASS: DOCUMENTATION_SYNC and Scenario 221 describe the single entry point."}
  - boundary: Repository preflight documentation consistency
    reason: scripts/repository_preflight.py is matrix-required and was the unwired fourth consumer blocking pip PRs.
    checks:
      static_lint: {applicable: true, evidence: "PASS: narrowed exception tuple; no new ruff findings."}
      unit: {applicable: false, na_reason: Covered by the shared entry point unit fixtures.}
      integration: {applicable: true, evidence: "PASS: repository_preflight.py --base b6555c31 --head HEAD with the candidate overlaid: #262 75ac2e7f, #263 67ace8ce, #260 d4c21f2f, #168 2a6e8988, #340 8b632b8c, #259 36bda58f all PASSED (four FAILED before)."}
      contract: {applicable: true, evidence: "PASS: janitor invocation and --base/--head contract unchanged."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: non-dependency candidates produce identical Documentation consistency errors."}
      migration_recovery: {applicable: false, na_reason: Revert-only.}
      cli_harness: {applicable: true, evidence: "PASS: repository_preflight.py CLI on six real PR heads."}
      docs_schema: {applicable: true, evidence: "PASS: MAINTENANCE and INTEGRATION_GATE notes."}
  - boundary: Action pin validation helper
    reason: require_pinned_action replaces copied SHA literals and must keep identity, immutability and downgrade protection.
    checks:
      static_lint: {applicable: true, evidence: "PASS: reuses ACTION_LINE, PINNED_SHA and _release from the pure-update grammar."}
      unit: {applicable: true, evidence: "PASS: accepts moved SHA, newer comment and comment-less reusable workflow; rejects tag, branch, short SHA, owner swap, prefixed owner, removed comment, below-floor comment, extra unpinned reference, wrong count and missing reference."}
      integration: {applicable: false, na_reason: Pure text function.}
      contract: {applicable: true, evidence: "PASS: pinned_action_references exposes refs for paired-workflow equality."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: identity compared exactly; every reference must be a 40-hex SHA; impostor-commit review stays Human (proposal analysis)."}
      migration_recovery: {applicable: false, na_reason: New function.}
      cli_harness: {applicable: false, na_reason: No CLI surface.}
      docs_schema: {applicable: true, evidence: "PASS: SECURITY_ASSURANCE Release Security Gate and Scenario 221."}
  - boundary: Pin contract sites and evolution adapter config
    reason: Ten literal SHA sites and the evolution action_commit key blocked Dependabot action PRs.
    checks:
      static_lint: {applicable: true, evidence: "PASS: config files load; no new ruff findings."}
      unit: {applicable: false, na_reason: Contracts are exercised directly.}
      integration: {applicable: true, evidence: "PASS: security_workflow, evolution_governance, dependency_review, publish_preflight, repository_health, documentation_sync and static contracts report 0 errors on main and on #340 and #259 heads with the candidate overlaid (4 errors before)."}
      contract: {applicable: true, evidence: "PASS: tampered fixtures on #340 (radar and decision SHAs differ; config action_commit restored) and #259 (tag reference, below-floor comment) fail with the expected messages."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: Node 24 and reviewed version floors kept; upstream tag peel for #259 and #340 recorded in the proposal."}
      migration_recovery: {applicable: true, evidence: "PASS: action_commit to action rename has no runtime reader; revert restores it."}
      cli_harness: {applicable: false, na_reason: No CLI surface.}
      docs_schema: {applicable: true, evidence: "PASS: EVOLUTION_RADAR docs record that the commit lives only in the workflows."}
  - boundary: Repository delivery and documentation closure
    reason: The change touches matrix-required repository preflight and must pass the full local Gate.
    checks:
      static_lint: {applicable: true, evidence: "PASS: full local Integration Gate static stage."}
      unit: {applicable: true, evidence: "PASS: focused suites; full Gate run recorded in the delivery report."}
      integration: {applicable: true, evidence: "PASS: publish_preflight.py run on the exact committed candidate."}
      contract: {applicable: true, evidence: "PASS: exact-candidate Documentation Impact complete; placement audit clean for 20 documents."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: candidate secret scan and content safety inside the Gate."}
      migration_recovery: {applicable: false, na_reason: Rollback is a PR revert.}
      cli_harness: {applicable: true, evidence: "PASS: publish_preflight.py run CLI."}
      docs_schema: {applicable: true, evidence: "PASS: Documentation Placement audit clean."}
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
