version: 1
change:
  id: plan17-preflight-not-required
  summary: Keep exact-candidate publication preflight ready when the CI toolchain
    plan does not require optional browser or Node capabilities, while preserving
    failures for selected prerequisites.
  boundary:
  - Treat browser NOT_REQUIRED as neutral only when needs_browser is false; browser
    discovery and launch probes remain skipped for that candidate.
  - Keep selected browser failures and every mandatory validation requirement blocking.
  - Preserve CI validation planning, required Integration Gate execution, secret scanning,
    repository validation, and all workflow permissions.
  - Update focused lifecycle evidence and recursive human/agent guidance for this
    behavior.
  - No release, tag, dependency-policy, workflow-permission, or data-schema changes.
candidate:
  base_sha: c84803666183a250145261a218cd50bc4bab5021
  changed_files_hash: da08b8708ff150690d0b41fdc21e200c1cc44cd6c3d09a3b30d148b04039dde2
matrix:
- boundary: optional-browser-preflight-classification
  reason: The exact CI validation plan selects optional environment probes. An unselected
    browser must not block publication, and a selected browser must still fail closed.
  checks:
    static_lint:
      applicable: true
      evidence: Full repository validation, quality ratchet, publication-preflight
        contracts, and exact changed-file/hash reconciliation cover the condition
        and its docs.
    unit:
      applicable: true
      evidence: publish_preflight_lifecycle.py exercises a plan with needs_browser=false,
        asserts READY and NOT_REQUIRED, and asserts browser discovery/probing and
        loopback checks are not called; its existing selected-browser failure case
        remains blocking.
    integration:
      applicable: true
      evidence: Exact-candidate Integration Gate must pass after the candidate is
        committed; the required repository validator owns the lifecycle and contract
        checks.
    contract:
      applicable: true
      evidence: publish_preflight_contracts.py and the lifecycle bind CI-plan interpretation,
        optional environment status, and fail-closed behavior for selected browser
        requirements.
    e2e:
      applicable: true
      evidence: Full local publication preflight plus required PR repository/JANITOR
        checks exercise the exact candidate; main checks run after merge.
    security:
      applicable: true
      evidence: Exact-candidate credential-free strict secret scanning remains mandatory;
        no credentials, permissions, publication writes, or secret handling change.
    migration_recovery:
      applicable: false
      na_reason: No persistence, schema, dependency, or release-state change; rollback
        is a code/documentation revert.
    cli_harness:
      applicable: true
      evidence: The publication lifecycle verifies a non-browser CI plan completes
        without optional browser or loopback probes and that selected browser failures
        remain blockers.
    docs_schema:
      applicable: true
      evidence: Recursive documentation preview and placement validation bind the
        user, orchestrator, Integration Gate, scheduler, and Core Change testing guidance
        to the changed behavior.
