change:
  id: plan34-publication-diagnostics-20261012
  summary: Add structured, safe publication diagnostics, read-only merge diagnosis, and Publish Doctor.
  boundary:
    - Extend the existing publication authority diagnostic codes and remediation contract; preserve redaction, exact candidate binding, all existing gates, and fail-closed behavior.
    - Classify Required Checks configuration and live outcomes separately, including empty/unconfigured, pending, failed, missing, cancelled, stale, API unavailable, and insufficient permission.
    - Add literal gh pr merge support to read-only diagnose and a publish doctor/onboarding command; neither executes mutations, changes GitHub policy, nor grants/consumes authority.
    - Give Claude Code, OpenCode, and Codex consistent safe diagnostic/remediation guidance; self-service is limited to already authorized read-only or safe actions.
    - Update Scenario 260, lifecycle/unit/contract/security evidence and canonical Traditional Chinese Human/Agent docs.

