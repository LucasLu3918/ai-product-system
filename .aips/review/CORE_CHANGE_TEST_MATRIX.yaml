version: 1
change:
  id: plan14-python-support
  summary: P14-02 aligns the supported Python floor with Python >=3.12 and tests the
    3.12, 3.13, and 3.14 compatibility range; previously merged P14-01 boundaries
    remain listed as regression evidence for the full candidate Gate.
  boundary:
  - Python runtime minimum, managed installer repair, doctor diagnosis, and compatibility
    behavior
  - canonical runtime facts, compatibility smoke workflow, tests, documentation, and
    candidate binding
  - previously merged P14-01 archive and monthly Effectiveness boundaries retained
    for regression traceability
matrix:
- boundary: Durable Issue archive and rollup consumer compatibility
  reason: Original evidence must remain byte-preserved below GitHub limits; invalid,
    oversized or corrupt archives cannot become complete evidence.
  checks:
    static_lint:
      applicable: true
      evidence: scripts/evolution_radar_rollup.py; tests/evidence/evolution_radar_lifecycle.py;
        repository validation
    unit:
      applicable: true
      evidence: archive digest, bounds, corruption, and missing-preanalysis assertions
    integration:
      applicable: true
      evidence: archived weekly Issue restored by Radar and Effectiveness consumers
    contract:
      applicable: true
      evidence: Issue evidence extraction and monthly source coverage/report contracts
    e2e:
      applicable: true
      evidence: tests/evidence/evolution_radar_lifecycle.py end-to-end Issue round-trip
    security:
      applicable: true
      evidence: 8 MiB decompression cap, SHA-256 check, malformed-envelope rejection;
        workflow permissions unchanged
    migration_recovery:
      applicable: false
      na_reason: Existing Issue bodies remain readable; no stored data is rewritten.
    concurrency_idempotency_replay:
      applicable: true
      evidence: immutable digest and repeatable archive decode lifecycle
    cli_harness:
      applicable: false
      na_reason: No CLI command or Harness authority changes.
    docs_schema:
      applicable: true
      evidence: Human and Agent Radar documentation plus Scenario 155 and coverage
        registry
- boundary: Monthly source-effectiveness evidence completeness
  reason: Missing weekly pre-analysis must remain unknown and cannot be counted as
    zero shortlist yield.
  checks:
    static_lint:
      applicable: true
      evidence: scripts/evolution_radar_rollup.py; tests/evidence/evolution_radar_lifecycle.py;
        repository validation
    unit:
      applicable: true
      evidence: archive digest, bounds, corruption, and missing-preanalysis assertions
    integration:
      applicable: true
      evidence: archived weekly Issue restored by Radar and Effectiveness consumers
    contract:
      applicable: true
      evidence: Issue evidence extraction and monthly source coverage/report contracts
    e2e:
      applicable: true
      evidence: tests/evidence/evolution_radar_lifecycle.py end-to-end Issue round-trip
    security:
      applicable: false
      na_reason: No new secret-bearing input or authority; archive decoder security
        is covered by the first boundary.
    migration_recovery:
      applicable: true
      evidence: Historical weekly Issues without pre-analysis remain accepted while
        shortlist yield is marked unavailable.
    concurrency_idempotency_replay:
      applicable: false
      na_reason: No new mutable persistence or concurrency behavior.
    cli_harness:
      applicable: false
      na_reason: No CLI command or Harness authority changes.
    docs_schema:
      applicable: true
      evidence: Human and Agent Radar documentation plus Scenario 155 and coverage
        registry
- boundary: Protected authority and workflow publication
  reason: Keep issue-only GitHub permissions, credential-free collection and Human-only
    source-policy decisions.
  checks:
    static_lint:
      applicable: true
      evidence: scripts/evolution_radar_rollup.py; tests/evidence/evolution_radar_lifecycle.py;
        repository validation
    unit:
      applicable: false
      na_reason: No authority evaluator code changes.
    integration:
      applicable: true
      evidence: archived weekly Issue restored by Radar and Effectiveness consumers
    contract:
      applicable: true
      evidence: Issue evidence extraction and monthly source coverage/report contracts
    e2e:
      applicable: false
      na_reason: No external GitHub write is performed during local validation.
    security:
      applicable: true
      evidence: 8 MiB decompression cap, SHA-256 check, malformed-envelope rejection;
        workflow permissions unchanged
    migration_recovery:
      applicable: false
      na_reason: No permission or persisted schema migration.
    concurrency_idempotency_replay:
      applicable: false
      na_reason: No workflow scheduling or publication authority changes.
    cli_harness:
      applicable: false
      na_reason: No CLI command or Harness authority changes.
    docs_schema:
      applicable: true
      evidence: Human and Agent Radar documentation plus Scenario 155 and coverage
        registry
- boundary: Canonical documentation and Scenario evidence closure
  reason: The approved evolution-radar doc mapping and additional publication placement
    closure must describe the same observable archive and incomplete-yield contract.
  checks:
    static_lint:
      applicable: true
      evidence: repository documentation placement and Scenario Conformance validators
    unit:
      applicable: false
      na_reason: Documentation changes are checked through canonical placement and
        repository validation.
    integration:
      applicable: true
      evidence: aips publish preview plus complete exact-candidate Integration Gate
    contract:
      applicable: true
      evidence: Scenario 155 and canonical documentation sync/placement mapping
    e2e:
      applicable: false
      na_reason: Documentation wording creates no runtime path.
    security:
      applicable: true
      evidence: Human/Agent docs retain bounded untrusted archive, authority and fail-closed
        statements
    migration_recovery:
      applicable: false
      na_reason: No documentation or stored-data migration.
    concurrency_idempotency_replay:
      applicable: false
      na_reason: No concurrent behavior is introduced by documentation.
    cli_harness:
      applicable: false
      na_reason: No CLI or Harness behavior is changed.
    docs_schema:
      applicable: true
      evidence: aips publish preview documentation_placement PASS and repository documentation
        contracts
- boundary: Python runtime minimum and managed installation recovery
  reason: AIPS must reject unsupported interpreters clearly and repair an existing
    managed venv without leaving a partial install.
  checks:
    static_lint:
      applicable: true
      evidence: bash syntax, Ruff, and repository validation
    unit:
      applicable: true
      evidence: Python-version predicate boundaries for 3.11, 3.12, and newer
    integration:
      applicable: true
      evidence: installer recreates an unsupported managed venv with a compatible interpreter
    contract:
      applicable: true
      evidence: doctor and install errors state the Python >=3.12 requirement
    e2e:
      applicable: true
      evidence: tests/evidence/install_preflight_lifecycle.py and installation-entrypoints workflow
    security:
      applicable: true
      evidence: unsupported EOL runtime is not accepted; update remains fail-closed when
        no compatible creator is available
    migration_recovery:
      applicable: true
      evidence: existing managed venv below 3.12 is recreated; unmanaged project data
        is untouched
    concurrency_idempotency_replay:
      applicable: false
      na_reason: No concurrent or replayable persistent writes are introduced.
    cli_harness:
      applicable: true
      evidence: aips doctor and aips install lifecycle diagnostics
    docs_schema:
      applicable: true
      evidence: installation, Getting Started, Technology Guide, and generated system reference
- boundary: Canonical Python facts and scheduled compatibility coverage
  reason: Declared support, tested versions, installer predicates, generated references,
    and scheduled smoke coverage must agree.
  checks:
    static_lint:
      applicable: true
      evidence: Python facts and workflow schema validation
    unit:
      applicable: true
      evidence: tests/validation/system_facts_contracts.py validates range and tested matrix
    integration:
      applicable: true
      evidence: system facts generator lifecycle and scheduled Python compatibility workflow
    contract:
      applicable: true
      evidence: pyproject.toml and config/system-facts.yaml are cross-checked
    e2e:
      applicable: true
      evidence: scheduled Python 3.12, 3.13, and 3.14 installer smoke matrix
    security:
      applicable: false
      na_reason: No dependency, workflow permission, or credential scope is expanded.
    migration_recovery:
      applicable: false
      na_reason: Runtime upgrade recovery is covered in the installer boundary.
    concurrency_idempotency_replay:
      applicable: false
      na_reason: No new mutable runtime state is introduced.
    cli_harness:
      applicable: true
      evidence: scheduled smoke runs aips install/doctor lifecycle contracts
    docs_schema:
      applicable: true
      evidence: generated system facts and canonical runtime support docs
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
status: READY
