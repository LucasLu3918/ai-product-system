version: 1
change:
  id: plan45-publication-scan-diagnostics
  summary: Map scanner failures to stable redacted publication diagnostics and validate command shape
    before scanning while preserving fail-closed behavior and existing authority.
  boundary:
  - Extend ScanError and publication diagnostics with stable reason, phase, component, retryability and
    safe recovery; keep raw exception data private.
  - Validate literal publication command shape before candidate/history scan; all later candidate, remote,
    PR, safety and authority checks remain mandatory.
  - Preserve diagnostic ID, optional allowlisted ledger behavior, existing Hook/CLI envelopes, exact candidate
    binding and Human/merge authority.
  - Add fault injection, redaction, no-side-effect, Hook/CLI lifecycle and Scenario 261 regression evidence;
    update canonical docs.
matrix:
- boundary: Scanner failure classification and redaction
  reason: A scan that cannot finish safely must deny publication with an actionable root cause without
    leaking private inputs.
  checks:
    static_lint:
      applicable: true
      evidence: 'PASS: focused Ruff reports only 7 pre-existing findings in check_secret_leakage.py; touched
        code compiles and git diff --check passes.'
    unit:
      applicable: true
      evidence: 'PASS: 42 publication-authority tests and 47 subtests cover invalid/expired policy, invalid
        base, missing head, unreadable file, internal error and redaction.'
    integration:
      applicable: true
      evidence: 'PASS: secret_scan_publication_lifecycle.py blocks exact-tree/history sentinels and reports
        PASS.'
    contract:
      applicable: true
      evidence: 'PASS: Scenario Conformance reports 265 registered, 0 missing/uncovered; full repository
        validation passes 101 checks.'
    e2e:
      applicable: false
      na_reason: No user interface or network service is changed; Hook/CLI lifecycle is the affected execution
        path.
    security:
      applicable: true
      evidence: 'PASS: focused tests assert no raw token, exception text, file path or command leaks through
        diagnostics.'
    migration_recovery:
      applicable: false
      na_reason: No persisted schema or data migration; existing optional ledger schema is unchanged.
    cli_harness:
      applicable: true
      evidence: 'PASS: focused publication Hook/CLI tests and scanner lifecycle preserve denial/NOT_EXECUTED;
        no authority granted.'
    docs_schema:
      applicable: true
      evidence: 'PASS: exact-candidate Documentation Impact reports complete=true; all 24 changed paths
        are covered with zero required additions.'
