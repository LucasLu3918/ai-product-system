candidate:
  base_sha: 5267514e2dc45713d5128475e35f5c7ae4960693
  changed_files_hash: f31cdd198afb5f711aaddaa239a0b585aad76f4f4d8c8fa8d46b9c0279d3fa53
change:
  id: portable-command-core
  summary: Add canonical Portable Command registry, shared renderer, advisory MCP projection and managed CLI lifecycle for three governance commands.
  boundary:
    - portable-command-registry
    - workflow-rendering
    - managed-projection-lifecycle
    - mcp-and-cli-contracts
    - documentation-governance
matrix:
  - boundary: publication-preflight
    reason: A new shared CLI and CI entrypoint controls exact-candidate resolution and validation ordering.
    checks:
      static_lint: {applicable: true, evidence: "Ruff critical/import/async checks and Python compileall pass for changed scripts and tests"}
      unit: {applicable: true, evidence: "tests/evidence/publish_preflight_lifecycle.py covers change class, recursive docs impact, matrix rules and environment states"}
      integration: {applicable: true, evidence: "scripts/publish_preflight.py delegates the fast repository preflight and existing Integration Gate with the same resolved base/head"}
      contract: {applicable: true, evidence: "tests/validation/publish_preflight_contracts.py and scheduler_gate_contracts.py bind CLI, workflow and resolver contracts"}
      e2e: {applicable: true, evidence: "exact-candidate local Integration Gate plus protected GitHub Actions Validate are required before merge"}
      security: {applicable: true, evidence: "remote policy is read-only; preflight grants no push, merge, reset, release or production authority"}
      migration_recovery: {applicable: true, evidence: "post-merge apply requires clean target branch and identical trees, and creates a backup branch before reset"}
      cli_harness: {applicable: true, evidence: "bin/aips exposes publish plan, preflight and post-merge plus docs impact without changing Harness authority"}
      docs_schema: {applicable: true, evidence: "publication behavior is bound through documentation sync, placement, architecture and Scenario 165"}
  - boundary: project-intelligence-refresh
    reason: Equivalent-tree squash reconciliation may refresh only revision metadata while semantic changes remain fail-closed.
    checks:
      static_lint: {applicable: true, evidence: "scripts/project_intelligence.py compiles and passes focused Ruff checks"}
      unit: {applicable: true, evidence: "refresh checks cleanliness and old/current tree object equality before metadata update"}
      integration: {applicable: true, evidence: "publish post-merge can invoke the canonical Project Intelligence refresh command after safe reconciliation"}
      contract: {applicable: true, evidence: "static contracts require REFRESHED_EQUIVALENT_TREE and SEMANTIC_REFRESH_REQUIRED outcomes"}
      e2e: {applicable: false, na_reason: "external intelligence metadata is workspace-local and semantic refresh stays an explicit follow-up"}
      security: {applicable: true, evidence: "refresh reads Git objects and writes only existing external Project Intelligence metadata"}
      migration_recovery: {applicable: true, evidence: "non-equivalent trees return SEMANTIC_REFRESH_REQUIRED without rewriting topic content"}
      cli_harness: {applicable: true, evidence: "aips intelligence refresh is routed through the existing intelligence CLI"}
      docs_schema: {applicable: true, evidence: "Human and agent Project Intelligence documentation describes equivalent-tree refresh limits"}
  - boundary: documentation-governance
    reason: Fast publication validation depends on recursive sync/placement impact and ignored-file-safe audience inspection.
    checks:
      static_lint: {applicable: true, evidence: "documentation YAML parses and repository validator passes all static contracts"}
      unit: {applicable: true, evidence: "documentation audience regression creates an ignored .DS_Store and verifies it is skipped"}
      integration: {applicable: true, evidence: "repository_preflight runs diff, sync, placement and audience checks against an explicit base"}
      contract: {applicable: true, evidence: "documentation sync and placement rules map every changed behavior surface to canonical topics"}
      e2e: {applicable: true, evidence: "full repository validation passes with AIPS_DOCS_DIFF_BASE bound to the candidate base"}
      security: {applicable: false, na_reason: "no secret, credential or authorization boundary changes"}
      migration_recovery: {applicable: false, na_reason: "no persisted documentation schema migration"}
      cli_harness: {applicable: true, evidence: "aips docs impact exposes the same recursive resolver used by publication preflight"}
      docs_schema: {applicable: true, evidence: "placement, audience, Technology Guide and Human/agent documentation contracts pass"}
  - boundary: repository-ci
    reason: GitHub Validate now calls the same publication preflight used locally and repository health verifies that wiring.
    checks:
      static_lint: {applicable: true, evidence: "workflow strings and integration profile are checked by repository static contracts"}
      unit: {applicable: false, na_reason: "workflow execution is covered by exact-candidate GitHub Actions rather than a separate unit harness"}
      integration: {applicable: true, evidence: "local full repository validator passes outside the sandbox with localhost and Chrome lifecycle support"}
      contract: {applicable: true, evidence: "config/architecture-surfaces.yaml and config/repository-health.yaml bind shared preflight paths and evidence"}
      e2e: {applicable: true, evidence: "PR Validate and protected-main Validate must both succeed before completion"}
      security: {applicable: true, evidence: "workflow remains contents:read and offline during candidate validation"}
      migration_recovery: {applicable: false, na_reason: "workflow wiring is source-controlled and rollback is a normal code revert"}
      cli_harness: {applicable: true, evidence: "local and CI execute the same Python entrypoint and canonical matrix path"}
      docs_schema: {applicable: true, evidence: "Architecture, Maintenance, Integration Gate and Scheduler documentation describe shared resolution"}
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
status: READY
