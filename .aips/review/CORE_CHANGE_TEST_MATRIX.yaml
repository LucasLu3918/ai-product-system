version: 1
change:
  id: plan43-publication-diagnostics-safe-recovery
  summary: Preserve fail-closed publication diagnostics for unexpected hook authorization
    failures and configure Claude Code native failure blocking only when the detected
    runtime supports it.
  boundary:
  - Publication hook unexpected-error classification, safe error_class output, optional
    redacted diagnostic ledger, and unchanged deny/Human authorization behavior.
  - Claude Code managed PreToolUse hook version detection and onFailure:block compatibility
    at v2.1.295+, including unaffected UserPromptSubmit behavior.
  - Canonical Human/Agent documentation closure, Scenario 261/runtime contracts, and
    exact-candidate repository validation.
matrix:
- boundary: Publication hook fail-closed behavior, diagnostics privacy, and authority
    preservation
  reason: Unexpected internal exceptions must not escape the hook or reveal exception
    text; diagnostic metadata may expose only an allowlisted exception class while
    preserving the existing deny decision.
