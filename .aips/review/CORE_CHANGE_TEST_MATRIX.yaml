change:
  id: plan29-selective-validation-20261011
  summary: Expose validator-level Validation Shadow precision and false-negative metrics,
    recover a missing PR link by exact SHA when uniquely attributable, and preserve
    full validation execution.
  boundary:
  - Report validator-level run/skip precision, recall, false-negative rate, confusion
    counts, and current graduation thresholds with null for zero denominators.
  - Resolve absent workflow-run pull request metadata using read-only commit-to-pull-requests
    lookup for the exact head SHA; require one same-repository result or keep the
    record incomplete.
  - Preserve FULL_RUN_SHADOW, the 30-day and 30-PR thresholds, zero false-negative
    requirement, modulo-10 audit, complete artifact history, and Human activation
    authority.
  - Keep the external Impact Graph scope limited to Validation Shadow, its existing
    workflow and exact lifecycle/contracts; preserve repository-wide partial/unknown
    coverage.
  - Document the one-day measured baseline as descriptive and NOT_READY without persisting
    raw run identifiers or artifact data.
