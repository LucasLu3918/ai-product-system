version: 1
candidate:
  base_sha: 552b7e1e7087611fd46177715603ad464bfd4ada
  changed_files_hash: 62f0df97c1547329772edff8feb0695504510941e69f4cca3a119afe1beba219
change:
  id: plan21-final
  summary: Complete Plan21 failure semantics, shared primitives, public CLI help/error
    contracts, focused quality, preflight routes, measured documentation performance,
    and advisory security inventory.
  boundary:
  - malformed-governance-input
  - failure-diagnostics
  - installer-transaction-and-lock
  - shared-deterministic-primitives
  - focused-pytest-contract
  - public-cli-help-errors
  - project-check-system-preflight
  - batched-documentation-diff
  - advisory-security-inventory
  - generated-cli-system-facts-and-scoped-impact-proposal
matrix:
- boundary: malformed-governance-input
  reason: Invalid or structurally malformed hook input must never be interpreted as
    an empty harmless command.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff compared changed modules with origin/main; zero findings added.
    unit:
      applicable: true
      evidence: tests/evidence/governance_command_guard.py passed.
    integration:
      applicable: true
      evidence: tests/validation/governance_resume.py passed malformed JSON, non-object
        payload, missing tool_input, and invalid tool_input cases.
    contract:
      applicable: true
      evidence: Both Claude and Gemini deny envelopes were parsed and asserted by
        governance_resume.py.
    security:
      applicable: true
      evidence: Invalid input returns deny and does not echo the input payload.
    migration_recovery:
      applicable: false
      na_reason: No persisted state changes.
    cli_harness:
      applicable: true
      evidence: Governance hook entrypoint lifecycle passed.
    docs_schema:
      applicable: false
      na_reason: Hook response shape remains unchanged; malformed input is now explicitly
        denied.
    e2e:
      applicable: false
      na_reason: Hook entrypoint and runtime-specific response contracts are exercised
        in local fixtures.
- boundary: failure-diagnostics
  reason: Optional Git/Intelligence probes remain distinguishable from invalid adapter
    state and internal/policy errors fail closed.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff compared changed modules with origin/main; zero findings added.
    unit:
      applicable: true
      evidence: Changed Python modules imported and governance_resume.py passed.
    integration:
      applicable: true
      evidence: Runtime resolver/policy callers remain covered by repository validation;
        exact-candidate Gate pending.
    contract:
      applicable: true
      evidence: Optional Git/Intelligence probes are distinguished from invalid adapter
        state; approval/policy errors remain fail-closed.
    security:
      applicable: true
      evidence: Policy and approval exceptions return deny/ERROR; exception diagnostics
        avoid raw hook payloads.
    migration_recovery:
      applicable: false
      na_reason: No persisted state changes.
    cli_harness:
      applicable: true
      evidence: harness_resolve.py emits an explicit invalid_adapter_state error and
        nonzero status.
    docs_schema:
      applicable: false
      na_reason: No user-facing output schema change beyond explicit error status.
    e2e:
      applicable: false
      na_reason: Runtime resolver and policy failure paths are tested as bounded local
        process contracts.
- boundary: installer-transaction-and-lock
  reason: Install/update must serialize concurrent writers, retry transient Git operations,
    remove partial staging state and promote only a verified checkout.
  checks:
    static_lint:
      applicable: true
      evidence: bash -n scripts/install.sh passed; Ruff changed-file baseline comparison
        has zero added findings.
    unit:
      applicable: true
      evidence: tests/evidence/installer_reliability_lifecycle.py passed.
    integration:
      applicable: true
      evidence: Source-checkout install lifecycle promoted verified checkout and invoked
        CLI fixture.
    contract:
      applicable: true
      evidence: tests/evidence/install_download_lifecycle.py passed with bounded curl
        retry options in Unix/WSL snippets.
    security:
      applicable: true
      evidence: Active locks are preserved; stale locks are reported for explicit
        recovery; partial clones are not promoted.
    migration_recovery:
      applicable: true
      evidence: Active lock, stale lock, success promotion and partial clone cleanup
        lifecycle cases passed.
    cli_harness:
      applicable: true
      evidence: Installer preserved install arguments and source-checkout CLI entrypoint.
    docs_schema:
      applicable: true
      evidence: Installer snippet parity and WSL contract passed; docs now describe
        bounded retry and recovery.
    e2e:
      applicable: true
      evidence: Local temporary Git source installed end-to-end to a separate test
        destination.
- boundary: shared-deterministic-primitives
  reason: Shared canonical serialization, path formatting and glob matching must preserve
    every existing public facade contract while keeping domain-specific fingerprints
    under their current owners.
  checks:
    static_lint:
      applicable: true
      evidence: Focused Ruff F401/I001/SIM102 checks pass for all changed modules;
        full repository validator passes on this candidate branch.
    unit:
      applicable: true
      evidence: tests/evidence/shared_primitives_lifecycle.py checks raw and prefixed
        digest facades, in/outside relative paths, path/glob compatibility vectors
        and domain digest contracts.
    integration:
      applicable: true
      evidence: Full repository validation passes locally; the configured exact-candidate
        Integration Gate must pass on the frozen commit before publication.
    contract:
      applicable: true
      evidence: tests/fixtures/plan21-contract-golden-vectors.yaml pins canonical
        digest bytes and caller-specific path/glob semantics.
    security:
      applicable: true
      evidence: governance_guard and runtime_policy fingerprints remain domain-owned
        and match frozen vectors; the shared package grants no authority.
    migration_recovery:
      applicable: false
      na_reason: No persisted data or installed state changes.
    cli_harness:
      applicable: false
      na_reason: No CLI or runtime hook surface changes in this boundary.
    docs_schema:
      applicable: true
      evidence: Human architecture, conformance, documentation map/sync, maintenance,
        technology guide and Agent conformance/sync topics describe the shared owner
        and limited evidence claim; docs/human/CONFORMANCE_HISTORY_INDEX.md is regenerated
        from the updated Human/Agent section anchors.
    e2e:
      applicable: false
      na_reason: The change is a deterministic helper extraction; facade behavior
        and exact candidate are exercised by lifecycle and Integration Gate contracts.
- boundary: focused-pytest-contract
  reason: Focused pytest coverage must pin the shared primitive contracts while remaining
    a separate advisory workflow.
  checks:
    static_lint:
      applicable: true
      evidence: Targeted Ruff and the repository quality ratchet validate changed
        Python modules.
    unit:
      applicable: true
      evidence: tests/test_aips_common_primitives.py passes under pytest; repository
        validation also runs the same cases directly.
    integration:
      applicable: true
      evidence: Full repository validation exercises the focused test file; the standalone
        workflow installs only the pinned pytest dependency set.
    contract:
      applicable: true
      evidence: Workflow is separate from the required repository aggregate and uses
        pinned checkout/setup-python actions.
    security:
      applicable: true
      evidence: Workflow permissions remain contents read-only and the required candidate
        secret scan is unchanged.
    migration_recovery:
      applicable: false
      na_reason: No persisted state or installation changes.
    cli_harness:
      applicable: false
      na_reason: No public CLI or runtime hook behavior changes.
    docs_schema:
      applicable: true
      evidence: Technology Guide and canonical documentation placement describe focused
        primitive verification.
    e2e:
      applicable: false
      na_reason: The new workflow is a supplementary test lane; the required repository
        Gate remains the end-to-end boundary.
- boundary: project-check-system-preflight
  reason: New CLI routes must preserve read-only status semantics and legacy update-preflight
    compatibility.
  checks:
    static_lint:
      applicable: true
      evidence: Repository quality ratchet and shell syntax checks cover the CLI facade
        changes.
    unit:
      applicable: true
      evidence: Static CLI contracts verify help routes and legacy command visibility.
    integration:
      applicable: true
      evidence: tests/evidence/install_preflight_lifecycle.py passed both preflight
        routes and project status cases.
    contract:
      applicable: true
      evidence: Scenario 232 records exit semantics, no-write behavior and alias compatibility.
    security:
      applicable: true
      evidence: project check invokes only read-only Intelligence status and rejects
        invalid paths before dispatch.
    migration_recovery:
      applicable: false
      na_reason: Commands do not migrate project state; preflight behavior reuses
        the existing recovery path.
    cli_harness:
      applicable: true
      evidence: The isolated AIPS CLI lifecycle fixture exercises canonical and compatibility
