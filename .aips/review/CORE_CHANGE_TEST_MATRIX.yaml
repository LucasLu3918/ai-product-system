version: 1
change:
  id: plan44-publication-command-and-native-failure-diagnostics
  summary: Add privacy-safe command-form detail codes and Claude native execution
    failure evidence while preserving the publication authority model.
  boundary:
  - Unsupported publication commands retain COMMAND_FORM_UNSUPPORTED and gain fixed
    detail_code recovery guidance; pipelines and compound commands remain fail-closed.
  - Claude PostToolUseFailure:Bash reports observed execution failure phase, safe
    category, and parseable exit code; PreToolUse denial remains NOT_EXECUTED.
  - Managed Claude lifecycle installs/removes the independent failure observer; version-bound
    PreToolUse onFailure behavior is unchanged.
  - Existing ALREADY_MERGED/squash-tree evidence, Branch Hygiene cleanup manifest
    and hook health behavior remain unchanged and regression covered.
  - Canonical Human/Agent guidance and Scenario 261 remain synchronized.
matrix:
- boundary: Command-form parsing and diagnostic details
  reason: Operators need safe distinctions for pipes, compound commands, wrappers,
    malformed syntax and upstream push-option refusals while retaining the established
    refusal contract.
  checks:
    static_lint:
      applicable: true
      evidence: 'Required: Ruff, selected static checks, and git diff --check on exact
        candidate.'
    unit:
      applicable: true
      evidence: 'Required on frozen candidate: publication test discovery covers pipe,
        compound, malformed, upstream option and no-command-echo assertions.'
    integration:
      applicable: true
      evidence: 'Required: publication diagnose contract verifies reason/detail code,
        phase, no command echo, no mutation and no grant consumption.'
    contract:
      applicable: true
      evidence: 'Required: Scenario 261 registration and runtime publication contracts.'
    e2e:
      applicable: false
      na_reason: No application UI or server is added; parser and CLI lifecycle contracts
        exercise the affected boundary.
    security:
      applicable: true
      evidence: 'Required: pipe/compound/upstream options remain blocked; private
        sentinel command text is absent from output.'
    migration_recovery:
      applicable: false
      na_reason: No persistent schema migration or recovery workflow change.
    cli_harness:
      applicable: true
      evidence: 'Required: aips publish diagnose output and direct CLI invocation
        contracts.'
    docs_schema:
      applicable: true
      evidence: 'Required: docs placement and synchronization checks.'
- boundary: Claude native execution failure event and redaction
  reason: AIPS must distinguish authorization refusal from a native Bash command that
    started and failed, without revealing host error content or creating authority.
  checks:
    static_lint:
      applicable: true
      evidence: 'Required: Ruff, selected static checks, and git diff --check on exact
        candidate.'
    unit:
      applicable: true
      evidence: 'Required: publication tests cover exit-code/private-sentinel redaction
        and PreToolUse separation.'
    integration:
      applicable: true
      evidence: 'Required: runtime_contracts validates PostToolUseFailure installation/removal
        and settings preservation.'
    contract:
      applicable: true
      evidence: 'Required: Scenario 261 native failure versus NOT_EXECUTED denial
        contracts.'
    e2e:
      applicable: false
      na_reason: A compatible native Claude Code host is unavailable; fixture lifecycle
        proves adapter routing, not live host delivery.
    security:
      applicable: true
      evidence: 'Required: raw error, command, paths and private sentinel do not appear;
        no retry, grant consumption or external mutation.'
    migration_recovery:
      applicable: true
      evidence: 'Required: uninstall removes only AIPS-owned PostToolUseFailure wiring
        and preserves unrelated user settings.'
    cli_harness:
      applicable: true
      evidence: 'Required: managed install/remove lifecycle and Harness shell syntax.'
    docs_schema:
      applicable: true
      evidence: 'Required: Claude adapter and Human/Agent documentation closure.'
