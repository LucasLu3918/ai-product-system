version: 1
change:
  id: opentelemetry-telemetry-export
  summary: Add privacy-safe OpenTelemetry trace projection and optional OTLP export/replay for AIPS run evidence.
  boundary:
  - matrix-readiness-preview-and-gate
  - canceled-workflow-required-aggregate
  - local-validation-guidance-and-documentation-closure
  - durable-run-events-and-telemetry-recording
  - telemetry-projection-and-otlp-export
  - architecture-documentation-and-release
  - publication-readiness-preflight
matrix:
- boundary: matrix-readiness-preview-and-gate
  reason: Preview previously accepted DRAFT, blocked or unreconciled Matrix state
    that exact Gate rejects.
  checks:
    static_lint:
      applicable: true
      evidence: Critical Ruff and Python syntax checks for publication and Gate modules.
    unit:
      applicable: true
      evidence: Matrix readiness cases for DRAFT, blockers, unreconciled actual diff,
        stale base and READY.
    integration:
      applicable: true
      evidence: Publication preview and exact Gate use the same matrix_readiness_issues
        predicate.
    contract:
      applicable: true
      evidence: Existing Gate error messages and candidate binding remain compatible.
    e2e:
      applicable: false
      na_reason: No deployed service; exact-candidate local Gate and PR CI cover publication
        lifecycle.
    security:
      applicable: true
      evidence: Preview returns fixed issue codes without rendering blocker contents;
        Gate remains fail closed.
    migration_recovery:
      applicable: false
      na_reason: No persisted schema changes; matrix-sync still resets readiness for
        review.
    cli_harness:
      applicable: true
      evidence: Local ./bin/aips preview and matrix-sync lifecycle.
    docs_schema:
      applicable: true
      evidence: Core testing, Integration Gate and Human documentation closure validated
        by preview.
- boundary: canceled-workflow-required-aggregate
  reason: A superseded canceled validate run could leave a misleading failed repository
    aggregate.
  checks:
    static_lint:
      applicable: true
      evidence: GitHub Actions expression and workflow contract checked statically.
    unit:
      applicable: true
      evidence: Scheduler Gate static contract requires cancellation-aware job condition
        and Janitor result assertion.
    integration:
      applicable: true
      evidence: Active runs still execute required repository aggregate and fail when
        Janitor fails; PR CI verifies workflow execution before merge.
    contract:
      applicable: true
      evidence: Required context remains repository; Janitor result is still asserted
        success.
    e2e:
      applicable: false
      na_reason: Remote GitHub cancellation behavior is verified on the PR before
        merge, not executable by local Gate.
    security:
      applicable: true
      evidence: Cancellation skips only superseded workflows; active Janitor failures
        remain blocking.
    migration_recovery:
      applicable: false
      na_reason: No branch protection or persisted data migration.
    cli_harness:
      applicable: false
      na_reason: Workflow condition is evaluated by GitHub Actions, not the local
        CLI.
    docs_schema:
      applicable: true
      evidence: Integration Gate and maintenance documentation describe cancellation
        behavior.
- boundary: local-validation-guidance-and-documentation-closure
  reason: Source checkout and sandbox capability mismatches obscured the actual local
    validation result.
  checks:
    static_lint:
      applicable: false
      na_reason: Documentation-only part has no executable syntax.
    unit:
      applicable: false
      na_reason: No new validation behavior; existing environment probes are covered
        by lifecycle tests.
    integration:
      applicable: true
      evidence: Publication preview verifies recursive documentation closure and placement.
    contract:
      applicable: true
      evidence: prepare-local-validation retains ENVIRONMENT_BLOCKED diagnostics and
        full validation requirement.
    e2e:
      applicable: false
      na_reason: No deployed service or additional external integration.
    security:
      applicable: true
      evidence: No credential or private path values are added to validation output.
    migration_recovery:
      applicable: false
      na_reason: No stored records or schema changes.
    cli_harness:
      applicable: true
      evidence: Local source ./bin/aips is used for matrix binding and preview.
    docs_schema:
      applicable: true
      evidence: Maintenance, User Guide, Technology Guide, Architecture and Conformance
        docs close declared impact.
- boundary: durable-run-events-and-telemetry-recording
  reason: Extend append-only run evidence with a bounded telemetry allowlist and lifecycle CLI.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff passed on new telemetry modules and tests; Python compilation and complete repository validation passed.
    unit:
      applicable: true
      evidence: telemetry_export_lifecycle.py passed allowlist, bounds, timestamps, pairing, and deterministic IDs.
    integration:
      applicable: true
      evidence: telemetry_export_lifecycle.py passed recording-to-replay and loopback OTLP receiver integration.
    contract:
      applicable: true
      evidence: telemetry_export_contracts.py passed; legacy event records remain valid and invalid telemetry fields reject.
    e2e:
      applicable: false
      na_reason: No deployed service; the local receiver exercises the full exporter request path.
    security:
      applicable: true
      evidence: Lifecycle rejected secret-like identifiers and content fields without persistence; strict candidate scan is required after commit.
    migration_recovery:
      applicable: true
      evidence: Legacy event loading, deterministic replay, and non-mutating exporter failure checks passed.
    cli_harness:
      applicable: true
      evidence: aips telemetry --help and telemetry lifecycle checks passed.
    docs_schema:
      applicable: true
      evidence: Telemetry schema checks and complete repository validation passed.
- boundary: telemetry-projection-and-otlp-export
  reason: Add deterministic offline projection and explicit host-side OTLP/HTTP JSON delivery.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff and Python compilation passed for telemetry modules and lifecycle/contract tests.
    unit:
      applicable: true
      evidence: Lifecycle checks passed stable IDs, nesting, links, allowlisted attributes, and incomplete evidence degradation.
    integration:
      applicable: true
      evidence: Local receiver verified OTLP envelope, host authorization, server failure, and redirect rejection.
    contract:
      applicable: true
      evidence: Contract checks passed against the pinned immutable GenAI mapping snapshot.
    e2e:
      applicable: false
      na_reason: No remote observability backend is required for the provider-neutral exporter.
    security:
      applicable: true
      evidence: Endpoint, credential, content exclusion, bounds, redaction, and redirect negative paths passed; strict repository source scan passed before commit.
    migration_recovery:
      applicable: true
      evidence: Replay is deterministic and transport failures do not mutate canonical run evidence.
    cli_harness:
      applicable: true
      evidence: Offline and explicit-send CLI lifecycle plus top-level telemetry help passed.
    docs_schema:
      applicable: true
      evidence: Schema, pinned mapping, and exporter docs passed complete repository validation.
- boundary: architecture-documentation-and-release
  reason: Update canonical architecture, user guidance, conformance, and release metadata.
  checks:
    static_lint:
      applicable: true
      evidence: Complete repository validation passed documentation and release metadata contracts.
    unit:
      applicable: false
      na_reason: Documentation and release metadata have no separate runtime behavior.
    integration:
      applicable: true
      evidence: Exact-candidate publication preview and Integration Gate are required before remote merge.
    contract:
      applicable: true
      evidence: Scenario 181 registry and documented CLI/config are checked by telemetry_export_contracts.py.
    e2e:
      applicable: false
      na_reason: No deployment or hosted service is part of this change.
    security:
      applicable: true
      evidence: Strict complete-candidate secret scan is required before publication.
    migration_recovery:
      applicable: false
      na_reason: No durable schema migration; event field is additive.
    cli_harness:
      applicable: true
      evidence: Local aips telemetry command routing and help checks passed.
    docs_schema:
      applicable: true
      evidence: VERSION, CHANGELOG, diagrams, and canonical guidance pass complete repository validation.
- boundary: publication-readiness-preflight
  reason: Make publication work against the explicitly selected checkout, detect local documentation/runtime blockers before the full Gate, and resolve traversal review findings without weakening approval semantics.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff and Python syntax checks cover the CLI, preflight scripts, Change Impact validation and focused lifecycle tests.
    unit:
      applicable: true
      evidence: Focused tests cover explicit-root selection/reporting, environment preflight order, Markdown local-link classification and actionable final-disposition diagnostics.
    integration:
      applicable: true
      evidence: Exact-candidate publish preflight runs repository checks, local VitePress build for documentation changes and the Integration Gate using one selected checkout.
    contract:
      applicable: true
      evidence: CLI/report additive fields, required class-label creation arguments, safe remote-auth diagnostics and fail-closed Change Impact behavior are asserted by contracts.
    e2e:
      applicable: false
      na_reason: There is no deployed service; repository lifecycle checks plus the remote PR CI run cover the publication path.
    security:
      applicable: true
      evidence: Authentication stderr remains redacted, strict exact-candidate secret scanning remains required, and unknown Impact nodes are never auto-approved.
    migration_recovery:
      applicable: false
      na_reason: No persisted schema or external integration state is changed; only ignored retrieval-index metadata is rebuilt.
    cli_harness:
      applicable: true
      evidence: Source CLI and installed CLI with --project-root are checked against the same explicit candidate root.
    docs_schema:
      applicable: true
      evidence: User and maintainer guidance plus orchestration docs describe root selection, local docs/build checks, environment blockers, labels and Change Impact dispositions.

scope_recomputed_after_expansion: true
actual_diff_reconciled: false
blockers:
  - candidate binding refreshed; review scope and evidence before marking READY
candidate:
  base_sha: 59a400e07a450395eff01c60ccb1d5ff07d9c024
  changed_files_hash: 5b88cfcc683be85231953ada20030e287a2b2e89673751a746909a5e4171fc71
review_evidence:
  required: false
  path: .aips/review/INDEPENDENT_REVIEW_EVIDENCE.yaml
status: DRAFT