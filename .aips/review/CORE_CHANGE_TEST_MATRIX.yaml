change:
  id: upstream-optional-skill-install
  summary: Add ownership-safe native install/status/uninstall for eligible vendored upstream Skills.
  boundary:
  - Existing AIPS catalog lifecycle remains the default and unchanged.
  - Upstream optional selection, pinned-source validation, projection, ownership, and selective removal.
  - Codex/Claude Code/Gemini, user/workspace scopes, duplicate canonical IDs, and conflict preservation.
  - CLI lifecycle, Scenario 259, human documentation, and exact candidate publication checks.

