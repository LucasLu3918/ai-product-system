version: 1
change:
  id: plan41-commit-safety-diagnostics
  summary: Add shared commit-safety scanning, structured redacted denials, strict publication scanning, format-aware media handling, and read-only diagnostics.
  boundary:
    - Shared Hook and CLI commit candidate scanning with safe findings
    - Strict ignore marker, media/binary classification, bounded parsing and fail-closed errors
    - Read-only CLI, scenario coverage and recursive documentation closure
matrix:
  - boundary: Shared commit scanner and structured denial diagnostics
    reason: Hook denials must retain actionable causes without exposing protected values, and the CLI must observe the same scan implementation.
    checks:
      static_lint: {applicable: true, evidence: "Ruff delta has no new touched-code findings; three inherited findings match origin/main; git diff --check PASS; final Gate pending"}
      unit: {applicable: true, evidence: "Focused safety/diagnostics/publication regression suite: 96 tests PASS"}
      integration: {applicable: true, evidence: "Focused 96-test suite and full repository validation PASS (263 scenarios)"}
      contract: {applicable: true, evidence: "Plan21 CLI contract baseline and documentation sync/conformance contracts PASS"}
      e2e: {applicable: true, evidence: "Read-only CLI and Hook share staged scanner; HEAD/status/index-hash invariants PASS"}
      security: {applicable: true, evidence: "Strict marker, redacted denial, scanner-failure and fail-closed regression assertions PASS"}
      migration_recovery: {applicable: false, na_reason: "Additive diagnostic output; no persisted schema."}
      cli_harness: {applicable: true, evidence: "aips safety diagnose commit --help and native Hook denial contract PASS"}
      docs_schema: {applicable: true, evidence: "Final publish preview: recursive closure complete; zero missing additions or placement errors"}
  - boundary: Strict scanning, media/binary parsing, and fail-closed classification
    reason: Protected commit content cannot disable scanning; supported formats need bounded parsing and unsupported or incomplete inspection must deny safely.
    checks:
      static_lint: {applicable: true, evidence: "Ruff delta has no new touched-code findings; three inherited findings match origin/main; bounded parser contracts PASS; final Gate pending"}
      unit: {applicable: true, evidence: "PNG/JPEG/WebP/M4A/MP3 extraction and malformed-format tests PASS"}
      integration: {applicable: true, evidence: "Unknown binary, oversize/read failure and scanner exception paths fail closed"}
      contract: {applicable: true, evidence: "Protected scans use strict marker handling; existing Secret/PII/Injection BLOCK policy retained"}
      e2e: {applicable: true, evidence: "Full repository validation PASS, 263 scenarios"}
      security: {applicable: true, evidence: "No matched content or raw exception reaches Hook/CLI denial; malformed and unsupported data denied"}
      migration_recovery: {applicable: false, na_reason: "No persisted state or format migration."}
      cli_harness: {applicable: true, evidence: "Hook and CLI share strict staged candidate classification; fail-closed reasons stable"}
      docs_schema: {applicable: true, evidence: "Human security and maintenance guidance plus Scenario 263 closure PASS"}
  - boundary: Read-only CLI, scenario/conformance, and documentation closure
    reason: Operators need safe local diagnostics while publication authority remains unchanged and documented across affected consumers.
    checks:
      static_lint: {applicable: true, evidence: "Ruff delta has no new touched-code findings; three inherited findings match origin/main; docs placement and diff checks PASS; final Gate pending"}
      unit: {applicable: true, evidence: "CLI diagnosis, message-file failures, redaction and read-only behavior tests PASS"}
      integration: {applicable: true, evidence: "Full repository validation PASS; Scenario 263 lifecycle is registered"}
      contract: {applicable: true, evidence: "CLI routing/help and stable golden vectors PASS"}
      e2e: {applicable: true, evidence: "Full repository validation PASS, 263 scenarios; exact-candidate Gate pending"}
      security: {applicable: true, evidence: "Diagnostics do not mutate Git or grant commit/publication authority"}
      migration_recovery: {applicable: false, na_reason: "No persisted state migration."}
      cli_harness: {applicable: true, evidence: "aips safety diagnose commit --help PASS; shared read-only CLI/Hook behavior covered"}
      docs_schema: {applicable: true, evidence: "AIPS recursive documentation preview complete; Scenario/conformance projections regenerated"}
