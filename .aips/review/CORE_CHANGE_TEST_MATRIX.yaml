change:
  id: design3-creative-authorization
  summary: Trusted prompt grants and resumable local multi-character generation.
  boundary:
  - Native OpenCode prompt-admission authorization
  - Creative executor and CLI set orchestration
  - Local engine health, output/job state and safe resume
  - OpenCode runtime, privacy, docs, scenarios and capability projections
matrix:
- boundary: Prompt grant authority and lifecycle
  reason: Changes authorization source and lifetime for creative mutations.
  checks:
    static_lint:
      applicable: true
      evidence: tests/validation/opencode_integration_contracts.py and git diff --check.
    unit:
      applicable: true
      evidence: Grant source/session/workspace/action/scope/count, revocation and
        reason-code cases.
    integration:
      applicable: true
      evidence: OpenCode prompt admission and native creative tool callback lifecycle.
    contract:
      applicable: true
      evidence: Read-only actions and additive tool/CLI schema remain compatible.
    e2e:
      applicable: true
      evidence: Mock OpenCode prompt to grant to tool call with long Context and cancellation/task
        switch.
    security:
      applicable: true
      evidence: Forged context, wrong session/root, revocation and privacy negative
        paths.
    migration_recovery:
      applicable: false
      na_reason: Grants are in-memory and fail closed after plugin restart.
    cli_harness:
      applicable: true
      evidence: Native prompt hook and plugin tool lifecycle.
    docs_schema:
      applicable: true
      evidence: OpenCode compatibility, instructions, scenario and route projections.
- boundary: Configured-Bundle batch execution and recovery
  reason: Adds collection/job templates and resumable per-item state for configured Bundles.
  checks:
    static_lint:
      applicable: true
      evidence: tests/validation/creative_execution_contracts.py and git diff --check.
    unit:
      applicable: true
      evidence: Manifest schema, confinement, item/output limits, and result transitions.
    integration:
      applicable: true
      evidence: Stub executor; continue after failure, recover an orphaned success, verify hashes and resume without overwrite.
    contract:
      applicable: true
      evidence: Existing Bundle v1 and single-item behavior remain valid.
    e2e:
      applicable: true
      evidence: One generate-set request creates validated fake rasters and collection
        status.
    security:
      applicable: true
      evidence: Symlink/path escape, duplicate IDs, existing targets and command rejection.
    migration_recovery:
      applicable: true
      evidence: Legacy workspaces unchanged; interrupted staging cleanup and partial-job
        resume.
    cli_harness:
      applicable: true
      evidence: Fixed new CLI action plus existing creative CLI regression.
    docs_schema:
      applicable: true
      evidence: Versioned collection/job templates and user docs.
- boundary: Local engine discovery and health
  reason: Select only verified local providers with no downloads or cloud fallback.
  checks:
    static_lint:
      applicable: true
      evidence: creative execution contracts and fixed-command discovery lifecycle.
    unit:
      applicable: true
      evidence: Missing executable/model, incompatible operation and local-only diagnostics.
    integration:
      applicable: true
      evidence: Stub executables/loopback; prove discover/preflight never infer.
    contract:
      applicable: true
      evidence: Stable discovery result consumed by generate-set.
    e2e:
      applicable: false
      na_reason: Real model weights/inference are not required to verify this boundary.
    security:
      applicable: true
      evidence: No arbitrary command, network egress, model download, proxy or remote
        ComfyUI.
    migration_recovery:
      applicable: false
      na_reason: No engine installation/configuration migration.
    cli_harness:
      applicable: true
      evidence: Read-only discovery and deterministic local provider selection.
    docs_schema:
      applicable: true
      evidence: Document health and missing-engine limits.
- boundary: Docs, projections and exact candidate publication
