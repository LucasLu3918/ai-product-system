version: 1
change:
  id: plan17-t06-effectiveness-concurrency
  summary: >
    Serialize scheduled and manual Evolution Effectiveness writes to the same monthly Issue without cancelling pending or in-progress evidence.
  boundary:
    - Scope concurrency by repository and requested cohort; schedule and default-period dispatch share one group, while explicitly requested months remain separate.
    - "Preserve up to 100 pending runs with queue: max and cancel-in-progress: false."
    - Preserve schedule, workflow_dispatch, job identity, Issue content, permissions, and existing Human authority.
    - Update Scenario 207 lifecycle evidence and the recursive canonical documentation closure.
