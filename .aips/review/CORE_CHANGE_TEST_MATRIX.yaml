      unit: {applicable: true, evidence: project_diagnostics_lifecycle missing, partial, stale, blocked, malformed and failure cases.}
      integration: {applicable: true, evidence: harness_runtime_lifecycle and local read-only aips project diagnose / aips doctor comparison.}
      contract: {applicable: true, evidence: Stable reason codes, read-only marker, safe next actions, output privacy and Doctor non-zero propagation.}
