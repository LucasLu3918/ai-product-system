    sheets.
  boundary:
  - character/style profiles and provenance manifest
  - SVG/PNG path, content, dimension and hash validation
  - deterministic SVG character sheet composition and Chinese labels
  - existing creative Skills, evidence compatibility and local runtime guidance
  - lifecycle evidence, Scenario 234, documentation and architecture closure
