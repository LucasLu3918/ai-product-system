- boundary: openapi-generator-adapter-execution-and-rollback
  reason: Only explicit local execution may invoke the pinned client generator; stale, unsafe or hand-edited outputs must not be applied.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff critical lint and compilation cover the adapter, Profile validator and lifecycle fixture.
    unit:
      applicable: true
      evidence: Profile and report schema contracts cover legacy defaults, declared inputs, path safety and preview invariants.
    integration:
      applicable: true
      evidence: Scenario 196 runs the fixture generator in temporary Git repositories and verifies the exact Integration Gate check.
    contract:
      applicable: true
      evidence: Profile adapter contract and versioned report schema bind paths, executable/input/output hashes and state transitions.
    e2e:
      applicable: false
      na_reason: AIPS has no production OpenAPI client target; isolated Git fixtures verify the reusable local adapter contract.
    security:
      applicable: true
      evidence: Lifecycle checks shell-free argv, revision-bound evidence, staged inputs, bounded timeout/output, allowlists, symlink rejection, edit protection and rollback; no OS sandbox is claimed.
    migration_recovery:
      applicable: true
      evidence: Additive Profile defaults preserve older files; injected Profile replacement failure verifies restoration of prior generated output.
    cli_harness:
      applicable: true
      evidence: Preview is the default and only --execute invokes the generator; JSON report schema and exit states are tested.
    docs_schema:
      applicable: true
      evidence: Recursive documentation placement, links, human/agent synchronization and docs site build cover Scenario 196.
- boundary: optional-generator-report-binding
  reason: An opted-in Profile must reject missing or stale Phase 4 execution evidence without changing legacy Profiles.
  checks:
    static_lint: {applicable: true, evidence: Ruff critical lint and Python compile.}
    unit: {applicable: true, evidence: Profile structural contracts and unchanged legacy lifecycle.}
    integration: {applicable: true, evidence: Scenario 197 exact-candidate Phase 3 inspector against a generated client.}
    contract: {applicable: true, evidence: Report schema, fingerprint, revision, tool, input, output and provenance bindings.}
    e2e: {applicable: true, evidence: Reference client runs against a loopback API before inspector PASS.}
    security: {applicable: true, evidence: Missing or tampered reports block; inspection never executes the generator.}
    migration_recovery: {applicable: false, na_reason: Optional additive Profile field requires no migration.}
    cli_harness: {applicable: true, evidence: Phase 3 inspect report and enforce modes retain existing entry points.}
    docs_schema: {applicable: true, evidence: Scenario 197 and synchronized Human guidance.}
- boundary: shared-openapi-client-reference-pilot
  reason: One executable reference verifies workflow behavior without claiming acceptance for other products.
  checks:
    static_lint: {applicable: true, evidence: Ruff critical lint and Python compile on example and lifecycle.}
    unit: {applicable: true, evidence: Generator verifies supported canonical contract operations and security shape.}
    integration: {applicable: true, evidence: Create/get, errors, Unicode JSON and bearer auth against local HTTP service.}
    contract: {applicable: true, evidence: Phase 2 OpenAPI validity and JUnit operation coverage reports.}
    e2e: {applicable: true, evidence: Temporary standalone Git product runs Phase 2 through Phase 4 and Phase 3.}
    security: {applicable: true, evidence: Only fake local bearer token, bounded generator output and hand-edit protection.}
    migration_recovery: {applicable: true, evidence: Existing Phase 4 rollback fixture plus no product migration.}
    cli_harness: {applicable: true, evidence: Preview, explicit execution and exact-candidate inspector lifecycle.}
    docs_schema: {applicable: true, evidence: Example README and Scenario 197 explain multi-product ownership.}
