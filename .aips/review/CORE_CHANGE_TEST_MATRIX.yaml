version: 1
change:
  id: validate-pr-event-concurrency
  summary: Isolate GitHub pull-request lifecycle validation runs by event action,
    keep required validation checks fail-closed, and safely fast-forward local main
    after a merge while preserving backups and refusing divergent history.
  boundary:
  - ci-validation-publication
matrix:
- boundary: ci-validation-publication
  reason: Pull-request event scheduling, required validation evidence, and post-merge
    local ref recovery are one publication lifecycle; event runs must remain isolated
    while failed validation and divergent Git history stay fail-closed.
  checks:
    static_lint:
      applicable: true
      evidence: Python compilation and the repository validator pass; CI runs the
        configured Ruff rules on the exact PR candidate.
    unit:
      applicable: true
      evidence: publish_preflight_lifecycle.py passes clean post-merge fast-forward
        and divergent-history refusal fixtures.
    integration:
      applicable: true
      evidence: Temporary Git repositories exercise backup preservation, local main
        fast-forward, remote reachability, and no ref mutation when local history diverges.
    contract:
      applicable: true
      evidence: static_contracts.py checks action-scoped concurrency groups and allows
        cancellation only for superseded synchronize and push runs.
    e2e:
      applicable: false
      na_reason: GitHub-hosted opened and labeled event delivery cannot run locally;
        the exact PR Actions checks provide this publication-only end-to-end evidence.
    security:
      applicable: true
      evidence: Required Integration Gate candidate scanning and protected required
        validation checks remain fail-closed; cancellation is limited to superseded runs.
    migration_recovery:
      applicable: true
      evidence: publish_preflight_lifecycle.py confirms clean ancestor fast-forward
        preserves a local backup and divergent history is rejected before changing refs.
    cli_harness:
      applicable: true
      evidence: publish_preflight_lifecycle.py exercises the publish_preflight
        post-merge command against isolated local Git repositories.
    docs_schema:
      applicable: true
      evidence: Scenario 165 and the architecture, maintenance, security, technology,
        user, scheduler, orchestrator, Integration Gate, and core testing documentation
        describe matching event and recovery behavior; architecture diagrams are unaffected.
scope_recomputed_after_expansion: true
