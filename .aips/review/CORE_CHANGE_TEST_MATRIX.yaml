version: 1

candidate:
  base_sha: 1c276d93cfe1f7008d2132ec0e1f7e9a539e10a8
  changed_files_hash: 0bd8a0c31ab65b4f9a01062f1faa8834b9e2aec71a9fd180d8706ada00ab1b5b

change:
  id: ci-retrospective-hardening
  summary: Ensure declared tests execute, preview complete working-tree publication impact, safely bind Core Matrix evidence, rerun CI on classification changes and report actionable environment blockers.
  boundary:
    - test-execution-fidelity
    - working-tree-publication-preview-and-document-closure
    - exact-core-matrix-and-change-class-binding
    - truthful-validation-environment-diagnostics
    - documentation-and-scenario-conformance

matrix:
  - boundary: test-execution-fidelity
    reason: Security and lifecycle checks must execute a known number of tests and fail when the runner collects none or reports no summary.
    checks:
      static_lint: {applicable: true, evidence: "Ruff critical checks and Python compilation"}
      unit: {applicable: true, evidence: "tests/test_content_safety.py executes five unittest cases"}
      integration: {applicable: true, evidence: "tests/evidence/integration_gate_lifecycle.py tests expected-count enforcement"}
      contract: {applicable: true, evidence: "config/integration-gate.yaml expected_test_count binding"}
      e2e: {applicable: false, na_reason: "No browser product surface changes; repository lifecycle is exercised directly"}
      security: {applicable: true, evidence: "secret, PII, SHA false-positive and valid-card cases"}
      migration_recovery: {applicable: false, na_reason: "No persisted application schema changes"}
      cli_harness: {applicable: true, evidence: "exact-candidate Integration Gate runner"}
      docs_schema: {applicable: true, evidence: "Core Matrix profile contract and Scenario 165"}
  - boundary: working-tree-publication-preview-and-document-closure
    reason: Pre-commit planning must include committed, staged, unstaged and untracked paths and explain recursive documentation requirements.
    checks:
      static_lint: {applicable: true, evidence: "Ruff and documentation placement"}
      unit: {applicable: true, evidence: "tests/evidence/publish_preflight_lifecycle.py preview path/closure assertions"}
      integration: {applicable: true, evidence: "Scenario 165 and repository preflight"}
      contract: {applicable: true, evidence: "aips publish preview structured output and required_by mapping"}
      e2e: {applicable: false, na_reason: "CLI preview has deterministic local contract evidence; no browser UI is involved"}
      security: {applicable: true, evidence: "preview preserves sink-aware candidate safety and final exact-candidate Gate"}
      migration_recovery: {applicable: false, na_reason: "No persistent data migration"}
      cli_harness: {applicable: true, evidence: "aips publish preview CLI"}
      docs_schema: {applicable: true, evidence: "documentation sync and placement closure"}
  - boundary: exact-core-matrix-and-change-class-binding
    reason: Core Matrix hashes and PR classification must remain bound to the actual candidate; rebinding invalidates prior readiness and label changes rerun CI.
    checks:
      static_lint: {applicable: true, evidence: "Ruff critical checks and workflow contract validation"}
      unit: {applicable: true, evidence: "matrix-sync idempotence and stale binding lifecycle tests"}
      integration: {applicable: true, evidence: "exact base/head Integration Gate and PR label event workflow"}
      contract: {applicable: true, evidence: "Core Matrix candidate base/hash and required status"}
      e2e: {applicable: false, na_reason: "GitHub event wiring and resolver behavior are covered by workflow and lifecycle contracts"}
      security: {applicable: true, evidence: "stale or unreviewed Matrix remains blocked"}
      migration_recovery: {applicable: false, na_reason: "Review metadata format remains backward compatible"}
      cli_harness: {applicable: true, evidence: "aips publish matrix-sync and validate workflow"}
      docs_schema: {applicable: true, evidence: "Core Change Testing and publication guidance"}
  - boundary: truthful-validation-environment-diagnostics
    reason: Local Python dependency, localhost and browser constraints must return actionable environment evidence without misclassifying product failures.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation and shell syntax"}
      unit: {applicable: true, evidence: "deterministic denied-socket and browser diagnostic lifecycle test"}
      integration: {applicable: true, evidence: "publish preflight environment contract"}
      contract: {applicable: true, evidence: "ENVIRONMENT_BLOCKED diagnostic shape and next_step fields"}
      e2e: {applicable: false, na_reason: "No user-facing browser product changes"}
      security: {applicable: true, evidence: "environment blockers remain separate from content-safety and authorization results"}
      migration_recovery: {applicable: false, na_reason: "No persistent state change"}
      cli_harness: {applicable: true, evidence: "aips doctor, publish environment and Python runtime selection"}
      docs_schema: {applicable: true, evidence: "Maintenance and publication diagnostics guidance"}
  - boundary: documentation-and-scenario-conformance
    reason: Narrowed CLI/install placement, test-count behavior and preview/matrix contracts must remain discoverable in canonical topics and Scenario 165.
    checks:
      static_lint: {applicable: true, evidence: "documentation sync, placement and audience validators"}
      unit: {applicable: true, evidence: "Scenario registry and documentation contract checks"}
      integration: {applicable: true, evidence: "tests/validate_repository.py"}
      contract: {applicable: true, evidence: "canonical docs and scoped placement rules"}
      e2e: {applicable: false, na_reason: "Documentation changes do not create a browser product flow"}
      security: {applicable: true, evidence: "documentation preserves merge authority and fail-closed matrix readiness"}
      migration_recovery: {applicable: false, na_reason: "No schema migration"}
      cli_harness: {applicable: true, evidence: "repository validation entrypoint"}
      docs_schema: {applicable: true, evidence: "Scenario 165 and Human/Agent documentation"}

scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
status: READY
