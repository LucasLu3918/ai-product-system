version: 1
change:
  id: plan16-p16-06-dependency-risk-classification
  summary: Classify dependency updates and recommend risk-based validation plans without authorizing automatic merges or policy edits.
  boundary:
  - Versioned dependency policy maps supported package ecosystems and exact names to explicit risk classes.
  - Offline classify, plan and report commands produce deterministic evidence; unknown packages fail closed to high risk and human review.
  - Scenario 221, validator contracts and canonical documentation placement keep policy, CLI and authority boundaries aligned.
