version: 1
change:
  id: guard-false-denials-20261020
  summary: Stop the publication guard from denying read-only commands and standard commit forms, keep publication-capable
    forms denied, make untracked files non-blocking for publication, and report stable classification reason codes.
  boundary:
    - Shell command classification for read-only Git/GitHub forms and Git aliases
    - Commit content inspection for heredoc messages, chained git add, -a/-am and --amend
    - Publication worktree validation for untracked files
    - Command-classification diagnostics and documentation closure
matrix:
  - boundary: Shell command classification for read-only Git/GitHub forms and Git aliases
    reason: The guard denied read-only commands with dynamic context, gh api GET, git lfs and aliases; every newly allowed
      form needs a still-denied publication-capable counterpart.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff critical selection and quality ratchet passed; git diff --check clean."}
      unit: {applicable: true, evidence: "PASS: tests/test_publication_authority.py 50 tests, including GuardFalseDenialTest classification and alias tables."}
      integration: {applicable: true, evidence: "PASS: governance_command_guard, runtime_policy contract and native hook lifecycle evidence."}
      contract: {applicable: true, evidence: "PASS: full repository validator with 266 registered scenarios; Scenario 099 updated and evidence registered."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed; the native hook is exercised through its CLI.}
      security: {applicable: true, evidence: "PASS: dynamic git/gh/shell executables, dynamic -c/--config-env/--exec-path, API writes, LFS push/lock and publication aliases stay denied."}
      migration_recovery: {applicable: false, na_reason: No persistent data or configuration migration; rollback is a PR revert.}
      cli_harness: {applicable: true, evidence: "PASS: claude-code hook subprocess allows read-only forms and denies publication forms with stable codes."}
      docs_schema: {applicable: true, evidence: "PASS: exact-candidate Documentation Impact complete with zero required additions."}
  - boundary: Commit content inspection for heredoc messages, chained git add, -a/-am and --amend
    reason: Standard commit forms were denied; supporting them must not skip content that the commit would include or let a
      heredoc hide commands.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff critical selection and quality ratchet passed."}
      unit: {applicable: true, evidence: "PASS: heredoc inlining, delimiter-line, comment and unquoted-delimiter cases; literal backticks and $ allowed, expansions denied."}
      integration: {applicable: true, evidence: "PASS: staged and worktree secrets block through git add chains, subdirectory pathspecs, -a and -am."}
      contract: {applicable: true, evidence: "PASS: Scenario 169 updated; content safety suite 16 tests and safety diagnostics 17 tests passed."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: ambiguous injection REVIEW still blocks message and staged content with CONTENT_REVIEW_REQUIRED; heredoc delimiter injection denied."}
      migration_recovery: {applicable: false, na_reason: No persistent data migration; rollback is a PR revert.}
      cli_harness: {applicable: true, evidence: "PASS: hook subprocess allows the standard heredoc commit and denies unsupported chains."}
      docs_schema: {applicable: true, evidence: "PASS: Content Safety Boundary and runtime docs record the commit forms and unchanged REVIEW blocking."}
  - boundary: Publication worktree validation for untracked files
    reason: Untracked files are never part of a pushed candidate, but blocked push and PR as WORKTREE_DIRTY.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff critical selection and quality ratchet passed."}
      unit: {applicable: true, evidence: "PASS: worktree_dirty_details reports untracked paths with CLEAN status and DIRTY for tracked edits."}
      integration: {applicable: true, evidence: "PASS: tests/test_publication_planning.py 30 tests, including an untracked-only push plan and tracked-edit WORKTREE_DIRTY."}
      contract: {applicable: true, evidence: "PASS: publication diagnostics suite 17 tests; Integration Gate clean-worktree requirement unchanged."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: uncommitted tracked changes still block push, PR and post-merge reconciliation."}
      migration_recovery: {applicable: false, na_reason: The diagnostic adds one field; no stored data changes.}
      cli_harness: {applicable: true, evidence: "PASS: publication prepare plans a push with only untracked files present."}
      docs_schema: {applicable: true, evidence: "PASS: User Guide, Integration Gate and Security Assurance record the semantics."}
  - boundary: Command-classification diagnostics and documentation closure
    reason: Classification denials surfaced INTERNAL_DIAGNOSTIC_GAP instead of the denial's own reason code.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff critical selection and quality ratchet passed."}
      unit: {applicable: true, evidence: "PASS: every CommandError reason code maps to PUBLICATION_DIAGNOSTICS with Traditional Chinese detail."}
      integration: {applicable: true, evidence: "PASS: hook denial text and additionalContext report the same reason code."}
      contract: {applicable: true, evidence: "PASS: full repository validator and exact-candidate Documentation Impact."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: diagnostics stay redacted and never echo command text."}
      migration_recovery: {applicable: false, na_reason: No persistent data migration.}
      cli_harness: {applicable: true, evidence: "PASS: claude-code hook subprocess diagnostics."}
      docs_schema: {applicable: true, evidence: "PASS: Documentation Impact complete for the exact candidate."}
