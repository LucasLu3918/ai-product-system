change:
  id: plan29-security-dependency-governance-20261011
  summary: Record Plan29 #11 as satisfied by existing verified/unknown governance snapshots, narrow secret fingerprints, exact-candidate dependency findings, and categorized dependency impact evidence.
  boundary:
    - Preserve VERIFIED only for complete governance snapshots; unreadable rulesets or branch protection remain UNKNOWN, and the stable digest identifies normalized evidence without changing policy.
    - Preserve narrow secret handling: never emit secret values, expose only SHA-256 prefix fingerprints, fail closed on unreadable or oversized candidate files, and scan exact candidate history.
    - Preserve seven explicit dependency risk classes, high-risk UNCLASSIFIED fallback, categorized validation plans, exact base/head evidence, and no automatic merge or policy mutation.
    - This candidate changes only Plan29 tracking and its Core Change Matrix; scanners, dependency policy, workflows, GitHub settings, and global Impact Graph coverage remain unchanged.
