version: 1
change:
  id: plan17-t03-unreleased-readiness
  summary: Block read-only release readiness while CHANGELOG.md has a missing, duplicate,
    malformed, or non-empty canonical Unreleased section.
  boundary:
  - Require exactly one canonical top-level '## Unreleased' heading and an empty section
    before stable readiness.
  - Preserve exact candidate/main SHA, VERSION, existing-tag provenance, explicit
    release approval, no-backfill, and read-only workflow contracts.
  - Extend lifecycle and validation contracts plus Scenario 208 and concise Human/Agent
    guidance.
  - No tag or release creation, movement, deletion, installer policy or workflow permission
    changes.
