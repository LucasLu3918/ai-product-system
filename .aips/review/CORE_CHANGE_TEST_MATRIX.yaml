version: 1
candidate:
  base_sha: 919bab5f7d0205573cac1ee7a1241a971efa548b
  changed_files_hash: 6efc74db595c015443115282406ce7771b5a156c5602625649f6661270450669
change:
  id: risk-adaptive-bounded-impact
  summary: Add local bounded multi-hop caller and consumer impact traversal with explicit evidence and truthful incomplete states.
  boundary:
    - bounded-code-relation-index
    - risk-adaptive-caller-consumer-traversal
    - affected-but-unchanged-disposition
    - explicit-unknown-truncation-and-history-evidence
    - candidate-ground-truth-evaluation
    - change-impact-ready-and-compatibility
    - docs-scenarios-and-architecture
matrix:
  - boundary: bounded-code-relation-index
    reason: Rebuildable symbol relations are the evidence source for caller traversal.
    checks:
      static_lint: {applicable: true, evidence: Python compile and static contracts}
      unit: {applicable: true, evidence: extraction boundaries, exact identifiers and secret exclusions}
      integration: {applicable: true, evidence: force rebuild index against a temporary repository}
      contract: {applicable: true, evidence: schema version and index metadata}
      e2e: {applicable: false, na_reason: No UI}
      security: {applicable: true, evidence: secret paths/content excluded from relation index}
      migration_recovery: {applicable: true, evidence: old index upgrade or deterministic full rebuild}
      cli_harness: {applicable: true, evidence: AIPS intelligence index/retrieve lifecycle}
      docs_schema: {applicable: true, evidence: Project Intelligence docs}
  - boundary: risk-adaptive-caller-consumer-traversal
    reason: Risk class, direction, hop depth, cycle handling and budgets determine impact coverage.
    checks:
      static_lint: {applicable: true, evidence: Python compile and static contracts}
      unit: {applicable: true, evidence: direct caller, caller's caller, leaf, fan-out and cycle cases}
      integration: {applicable: true, evidence: synthetic multi-file repository traversal}
      contract: {applicable: true, evidence: deterministic status, depth and stop-reason fields}
      e2e: {applicable: false, na_reason: No UI}
      security: {applicable: true, evidence: bounded resource use and unknown on unresolved critical edges}
      migration_recovery: {applicable: false, na_reason: Run-local computation over disposable index}
      cli_harness: {applicable: true, evidence: command/query output round-trip}
      docs_schema: {applicable: true, evidence: traversal policy and examples}
  - boundary: affected-but-unchanged-disposition
    reason: Affected consumers may be outside the changed-file set and must get an explicit disposition.
    checks:
      static_lint: {applicable: true, evidence: Python compile}
      unit: {applicable: true, evidence: API array-to-object with Vue map consumer}
      integration: {applicable: true, evidence: adapter-safe and direct-consumer contrast fixtures}
      contract: {applicable: true, evidence: changed/affected/disposition schema}
      e2e: {applicable: false, na_reason: No UI}
      security: {applicable: true, evidence: no automatic edit or readiness claim without review}
      migration_recovery: {applicable: true, evidence: legacy artifact reads remain valid}
      cli_harness: {applicable: true, evidence: impact artifact CLI validation}
      docs_schema: {applicable: true, evidence: Change Impact template/docs}
  - boundary: explicit-unknown-truncation-and-history-evidence
    reason: Static relations are incomplete and resource limits must not produce false completeness.
    checks:
      static_lint: {applicable: true, evidence: Python compile}
      unit: {applicable: true, evidence: dynamic DI unknown, stale index, max depth/fan-out truncation}
      integration: {applicable: true, evidence: candidate status for unresolved frontier}
      contract: {applicable: true, evidence: exact/inferred/unresolved and history provenance}
      e2e: {applicable: false, na_reason: No UI}
      security: {applicable: true, evidence: high-risk unresolved/truncated cannot claim complete}
      migration_recovery: {applicable: false, na_reason: Run-local evidence}
      cli_harness: {applicable: true, evidence: stale-index degraded path}
      docs_schema: {applicable: true, evidence: explicit completeness limits}
  - boundary: candidate-ground-truth-evaluation
    reason: Default adoption requires measurable benefit over existing retrieval and review behavior.
    checks:
      static_lint: {applicable: true, evidence: Evaluation schema contracts}
      unit: {applicable: true, evidence: metric calculations and thresholds}
      integration: {applicable: true, evidence: current vs candidate replay}
      contract: {applicable: true, evidence: deterministic report fingerprint}
      e2e: {applicable: false, na_reason: No user workflow UI}
      security: {applicable: true, evidence: synthetic repo only; no source upload}
      migration_recovery: {applicable: false, na_reason: Evaluation reports are disposable}
      cli_harness: {applicable: true, evidence: trial/evaluation command lifecycle}
      docs_schema: {applicable: true, evidence: case corpus and metric definitions}
  - boundary: change-impact-ready-and-compatibility
    reason: Existing READY diff checks must remain and consume impact evidence additively.
    checks:
      static_lint: {applicable: true, evidence: Python compile and repository validation}
      unit: {applicable: true, evidence: valid/invalid statuses, scope, truncation and legacy artifacts}
      integration: {applicable: true, evidence: Scenario and real temporary Git reconciliation}
      contract: {applicable: true, evidence: CHANGE_IMPACT schema and CLI output}
      e2e: {applicable: false, na_reason: Governance CLI has no UI}
      security: {applicable: true, evidence: unknown high-risk consumer fails closed}
      migration_recovery: {applicable: true, evidence: old DRAFT/READY compatibility and rollback}
      cli_harness: {applicable: true, evidence: impact-validate command lifecycle}
      docs_schema: {applicable: true, evidence: template and protocol}
  - boundary: docs-scenarios-and-architecture
    reason: Agent and human workflow, diagrams and scenario coverage must match adopted behavior.
    checks:
      static_lint: {applicable: true, evidence: markdown/schema validators}
      unit: {applicable: false, na_reason: Documentation only}
      integration: {applicable: true, evidence: repository validation and scenario coverage}
      contract: {applicable: true, evidence: doc contract assertions}
      e2e: {applicable: false, na_reason: No UI}
      security: {applicable: true, evidence: no claims of compiler-grade completeness}
      migration_recovery: {applicable: false, na_reason: No persistent docs data}
      cli_harness: {applicable: false, na_reason: Documentation only}
      docs_schema: {applicable: true, evidence: documentation impact and diagram checks}
scope_recomputed_after_expansion: false
blockers: []
actual_diff_reconciled: true
status: READY
