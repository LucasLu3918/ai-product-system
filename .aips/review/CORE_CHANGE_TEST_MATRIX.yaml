version: 1

candidate:
  base_sha: 0ca1aa5686d572731a2abf28482f054d089dec79
  changed_files_hash: 9982c95fbf882a2ce449b58ce96e88430043840f391b5b05198153c32958e9a3

change:
  id: publication-ci-and-docs-hardening
  summary: Enforce privacy-safe commit publication, narrow EARS test-only documentation impact, make Python lifecycle subprocesses use the active interpreter, and stabilize Actions runtime and runner versions.
  boundary:
    - public-commit-identity-and-content-safety
    - recursive-documentation-impact-and-fast-precheck
    - python-lifecycle-runtime-consistency
    - github-actions-runtime-and-runner
    - documentation-and-release-procedure

matrix:
  - boundary: public-commit-identity-and-content-safety
    reason: Public commits must use approved GitHub noreply author and committer identities; every commit message in the candidate range must pass sink-aware content safety without exposing rejected values.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation and publish preflight contracts"}
      unit: {applicable: true, evidence: "publish_preflight_lifecycle validates allowed and rejected identities without echoing email values"}
      integration: {applicable: true, evidence: "Exact candidate publication preflight checks base..head commit range"}
      contract: {applicable: true, evidence: "config/git-publication.yaml policy and commit message safety report"}
      e2e: {applicable: false, na_reason: "No user-facing product flow"}
      security: {applicable: true, evidence: "Rejected PII remains redacted; author, committer, and all candidate messages are checked"}
      migration_recovery: {applicable: false, na_reason: "No persisted application data or schema change"}
      cli_harness: {applicable: true, evidence: "aips publish preflight against exact base/head"}
      docs_schema: {applicable: true, evidence: "Publication policy and manual GitHub merge procedure in canonical docs"}
  - boundary: recursive-documentation-impact-and-fast-precheck
    reason: EARS test contract-only changes require Scenario Conformance docs while feature, template, and canonical requirement changes retain full Requirement Planning closure; CI should fail before expensive browser installation when docs are incomplete.
    checks:
      static_lint: {applicable: true, evidence: "Documentation sync/placement validators"}
      unit: {applicable: true, evidence: "publish_preflight_lifecycle asserts test-only and source-feature impact closures"}
      integration: {applicable: true, evidence: "aips publish preview and full repository validation"}
      contract: {applicable: true, evidence: "validate workflow requires complete docs-impact before full dependency installation"}
      e2e: {applicable: false, na_reason: "No UI changes"}
      security: {applicable: true, evidence: "Fail-closed docs closure remains authoritative in full publication preflight"}
      migration_recovery: {applicable: false, na_reason: "No migration"}
      cli_harness: {applicable: true, evidence: "aips docs impact --require-complete and publish preview"}
      docs_schema: {applicable: true, evidence: "Recursive closure and scoped EARS documentation contract"}
  - boundary: python-lifecycle-runtime-consistency
    reason: Lifecycle subprocesses must use the same interpreter and dependencies as their parent validator to prevent environment-dependent command-not-found and missing-package failures.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation"}
      unit: {applicable: true, evidence: "Scheduler, branch-hygiene, evolution-governance, and integration-gate lifecycle tests"}
      integration: {applicable: true, evidence: "Full tests/validate_repository.py passed"}
      contract: {applicable: true, evidence: "Lifecycle runners reference sys.executable"}
      e2e: {applicable: false, na_reason: "No product UI changes"}
      security: {applicable: false, na_reason: "No security boundary change in lifecycle runners"}
      migration_recovery: {applicable: false, na_reason: "No persisted state change"}
      cli_harness: {applicable: true, evidence: "Tests execute through current environment interpreter"}
      docs_schema: {applicable: true, evidence: "Execution isolation and deterministic scheduler guidance"}
  - boundary: github-actions-runtime-and-runner
    reason: Keep hosted runner image predictable and replace artifact action versions that rely on retired Node 20 with a pinned supported release.
    checks:
      static_lint: {applicable: true, evidence: "Workflow YAML validation and repository health contracts"}
      unit: {applicable: true, evidence: "repository_health_contracts validates immutable artifact action SHAs"}
      integration: {applicable: true, evidence: "PR and main CI runs on pinned ubuntu-24.04"}
      contract: {applicable: true, evidence: "All ubuntu-latest runner references replaced; macOS matrix retained"}
      e2e: {applicable: false, na_reason: "No browser product flow change"}
      security: {applicable: true, evidence: "Existing immutable action SHAs and least-privilege permissions preserved"}
      migration_recovery: {applicable: false, na_reason: "No persistent schema change"}
      cli_harness: {applicable: true, evidence: "GitHub Actions full validation and docs-site jobs"}
      docs_schema: {applicable: true, evidence: "Runner/action maintenance guidance"}
  - boundary: documentation-and-release-procedure
    reason: Canonical human and agent docs must describe the new publication policy, EARS trigger ownership, and runtime handling consistently.
    checks:
      static_lint: {applicable: true, evidence: "Documentation audience, sync, and placement validation"}
      unit: {applicable: true, evidence: "Documentation contract validators"}
      integration: {applicable: true, evidence: "Full repository validation and remote docs-site CI"}
      contract: {applicable: true, evidence: "Documentation impact preview reports complete closure"}
      e2e: {applicable: false, na_reason: "Documentation-only product surface"}
      security: {applicable: true, evidence: "Public identity and merge procedure preserve PII policy"}
      migration_recovery: {applicable: false, na_reason: "No migration"}
      cli_harness: {applicable: true, evidence: "aips publish plan and preflight documented"}
      docs_schema: {applicable: true, evidence: "Core Change Test Matrix and canonical documentation closure"}

scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
status: READY
