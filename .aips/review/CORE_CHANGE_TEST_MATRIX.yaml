version: 1
change:
  id: plan36-publication-diagnostics
  summary: Preserve GitHub publication evidence and provide precise, safe recovery guidance.
  boundary:
  - GitHub branch policy snapshot, effective rules, and sanitized HTTP/API error evidence.
  - Publication authority reason codes, phase attribution, and backward-compatible diagnostic contracts.
  - Read-only staged/modified/deleted/untracked worktree detail reporting.
  - Push, PR, checks, merge, and already-merged recovery planning.
  - Claude Code adapter guidance, human docs, scenarios, validators, and architecture narrative.
  - Preserve Human Authority, Proposal-first, exact candidate/base/PR binding, secret scan, and native confirmations.
matrix:
- boundary: GitHub policy evidence resolver
  reason: Distinguish explicit effective policy evidence from permission, network, not-found, and malformed responses.
  checks:
    static_lint:
      applicable: true
      evidence: 'PASS: Ruff output has no additional findings versus origin/main (15 inherited findings remain unchanged).'
    unit:
      applicable: true
      evidence: 'PASS: 58 publication authority/planning unit tests, including HTTP status, redaction, 401/403/404
        and malformed-evidence cases.'
    integration:
      applicable: true
      evidence: 'PASS: repository governance snapshot lifecycle covers branch existence, effective rules, rulesets
        and classic-protection evidence.'
    contract:
      applicable: true
      evidence: 'PASS: repository governance snapshot contracts and Scenario 260 documentation coverage.'
    e2e:
      applicable: false
      na_reason: No deployed application flow; deterministic API lifecycle fixtures exercise the resolver.
    security:
      applicable: true
      evidence: 'PASS: sanitized bounded GitHub message and secret/header redaction contracts; UNKNOWN remains fail-closed.'
    migration_recovery:
      applicable: false
      na_reason: No persisted schema or migration is introduced.
    cli_harness:
      applicable: true
      evidence: 'PASS: publication doctor contract and endpoint/evidence reporting covered by lifecycle and publication
        preflight contracts.'
    docs_schema:
