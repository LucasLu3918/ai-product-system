version: 1
change:
  id: plan42-staged-binary-safety
  summary: Safely inspect staged fonts and report actionable root causes without changing commit or publication authority.
  boundary:
    - Bounded TTF/OTF/WOFF/WOFF2 metadata parsing through the shared staged content-safety pipeline
    - Git object size precheck, parser/decompression limits, magic/suffix reconciliation, fail-closed malformed or unsupported content
    - Stable safe diagnostics across native Hook, Safety Diagnose CLI, and publication candidate scanner
    - Managed fontTools/Brotli dependency detection and tested runtime dependency constraints
    - Regression, lifecycle, security/redaction, documentation and exact-candidate validation evidence
matrix:
  - boundary: Staged blob detection, size-before-read, bounded font parser and metadata extraction
    reason: The current scanner reads a full blob before checking the limit and treats valid font binaries as generic unsupported content; parsers add attack surface.
    checks:
      static_lint: {applicable: true, evidence: PASS}
      unit: {applicable: true, evidence: PASS}
      integration: {applicable: true, evidence: PASS}
      contract: {applicable: true, evidence: PASS}
      e2e: {applicable: true, evidence: PASS}
      security: {applicable: true, evidence: PASS}
      migration_recovery: {applicable: false, na_reason: No application persistence or schema migration; parser denial leaves Git index and files unchanged.}
      cli_harness: {applicable: true, evidence: PASS}
      docs_schema: {applicable: true, evidence: PASS}
  - boundary: Shared format capability and root-cause diagnostics across Hook, CLI, and publication scanning
    reason: Inconsistent format handling can either reject valid content or weaken a downstream scanner; error categories must stay safe and actionable.
    checks:
      static_lint: {applicable: true, evidence: PASS}
      unit: {applicable: true, evidence: PASS}
      integration: {applicable: true, evidence: PASS}
      contract: {applicable: true, evidence: PASS}
      e2e: {applicable: true, evidence: PASS}
      security: {applicable: true, evidence: PASS}
      migration_recovery: {applicable: false, na_reason: Additive diagnostic fields; no stored diagnostic schema migration.}
      cli_harness: {applicable: true, evidence: PASS}
      docs_schema: {applicable: true, evidence: PASS}
  - boundary: Managed parser dependency and installation diagnostics
    reason: A missing parser dependency must fail closed with the correct runtime and actionable install guidance, without modifying system Python.
    checks:
      static_lint: {applicable: true, evidence: PASS}
      unit: {applicable: true, evidence: PASS}
      integration: {applicable: true, evidence: PASS}
      contract: {applicable: true, evidence: PASS}
