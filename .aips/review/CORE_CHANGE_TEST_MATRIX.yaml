version: 1
change:
  id: plan39-comfyui-resource-auth
  summary: 'Fail-closed Resource Authorization profile/grant matching, fixed local ComfyUI read-only discovery, normalized redacted diagnostics, shared creative presets, and evidence-ranked Apple Silicon/MPS compatibility guidance.'
  boundary:
  - Resource Authorization profile resolution and selector/kind/operation/destination/constraint enforcement
  - Runtime Policy Action profile binding and structured safe denial diagnostics
  - Fixed loopback ComfyUI read-only capability/model inventory and HTTP boundary enforcement
  - Existing independent authorization and workflow validation for generation; no external download or custom nodes
  - Creative character/background/texture/UI ornament presets and manifest/review/quality flow
  - Static MPS/model precision evidence only; inference remains unverified until observed
  - CLI/schema/scenario/coverage/documentation placement/sync and Human architecture/usage guidance
  - User Mac authorization state and actual local Hook root cause remain outside evidence
matrix:
- boundary: Resource Authorization profile lifecycle and exact grant scope
  reason: Missing or mismatched profiles/grants must remain default-deny with stage-specific safe explanations.
  checks:
    static_lint: {applicable: true, evidence: "scripts/validation syntax contracts and exact-candidate repository Integration Gate"}
    unit: {applicable: true, evidence: "tests/test_runtime_policy.py plus Resource Authorization lifecycle assertions"}
    integration: {applicable: true, evidence: "tests/evidence/resource_authorization_lifecycle.py and tests/evidence/runtime_policy_lifecycle.py"}
    contract: {applicable: true, evidence: "tests/validation/resource_authorization_contracts.py and runtime_policy_contracts.py"}
    e2e: {applicable: false, na_reason: No deployed UI; deterministic CLI and runtime fixtures cover the boundary.}
    security: {applicable: true, evidence: "missing/invalid Profile, default-deny and grant kind/selector/operation/destination/constraint negative cases; exact-candidate secret scan"}
    migration_recovery: {applicable: false, na_reason: No persistent user profile migration; the user's machine configuration is not modified.}
    cli_harness: {applicable: true, evidence: "resource authorization CLI lifecycle and observed Hook URL binding fixtures"}
    docs_schema: {applicable: true, evidence: "resource-authorization-profile.yaml, runtime-action.yaml, Scenario 262 and documentation placement/sync preview"}
- boundary: Runtime Policy error classification and redaction
  reason: Profile-source distinctions and HTTP/provider diagnostics must be stable and useful without leaking paths, credentials, headers, or raw bodies.
  checks:
    static_lint: {applicable: true, evidence: "scripts/validation syntax contracts and exact-candidate repository Integration Gate"}
    unit: {applicable: true, evidence: "tests/test_runtime_policy.py structured fields and denial/redaction assertions"}
    integration: {applicable: true, evidence: "tests/evidence/runtime_policy_lifecycle.py Hook request lifecycle"}
    contract: {applicable: true, evidence: "tests/validation/runtime_policy_contracts.py schema/adapter/docs contract"}
    e2e: {applicable: false, na_reason: No deployed UI; deterministic local actions exercise the output contract.}
    security: {applicable: true, evidence: "authorization/profile source distinction and diagnostic credential/path/body redaction cases; exact-candidate secret scan"}
    migration_recovery: {applicable: false, na_reason: No persisted diagnostic history or migration is introduced.}
    cli_harness: {applicable: true, evidence: "Runtime Policy native Hook lifecycle and CLI output checks"}
    docs_schema: {applicable: true, evidence: "runtime-action.yaml, Runtime Policy human docs, Scenario 262 and generated Conformance summary validation"}
- boundary: Local ComfyUI read-only discovery and network boundary
  reason: Only the fixed loopback service on port 8188 and fixed GET paths may be probed; redirects and arbitrary destinations remain blocked.
  checks:
    static_lint: {applicable: true, evidence: "scripts/validation syntax contracts and exact-candidate repository Integration Gate"}
    unit: {applicable: true, evidence: "Creative prompt preset, model catalog, error-envelope and MPS metadata assertions"}
    integration: {applicable: true, evidence: "tests/evidence/creative_execution_lifecycle.py fake MFLUX and loopback ComfyUI fixtures"}
    contract: {applicable: true, evidence: "tests/validation/creative_execution_contracts.py plus generate-set lifecycle"}
    e2e: {applicable: false, na_reason: The user's ComfyUI instance is not contacted; fixtures prove the HTTP contract.}
    security: {applicable: true, evidence: "loopback/port/method/path, redirect, external destination, HTTP 4xx/5xx and redaction fixtures; no generation/download"}
    migration_recovery: {applicable: false, na_reason: Read-only discovery adds no stored state.}
    cli_harness: {applicable: true, evidence: "native creative tool callback fixture plus read-only discovery/preflight CLI paths"}
    docs_schema: {applicable: true, evidence: "CREATIVE_ASSET_PRESETS.yaml, Bundle/Manifest, Scenario 262 and generated Conformance summary validation"}
- boundary: Creative presets and Apple Silicon/model compatibility evidence
  reason: Presets must retain existing explicit generation controls; static dtype observations must not imply verified MPS inference.
  checks:
    static_lint: {applicable: true, evidence: "scripts/validation syntax contracts and exact-candidate repository Integration Gate"}
    unit: {applicable: true, evidence: "Creative prompt preset, model catalog, error-envelope and MPS metadata assertions"}
