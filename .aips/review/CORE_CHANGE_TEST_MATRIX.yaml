change:
  id: plan21-p2
  summary: Preserve Plan21 failure semantics and installer recovery while extracting
    byte-compatible shared deterministic primitives.
  boundary:
  - malformed-governance-input
  - failure-diagnostics
  - installer-transaction-and-lock
  - shared-deterministic-primitives
