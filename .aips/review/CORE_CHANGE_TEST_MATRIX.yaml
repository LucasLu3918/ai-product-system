candidate:
  base_sha: 75cc9491fd1bc073d14619d4141aaccc313fa877
  changed_files_hash: 9f7c626262fe4af9c4674807ecc2269c867204ebc9710f9189afa9d3a8d2524e

change:
  id: runtime-content-safety-boundary
  summary: Add the sink-aware Runtime Content Safety Boundary, integrate it with AIPS persistence and publication paths, and preserve truthful runtime capability reporting.
  boundary:
    - content-safety-kernel-and-detectors
    - aips-persistence-sinks
    - runtime-and-publication-guards
    - provenance-and-runtime-capability
    - documentation-and-scenario-conformance

matrix:
  - boundary: content-safety-kernel-and-detectors
    reason: Shared deterministic secret, PII and injection-signal detection must never emit raw findings and must produce sink-aware decisions.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation and Ruff critical checks"}
      unit: {applicable: true, evidence: "tests/test_content_safety.py"}
      integration: {applicable: true, evidence: "content-safety lifecycle Integration Gate check"}
      contract: {applicable: true, evidence: "SafeFinding and sink policy contract"}
      e2e: {applicable: false, na_reason: "No product browser flow is changed"}
      security: {applicable: true, evidence: "secret safety, redaction and durable-sink blocking"}
      migration_recovery: {applicable: false, na_reason: "No persisted data migration"}
      cli_harness: {applicable: true, evidence: "content_safety.py scan CLI"}
      docs_schema: {applicable: true, evidence: "CONTENT_SAFETY_BOUNDARY.md and YAML policy"}
  - boundary: aips-persistence-sinks
    reason: Audit and observable event data must be sanitized before hashing, chaining or persistence.
    checks:
      static_lint: {applicable: true, evidence: "Documentation sync and placement contracts"}
      unit: {applicable: true, evidence: "governance audit and observable event lifecycle tests"}
      integration: {applicable: true, evidence: "sanitize → hash → persist lifecycle"}
      contract: {applicable: true, evidence: "audit/event bounded payload contract"}
      e2e: {applicable: false, na_reason: "No browser flow is changed"}
      security: {applicable: true, evidence: "no raw secret in audit/event evidence"}
      migration_recovery: {applicable: false, na_reason: "Existing ledger format remains compatible"}
      cli_harness: {applicable: true, evidence: "audit and Gemini hook lifecycle"}
      docs_schema: {applicable: true, evidence: "runtime boundary protocol"}
  - boundary: runtime-and-publication-guards
    reason: Commit, push, PR, release and indirect body/message paths need content checks without conflating content safety and publish approval.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation and Ruff critical checks"}
      unit: {applicable: true, evidence: "governance command guard and publication preflight lifecycle"}
      integration: {applicable: true, evidence: "exact-candidate publication resolver"}
      contract: {applicable: true, evidence: "git commit content-only guard and publication approval separation"}
      e2e: {applicable: false, na_reason: "No product browser flow is changed"}
      security: {applicable: true, evidence: "durable/public sinks fail closed"}
      migration_recovery: {applicable: false, na_reason: "No persisted data migration"}
      cli_harness: {applicable: true, evidence: "governance_guard and publish_preflight CLI"}
      docs_schema: {applicable: true, evidence: "publication boundary documentation"}
  - boundary: provenance-and-runtime-capability
    reason: Untrusted content and native-hook capability must remain explicit and truthful.
    checks:
      static_lint: {applicable: true, evidence: "Lifecycle syntax and critical Ruff checks"}
      unit: {applicable: true, evidence: "provenance and injection signal tests"}
      integration: {applicable: true, evidence: "native hook capability guard"}
      contract: {applicable: true, evidence: "ENFORCED / TOOL_GUARDED / ADVISORY matrix"}
      e2e: {applicable: false, na_reason: "No product browser flow is changed"}
      security: {applicable: true, evidence: "injection cannot bypass human approval"}
      migration_recovery: {applicable: false, na_reason: "No persisted data migration"}
      cli_harness: {applicable: true, evidence: "runtime guard hook"}
      docs_schema: {applicable: true, evidence: "provenance protocol"}
  - boundary: documentation-and-scenario-conformance
    reason: The security contract, sink manifest and scenario registry must stay complete and discoverable.
    checks:
      static_lint: {applicable: true, evidence: "documentation placement and static contracts"}
      unit: {applicable: true, evidence: "scenario conformance check"}
      integration: {applicable: true, evidence: "repository validation"}
      contract: {applicable: true, evidence: "scenario coverage registry"}
      e2e: {applicable: false, na_reason: "No product browser flow is changed"}
      security: {applicable: true, evidence: "security assurance documentation"}
      migration_recovery: {applicable: false, na_reason: "Additive documentation and tests"}
      cli_harness: {applicable: true, evidence: "publish preflight documentation impact"}
      docs_schema: {applicable: true, evidence: "canonical boundary protocol and config"}

scope_recomputed_after_expansion: true
