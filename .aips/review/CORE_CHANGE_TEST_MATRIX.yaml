change:
  id: plan10-product-planning-capability
  summary: Add an optional machine-checkable Planning Package with deterministic cross-artifact
    traceability, expanded product research and domain planning, and preserve existing
    roles, Human approvals and legacy package compatibility.
  boundary:
  - product-planning-package
matrix:
- boundary: product-planning-package
  reason: Manifest lifecycle, artifact dependency/traceability and skill/reference
    guidance form one coherent product planning contract. The same exact candidate
    includes its tests, scenarios and human/agent documentation.
  checks:
    static_lint:
      applicable: true
      evidence: Full tests/validate_repository.py passed; YAML/Markdown/static contracts
        and Python compilation are included.
    unit:
      applicable: true
      evidence: tests/validation/planning_package_contracts.py passed dependency,
        path, traceability, applicability and separate gate-evidence rejection cases.
    integration:
      applicable: true
      evidence: tests/evidence/planning_package_lifecycle.py passed canonical template
        validation and rejected unknown operation/path traversal in isolated temporary
        package copies.
    contract:
      applicable: true
      evidence: python scripts/planning_package_validate.py templates/planning-package
        --format json returned PASS for 11 artifacts and 2 requirements; Scenario
        Conformance returned 192 registered, 0 uncovered.
    e2e:
      applicable: false
      na_reason: The end-to-end product planning and approvals depend on real user
        decisions; Scenario 192 is explicitly manual. Structural subcontracts have
        deterministic/lifecycle evidence.
    security:
      applicable: true
      evidence: Validator rejects escaping paths and requires reasons for N/A plus
        independent human evidence for Gates; domain guidance prohibits raw payment
        credentials and invented compliance claims. Candidate content safety scan
        passed.
    migration_recovery:
      applicable: true
      evidence: No persistence migration is introduced; legacy packages without PLANNING_MANIFEST.yaml
        remain valid as documented and structurally checked.
    cli_harness:
      applicable: true
      evidence: Planning validator JSON PASS/FAIL and exit status are exercised through
        direct invocation and isolated lifecycle evidence.
    docs_schema:
      applicable: true
      evidence: Documentation placement passed; Human/Agent canonical docs, product-delivery
        SVG, Mermaid flow, templates, version and Scenario 183–192 were synchronized.
