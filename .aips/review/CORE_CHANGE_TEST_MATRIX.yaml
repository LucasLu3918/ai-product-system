version: 1
candidate:
  base_sha: 04824395029b272800b58679e7fa307693fb8690
  changed_files_hash: 3a2ba6cebf7d0ced2404c95f072fda4e573264fe2a9102f53e8d73e2ef3075f8
change:
  id: human-docs-site-installation-ux
  summary: Reorganize Human current-behavior documentation by topic, add a VitePress official docs renderer, modernize managed install/uninstall entrypoints, and enforce deterministic documentation placement so new features cannot be appended as release-style notes.
  boundary:
    - documentation-architecture
    - installation-lifecycle
    - harness-documentation
    - repository-ci
matrix:
  - boundary: documentation-architecture
    reason: Human documentation source structure, rendering, navigation and placement enforcement change.
    checks:
      static_lint: {applicable: true, evidence: "repository validator compiles and executes documentation placement contracts"}
      unit: {applicable: true, evidence: "documentation placement static audit checks H1/H2 hierarchy, forbidden version/scenario headings and compatibility HTML stubs"}
      integration: {applicable: true, evidence: "VitePress build renders docs/human canonical Markdown sources"}
      contract: {applicable: true, evidence: "config/documentation-placement.yaml binds current-behavior topics and per-subsystem canonical placements"}
      e2e: {applicable: true, evidence: "docs-site workflow builds the exact PR candidate; main deployment is isolated to GitHub Pages"}
      security: {applicable: true, evidence: "docs workflow uses contents:read for build; Pages deployment has only pages/id-token permissions and no code publication authority"}
      migration_recovery: {applicable: true, evidence: "legacy standalone HTML becomes compatibility stub while canonical Markdown paths are added; raw Markdown remains usable without VitePress"}
      cli_harness: {applicable: false, na_reason: "docs renderer does not alter runtime Harness semantics"}
      docs_schema: {applicable: true, evidence: "Human Docs, Documentation Sync, Audience Map, Architecture Surface and Scenario 163 updated"}
  - boundary: installation-lifecycle
    reason: Public installation changes from manual clone/cd/bootstrap instructions to managed Install/Update/Uninstall entrypoints.
    checks:
      static_lint: {applicable: true, evidence: "bash syntax and PowerShell parser checks"}
      unit: {applicable: true, evidence: "installer dry-run validates managed path and supported Windows WSL contract"}
      integration: {applicable: true, evidence: "Linux CI installs from a local source checkout, runs doctor/MCP inspect, then uninstalls"}
      contract: {applicable: true, evidence: "README/Installation/Getting Started use install/uninstall terminology; bootstrap remains compatibility wrapper"}
      e2e: {applicable: true, evidence: "ubuntu lifecycle plus macOS shell validation plus windows-latest PowerShell contract workflow"}
      security: {applicable: true, evidence: "existing non-AIPS install path and dirty managed checkout fail closed; third-party client settings remain user-owned"}
      migration_recovery: {applicable: true, evidence: "bootstrap.sh and uninstall.sh remain backward-compatible recovery entrypoints"}
      cli_harness: {applicable: true, evidence: "managed checkout delegates to existing bin/aips install/uninstall lifecycle"}
      docs_schema: {applicable: true, evidence: "Installation and Getting Started document macOS/Linux/Windows+WSL truthfully"}
  - boundary: repository-ci
    reason: New documentation and installation workflows execute on pull requests and main.
    checks:
      static_lint: {applicable: true, evidence: "workflow contracts are repository validated"}
      unit: {applicable: false, na_reason: "workflow behavior is covered by exact Actions execution"}
      integration: {applicable: true, evidence: "PR workflow executions are exact-head checks"}
      contract: {applicable: true, evidence: "docs build is independent from code merge authority and Pages deploy is main-only"}
      e2e: {applicable: true, evidence: "GitHub Actions verifies docs build and installation entrypoints"}
      security: {applicable: true, evidence: "minimal workflow permissions; no external Agent/provider credential"}
      migration_recovery: {applicable: false, na_reason: "workflows are additive and removable without persisted product data"}
      cli_harness: {applicable: false, na_reason: "CI registration does not change runtime CLI contract"}
      docs_schema: {applicable: true, evidence: "workflow triggers are documented in Official Docs Site / Installation sections"}
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
status: READY
