version: 1
change:
  id: avif-media-safety-20261018
  summary: Safely inspect AVIF metadata across existing AIPS content-safety consumers with actionable redacted diagnostics and no authority change.
  boundary:
    - Bounded AVIF ISO BMFF file type, metadata-box and item-extent inspection through the existing media parser.
    - One shared media capability registry used by staged commit, candidate/history scan, publication preflight and Creative raster validation.
    - EXIF/XMP metadata scanning under the existing content safety rules; never decode mdat as text.
    - Stable format, signature, malformed, unsupported-feature, inspector and resource-limit reasons with safe recovery guidance.
    - Preserve fail-closed behavior, 8 MiB staged limit, current formats, Hook/CLI parity and Git authority.
    - Scenario 265, documentation closure, exact-candidate repository validation and post-merge evidence.
