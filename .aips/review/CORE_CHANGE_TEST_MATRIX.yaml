change:
  id: layered-context-memory
  summary: Add deterministic layered Project Intelligence context with a derived compact core capsule, bounded Recall and on-demand Archive pointers, task-scoped freshness telemetry, read-only context auditing, and a two-phase Change Impact approval/reconciliation lifecycle.
  boundary:
    - deterministic-layered-project-context-and-budget-telemetry
    - task-scoped-freshness-with-global-mutation-fail-closed
    - read-only-project-context-audit
    - change-impact-implementation-approval-and-post-diff-readiness
    - runtime-hook-and-manifest-compatibility
    - scenario-documentation-and-evidence

matrix:
  - boundary: deterministic-layered-project-context-and-budget-telemetry
    reason: The runtime context contract gains derived Core, Recall and Archive layers, bounded token estimates, source provenance and temporal references.
    checks:
      static_lint: {applicable: true, evidence: "Python compilation and repository static contracts"}
      unit: {applicable: true, evidence: "tests/evidence/layered_context_memory_lifecycle.py validates derived capsule, token limits, pointers and safe defaults"}
      integration: {applicable: true, evidence: "tests/evidence/intelligence_context_lifecycle.py and full repository validation"}
      contract: {applicable: true, evidence: "TURN_CONTEXT_MANIFEST schema and exact manifest lifecycle checks"}
      e2e: {applicable: false, na_reason: "No user-facing product UI; runtime hook contract is verified directly"}
      security: {applicable: true, evidence: "Canonical sources remain pointer-based; derived capsule marks canonical:false and preserves source digest"}
      migration_recovery: {applicable: false, na_reason: "Existing Intelligence stores remain readable; missing derived capsule uses safe fallback and no canonical migration occurs"}
      cli_harness: {applicable: true, evidence: "AIPS context hook and intelligence context command lifecycle validation"}
      docs_schema: {applicable: true, evidence: "Manifest template and Project Intelligence docs validation"}
  - boundary: task-scoped-freshness-with-global-mutation-fail-closed
