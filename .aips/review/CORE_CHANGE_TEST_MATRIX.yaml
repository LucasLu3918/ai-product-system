version: 1
change:
  id: eval-redteam-interoperability
  summary: Add secure external Eval interoperability, Promptfoo and PyRIT pilot adapters, risk profiles, and Finding-to-regression workflow.
  boundary:
    - external-eval-contract-and-untrusted-input
    - promptfoo-import-export-and-deterministic-evidence
    - pyrit-pilot-finding-promotion-and-risk-profiles
    - cli-scenario-documentation-and-architecture
matrix:
  - boundary: external-eval-contract-and-untrusted-input
    reason: External config/evidence can contain executable configuration, secrets, private reasoning, malformed YAML or stale provenance.
    checks:
      static_lint: {applicable: true, evidence: ruff check passed; Python AST syntax and bin/aips shell syntax passed}
      unit: {applicable: true, evidence: tests/test_eval_interop.py passed 7 tests, including parser bounds and hostile/secret input rejection}
      integration: {applicable: true, evidence: tests/evidence/eval_interop_lifecycle.py passed 2 lifecycle cases in full repository validation}
      contract: {applicable: true, evidence: eval_interop_contracts and external-evidence/finding schema checks passed in full repository validation}
      e2e: {applicable: false, na_reason: No external evaluator is executed; the adapter is verified with offline fixtures.}
      security: {applicable: true, evidence: parser negative cases passed; candidate content-safety preview PASS with 0 unscannable files}
      migration_recovery: {applicable: false, na_reason: Additive external evidence schemas; existing Agent Eval records are not migrated or rewritten.}
      cli_harness: {applicable: true, evidence: CLI import/export/verify and safe failure paths passed in lifecycle validation}
      docs_schema: {applicable: true, evidence: schemas/protocol validated by full repository validation}
  - boundary: promptfoo-import-export-and-deterministic-evidence
    reason: The adapter exports canonical prompts without external assertions, then imports only the supported static Promptfoo result subset and derives local assertion observations from result text.
    checks:
      static_lint: {applicable: true, evidence: ruff check passed; Python syntax passed}
      unit: {applicable: true, evidence: Promptfoo allowlist, JSONL mapping, evidence fingerprint and unsupported assertion tests passed in 7-test unit suite}
      integration: {applicable: true, evidence: fixture export/import, evidence verification and deterministic AIPS Agent Eval rescoring passed in lifecycle validation}
      contract: {applicable: true, evidence: Promptfoo fixture and canonical external-evidence schema validation}
      e2e: {applicable: false, na_reason: Live Promptfoo execution would require a target model/provider and is intentionally optional.}
      security: {applicable: true, evidence: unsupported executable config is rejected; content-safety candidate preview PASS}
      migration_recovery: {applicable: false, na_reason: No stored records change; failed imports emit no canonical PASS evidence.}
      cli_harness: {applicable: true, evidence: local AIPS import/export/verify CLI lifecycle passed}
      docs_schema: {applicable: true, evidence: supported subset documentation, placement preview and full repository validation passed}
  - boundary: pyrit-pilot-finding-promotion-and-risk-profiles
    reason: PyRIT is an optional evolving producer; scan findings require review before becoming canonical release evidence.
    checks:
      static_lint: {applicable: true, evidence: ruff check passed; Python syntax passed}
      unit: {applicable: true, evidence: PyRIT bridge, risk profile, finding transition and Human-confirmation rejection cases passed in 7-test unit suite}
      integration: {applicable: true, evidence: bridge import remains advisory; confirmed reproduction promotion and canonical deterministic regression passed in lifecycle validation}
      contract: {applicable: true, evidence: eval-profile and red-team-finding schemas}
      e2e: {applicable: false, na_reason: The PyRIT runtime is not installed or launched; its adapter is a dependency-free pilot bridge.}
      security: {applicable: true, evidence: external scores remain advisory; unconfirmed finding and sensitive inputs are rejected by tests}
      migration_recovery: {applicable: false, na_reason: Optional profile and bridge records; no database or existing evidence migration.}
      cli_harness: {applicable: true, evidence: release_candidate profile CLI passed; finding promotion CLI lifecycle passed}
      docs_schema: {applicable: true, evidence: profile/schema and PyRIT bridge docs validated by full repository validation}
  - boundary: cli-scenario-documentation-and-architecture
    reason: The feature adds AIPS CLI commands, one behavior Scenario, configuration/docs synchronization and a new architecture data flow.
    checks:
      static_lint: {applicable: true, evidence: Python syntax/lint and shell syntax validation}
      unit: {applicable: true, evidence: command routing and documentation/registry static contracts}
      integration: {applicable: true, evidence: full repository validator passed version 0.64.0 with 180 scenarios; preview documentation placement PASS}
      contract: {applicable: true, evidence: CLI and Scenario registry mappings}
      e2e: {applicable: false, na_reason: No deployed service or external provider is part of this feature.}
      security: {applicable: true, evidence: final candidate secret scan and safe CLI negative paths}
      migration_recovery: {applicable: false, na_reason: No external persisted state or production deployment changes.}
      cli_harness: {applicable: true, evidence: direct aips eval profile invocation passed; repository validator covered CLI lifecycle}
      docs_schema: {applicable: true, evidence: complete documentation closure and placement preview PASS; Architecture Mermaid and SVG validated}

