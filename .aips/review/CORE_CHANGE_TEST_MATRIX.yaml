version: 1
change:
  id: plan47-content-safety-classification
  summary: Reduce ordinary-code injection false positives while preserving full-blob secret scanning, blocking high-confidence attacks, requiring review for ambiguous signals, and returning safe recovery diagnostics.
  boundary:
    - Versioned injection rule classification and fixed-corpus comparison
    - Added-line staged injection inspection with full staged-blob secret and PII scanning
    - Exact expiring exception validation and safe commit diagnostics
    - Documentation, scenario conformance, repository integration, and publication lifecycle
matrix:
  - boundary: Injection classification and false-positive control
    reason: Generic run/send patterns blocked ordinary JavaScript; versioned rules must reduce false positives without losing attack detection.
    checks:
      static_lint: {applicable: true, evidence: "PASS: Python compilation, Ruff, quality ratchet, and git diff --check passed."}
      unit: {applicable: true, evidence: "PASS: 16 content safety unit tests passed, including fixed corpus old/new and publication diff comparison."}
      integration: {applicable: true, evidence: "PASS: staged diagnostic regressions passed in the focused diagnostics suite."}
      contract: {applicable: true, evidence: "PASS: repository validator reports 266 registered scenarios, zero uncovered; full validation passed."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: high-confidence override, exfiltration, and agent execution fixtures remain blocked."}
      migration_recovery: {applicable: false, na_reason: No persistent data migration; rollback is a PR revert.}
      cli_harness: {applicable: true, evidence: "PASS: ordinary staged JavaScript allowed and strong injection denied."}
      docs_schema: {applicable: true, evidence: "PASS: exact candidate Documentation Impact is complete for 51 changed paths with zero required additions."}
  - boundary: Staged-line classification and full-blob secret coverage
