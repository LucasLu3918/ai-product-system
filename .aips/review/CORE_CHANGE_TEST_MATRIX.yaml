    - explicit dynamic-local generate/edit bindings, workflow import/inspection, output confinement and uncertain-submit recovery
    - Creative Bundle compatibility, declarative Z-Image/FLUX 3 profiles, fixed-profile readiness, provenance and privacy
    - canonical human/agent docs, Scenario 268 and documentation closure
    - exact-candidate content safety, secret scan, repository validation and remote publication
