version: 1
change:
  id: plan17-t06-observation-timeout
  summary: Bound the read-only daily/manual Validation Observation Collector to a
    provisional 15-minute timeout from a two-run (~31-second) sample; preserve event
    behavior, permissions, artifact retention and pending evidence. Defer the two
    Issue-writing workflows to Batch C.
  boundary:
  - Validation Observation Collector job timeout, scheduled/manual evidence lifecycle,
    bounded graph traversal, required placement documentation and this candidate-bound
    matrix.
candidate:
  base_sha: b8e3e0a65a876cb99b945a7e0cbc35b2cd486074
  changed_files_hash: 43fc370b5f7a935c3115a7faad7c1a310e6e39cf94429e841beb5f2e4f788ca9
matrix:
- boundary: read-only-validation-observation-timeout
  reason: A two-run timing sample (~31 seconds) is insufficient for a reliable P95.
    A provisional 15-minute limit bounds a hung collector with a conservative margin;
    scheduled/manual evidence runs retain existing triggers and are not put in a concurrency
    group that can replace pending evidence.
  checks:
    static_lint:
      applicable: true
      evidence: YAML contract verifies timeout, unchanged schedule/manual dispatch,
        read-only token permissions and absence of concurrency cancellation.
    unit:
      applicable: true
      evidence: Existing validation-observation lifecycle PASS; observation contract
        checks the new timeout and evidence-preserving trigger behavior.
    integration:
      applicable: true
      evidence: Exact-candidate AIPS standard publish preflight runs repository validation
        and required aggregate before publication.
    contract:
      applicable: true
      evidence: Scenario 217 and validation_observation_contracts.py enforce timeout,
        trigger, permissions, artifact profile and no-concurrency policy.
    e2e:
      applicable: true
      evidence: PR CI exercises the collector workflow contract; full repository validation
        and required gate remain enabled.
    security:
      applicable: true
      evidence: GitHub token remains actions:read/contents:read; timeout does not
        modify permissions or release/security policy.
    migration_recovery:
      applicable: true
      evidence: The job-level timeout is isolated and revertible; interruption reports
        existing artifact behavior and cannot enable selective execution.
    cli_harness:
      applicable: false
      na_reason: No AIPS CLI or Harness command surface changes.
    docs_schema:
      applicable: true
      evidence: CHANGELOG and all placement-required canonical Human/Orchestration
        references state the provisional bound and small-sample limitation.
