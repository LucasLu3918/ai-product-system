version: 1
change:
  id: plan17-reliability-hardening
  summary: Correct publication/validation failures and enforce exact protected-main
    branch cleanup without changing release or shadow authority.
  boundary:
  - publication-safety
  - validation-runtime
  - capability-and-workflow
  - dependency-parity
  - documentation-closure
  - branch-cleanup
  - github-execution-trust
matrix:
- boundary: publication-safety
  reason: Numeric Git metadata false-positive regression and unchanged body/secret
    blocking
  checks:
    static_lint:
      applicable: true
      evidence: Ruff touched-code ratchet and critical compile checks
    unit:
      applicable: true
      evidence: tests/evidence/reliability_hardening_lifecycle.py
    integration:
      applicable: true
      evidence: Exact-candidate Integration Gate; full repository validator retains
        all mandatory checks
    contract:
      applicable: true
      evidence: tests/evidence/reliability_hardening_lifecycle.py
    security:
      applicable: true
      evidence: Negative fixture paths, mandatory candidate secret scanning; OIDC
        issuer verification in report-only main dispatch
    migration_recovery:
      applicable: true
      evidence: Atomic transaction failure preserves all approved refs; historical
        manifests remain readable but require trusted dispatch for remote deletion
    cli_harness:
      applicable: true
      evidence: Source and installed-symlink CLI lifecycle, explicit invalid Python
        rejection
    docs_schema:
      applicable: true
      evidence: Complete fixed-point documentation and canonical topic validation
    e2e:
      applicable: false
      na_reason: No product UI or deployment changes; local bare Git plus post-merge
