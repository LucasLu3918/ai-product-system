        runtime contract suite passed.'
    contract:
      applicable: true
      evidence: 'PASS: tests/scenarios/261-publication-diagnostics-and-safe-recovery.md
        and tests/validation/runtime_contracts.py.'
    e2e:
      applicable: false
      na_reason: This is a native runtime hook and diagnostic contract with no application
        UI or server; the hook and runtime lifecycle contracts exercise the supported
        path.
    security:
      applicable: true
