version: 1
change:
  id: ci-publication-reliability
  summary: Lock documentation dependencies, supersede duplicate PR validation runs
    using latest labels, and report repository-supported GitHub merge methods with
    safe API diagnostics.
  boundary:
  - node-documentation-dependency-installation
  - pull-request-validation-event-concurrency
  - github-repository-publication-policy-diagnostics
  - canonical-documentation-and-agent-contracts
  - local-validation-requirement-parity
matrix:
- boundary: node-documentation-dependency-installation
  reason: VitePress CI builds need a deterministic dependency graph and a lockfile-aware
    build trigger.
  checks:
    static_lint:
      applicable: true
      evidence: Workflow contracts assert Node 24, setup-node npm cache keyed by package-lock.json,
        and npm ci.
    unit:
      applicable: true
      evidence: A clean npm ci restored all 126 locked packages with npm 11.6.2.
    integration:
      applicable: true
      evidence: npm run docs:build completed with VitePress 1.6.4 after npm ci.
    contract:
      applicable: true
      evidence: Validation and docs-site workflow contracts use the committed npm
        lockfile; package-lock changes trigger docs-site.
    e2e:
      applicable: false
      na_reason: No deployed product or UI changed; npm ci plus the production VitePress
        build is the relevant boundary.
    security:
      applicable: true
      evidence: CI installation preserves --ignore-scripts and lockfile integrity
        hashes; npm audit remains disabled per repository policy.
    migration_recovery:
      applicable: false
      na_reason: No persisted application data or schema changes.
    cli_harness:
      applicable: false
      na_reason: This boundary changes CI dependency installation, not AIPS CLI or
        Harness behavior.
    docs_schema:
      applicable: true
      evidence: Documentation sync/placement preview is complete and the VitePress
        site build passes.
- boundary: pull-request-validation-event-concurrency
  reason: Opened, label, unlabel and synchronize events must run the latest label-sensitive
    Gate without duplicate in-progress Gate work.
  checks:
    static_lint:
      applicable: true
      evidence: Python static contracts validate the action-independent PR group and
        cancellation policy.
    unit:
      applicable: true
      evidence: Static contract cases confirm PR events share a group, pushes remain
        isolated, and workflow_dispatch is not canceled.
    integration:
      applicable: true
      evidence: Exact candidate Integration Gate and required repository aggregate
        run after publication.
    contract:
      applicable: true
      evidence: The validate workflow retains all PR event types and derives Core/Large
        level from the latest event labels.
    e2e:
      applicable: false
      na_reason: No deployed product path changes; workflow contracts and the exact
        candidate aggregate are the observable boundary.
    security:
      applicable: true
      evidence: Cancellation changes scheduling only; it does not weaken candidate
        secret scanning, label routing or required aggregate behavior.
    migration_recovery:
      applicable: false
      na_reason: No persisted state or workflow database migration.
    cli_harness:
      applicable: false
      na_reason: No CLI command or Harness behavior changes in this boundary.
    docs_schema:
      applicable: true
      evidence: Conformance, Maintenance, Security Assurance, User Guide and Gate
        protocols describe latest-event behavior.
- boundary: github-repository-publication-policy-diagnostics
  reason: Publication planning must distinguish GitHub API auth/network failures and
    report only repository-enabled merge methods.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff and Python compile checks cover scripts/publish_preflight.py
        and its lifecycle test.
    unit:
      applicable: true
      evidence: Lifecycle evidence covers protected/unprotected status, merge-method
        flags, HTTP 403, DNS failure and diagnostic redaction.
    integration:
      applicable: true
      evidence: The exact candidate Gate runs offline; the publication plan performs
        read-only GitHub metadata/policy queries when online.
    contract:
      applicable: true
      evidence: Structured publish plan output includes merge_methods containing only
        enabled repository settings.
    e2e:
      applicable: false
      na_reason: The plan is read-only and no remote branch, PR, merge or release
        side effect is part of this boundary.
    security:
      applicable: true
      evidence: GitHub errors are reduced to fixed statuses/remediation; credentials
        and raw stderr are not returned.
    migration_recovery:
      applicable: false
      na_reason: No persisted data or schema migration.
    cli_harness:
      applicable: true
      evidence: Publish-preflight lifecycle and plan contract tests verify the shared
        CLI resolver behavior.
    docs_schema:
      applicable: true
      evidence: Human publication/security guidance and Agent Gate contracts are updated
        and validated.
- boundary: canonical-documentation-and-agent-contracts
  reason: Document the lockfile, latest-event workflow semantics and read-only merge-method
    diagnostics in their existing canonical sections.
  checks:
    static_lint:
      applicable: true
      evidence: Documentation placement and consistency preflight checks changed files
        and canonical sections.
    unit:
      applicable: true
      evidence: Documentation link and layout validators cover all changed Human and
        Agent guidance.
    integration:
      applicable: true
      evidence: npm run docs:build renders the updated docs site.
    contract:
      applicable: true
      evidence: Documentation sync preview reports a complete recursive closure with
        no missing required additions.
    e2e:
      applicable: false
      na_reason: No user-facing application workflow changed; the documentation site
        build covers this boundary.
    security:
      applicable: true
      evidence: Security guidance states API diagnostics remain read-only and do not
        grant merge authority.
    migration_recovery:
      applicable: false
      na_reason: Documentation updates require no migration or rollback mechanism.
    cli_harness:
      applicable: false
      na_reason: No CLI/Harness contract documentation or command schema changed.
    docs_schema:
      applicable: true
      evidence: VitePress build plus repository documentation checks validate output.
- boundary: local-validation-requirement-parity
  reason: The local validation helper must install the same pinned Python requirements
    as GitHub Actions so the exact Integration Gate can run offline with complete
    validators.
  checks:
    static_lint:
      applicable: true
      evidence: The local-preparation lifecycle test executes with Ruff critical rules
        and Python compile validation.
    unit:
      applicable: true
      evidence: Publication lifecycle evidence asserts requirements-openapi.txt is
        included in the local environment dependency set.
    integration:
      applicable: true
      evidence: The corrected prepare-local-validation script installed all four CI
        requirements and reported READY.
    contract:
      applicable: true
      evidence: CI workflow and local preparation dependency lists are tested for
        parity.
    e2e:
      applicable: false
      na_reason: No deployed application changed; the validation environment setup
        and exact-candidate Gate are the integration boundary.
    security:
      applicable: true
      evidence: All local requirements remain exact pinned files; the helper runs
        the same isolated venv policy as CI.
    migration_recovery:
      applicable: false
      na_reason: No persisted product state or dependency migration.
    cli_harness:
      applicable: true
      evidence: The local prepare/check-only command and exact-candidate invocation
        are covered by the existing lifecycle contract.
    docs_schema:
      applicable: true
      evidence: Maintenance and Technology Guide now document all four requirements
        and docs site builds successfully.
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
