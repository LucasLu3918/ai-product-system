version: 1
change:
  id: plan38-required-checks-policy
  summary: Share fresh target-branch Required Checks evidence across Doctor and Merge Authority; distinguish
    policy permissions and provider outcomes; perform one read-only Claude Hook Doctor on retryable remote errors.
  boundary:
  - Shared fresh policy evidence for Doctor and Merge Authority
  - Classic protection, aggregate branch state and effective-rule consistency
  - Required Checks status, sanitized API error provenance and provider outcomes
  - Claude Code one-shot read-only recovery and preserved Human/Host authority
  - lucas-lab/main PR, required-check and branch safety settings
  - Canonical documentation closure and exact-candidate validation
matrix:
- boundary: Candidate and target policy branch evidence
  reason: Policy decisions must observe the selected/default remote target independently of the local candidate,
    and missing evidence must remain blocking.
  checks:
    static_lint:
      applicable: true
      evidence: 'PASS: Ruff found no new candidate lint findings; governance_guard has the same three baseline findings as origin/main.'
    unit:
      applicable: true
      evidence: 'PASS: focused doctor tests cover source/default-target branch separation, explicit target, and
        incomplete policy remains UNKNOWN.'
    integration:
      applicable: true
      evidence: 'PASS: repository governance snapshot lifecycle verifies branch.protected cross-check, permission-hidden classic policy, inconsistent protection evidence and contextual 404 behavior.'
    contract:
      applicable: true
      evidence: 'PASS: focused authority/doctor tests verify one shared fresh target-branch policy observation and separate candidate/policy branch fields.'
    e2e:
      applicable: false
      na_reason: No deployed user interface; the read-only CLI and deterministic remote API fixtures exercise the
        behavior.
    security:
      applicable: true
      evidence: 'PASS: missing or permission-limited evidence remains blocking; no authorization or writes are produced.'
    migration_recovery:
      applicable: false
      na_reason: Read-only evidence only; no persisted state or migration.
    cli_harness:
      applicable: true
      evidence: 'PASS: public doctor invocation and branch-selection behavior are covered by focused publication
        tests.'
    docs_schema:
      applicable: true
      evidence: 'PASS: recursive documentation impact has zero pending additions and documentation placement has zero errors; full exact-candidate Gate remains required.'
- boundary: GitHub response provenance and redaction
