version: 1
change:
  id: plan40-publication-diagnostics
  summary: 'Preserve explicit publication rejection causes, compare safe Prepare/Hook observations and lifecycle state, and optionally trace Diagnostic IDs through the existing configured audit ledger.'
  boundary:
  - Explicit stable reason codes and redacted internal diagnostic gaps across PublicationError call sites
  - Candidate/worktree/ref/mode/runtime observation binding shared by Prepare and PreToolUse; observational only
  - Distinct planning, authority, Host decision, and execution states
  - Optional allowlisted Diagnostic ID event append/lookup through the existing governance audit ledger
  - Focused tests, Scenario 261, CLI and Human/Claude documentation updates
matrix:
- boundary: Stable publication error classification and Traditional Chinese recovery
  reason: Known denials need a stable machine-readable cause and safe actionable recovery; unknown implementation errors must not collapse into PUBLICATION_REJECTED or expose raw details.
  checks:
    static_lint: {applicable: true, evidence: "Python syntax checks and exact-candidate Integration Gate"}
    unit: {applicable: true, evidence: "tests/test_publication_authority.py reason-code, phase, blocker, redaction and unknown-gap assertions"}
    integration: {applicable: true, evidence: "tests/test_publication_planning.py and tests/test_publication_error_recovery.py"}
    contract: {applicable: true, evidence: "Stable diagnostic JSON fields asserted by publication unit/integration tests; no external diagnostic schema is introduced"}
    e2e: {applicable: true, evidence: "tests/test_publication_diagnostics.py simulated PreToolUse denial preserves exact reason and safe recovery context"}
    security: {applicable: true, evidence: "Credential, raw exception, command and path redaction; exact-candidate secret scan"}
    migration_recovery: {applicable: false, na_reason: "Reason fields are additive; no persisted schema migration."}
    cli_harness: {applicable: true, evidence: "Claude Code Hook output and publication diagnose CLI tests"}
    docs_schema: {applicable: true, evidence: "Scenario 261 and scenario_coverage.yaml; complete recursive documentation closure in Architecture, Security Assurance, User Guide, Maintenance, Technology Guide, Installation, Harness, Claude/OpenCode adapters, Conformance, Creative Direction and linked orchestration contracts"}
- boundary: Prepare and Hook observation binding and lifecycle clarity
  reason: Prepare and native Hook reobserve independently; safe comparison must show drift without turning an observation into authority.
  checks:
    static_lint: {applicable: true, evidence: "Python syntax checks and exact-candidate Integration Gate"}
    unit: {applicable: true, evidence: "tests/test_publication_authority.py runtime binding and tests/test_publication_planning.py lifecycle/binding assertions"}
    integration: {applicable: true, evidence: "tests/test_publication_planning.py Prepare/diagnose fixtures and tests/test_publication_diagnostics.py Hook simulation"}
    contract: {applicable: true, evidence: "Additive candidate, authorization and execution JSON contracts asserted in tests"}
    e2e: {applicable: true, evidence: "Simulated Prepare/diagnose and Claude PreToolUse contracts compare candidate identity without executing Git push"}
    security: {applicable: true, evidence: "Allowlisted hashes, SHA, full target ref, mode and runtime version; no path/command in binding; Human/Host negatives retained"}
    migration_recovery: {applicable: false, na_reason: "Output fields are additive and carry no persisted state."}
    cli_harness: {applicable: true, evidence: "aips publish prepare, diagnose and native Hook fixture"}
    docs_schema: {applicable: true, evidence: "Scenario 261 and synchronized Human/Claude/OpenCode lifecycle guidance; Architecture, Harness, Installation, Security Assurance and authorization/execution boundary documents"}
- boundary: Optional Diagnostic ID trace and verified read-only lookup
  reason: A Diagnostic ID should resolve to a safely masked event when the existing ledger is explicitly configured, without creating a second default store or affecting allow/deny.
  checks:
    static_lint: {applicable: true, evidence: "Python syntax checks and exact-candidate Integration Gate"}
    unit: {applicable: true, evidence: "tests/test_governance_audit.py allowlist, chain verification and not-found cases"}
    integration: {applicable: true, evidence: "tests/test_publication_diagnostics.py configured/unconfigured/failed trace cases"}
    contract: {applicable: true, evidence: "Lookup JSON status, integrity and allowlisted event shape asserted in tests"}
    e2e: {applicable: true, evidence: "Subprocess invocation of publish diagnose --diagnostic-id reads the verified existing ledger event"}
    security: {applicable: true, evidence: "No default ledger; nested binding/event allowlists; chain verification; write failure cannot change Hook decision"}
    migration_recovery: {applicable: false, na_reason: "Existing governance audit ledger format is reused without schema migration or default creation."}
    cli_harness: {applicable: true, evidence: "scripts/publish_preflight.py diagnose --diagnostic-id CLI lifecycle test"}
    docs_schema: {applicable: true, evidence: "CLI help, Scenario 261, Human/Claude/OpenCode opt-in ledger guidance, Documentation Map/Sync and complete recursive publication-preflight closure"}
