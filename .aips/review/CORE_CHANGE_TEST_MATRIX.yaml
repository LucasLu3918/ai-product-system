version: 1
change:
  id: plan17-openapi-preflight-lifecycle
  summary: Keep required publication-preflight lifecycle evidence compatible with
    exact-path CI plans that omit optional OpenAPI validator installation.
  boundary:
  - Always run publication-preflight lifecycle evidence, top-level OpenAPI CLI routing,
    and non-OpenAPI repository checks.
  - When openapi_spec_validator and jsonschema are available, run action-level OpenAPI
    help and contract smoke including remote-reference blocking.
  - When an optional validator dependency is absent, assert a clear fail-closed diagnostic
    without traceback or output artifact.
  - Preserve the mandatory repository aggregate, exact-candidate Integration Gate,
    candidate secret scan, and all existing publication authority.
  - No runtime product behavior, public API, data schema, release state, or workflow
    permission changes.
