version: 1
status: READY
change:
  id: required-check-concurrency-race
  summary: Isolate validate workflow runs by pull-request event action so opened and classification-label events cannot cancel each other while same-action supersession and required repository checks remain intact.
  boundary:
  - .github/workflows/validate.yml
  - tests/validation/static_contracts.py
  - .aips/review/CORE_CHANGE_TEST_MATRIX.yaml
  - .aips/review/REQUIRED_CHECK_CONCURRENCY_CORE_CHANGE_PROPOSAL.md
  - docs/human/ARCHITECTURE_OVERVIEW.md
  - docs/human/CONFORMANCE.md
  - docs/human/MAINTENANCE.md
  - docs/human/SECURITY_ASSURANCE.md
  - docs/human/TECHNOLOGY_GUIDE.md
  - docs/human/USER_GUIDE.md
  - orchestration/CONFORMANCE.md
  - orchestration/CORE_CHANGE_TESTING.md
  - orchestration/DETERMINISTIC_SCHEDULER.md
  - orchestration/INTEGRATION_GATE.md
  - orchestration/ORCHESTRATOR.md
candidate:
  base_sha: bde3a84afbba375de0d1aa4297b8ba2a7b4847af
  changed_files_hash: 7e46034164ef2650a44790af94a39a00984a799551b75c9e580aaf73be7374cc
matrix:
- boundary: Pull-request event concurrency and required aggregate
  reason: GitHub workflow cancellation previously removed the required repository aggregate when opened and labeled events shared a PR-only concurrency key. The action-aware key must retain same-action replacement without cross-action cancellation.
  checks:
    static_lint:
      applicable: true
      evidence: Python static workflow contract and YAML/workflow structural validation.
    unit:
      applicable: true
      evidence: Static contract exercises distinct PR action keys, same-PR action isolation, push separation, and cancellation decisions.
    integration:
      applicable: true
      evidence: Full repository validation and exact-candidate Core Integration Gate.
    contract:
      applicable: true
      evidence: Workflow contract locks event-action grouping, label behavior, Janitor routing, and the required repository aggregate.
    e2e:
      applicable: false
      na_reason: No product UI/browser behavior changes; remote PR event-pair behavior is verified by the exact candidate GitHub Actions run.
    security:
      applicable: true
      evidence: "Strict exact-candidate and base..head secret scans; confirm contents: read and branch protection are unchanged."
    migration_recovery:
      applicable: false
      na_reason: No persisted schema, data, migration, or recovery behavior changes.
    cli_harness:
      applicable: false
      na_reason: No AIPS CLI or Harness runtime behavior changes.
    docs_schema:
      applicable: true
      evidence: Required 15-path impact closure, canonical placement, Markdown links, documentation contracts, and VitePress build.
- boundary: Documentation and policy compatibility
  reason: The documentation impact gate requires canonical guidance updates; workflow permissions, branch protection, required check names, secret scanning, and merge authority must remain unchanged.
  checks:
    static_lint:
      applicable: true
      evidence: Documentation validators, placement checks, link checks, and VitePress build.
    unit:
      applicable: true
      evidence: Repository documentation and workflow static contracts.
    integration:
      applicable: true
      evidence: Full repository validation and exact-candidate Core Integration Gate.
    contract:
      applicable: true
      evidence: Impact closure and canonical placement contracts.
    e2e:
      applicable: false
      na_reason: No user-facing product flow changes.
    security:
      applicable: true
      evidence: Read-only permissions and protected-main behavior remain covered by static and remote candidate checks.
    migration_recovery:
      applicable: false
      na_reason: Documentation-only compatibility updates have no persistent state.
    cli_harness:
      applicable: false
      na_reason: No CLI or Harness changes.
    docs_schema:
      applicable: true
      evidence: All required closure files updated and validated.
