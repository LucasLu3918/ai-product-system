version: 1
change:
  id: dependabot-identity-20261020
  summary: Treat the GitHub App bot noreply author and Dependabot's exact final Signed-off-by trailer as Git identity
    metadata decided by config/git-publication.yaml, so Dependabot commits pass git_identity and commit_messages without
    changing pii.email.v2, adding a PII exception or granting a bot identity any authority.
  boundary:
    - Bot author identity
    - Trailer identity masking
    - Policy file validation
    - PII detector invariants
    - Repository delivery and documentation closure
matrix:
  - boundary: Bot author identity
    reason: commit_identity_plan decides which candidate author addresses are publishable; the bot form must stay
      author-only, numeric-ID-bound and ASCII-only.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff on publish_preflight.py and the lifecycle shows only pre-existing findings; git diff --check clean."}
      unit: {applicable: true, evidence: "PASS: publish_preflight_lifecycle accepts dependabot and github-actions bot authors and rejects missing ID, empty or hyphen-edged slug, underscore, [bot][bot], [BOT], suffix domain, other domain, trailing newline/space, fullwidth brackets, Kelvin sign and human noreply as bot."}
      integration: {applicable: true, evidence: "PASS: real commit-tree fixtures: bot author with human or GitHub committer PASS; bot committer BLOCKED (committer field)."}
      contract: {applicable: true, evidence: "PASS: findings keep {commit, field, reason: email_not_approved}; configured_identity_plan with a bot user.email stays BLOCKED."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: identity is not treated as authentication; no gate derives authority, exemption or merge permission from the author."}
      migration_recovery: {applicable: false, na_reason: "No persistent state; allowed_bot_author_patterns [] restores the previous behavior (asserted)."}
      cli_harness: {applicable: true, evidence: "PASS: publish_preflight.py plan --offline on #338 (438fcaa6) and #262 (a08fd4cc) with the change overlaid reports only the overlay dirty-worktree blocker."}
      docs_schema: {applicable: true, evidence: "PASS: proposal, CONTENT_SAFETY_BOUNDARY, SECURITY_ASSURANCE and MAINTENANCE describe the author-only scope."}
  - boundary: Trailer identity masking
    reason: The commit_messages PII scan must still block every address except the exact approved trailer identity in the
      final trailer block of a commit authored by the same bot.
    checks:
      static_lint: {applicable: true, evidence: "PASS: ruff clean for introduced code."}
      unit: {applicable: true, evidence: "PASS: masked Dependabot message ALLOW; 14 smuggling variants unchanged by masking (personal sign-off, human or other-bot author, body position, non-trailer final line, second address, Co-authored-by, lower-case key, double space, upper-case domain, fullwidth at, confusable domain, other name, no body) and every detectable variant BLOCK."}
      integration: {applicable: true, evidence: "PASS: replayed #338 and #262 real heads: git_identity PASS, commit_messages ALLOW, candidate_diff ALLOW, secret scan PASS, PURE_DEPENDENCY_UPDATE, documentation complete."}
      contract: {applicable: true, evidence: "PASS: content_safety_plan keeps one commit_messages check with the same shape; per-commit masking with a bot commit followed by a human commit carrying the same trailer BLOCK."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: a personal address elsewhere, a fake token and every malicious_hex corpus sample in a Dependabot message still block; findings never contain the address."}
      migration_recovery: {applicable: false, na_reason: "trailer_identities [] restores the previous behavior (asserted)."}
      cli_harness: {applicable: true, evidence: "PASS: publish_preflight.py plan CLI on the replayed heads."}
      docs_schema: {applicable: true, evidence: "PASS: CONTENT_SAFETY_BOUNDARY Detection boundaries and INTEGRATION_GATE Content Safety Gate record the trailer grammar."}
  - boundary: Policy file validation
    reason: A malformed identity policy must never widen acceptance.
    checks:
      static_lint: {applicable: true, evidence: "PASS: config/git-publication.yaml loads; git_identity_policy validates the committed policy."}
      unit: {applicable: true, evidence: "PASS: missing trailer fields, non-list bot patterns, invalid regex, empty human patterns and a name containing angle brackets yield identity_policy_invalid and an unmasked BLOCK."}
      integration: {applicable: false, na_reason: Static configuration consumed only by publish_preflight.}
      contract: {applicable: true, evidence: "PASS: invalid policy findings are {reason: identity_policy_invalid} with no values."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: fail closed on every malformed case."}
      migration_recovery: {applicable: false, na_reason: Static repository policy only.}
      cli_harness: {applicable: false, na_reason: No CLI surface for policy editing.}
      docs_schema: {applicable: true, evidence: "PASS: policy keys documented in the proposal and canonical docs."}
  - boundary: PII detector invariants
    reason: The change must not alter pii.email.v2, redaction or the exception validator.
    checks:
      static_lint: {applicable: true, evidence: "PASS: scripts/content_safety.py, config/content-safety*.yaml and config/integration-gate.yaml unchanged."}
      unit: {applicable: true, evidence: "PASS: tests/test_content_safety.py (16 tests) and tests/test_safety_diagnostics.py OK."}
      integration: {applicable: true, evidence: "PASS: test_publication_planning, publication_transfer_lifecycle and dependency_impact_lifecycle pass."}
      contract: {applicable: true, evidence: "PASS: expected_test_count 16 unchanged."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: PII still accepts no repository exception; only identity policy decides trailer identities."}
      migration_recovery: {applicable: false, na_reason: Unchanged module.}
      cli_harness: {applicable: false, na_reason: Unchanged module.}
      docs_schema: {applicable: false, na_reason: Detector documentation unchanged apart from the identity-metadata sentence.}
  - boundary: Repository delivery and documentation closure
    reason: The change touches matrix-required publication preflight code and must pass the full local Gate.
    checks:
      static_lint: {applicable: true, evidence: "PASS: full local Integration Gate static stage."}
      unit: {applicable: true, evidence: "PASS: focused suites; full Gate run recorded in the delivery report."}
      integration: {applicable: true, evidence: "PASS: publish_preflight.py run on the exact committed candidate."}
      contract: {applicable: true, evidence: "PASS: exact-candidate Documentation Impact complete; placement audit clean for 14 documents."}
      e2e: {applicable: false, na_reason: No browser UI or deployed service is changed.}
      security: {applicable: true, evidence: "PASS: candidate secret scan and content safety inside the Gate."}
      migration_recovery: {applicable: false, na_reason: Rollback is a PR revert or empty policy lists.}
      cli_harness: {applicable: true, evidence: "PASS: publish_preflight.py run CLI."}
      docs_schema: {applicable: true, evidence: "PASS: Documentation Placement audit clean."}
