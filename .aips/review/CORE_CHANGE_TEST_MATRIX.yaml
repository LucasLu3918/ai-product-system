change:
  id: validation-preflight-impact-safety
  summary: Fail early on repository drift, make local exact-candidate validation repeatable,
    and preserve existing Change Impact evidence.
  boundary:
  - ci-repository-preflight
  - local-validation-entrypoint
  - impact-init-evidence-safety
  - documentation-and-compatibility
matrix:
- boundary: ci-repository-preflight
  reason: Run the existing preflight after mandatory secret scanning and before expensive
    CI setup.
  checks: &id001
    static_lint:
      applicable: true
      evidence: workflow syntax, Python lint and diff checks
    unit:
      applicable: false
      na_reason: documentation is checked by repository and placement validators
    integration:
      applicable: true
      evidence: documentation closure and repository validation
    contract:
      applicable: true
      evidence: human and agent guidance matches CI and CLI behavior
    e2e:
      applicable: false
      na_reason: no user-facing UI behavior changes
    security:
      applicable: true
      evidence: secret-scan ordering and evidence preservation described
    migration_recovery:
      applicable: false
      na_reason: no schema migration
    cli_harness:
      applicable: false
      na_reason: no new CLI behavior in this boundary
    docs_schema:
      applicable: true
      evidence: documentation closure, placement and Core Matrix validation
- boundary: local-validation-entrypoint
  reason: Use the existing Publication Preflight with a venv PATH and isolated test
    configuration.
  checks: *id001
- boundary: impact-init-evidence-safety
  reason: Prevent silent evidence loss and retain the old record on explicit reset.
  checks: *id001
- boundary: documentation-and-compatibility
  reason: Keep user, agent and security documents aligned with changed CI and CLI
    behavior.
  checks: *id001
