matrix:
  - boundary: Profile-driven prompt compilation and provenance
    reason: Style and identity constraints must reach local generation deterministically, while profile compatibility and prompt privacy remain intact.
    checks:
      static_lint: {applicable: true, evidence: Python 3.12 lint and type checks on the exact candidate.}
      unit: {applicable: true, evidence: Tests cover compilation ordering, bounded fields, and identity/style/collection constraints.}
      integration: {applicable: true, evidence: Creative execution lifecycle proves both local provider adapters receive only compiled input and provenance stores fingerprints only.}
      contract: {applicable: true, evidence: Existing version-1 Character, Style, Collection, and Bundle fixtures remain readable.}
      e2e: {applicable: false, na_reason: No production UI or browser workflow changes.}
      security: {applicable: true, evidence: Raw prompt and profile text are absent from manifest/trace; no image egress or provider fallback.}
      migration_recovery: {applicable: true, evidence: Existing manifests and output paths remain valid; changed Profile hashes invalidate stale reviews without overwriting prior outputs.}
      cli_harness: {applicable: true, evidence: Existing creative CLI and OpenCode tool lifecycles exercise prepare/configure/preflight/execute.}
      docs_schema: {applicable: true, evidence: Creative Profile/Bundle examples and schema/placement contracts are synchronized.}
  - boundary: Model capability recommendations and optional local vision review
    reason: Model selection must disclose evidence and uncertainty; optional local review may report suspected defects but cannot assert Human acceptance.
    checks:
      static_lint: {applicable: true, evidence: Python 3.12 lint and type checks on the exact candidate.}
      unit: {applicable: true, evidence: Model recommendation ranks only declared locally observed capabilities and reports missing/unknown evidence.}
      integration: {applicable: true, evidence: Mocked local vision API lifecycle verifies bounded request/response and create-only reports.}
      contract: {applicable: true, evidence: Visual-review report schema and strict response validation reject malformed/model-authored authority claims.}
      e2e: {applicable: false, na_reason: Real VLM inference and visual quality are not executed in CI.}
      security: {applicable: true, evidence: Fixed loopback destination, proxy disabled, redirects refused, no credentials, model download, cloud access, or content traces.}
      migration_recovery: {applicable: true, evidence: New report creation is atomic/create-only; interrupted or invalid review leaves manifests and images unchanged.}
      cli_harness: {applicable: true, evidence: Explicit review-assist CLI and OpenCode action stay within Session root and user grant.}
      docs_schema: {applicable: true, evidence: Capability evidence, advisory status, limitations, and model setup guidance are documented.}
  - boundary: OpenCode authorization, output budget, and collection consistency
    reason: New review action and shared Style Lock must reuse the existing prompt grant, output cap, collection contract, and Human decision separation.
    checks:
      static_lint: {applicable: true, evidence: TypeScript and Python checks cover modified adapters and validators.}
      unit: {applicable: true, evidence: Authorization, collection lock, and character acceptance validation lifecycle coverage.}
      integration: {applicable: true, evidence: Native creative tool fixture covers review authorization, revocation, Session root, and existing generation limits.}
      contract: {applicable: true, evidence: Existing native action schemas and profile/artifact version-1 contracts remain compatible.}
      e2e: {applicable: false, na_reason: Native OpenCode binary acceptance is an optional separately provisioned check; synthetic callback lifecycle is required.}
      security: {applicable: true, evidence: No action grant from transcript/assistant messages; all paths are confined; image count and create-only guarantees remain unchanged.}
      migration_recovery: {applicable: true, evidence: Older collection/profile versions remain valid and stale review reports cannot mutate reviewed manifests.}
      cli_harness: {applicable: true, evidence: CLI dispatch and native tool contract fixture exercise every newly exposed action.}
      docs_schema: {applicable: true, evidence: Scenario 234/236/238 and OpenCode/Human/Agent guidance remain aligned.}
  - boundary: Documentation, scenarios, and repository governance
    reason: New workflow steps and authority boundaries must appear in the canonical recursive documentation closure and exact Core candidate evidence.
    checks:
      static_lint: {applicable: true, evidence: Markdown link, documentation placement, and documentation sync checks.}
      unit: {applicable: false, na_reason: Documentation-only contracts are exercised by repository validation; behavior unit evidence is in the creative boundaries above.}
      integration: {applicable: true, evidence: Full exact-candidate Core Integration Gate and repository validation.}
      contract: {applicable: true, evidence: Scenario and capability/profile documentation contracts match the implementation.}
      e2e: {applicable: false, na_reason: No browser-backed product UI changes.}
      security: {applicable: true, evidence: Mandatory candidate secret scan and documented privacy/authority invariants.}
      migration_recovery: {applicable: false, na_reason: Documentation has no runtime persistence or migration behavior.}
      cli_harness: {applicable: true, evidence: Full creative CLI/OpenCode lifecycle remains required for the core change.}
      docs_schema: {applicable: true, evidence: Canonical documentation sync and placement gates plus diagrams are updated.}
