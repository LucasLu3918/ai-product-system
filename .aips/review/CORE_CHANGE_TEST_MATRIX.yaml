version: 1
change:
  id: plan25-phase2-creative
  summary: Record safe local creative-engine readiness and synthetic acceptance evidence; do not add a parallel execution path.
  boundary:
    - .aips/review/PLAN25_PHASE2_EVIDENCE.md
    - .aips/review/CORE_CHANGE_TEST_MATRIX.yaml
candidate:
  base_sha: 9b563c8c3334887a6cb2d092b3d199010d88ae67
  changed_files_hash: 144a659b29f4ac354a332e747e36b8d635dd4cb64c074add1bc697b900647fea
matrix:
  - boundary: Staged local creative-engine readiness
    reason: Discovery, runtime health, model configuration, preflight and inference must remain separate evidence stages.
    checks:
      static_lint: {applicable: true, evidence: Repository validation and YAML/document checks.}
      unit: {applicable: true, evidence: creative_execution_lifecycle command, version, model and readiness-state cases.}
      integration: {applicable: true, evidence: Read-only creative_execution discover reports local MFLUX command/version and ComfyUI states.}
      contract: {applicable: true, evidence: Stable readiness fields preserve RUNTIME_UNVERIFIED, MODEL_NOT_CONFIGURED, NOT_RUN and INFERENCE_UNVERIFIED.}
      e2e: {applicable: true, evidence: Synthetic local lifecycle only; no real model execution.}
      security: {applicable: true, evidence: No model download, provider credential, external image egress or telemetry export.}
      migration_recovery: {applicable: false, na_reason: No saved creative bundle or model configuration changed.}
      cli_harness: {applicable: true, evidence: Read-only discover command and existing create-only execution lifecycle.}
      docs_schema: {applicable: true, evidence: Documentation closure and Scenario 236 acceptance stages.}
  - boundary: Native creative preparation and human acceptance boundary
    reason: A native mock-model session can verify preparation and authority handling but cannot establish real inference or visual quality.
    checks:
      static_lint: {applicable: true, evidence: Repository validation.}
      unit: {applicable: true, evidence: Native acceptance and creative lifecycle contracts.}
      integration: {applicable: true, evidence: OpenCode v2.0.24 isolated native mock-model acceptance.}
      contract: {applicable: true, evidence: Native prepare/revocation, create-only output, provenance and explicit generation status.}
      e2e: {applicable: true, evidence: Native preparation and authorization only; generation_executed remains false.}
      security: {applicable: true, evidence: Isolated host config, secret-free environment and loopback-only model.}
      migration_recovery: {applicable: false, na_reason: No user project or native host configuration is modified.}
      cli_harness: {applicable: true, evidence: Native OpenCode host and AIPS creative tool lifecycle.}
      docs_schema: {applicable: true, evidence: Real inference and visual acceptance explicitly remain UNVERIFIED.}
