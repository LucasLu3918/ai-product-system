version: 1
change:
  id: phase10-environment-ci-recovery
  summary: Recover CLI runtime selection, CI diagnostics and dependency updates, and
    Intelligence preservation with truthful freshness.
  boundary:
  - ci-label-event-concurrency
  - required-repository-aggregate
  - cli-runtime-and-offline-dependencies
  - intelligence-preservation-and-freshness
  - ci-diagnostics-and-actions
matrix:
- boundary: ci-label-event-concurrency
  reason: Candidate updates and Core/Large classification-label changes affect the
    validated candidate or its Gate class; unrelated labels do not.
  checks:
    static_lint:
      applicable: true
      evidence: Critical Ruff checks, workflow expression syntax, and git diff --check.
    unit:
      applicable: true
      evidence: Static event-policy contracts cover push, workflow_dispatch, candidate
        events, classification labels, unrelated labels, skip conditions, and aggregate
        results.
    integration:
      applicable: true
      evidence: Exact-candidate Integration Gate and repository validation run the
        updated contracts and documentation checks.
    contract:
      applicable: true
      evidence: Scenario 165 asserts classification-label supersession, unrelated-label
        no-op, and required aggregate behavior.
    e2e:
      applicable: false
      na_reason: No deployed product journey or production application behavior changes.
    security:
      applicable: true
      evidence: Workflow remains contents-read only; unrelated label values are passed
        through environment context and never interpolated into shell source.
    migration_recovery:
      applicable: false
      na_reason: No persistent data, schema, or branch-protection required-context
        migration.
    cli_harness:
      applicable: true
      evidence: Publication plan guidance accurately describes initial classification
        labels and later event behavior.
    docs_schema:
      applicable: true
      evidence: Human guidance, Integration Gate operations, Orchestrator, Scheduler,
        and Scenario 165 describe the same event policy.
- boundary: required-repository-aggregate
  reason: Existing protected-main branch rules depend on the single repository check
    context; only an unrelated-label skip may produce a no-op success.
  checks:
    static_lint:
      applicable: true
      evidence: Static contract asserts workflow skip guard and no-op summary while
        preserving failure propagation.
    unit:
      applicable: true
      evidence: Aggregate model verifies only an unrelated labeled/unlabeled event
        with skipped Janitor succeeds; failed and other skipped jobs remain non-success.
    integration:
      applicable: true
      evidence: Exact-candidate GitHub validation confirms repository remains the
        required successful aggregate for full Gate runs.
    contract:
      applicable: true
      evidence: Scenario 165 retains the same required context and tests skipped/no-op
        boundary.
    e2e:
      applicable: false
      na_reason: No deployed product journey or production application behavior changes.
    security:
      applicable: true
      evidence: No new permissions or credentials; failure results remain blocking.
    migration_recovery:
      applicable: false
      na_reason: Protected branch required context remains repository; no migration
        is needed.
    cli_harness:
      applicable: true
      evidence: Existing publish preflight label plan remains compatible and documents
        when full validation occurs.
    docs_schema:
      applicable: true
      evidence: Required aggregate/no-op behavior is documented in canonical maintenance
        and Gate guidance.
