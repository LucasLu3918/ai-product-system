version: 1
change:
  id: phase12-installation-cli
  summary: Add explicit optional OpenAPI setup and diagnostics and verify installed
    product CLI behavior across the supported installation paths.
  boundary:
  - optional-openapi-installation
  - installed-product-cli
  - supported-installation-platforms
matrix:
- boundary: optional-openapi-installation
  reason: Fresh installations need actionable optional-dependency status without changing
    the required baseline or silently performing network installation.
  checks:
    static_lint:
      applicable: true
      evidence: Critical Ruff, Bash syntax, diff check, docs closure and repository static contracts
    unit:
      applicable: true
      evidence: Isolated OpenAPI CLI lifecycle verifies missing/ready/install state and exact pinned requirements path
    integration:
      applicable: true
      evidence: Installed CLI validates a contract from a product directory with spaces; install CI checks the actual pinned validator
    contract:
      applicable: true
      evidence: Existing AIPS CLI and installation contracts; additive commands preserve baseline install and required dependency status
    e2e:
      applicable: true
      evidence: Actual AIPS local exact-candidate Gate, PR and main required validation; Linux fresh-install product fixture
    security:
      applicable: true
      evidence: No automatic network installation; explicit pinned dependency action; existing remote OpenAPI reference and repo-root restrictions remain blocked; exact candidate secret scan
    migration_recovery:
      applicable: true
      evidence: Base AIPS installs omit optional packages, existing commands remain compatible, explicit setup is repeatable
    cli_harness:
      applicable: true
      evidence: Doctor distinguishes optional status; validator gives safe remediation; product cwd and CLI routing are verified
    docs_schema:
      applicable: true
      evidence: Full documentation impact closure, placement, links and VitePress
        build
- boundary: supported-installation-platforms
  reason: Keep actual support claims aligned with executable Linux/macOS entrypoints and the Windows WSL launcher contract.
  checks:
    static_lint:
      applicable: true
      evidence: Installer shell syntax and PowerShell parser contracts
    unit:
      applicable: true
      evidence: Linux/macOS isolated CLI lifecycle uses no package download
    integration:
      applicable: true
      evidence: Linux managed install sets up pinned OpenAPI tooling and validates a separate product tree
    contract:
      applicable: true
      evidence: Windows supported WSL launcher smoke remains covered
    e2e:
      applicable: true
      evidence: Exact candidate repository validator and platform installation workflows
    security:
      applicable: true
      evidence: No native Windows support claim; no ambient product-root files or credentials modified
    migration_recovery:
      applicable: true
      evidence: Existing users opt into the optional toolchain without runtime migration
    cli_harness:
      applicable: true
      evidence: Installed executable works from an independent product root on supported Unix hosts
    docs_schema:
      applicable: true
      evidence: Installation and product onboarding claims describe actual Linux/macOS/Windows WSL scope
scope_recomputed_after_expansion: true
actual_diff_reconciled: true
blockers: []
