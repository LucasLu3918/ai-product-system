version: 1
change:
  id: retrieval-relation-schema-refresh
  summary: Parse Python call identifiers from raw source only in memory, keep indexed
    data redacted, and force full re-extraction when relation semantics change.
  boundary:
  - Python relation extraction and privacy boundary
  - Disposable retrieval-index schema upgrade
  - Change Impact traversal evidence and documentation
  - Exact-candidate validation and publication
matrix:
- boundary: Python relation extraction and privacy boundary
  reason: Redaction can make valid Python syntax unparsable and create false lexical
    call edges; AST extraction must consume raw source in memory while persisted rows
    remain redacted.
  checks: &id001
    static_lint:
      applicable: true
      evidence: 'REQUIRED: exact-candidate lint and touched-code ratchet in the Integration
        Gate.'
    unit:
      applicable: true
      evidence: 'PASS: tests/evidence/retrieval_relations_extraction_lifecycle.py
        verifies only call-name identifiers are extracted from raw source and secret
        literals are absent from relation output.'
    integration:
      applicable: true
      evidence: 'REQUIRED: exact-candidate AIPS Integration Gate before publication
        and merge.'
    contract:
      applicable: true
      evidence: 'PASS: tests/validation/change_impact_resolution_contracts.py verifies
        the public traversal/reconciliation contract; documentation placement preview
        passes.'
    e2e:
      applicable: true
      evidence: 'PASS: tests/evidence/retrieval_intelligence_lifecycle.py upgrades
        a schema-v6 disposable index and confirms stale attribute-call edges are removed
        by full rebuild.'
    security:
      applicable: true
      evidence: 'REQUIRED: exact-candidate Secret/PII scan in the Integration Gate;
        raw source is used only for in-memory AST call-name extraction.'
    migration_recovery:
      applicable: true
      evidence: 'PASS: schema-version change triggers disposable full index rebuild;
        canonical source and Project Intelligence state are not migrated or overwritten.'
    cli_harness:
      applicable: false
      na_reason: No CLI signature, host adapter, or authorization behavior changes.
    docs_schema:
      applicable: true
      evidence: 'REQUIRED: exact-candidate documentation validation and build in the
        Integration Gate; canonical docs describe schema bump/rebuild and privacy
        behavior.'
- boundary: Disposable retrieval-index schema upgrade
  reason: Old indexes may retain stale lexical relations even when source content
    hashes are unchanged; the schema bump invalidates the disposable relation index.
  checks: *id001
- boundary: Change Impact traversal evidence and documentation
  reason: False execute edges are removed; remaining unmapped architecture seeds stay
    explicit unknowns and do not establish repository-wide completeness.
  checks: *id001
- boundary: Exact-candidate validation and publication
  reason: Bind the reviewed implementation and documentation closure to one candidate;
    native branch protections and Human merge authority remain in force.
  checks: *id001
