version: 1
change:
  id: plan16-p16-05-evolution-human-evaluation
  summary: Add deterministic monthly Human-label sampling and offline relevance, actionability
    and per-source yield metrics without authorizing automatic Evolution policy changes.
  boundary:
  - Deterministic bounded monthly fingerprint sampling and a metadata-minimized review
    manifest.
  - Human provenance, relevance/actionability completeness, confusion metrics and
    source yield reporting.
  - Backward-compatible evaluator CLI, Scenario 218 evidence and canonical documentation
    placement.
candidate:
  base_sha: 27d2c640634dfb11f46e4f8409a7c78394417a85
  changed_files_hash: 9e18ab1310174d55a4c2e76d63a0df71e1cf7de65dc345af619b44e318e9c9ad
matrix:
- boundary: deterministic-human-sample
  reason: Monthly sampling must be stable for the same period and fingerprint set,
    bounded in size, and free of invented labels or copied signal text.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff, YAML contracts and repository preflight validate the evaluator,
        policy config and exact diff.
    unit:
      applicable: true
      evidence: Evolution relevance lifecycle tests assert stable fingerprint ranking,
        duplicate rejection, incomplete cohorts and default sample bounds.
    integration:
      applicable: true
      evidence: The public CLI samples an input candidate inventory and emits the
        bounded JSON manifest consumed by Human review.
    contract:
      applicable: true
      evidence: Scenario 218 and validation contracts bind the monthly sample method,
        count, label authority and no-policy-mutation rule.
    e2e:
      applicable: true
      evidence: Full repository validation and exact-candidate Integration Gate exercise
        the sampler and unchanged full required validation.
    security:
      applicable: true
      evidence: The manifest carries fingerprints, source IDs, selection and optional
        source URL only; no article bodies, credentials or policy mutations are emitted.
    migration_recovery:
      applicable: false
      na_reason: No persistent store or database schema changes; the production labels
        file remains empty and label additions are backward compatible.
    cli_harness:
      applicable: true
      evidence: Lifecycle coverage invokes the existing evaluator CLI in both Human-label
        evaluation and deterministic sample modes.
    docs_schema:
      applicable: true
      evidence: Human Radar guides, Scenario 218, conformance summaries and documentation
        placement describe the sample contract.
- boundary: human-evaluation-and-policy-authority
  reason: Yield metrics must require complete Human labels and remain advisory without
    mutating any source-selection policy.
  checks:
    static_lint:
      applicable: true
      evidence: Ruff and repository validation cover the evaluator and its static
        validation contract.
    unit:
      applicable: true
      evidence: Lifecycle cases verify precision, recall, actionable yield, per-source
        yield and NOT_READY on uncertain or incomplete labels.
    integration:
      applicable: true
      evidence: The evaluator CLI reads the empty production label file and fixture
        labels without changing either input.
    contract:
      applicable: true
      evidence: Scenario 218, evaluation config and validation contracts require human
        authority and forbid automatic source weight, enablement or config changes.
    e2e:
      applicable: true
      evidence: Full local validation and the exact-candidate Integration Gate run
        the complete production repository checks.
    security:
      applicable: true
      evidence: The evaluation is offline and read-only; no credentials, issue publication
        or remote policy mutation is added.
    migration_recovery:
      applicable: false
      na_reason: No persistent evaluation result store or migration is introduced.
    cli_harness:
      applicable: true
      evidence: Existing positional label evaluation and the new sample flags are
        exercised through the public CLI.
    docs_schema:
      applicable: true
      evidence: Evolution Radar Human and Agent documentation states the fail-closed
        label contract and Human-only policy review.
