version: 1

product:
  name: example-store
  planning_status: PLANNING # DISCOVERY | PLANNING | REVIEW | GATE_1_READY | GATE_1_APPROVED | IMPLEMENTATION_READY

approvals:
  planning:
    status: PENDING # PENDING | APPROVED
    evidence: null # Human approval reference; never generated by the validator.
  implementation:
    status: PENDING
    evidence: null

artifacts:
  product_research:
    path: PRODUCT_RESEARCH.md
    applicability: applicable # applicable | not_applicable
    status: IN_PROGRESS # NOT_STARTED | IN_PROGRESS | NEEDS_DECISION | READY_FOR_REVIEW | APPROVED | N/A | STALE
    depends_on: []

  product_plan:
    path: PRODUCT_PLAN.md
    applicability: applicable
    status: IN_PROGRESS
    depends_on:
      - artifact: product_research
        strength: recommended # required | recommended | conditional

  requirements:
    path: REQUIREMENTS.yaml
    applicability: applicable
    status: IN_PROGRESS
    depends_on:
      - artifact: product_plan
        strength: required

  experience_design:
    path: EXPERIENCE_DESIGN.md
    applicability: applicable
    status: IN_PROGRESS
    depends_on:
      - artifact: product_plan
        strength: required
      - artifact: requirements
        strength: recommended

  visual_system:
    path: VISUAL_SYSTEM.md
    applicability: applicable
    status: IN_PROGRESS
    depends_on:
      - artifact: experience_design
        strength: required

  domain_model:
    path: DOMAIN_MODEL.md
    applicability: applicable
    status: IN_PROGRESS
    depends_on:
      - artifact: requirements
        strength: required

  api_spec:
    path: API_SPEC.md
    applicability: applicable
    status: IN_PROGRESS
    depends_on:
      - artifact: requirements
        strength: required
      - artifact: domain_model
        strength: recommended

  technical_architecture:
    path: TECHNICAL_ARCHITECTURE.md
    applicability: applicable
    status: IN_PROGRESS
    depends_on:
      - artifact: requirements
        strength: required
      - artifact: api_spec
        strength: conditional

  implementation_plan:
    path: IMPLEMENTATION_PLAN.md
    applicability: applicable
    status: IN_PROGRESS
    depends_on:
      - artifact: technical_architecture
        strength: required

  decisions_assumptions:
    path: DECISIONS_ASSUMPTIONS.md
    applicability: applicable
    status: IN_PROGRESS
    depends_on: []

  security:
    path: security/SECURITY_PLAN.md
    applicability: not_applicable
    status: N/A
    reason: Set applicable and provide the security plan when product scope or SAL requires it.

traceability:
  # Add one row per requirement. Every applicable target needs at least one stable artifact ID.
  - requirement_id: FR-001
    acceptance_ids: [AC-001]
    downstream:
      experience_design:
        applicable: true
        refs: [SCR-001]
      visual_system:
        applicable: true
        refs: [VIS-001]
      domain_model:
        applicable: true
        refs: [DOM-001]
      api_spec:
        applicable: true
        refs: [OP-001]
      security:
        applicable: false
        reason: No security-specific requirement is introduced by this behavior.
      verification:
        applicable: true
        refs: [tests/example_test.py]

  - requirement_id: NFR-001
    acceptance_ids: [AC-002]
    downstream:
      experience_design:
        applicable: false
        reason: This performance target does not change a user journey.
      visual_system:
        applicable: false
        reason: This performance target does not change visual rules.
      domain_model:
        applicable: false
        reason: This performance target does not change domain concepts.
      api_spec:
        applicable: false
        reason: This target is measured at the system boundary without a new operation.
      security:
        applicable: false
        reason: This target introduces no security-specific requirement.
      verification:
        applicable: true
        refs: [tests/performance/example_benchmark.py]
