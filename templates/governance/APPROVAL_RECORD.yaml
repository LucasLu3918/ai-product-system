  id: null
  type: null
  status: PENDING
  approved_by: null
  approved_at: null
  expires_at: null
proposal:
  fingerprint: null
scope:
  repository_id: null
  worktree_id: null
  branch: null
  remote: null
  remote_url: null
  target_ref: null
  expected_remote_oid: null
  candidate_commit: null
  base_commit: null
  diff_digest: null
  argv: []
  force: false
  delete: false
  files: []
  boundaries: []
  operations: []
evidence:
  validation: []
  unresolved: []
metadata:
  created_at: null
