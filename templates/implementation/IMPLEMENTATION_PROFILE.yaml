schema_version: "1"
status: BLOCKED # READY | BLOCKED; unresolved authority below intentionally blocks implementation

project:
  mode: existing # existing | new
  evidence:
    - source: repository
      reference: go.mod

requirement:
  summary: null
  acceptance_references: []

contract:
  type: openapi # openapi | none | other
  source: api/openapi.yaml
  authority: unresolved # canonical | descriptive | proposed | unresolved
  affects_change: true
  resolution: unresolved # confirmed | strong_evidence | inferred | not_detected | unresolved | conflicting
  evidence: []
  openapi:
    validation_status: UNVERIFIED # PASS | FAIL | UNVERIFIED | BLOCKED
    validation_report: null # Repository-relative, versioned evidence artifact
    spec_sha256: null
    compatibility_required: false
    compatibility_status: UNKNOWN # NO_CHANGE | NON_BREAKING | BREAKING | UNKNOWN | BLOCKED
    baseline_authority: unresolved # Only canonical may be automatically compared
    compatibility_report: null
    implementation_conformance_status: UNVERIFIED # PASS | FAIL | UNVERIFIED | BLOCKED
    conformance_report: null

technology:
  language:
    name: go # go | php | python | dotnet
    version: null
    resolution: strong_evidence
    evidence:
      - source: repository
        reference: go.mod
  framework:
    name: null # Optional; resolved after language
    version: null
    resolution: not_detected
    evidence: []
  decision_record:
    constraints: []
    human_preferences: []
    candidates: []
    selected_by: project_evidence # project_evidence | human
    confirmed: true

architecture:
  complexity_signals: [] # Qualitative evidence; never a summed score
  triggers: []
  counter_signals: []
  logical_style:
    value: unknown # simple | modular | modular_monolith | domain_oriented | domain_ecosystem | unknown
    resolution: unresolved
    evidence: []
  clean_architecture:
    level: unknown # none | light | full | unknown
    resolution: not_detected
    evidence: []
  ddd:
    tactical:
      level: unknown # none | selective | tactical | unknown
      resolution: not_detected
      evidence: []
    strategic:
      level: unknown # none | selective | strategic | unknown
      resolution: not_detected
      evidence: []
  deployment:
    style: unknown # single_deployment | modular_monolith | microservices | serverless | unknown
    resolution: unresolved
    evidence: []

generation:
  enabled: false
  policy: none # none | boundary_only
  adapters: [] # Optional Phase 4 OpenAPI client CLI adapters; execution requires an explicit local --execute.

ownership:
  generated: []
  scaffolded: []
  project_owned: []
  unresolved: [] # Protected until Human/project evidence resolves ownership

enforcement:
  mode: disabled # disabled | report | enforce; old Profiles may omit this section
  scope_paths: [] # Repository-relative globs for files governed by this Profile
  language_profile: null # e.g. references/languages/go/PROFILE.yaml
  commands: [] # id, argv, source, timeout_seconds, deterministic
  generation_records: [] # path, tool, version, output_sha256, inputs [{path, sha256}]

quality:
  mandatory: [] # Enforced entries: {id, command_id, evidence_report}
  project_required: [] # Same shape; project command remains authoritative
  risk_triggered: [] # Same shape when risk trigger applies
  advisory: []
  evidence: [] # PASS | FAIL | UNVERIFIED | BLOCKED with command/source provenance

knowledge:
  project_evidence: []
  external_evidence: [] # Official source and applicable version

unresolved:
  - id: U-CONTRACT-AUTHORITY
    topic: contract_authority
    description: Confirm who owns the API contract before contract-affecting implementation.
    blocking: true
    resolution: Human clarification is required.
    evidence: []
