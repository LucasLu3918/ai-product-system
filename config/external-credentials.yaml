version: 1
purpose: Deterministic registry and policy for external Agent/provider credentials.
scope:
  scan_roots:
    - .github/workflows
    - config
    - scripts
  file_suffixes: [.yml, .yaml, .py]
policy:
  external_credentials_required_for_baseline: false
  external_credentials_required_for_release: false
  undeclared_external_credential: BLOCK
  pull_request_secret_exposure: BLOCK
  credential_values_in_repository: false
credentials:
  GEMINI_API_KEY:
    class: external_agent_provider
    optional: true
    activation: explicit_secret_configuration
    missing_behaviors: [SKIPPED_NOT_CONFIGURED]
    required_for_baseline: false
    required_for_release: false
    allowed_consumers:
      - .github/workflows/gemini-provider-session-verification.yml
      - scripts/gemini_provider_session_verification.py
  OPENAI_API_KEY:
    class: external_agent_provider
    optional: true
    activation: explicit_secret_configuration
    missing_behaviors: [ANALYSIS_PENDING, TRIAL_PENDING, TRIAL_HANDOFF_READY]
    required_for_baseline: false
    required_for_release: false
    allowed_consumers:
      - .github/workflows/evolution-decision.yml
      - .github/workflows/evolution-radar.yml
      - .github/workflows/retrieval-semantic-trial.yml
      - config/evolution-analyzer.yaml
      - config/evolution-trial.yaml
      - config/retrieval-embedding-trial.yaml
conditional_workflow_exposure:
  - credential: OPENAI_API_KEY
    workflow: .github/workflows/retrieval-semantic-trial.yml
    required_condition: "vars.AIPS_RETRIEVAL_EMBEDDING_PROVIDER == 'remote'"
authority:
  human_approval_granted: false
  merge_authorized: false
  release_authorized: false
  publication_authorized: false
  credential_creation_authorized: false
