version: 1
technology_guide:
  enabled: true
  path: docs/human/TECHNOLOGY_GUIDE.md
  triggers:
    - harness/**
    - orchestration/**
    - scripts/**
    - templates/**
    - config/**
    - references/**
    - .github/workflows/**
    - requirements*.txt
rules:
  - id: evolution-radar
    triggers:
      - scripts/evolution_radar.py
      - scripts/evolution_radar_rollup.py
      - scripts/evolution_analysis.py
      - scripts/evolution_decision.py
      - scripts/evolution_trial.py
      - scripts/evolution_adoption.py
      - scripts/evolution_effectiveness.py
      - config/evolution-sources.yaml
      - config/evolution-analyzer.yaml
      - config/evolution-trial.yaml
      - config/evolution-effectiveness.yaml
      - references/evolution/**
      - templates/evolution/**
      - .github/workflows/evolution-radar.yml
      - .github/workflows/evolution-decision.yml
      - .github/workflows/evolution-effectiveness.yml
    human_docs:
      - docs/human/EVOLUTION_RADAR.md
      - docs/human/EVOLUTION_RADAR_OVERVIEW.md
    agent_docs:
      - orchestration/EVOLUTION_RADAR.md
      - orchestration/EXECUTION_ISOLATION.md
  - id: documentation-governance
    triggers:
      - scripts/documentation_sync.py
      - scripts/documentation_audience.py
      - config/documentation-sync.yaml
      - config/documentation-audience.yaml
      - tests/validation/documentation_sync_contracts.py
      - tests/validation/documentation_audience_contracts.py
    human_docs:
      - docs/human/DOCUMENTATION_SYNC.md
      - docs/human/DOCUMENTATION_MAP.md
    agent_docs:
      - orchestration/DOCUMENTATION_SYNC.md
  - id: harness
    triggers: [scripts/manage_runtime_adapter.py, scripts/harness_resolve.py, harness/adapters/**, templates/harness/**]
    human_docs: [docs/human/HARNESS.md]
    agent_docs: [harness/HARNESS_PROTOCOL.md]
  - id: project-intelligence
    triggers: [scripts/project_intelligence.py, scripts/retrieval_intelligence.py, scripts/retrieval_evaluation.py, scripts/structural_retrieval_trial.py, scripts/retrieval_embedding_trial.py, scripts/retrieval_embedding_trial_summary.py, scripts/turn_context_hook.py, config/retrieval-embedding-trial.yaml, requirements-semantic-trial.txt, templates/intelligence/**, .github/workflows/retrieval-semantic-trial.yml]
    human_docs: [docs/human/PROJECT_INTELLIGENCE.md]
    agent_docs: [orchestration/PROJECT_INTELLIGENCE.md]
  - id: execution-isolation
    triggers:
      - scripts/execution_isolation.py
      - scripts/sandbox_providers.py
      - scripts/e2b_sandbox_verification.py
      - orchestration/schemas/execution-profile.yaml
      - config/sandbox-providers.yaml
      - config/external-credentials.yaml
      - requirements-sandbox.txt
      - .github/workflows/e2b-sandbox-verification.yml
      - tests/validation/conformance_isolation.py
      - tests/scenarios/111-isolation-resolution.md
      - tests/scenarios/114-sandbox-truthfulness.md
    human_docs:
      - docs/human/ARCHITECTURE_OVERVIEW.md
      - docs/human/SECURITY_ASSURANCE.md
    agent_docs: [orchestration/EXECUTION_ISOLATION.md]
  - id: deterministic-execution
    triggers:
      - scripts/deterministic_scheduler.py
      - scripts/integration_gate.py
      - orchestration/schemas/task-graph.yaml
      - templates/automation/TASK_GRAPH.yaml
      - templates/automation/VALIDATION_PROFILE.yaml
      - templates/review/INTEGRATION_GATE_REPORT.yaml
      - config/integration-gate.yaml
      - requirements-validation.txt
      - .github/workflows/validate.yml
    human_docs:
      - docs/human/ARCHITECTURE_OVERVIEW.md
      - docs/human/USER_GUIDE.md
    agent_docs:
      - orchestration/DETERMINISTIC_SCHEDULER.md
      - orchestration/INTEGRATION_GATE.md
      - orchestration/ORCHESTRATOR.md
  - id: publication-preflight
    triggers:
      - scripts/publish_preflight.py
      - scripts/browser_runtime.py
      - scripts/repository_preflight.py
      - .github/workflows/validate.yml
      - config/integration-gate.yaml
      - tests/evidence/publish_preflight_lifecycle.py
      - tests/validation/publish_preflight_contracts.py
    human_docs:
      - docs/human/MAINTENANCE.md
      - docs/human/USER_GUIDE.md
      - docs/human/ARCHITECTURE_OVERVIEW.md
      - docs/human/TECHNOLOGY_GUIDE.md
    agent_docs:
      - orchestration/INTEGRATION_GATE.md
      - orchestration/CORE_CHANGE_TESTING.md
      - orchestration/ORCHESTRATOR.md
      - orchestration/DETERMINISTIC_SCHEDULER.md
  - id: resource-authorization
    triggers:
      - scripts/resource_authorization.py
      - orchestration/RESOURCE_AUTHORIZATION.md
      - orchestration/schemas/resource-authorization-profile.yaml
      - orchestration/schemas/execution-profile.yaml
      - templates/automation/RESOURCE_AUTHORIZATION_PROFILE.yaml
      - tests/validation/resource_authorization_contracts.py
    human_docs:
      - docs/human/ARCHITECTURE_OVERVIEW.md
      - docs/human/USER_GUIDE.md
    agent_docs:
      - orchestration/EXECUTION_ISOLATION.md
      - orchestration/ORCHESTRATOR.md
  - id: scenario-conformance
    triggers: [scripts/scenario_conformance.py, scripts/agent_eval.py, scripts/trajectory_eval.py, orchestration/TRAJECTORY_EVAL.md, templates/conformance/**, tests/scenario_coverage.yaml, tests/validation/ears_requirement_contracts.py]
    human_docs: [docs/human/CONFORMANCE.md]
    agent_docs: [orchestration/CONFORMANCE.md]

  - id: requirement-planning
    triggers:
      - orchestration/REQUIREMENT_CLARIFICATION.md
      - orchestration/PLANNING_PACKAGE.md
      - templates/requirements/IMPLEMENTATION_GOAL.yaml
      - templates/planning-package/PRODUCT_PLAN.md
      - templates/planning-package/REQUIREMENTS.yaml
      - scripts/requirements_traceability.py
      - tests/scenarios/174-ears-requirement-traceability.md
      - tests/scenario_coverage.yaml
      - tests/validation/conformance_isolation.py
      - tests/validate_repository.py
      - orchestration/DOCUMENTATION_SYNC.md
    human_docs:
      - docs/human/USER_GUIDE.md
      - docs/human/TECHNOLOGY_GUIDE.md
      - docs/human/CONFORMANCE.md
    agent_docs:
      - orchestration/REQUIREMENT_CLARIFICATION.md
      - orchestration/PLANNING_PACKAGE.md
      - orchestration/CONFORMANCE.md
      - orchestration/DOCUMENTATION_SYNC.md

  - id: documentation-platform
    triggers:
      - docs/human/.vitepress/**
      - package.json
      - .github/workflows/docs-site.yml
      - scripts/documentation_placement.py
      - config/documentation-placement.yaml
    human_docs:
      - docs/human/ARCHITECTURE_OVERVIEW.md
      - docs/human/DOCUMENTATION_SYNC.md
      - docs/human/DOCUMENTATION_MAP.md
    agent_docs:
      - orchestration/DOCUMENTATION_SYNC.md
