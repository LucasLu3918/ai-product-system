version: 1
boundary: AIPS Runtime Content Safety Boundary
default_failure_mode: BLOCK_FOR_DURABLE_SINKS
sinks:
  default:
    owner: aips
    enforcement: ENFORCED
    policies:
      SECRET: {action: REDACT, confidence: 0.99}
      PII: {action: REDACT, confidence: 0.90}
      INJECTION_SIGNAL: {action: REVIEW, confidence: 0.60}
      UNTRUSTED_CONTENT: {action: REVIEW, confidence: 1.0}
  runtime_log:
    owner: aips
    enforcement: ENFORCED
    policies:
      SECRET: {action: REDACT, confidence: 0.99}
      PII: {action: REDACT, confidence: 0.90}
      INJECTION_SIGNAL: {action: REVIEW, confidence: 0.60}
  governance_audit:
    owner: aips
    enforcement: ENFORCED
    policies:
      SECRET: {action: REDACT, confidence: 0.99}
      PII: {action: REDACT, confidence: 0.90}
      INJECTION_SIGNAL: {action: REDACT, confidence: 0.60}
  observable_event:
    owner: aips
    enforcement: ENFORCED
    policies:
      SECRET: {action: REDACT, confidence: 0.99}
      PII: {action: REDACT, confidence: 0.90}
      INJECTION_SIGNAL: {action: REDACT, confidence: 0.60}
  temporary_evidence:
    owner: aips
    enforcement: ENFORCED
    policies:
      SECRET: {action: REDACT, confidence: 0.99}
      PII: {action: REDACT, confidence: 0.90}
      INJECTION_SIGNAL: {action: REVIEW, confidence: 0.60}
  git_commit:
    owner: host
    enforcement: RUNTIME_DEPENDENT
    policies:
      SECRET: {action: BLOCK, confidence: 0.99}
      PII: {action: BLOCK, confidence: 0.90}
      INJECTION_SIGNAL: {action: BLOCK, confidence: 0.60}
  github_pr:
    owner: host
    enforcement: RUNTIME_DEPENDENT
    policies:
      SECRET: {action: BLOCK, confidence: 0.99}
      PII: {action: BLOCK, confidence: 0.90}
      INJECTION_SIGNAL: {action: BLOCK, confidence: 0.60}
  release_notes:
    owner: host
    enforcement: RUNTIME_DEPENDENT
    policies:
      SECRET: {action: BLOCK, confidence: 0.99}
      PII: {action: BLOCK, confidence: 0.90}
      INJECTION_SIGNAL: {action: BLOCK, confidence: 0.60}
  source_artifact:
    owner: aips
    enforcement: ENFORCED
    policies:
      SECRET: {action: BLOCK, confidence: 0.99}
      PII: {action: BLOCK, confidence: 0.90}
      INJECTION_SIGNAL: {action: REVIEW, confidence: 0.60}
injection_rules:
  injection.override.v2:
    confidence: 0.99
    purpose: Classify high-confidence hierarchy replacement attempts.
    actions: {default: REVIEW, git_commit: BLOCK, github_pr: BLOCK, release_notes: BLOCK, source_artifact: BLOCK}
  injection.exfiltration.v2:
    confidence: 0.99
    purpose: Identify requests to expose protected instruction and authentication material.
    actions: {default: REVIEW, git_commit: BLOCK, github_pr: BLOCK, release_notes: BLOCK, source_artifact: BLOCK}
  injection.agent_execution.v2:
    confidence: 0.95
    purpose: Identify execution directives aimed at an automated actor.
    actions: {default: REVIEW, git_commit: BLOCK, github_pr: BLOCK, release_notes: BLOCK, source_artifact: BLOCK}
  injection.ambiguous.v2:
    action: REVIEW
    confidence: 0.60
    purpose: Flag context-poor operational language for review.
