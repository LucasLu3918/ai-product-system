version: 1
profile_id: aips-repository
candidate_secret_scan:
  required: true
  check_id: mandatory-candidate-secret-scan
  scanner: scripts/check_secret_leakage.py
  policy: config/secret-scan.yaml
matrix_required: false
matrix_required_change_classes: [large, core]
matrix_required_paths:
  # Narrow fail-closed safety net for governance-core Integration Gate surfaces.
  # Ordinary changes remain matrix-optional unless classified large/core.
  - scripts/integration_gate.py
  - scripts/publish_preflight.py
  - scripts/check_secret_leakage.py
  - scripts/repository_preflight.py
  - config/integration-gate.yaml
  - config/secret-scan.yaml
  - orchestration/SECRET_HANDLING.md
  - .github/workflows/validate.yml
  - orchestration/CORE_CHANGE_TESTING.md
  - orchestration/INTEGRATION_GATE.md
  - templates/review/CORE_CHANGE_TEST_MATRIX.yaml
  - tests/validation/scheduler_gate_contracts.py
  - tests/evidence/integration_gate_lifecycle.py
  - scripts/trajectory_eval.py
  - tests/evidence/trajectory_quality_gate_lifecycle.py
checks:
  - id: ruff-critical
    category: lint
    required: true
    timeout_seconds: 120
    argv: [python3, -m, ruff, check, --select, "E9,F63,F7,F82", scripts, tests]
    paths: ["**"]
  - id: scheduler-gate-types
    category: type
    required: true
    timeout_seconds: 120
    argv: [python3, -m, mypy, --ignore-missing-imports, scripts/deterministic_scheduler.py, scripts/integration_gate.py]
    paths:
      - scripts/deterministic_scheduler.py
      - scripts/integration_gate.py
      - scripts/publish_preflight.py
      - scripts/repository_preflight.py
      - orchestration/DETERMINISTIC_SCHEDULER.md
      - orchestration/INTEGRATION_GATE.md
      - orchestration/schemas/task-graph.yaml
      - templates/automation/TASK_GRAPH.yaml
      - templates/automation/VALIDATION_PROFILE.yaml
      - templates/review/INTEGRATION_GATE_REPORT.yaml
      - config/integration-gate.yaml
      - .github/workflows/validate.yml
  - id: deterministic-scheduler-lifecycle
    category: test
    required: true
    timeout_seconds: 120
    argv: [python3, tests/evidence/deterministic_scheduler_lifecycle.py]
    paths:
      - scripts/deterministic_scheduler.py
      - orchestration/DETERMINISTIC_SCHEDULER.md
      - orchestration/schemas/task-graph.yaml
      - templates/automation/TASK_GRAPH.yaml
      - tests/evidence/deterministic_scheduler_lifecycle.py
      - tests/scenarios/135-deterministic-multi-agent-scheduler.md
  - id: integration-gate-lifecycle
    category: test
    required: true
    timeout_seconds: 120
    argv: [python3, tests/evidence/integration_gate_lifecycle.py]
    paths:
      - scripts/integration_gate.py
      - orchestration/INTEGRATION_GATE.md
      - orchestration/CORE_CHANGE_TESTING.md
      - templates/automation/VALIDATION_PROFILE.yaml
      - templates/review/INTEGRATION_GATE_REPORT.yaml
      - .aips/review/CORE_CHANGE_TEST_MATRIX.yaml
      - config/integration-gate.yaml
      - .github/workflows/validate.yml
      - tests/evidence/integration_gate_lifecycle.py
      - tests/scenarios/136-exact-candidate-integration-gate.md
  - id: trajectory-quality-gate-lifecycle
    category: test
    required: true
    timeout_seconds: 120
    argv: [python3, tests/evidence/trajectory_quality_gate_lifecycle.py]
    paths:
      - scripts/trajectory_eval.py
      - bin/aips
      - tests/evidence/trajectory_quality_gate_lifecycle.py
      - tests/scenarios/167-trajectory-quality-gate.md
  - id: repository-validation
    category: test
    required: true
    timeout_seconds: 900
    env:
      AIPS_PROFILE_LIFECYCLE_ALREADY_EXECUTED: "1"
    argv: [python3, tests/validate_repository.py]
    paths: ["**"]
  - id: content-safety-lifecycle
    category: security
    required: true
    timeout_seconds: 120
    expected_test_count: 5
    argv: [python3, tests/test_content_safety.py]
    paths:
      - scripts/content_safety.py
      - scripts/check_secret_leakage.py
      - scripts/governance_audit.py
      - scripts/gemini_observable_event_capture.py
      - scripts/governance_guard.py
      - scripts/publish_preflight.py
      - config/content-safety.yaml
      - orchestration/CONTENT_SAFETY_BOUNDARY.md
      - tests/test_content_safety.py
  - id: runtime-policy-lifecycle
    category: security
    required: true
    timeout_seconds: 120
    argv: [python3, tests/test_runtime_policy.py]
    paths:
      - scripts/runtime_policy.py
      - scripts/semantic_guard.py
      - scripts/sandbox_providers.py
      - scripts/governance_guard.py
      - config/runtime-policy.yaml
      - orchestration/schemas/runtime-action.yaml
      - orchestration/RUNTIME_POLICY_ENFORCEMENT.md
      - tests/test_runtime_policy.py
      - tests/fixtures/runtime_policy/resource-authorization.yaml
      - tests/validation/runtime_policy_contracts.py
      - tests/scenario_coverage.yaml
      - tests/validate_repository.py
  - id: runtime-policy-hook-lifecycle
    category: security
    required: true
    timeout_seconds: 120
    argv: [python3, tests/evidence/runtime_policy_lifecycle.py]
    paths:
      - scripts/governance_guard.py
      - scripts/runtime_policy.py
      - harness/adapters/claude-code/CLAUDE.md
      - harness/adapters/gemini-cli/hooks/hooks.json
      - tests/evidence/runtime_policy_lifecycle.py
      - tests/scenarios/177-runtime-policy-enforcement.md
  - id: secret-scan-publication-lifecycle
    category: security
    required: true
    timeout_seconds: 120
    argv: [python3, tests/evidence/secret_scan_publication_lifecycle.py]
    paths:
      - scripts/check_secret_leakage.py
      - scripts/integration_gate.py
      - scripts/publish_preflight.py
      - config/secret-scan.yaml
      - config/integration-gate.yaml
      - .github/workflows/validate.yml
      - tests/evidence/secret_safety.py
      - tests/evidence/secret_scan_publication_lifecycle.py
      - orchestration/SECRET_HANDLING.md
      - orchestration/INTEGRATION_GATE.md
  - id: mandatory-candidate-secret-scan
    category: security
    required: true
    candidate_context: true
    timeout_seconds: 300
    argv: [python3, scripts/check_secret_leakage.py, --root, ., --policy, config/secret-scan.yaml, --publication-candidate, --json]
    paths: ["**"]
