version: 1
policy_id: aips-secret-scan
limits:
  max_file_bytes: 2000000
generated_paths:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/.next/**"
  - "**/.cache/**"
  - "**/.ruff_cache/**"
  - "**/.pytest_cache/**"
  - "**/target/**"
  - "**/__pycache__/**"
lockfiles:
  path_patterns:
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/poetry.lock"
    - "**/Pipfile.lock"
    - "**/*.lock"
  disabled_detectors:
    - generic-secret-assignment
allowlist: []
