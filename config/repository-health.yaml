version: 1
evidence_binding:
  manifest: complete
  dirty_workspace: report_non_reproducible
truth_sources:
  capability_map: references/evolution/CAPABILITY_MAP.yaml
  architecture_surfaces: config/architecture-surfaces.yaml
  repository_validator: tests/validate_repository.py
  scenario_registry: tests/scenario_coverage.yaml
  scenario_dir: tests/scenarios
  scenario_helper: scripts/scenario_conformance.py
surface_discovery:
  patterns: [scripts/*_guard.py, scripts/*_gate.py]
  ignore: []
documentation_bindings:
  - source: orchestration/REPOSITORY_HEALTH.md
    required_references: [config/repository-health.yaml, config/architecture-surfaces.yaml, scripts/repository_health.py, references/evolution/CAPABILITY_MAP.yaml, scripts/scenario_conformance.py, config/integration-gate.yaml]
  - source: docs/human/MAINTENANCE.md
    required_references: [orchestration/REPOSITORY_HEALTH.md, config/architecture-surfaces.yaml, scripts/repository_health.py]
contract_files:
  - path: .github/workflows/validate.yml
    required_strings: [scripts/integration_gate.py, config/integration-gate.yaml, scripts/repository_health.py, repository-health-report.json, "actions/upload-artifact@", "repository:", "needs: janitor"]
  - path: config/integration-gate.yaml
    required_strings: ["id: repository-validation", tests/validate_repository.py, 'paths: ["**"]']
  - path: tests/validate_repository.py
    required_strings: ["from validation import conformance_isolation", "from validation import repository_health_contracts"]
