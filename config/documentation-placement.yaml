version: 1
policy:
  current_behavior_is_topic_oriented: true
  release_history_target: CHANGELOG.md
  verification_history_target: docs/human/CONFORMANCE.md
  legacy_html_append_forbidden: true

current_behavior_docs:
  docs/human/GETTING_STARTED.md:
    required_h2: [安裝 AIPS, 驗證安裝, 開始工作, 更新, 解除安裝]
  docs/human/INSTALLATION.md:
    required_h2: [macOS / Linux, Windows, 驗證, Runtime integration, 更新, 解除安裝]
  docs/human/HARNESS.md:
    required_h2: [Integration model, Native Runtime Adapters, MCP Interoperability, Capability truth, Progressive disclosure, Ownership 與解除]
  docs/human/USER_GUIDE.md:
    required_h2: [工作模式與基本流程, 建立大型產品, Existing Project, Global Harness 與 MCP, Deterministic Scheduler, Execution Isolation 與 Runtime Resource, Security, Quality 與 Review, Git Publication 與 Release, Documentation]
  docs/human/PROJECT_INTELLIGENCE.md:
    required_h2: [第一次 Existing Project, Change Impact, Retrieval Intelligence：即時按需檢索]
  docs/human/SECURITY_ASSURANCE.md:
    required_h2: [Core model, Assurance levels, Release Security Gate]
  docs/human/ARCHITECTURE_OVERVIEW.md:
    required_h2: [Runtime 與接入層, Project Intelligence 與 Retrieval, Planning 與 Product Delivery, Deterministic Execution, Security 與 Governance, Documentation Architecture, Official Docs Site]
  docs/human/EVOLUTION_RADAR.md:
    required_h2: [Weekly Signal Scan, Evidence Quality, Deterministic Pre-analysis, Semantic Analysis, Human Decision Binding, Controlled Trial, Trial → ADOPT, Verification History]
  docs/human/EVOLUTION_RADAR_OVERVIEW.md:
    required_h2: [Signal Collection, Deterministic Pre-analysis, Semantic Analysis, Human Decision, Controlled Trial, Trial → Adoption, Verification History]
  docs/human/TECHNOLOGY_GUIDE.md:
    required_h2: [Runtime & Integration, Project Understanding, Execution, Security & Governance, Quality & Verification, Product Delivery, Evolution & Maintenance, Documentation Platform]
  docs/human/DOCUMENTATION_SYNC.md:
    required_h2: [文件角色, Current-behavior placement contract, Official Docs Site, Deterministic protection]
  docs/human/DOCUMENTATION_MAP.md:
    required_h2: [Official Docs Site, 文件角色, Agent / machine canonical 文件, 文件一致性]
  docs/human/MAINTENANCE.md:
    required_h2: [Documentation Impact Gate, Architecture Diagram Impact Check, Release checklist]

legacy_append_forbidden:
  - docs/human/TECHNOLOGY_GUIDE.html
  - docs/human/EVOLUTION_RADAR_OVERVIEW.html

placement_rules:
  - id: installation
    triggers: [scripts/install.sh, scripts/install.ps1, scripts/uninstall.ps1, scripts/bootstrap.sh, scripts/uninstall.sh, bin/aips]
    placements:
      docs/human/INSTALLATION.md: [macOS / Linux, Windows, 驗證, Runtime integration, 更新, 解除安裝, 相容入口]
      docs/human/GETTING_STARTED.md: [安裝 AIPS, 驗證安裝, 更新, 解除安裝]

  - id: harness
    triggers: [harness/**, scripts/harness_resolve.py, scripts/mcp_server.py, scripts/manage_runtime_adapter.py]
    placements:
      docs/human/HARNESS.md: [Integration model, Native Runtime Adapters, MCP Interoperability, Capability truth, Progressive disclosure, Ownership 與解除]
      docs/human/ARCHITECTURE_OVERVIEW.md: [Runtime 與接入層]

  - id: project-intelligence
    triggers: [scripts/project_intelligence.py, scripts/retrieval_intelligence.py, scripts/turn_context_hook.py, templates/intelligence/**]
    placements:
      docs/human/PROJECT_INTELLIGENCE.md: [第一次 Existing Project, Change Impact, Retrieval Intelligence：即時按需檢索]
      docs/human/ARCHITECTURE_OVERVIEW.md: [Project Intelligence 與 Retrieval]

  - id: security
    triggers: [scripts/governance_guard.py, orchestration/SECRET_HANDLING.md, orchestration/RESOURCE_AUTHORIZATION.md]
    placements:
      docs/human/SECURITY_ASSURANCE.md: [Core model, Assurance levels, Release Security Gate, Secret and credential safety]
      docs/human/ARCHITECTURE_OVERVIEW.md: [Security 與 Governance]

  - id: deterministic-execution
    triggers: [scripts/deterministic_scheduler.py, scripts/integration_gate.py, scripts/execution_isolation.py]
    placements:
      docs/human/USER_GUIDE.md: [Deterministic Scheduler, Execution Isolation 與 Runtime Resource, Quality 與 Review]
      docs/human/ARCHITECTURE_OVERVIEW.md: [Deterministic Execution]

  - id: evolution
    triggers: [scripts/evolution_*.py, config/evolution-*.yaml, references/evolution/**, .github/workflows/evolution-*.yml]
    placements:
      docs/human/EVOLUTION_RADAR.md: [Weekly Signal Scan, Evidence Quality, Deterministic Pre-analysis, Semantic Analysis, Human Decision Binding, Controlled Trial, Trial → ADOPT, Effectiveness Feedback, Current Boundaries]
      docs/human/EVOLUTION_RADAR_OVERVIEW.md: [Signal Collection, Deterministic Pre-analysis, Semantic Analysis, Human Decision, Controlled Trial, Trial → Adoption, Effectiveness Feedback]

  - id: documentation-platform
    triggers: [docs/human/.vitepress/**, package.json, .github/workflows/docs-site.yml, scripts/documentation_placement.py, config/documentation-placement.yaml]
    placements:
      docs/human/ARCHITECTURE_OVERVIEW.md: [Documentation Architecture, Official Docs Site]
      docs/human/DOCUMENTATION_SYNC.md: [Current-behavior placement contract, Official Docs Site]
      docs/human/DOCUMENTATION_MAP.md: [Official Docs Site, 文件角色]
