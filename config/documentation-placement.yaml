version: 2
policy:
  current_behavior_is_topic_oriented: true
  release_history_target: CHANGELOG.md
  release_history_archive_root: docs/history/changelog/
  root_changelog_full_release_window: 5
  release_history_archiving: "human-maintained; report-only size audit never moves files"
  verification_history_target: docs/human/CONFORMANCE.md
  legacy_html_append_forbidden: true
  all_added_lines_must_match_canonical_placement: true
  new_topics_require_contract_update: true
  # v0.53 migration is complete. Future diffs have no placement bypass.
  one_time_structure_migration_bases: []

current_behavior_docs:
  docs/human/SYSTEM_REFERENCE.md:
    strict_h2: true
    required_h2: [Public commands, Capability surfaces, Runtime support, Observation fields]
  docs/human/GETTING_STARTED.md:
    strict_h2: true
    required_h2: [安裝 AIPS, 驗證安裝, 開始工作, Existing Project, 更新, 解除安裝]
  docs/human/INSTALLATION.md:
