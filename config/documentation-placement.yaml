  docs/human/HARNESS.md:
    strict_h2: true
    required_h2: [Integration model, Native Runtime Adapters, MCP Interoperability, Portable Commands, Capability truth, Progressive disclosure, Ownership 與解除]
  docs/human/USER_GUIDE.md:
    strict_h2: true
    required_h2:
      - 工作模式與基本流程
      - 建立大型產品
      - Existing Project
      - Creative Direction、Style 與 Brand
      - 需求釐清與 Planning
      - Global Harness 與 MCP
      - Roles、Skills 與重用
      - Deterministic Automation
      - Deterministic Scheduler
      - Execution Isolation 與 Runtime Resource
      - Visual Polish 與 Product Consistency
      - Security
      - Quality 與 Review
      - Logging、Observability 與 Operations
      - Checkpoint / Resume
      - Project Intelligence
      - Git Publication 與 Release
      - Evolution Radar
      - Documentation
      - Runtime Content Safety Boundary
  docs/human/PROJECT_INTELLIGENCE.md:
    required_h2: [第一次 Existing Project, Change Impact, Retrieval Intelligence：即時按需檢索, Runtime Content Safety Boundary]
  docs/human/SECURITY_ASSURANCE.md:
    required_h2: [Core model, Assurance levels, External sandbox execution, Release Security Gate, Runtime Content Safety Boundary]
  docs/human/ARCHITECTURE_OVERVIEW.md:
    strict_h2: true
    required_h2: [Runtime 與接入層, Project Intelligence 與 Retrieval, Project Identity 與 Persistence, Creative Workflow, Planning 與 Product Delivery, Deterministic Execution, Security 與 Governance, Scenario Conformance 與 Agent Eval, Evolution Radar, Documentation Architecture, Official Docs Site, Maintenance governance, Runtime Content Safety Boundary]
  docs/human/EVOLUTION_RADAR.md:
    strict_h2: true
    required_h2: [Weekly Signal Scan, Evidence Quality, Deterministic Pre-analysis, Semantic Analysis, Human Decision Binding, Controlled Trial, Trial → ADOPT, Optional Provider Credentials, Effectiveness Feedback, Current Boundaries, Verification History]
  docs/human/EVOLUTION_RADAR_OVERVIEW.md:
    strict_h2: true
    required_h2: [Signal Collection, Deterministic Pre-analysis, Semantic Analysis, Human Decision, Controlled Trial, Trial → Adoption, Provider Credentials, Effectiveness Feedback, Verification History]
  docs/human/TECHNOLOGY_GUIDE.md:
    strict_h2: true
    required_h2: [Runtime & Integration, Project Understanding, Execution, Security & Governance, Quality & Verification, Product Delivery, Evolution & Maintenance, Documentation Platform, Runtime Content Safety Boundary]
  docs/human/DOCUMENTATION_SYNC.md:
    strict_h2: true
