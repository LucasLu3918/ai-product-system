version: 1
ruff:
  baseline_findings: 685
  policy: never_increase
  scope: scripts_and_tests
  report_dimensions: [rule, module, auto_fixable]
  module_budgets:
    scripts/project_intelligence.py:
      current_findings: 0
      next_target: 0
    scripts/retrieval_intelligence.py:
      current_findings: 4
      next_target: 3
touched_code:
  policy: no_new_findings
  base_ref: origin/main
  missing_base_behavior: block
  fingerprint_fields: [path, code, name, message, source_cell]
mypy:
  policy: selected_module_ratchet
  maximum_findings: 0
  modules:
    - scripts/deterministic_scheduler.py
    - scripts/integration_gate.py
    - scripts/review_packet.py
    - scripts/review_evidence.py
    - scripts/validation_observation.py
    - scripts/validation_taxonomy.py
    - scripts/project_intelligence_promotion.py
    - scripts/project_intelligence_context.py
  follow_imports: skip
  ignore_missing_imports: true
coverage:
  policy: report_only
  branch_measurement: true
  minimum_percent: null
  module_baselines:
    scripts/project_intelligence_impact_graph.py:
      covered_lines: 98
      total_statements: 207
      percent: 45.5
      covered_branches: 47
      total_branches: 112
      measurement_scope: bounded_relation_candidates_lifecycle
      evidence: tests/evidence/project_intelligence_relation_candidates_lifecycle.py
      measurement_command: coverage run --branch --source=project_intelligence_impact_graph tests/evidence/project_intelligence_relation_candidates_lifecycle.py
    scripts/project_intelligence_storage.py:
      covered_lines: 37
      total_statements: 37
      percent: 100.0
      covered_branches: 0
      total_branches: 0
      measurement_scope: bounded_storage_lifecycle
      evidence: tests/evidence/module_extraction_lifecycle.py
      measurement_command: coverage run --branch --source=project_intelligence_storage tests/evidence/module_extraction_lifecycle.py
  note: These are bounded lifecycle baselines, not repository-wide coverage. Keep them report-only; do not infer a global threshold from selected module measurements.
