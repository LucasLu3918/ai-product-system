version: 1
identity:
  allowed_email_patterns:
    - '^(?:[0-9]+\+)?[A-Za-z0-9-]+\x40users\.noreply\.github\.com$'
    - '^noreply\x40github\.com$'
  # GitHub App bot noreply; candidate commit author field only (never committer or local user.email).
  allowed_bot_author_patterns:
    - '^[0-9]+\+[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\[bot\]\x40users\.noreply\.github\.com$'
  # Exact Git trailer identities masked before the commit message PII scan, only in the final
  # trailer block of a commit authored by the bot with the same slug. Set to [] to disable.
  trailer_identities:
    - key: Signed-off-by
      name: dependabot[bot]
      email_pattern: '^support\x40github\.com$'
      requires_author_slug: dependabot
  # Profile-gated trailer identities: used only while the named AIPS profile switch is enabled by a
  # person (aips profile set). Final trailer block only; the name and address must match exactly.
  profile_trailer_identities:
    claude_coauthor_trailer:
      key: Co-Authored-By
      name_pattern: '^Claude(?: [A-Za-z0-9.]{1,24}){1,4}$'
      email_pattern: '^noreply\x40anthropic\.com$'
  report_values: false
merge:
  recommended_method: merge
  squash_allowed: false
  rationale: GitHub-generated squash messages can add co-author email trailers that the git_commit PII policy must block.
